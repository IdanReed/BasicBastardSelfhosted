services:
  arcane:
    # Upstream tags releases with a leading "v"; "1.17.4" does not exist in the
    # registry and could never have been pulled.
    image: ghcr.io/getarcaneapp/arcane:v1.17.4
    container_name: arcane
    # Loopback only. Arcane mounts the Docker socket, so its web UI is a
    # root-equivalent interface; it was previously reachable from the whole
    # trusted VLAN with only its own login in front of it. Reach it through
    # Caddy at arcane.svc.idanreed.com.
    ports:
      - '127.0.0.1:10000:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A BIND, not the named `arcane_data` volume it was until 2026-08-31.
      #
      # A named volume lives under /var/lib/docker, which the fast-volume
      # Backrest plan excludes with `**/docker/**` — so Arcane's own database
      # was in NO backup at all. That database holds the GitOps sync
      # definitions, and recreating those by hand after a restore does not
      # reproduce them: `syncDirectory` is a per-sync flag that DEFAULTS OFF
      # in v1.17.4, so a hand-made sync silently reverts to single-file mode
      # and stops delivering the sibling `.sops.env` files. Every stack then
      # deploys with its secrets unset, and the only symptom is each app
      # failing its own way. A restore that looks complete and ships no
      # secrets is the worst shape a backup gap can take.
      #
      # The image declares `VOLUME /app/data` and its DATABASE_URL default is
      # `file:data/arcane.db` (WAL) — so the file to protect is
      # /mnt/fast/arcane/arcane.db, and a raw copy of a live WAL database is a
      # torn snapshot, not a backup (the Forgejo lesson). It needs a
      # `sqlite_backup arcane /mnt/fast/arcane/arcane.db` line in
      # nixos/backup-prepare.sh, not just a plan path.
      #
      # 1000:1000 on the host directory, matching PUID/PGID below: root-owned,
      # Arcane cannot write its own database (the same failure mode that made
      # /srv/stacks 1000:1000 — finding #10). The tmpfiles rule is generated
      # into nixos/stack-dirs.nix from THIS line.
      - /mnt/fast/arcane:/app/data
      - /srv/stacks:/srv/stacks
    environment:
      - APP_URL=http://localhost:3552
      - PROJECTS_DIRECTORY=/srv/stacks
      - PUID=1000
      - PGID=1000
    # Long form with required:false ON PURPOSE (finding #11): Arcane's
    # gitops sync VALIDATES the compose in a staging directory before copying,
    # where the host-side decrypted .env cannot exist yet — a plain
    # `env_file: .env` fails that validation and the sync of the whole stack
    # aborts. required:false passes staging; at deploy time the project dir
    # has the real .env (decrypt timer, ≤~1min after delivery). Residual
    # window: a deploy racing the first decrypt starts with unset vars — the
    # loud guard is each service's own healthcheck/startup failure.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
