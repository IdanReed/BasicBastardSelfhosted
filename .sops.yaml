creation_rules:
  # Test fixtures. Encrypted to a THROWAWAY key that is committed at
  # tests/keys/test-age-key.txt, so the harness runs without the real key.
  # This rule must come first: sops applies the first matching rule, and the
  # general rules below would otherwise claim these paths and encrypt fake
  # secrets to the production recipient.
  #
  # Nothing here is a real credential. See tests/README.md.
  - path_regex: tests/fixtures/.*\.sops\.(yaml|json)$
    age:
      - age163ufha7vvweplkjw67fe9rv5nzuz33sg6hnj69mh2zngm2cu6fzqatkw2j

  # Central recovery escrow (secrets-gen/): plaintext copies of hash-derived
  # app credentials (the app files carry only the hash). No host reads it, so
  # it never reaches a container's environment. The fixtures variant is redundant
  # with the first rule by construction; kept explicit so the pair documents
  # the recovery contract and survives any reshuffle of the rule above.
  - path_regex: tests/fixtures/secrets-recovery\.sops\.yaml$
    age:
      - age163ufha7vvweplkjw67fe9rv5nzuz33sg6hnj69mh2zngm2cu6fzqatkw2j
  - path_regex: secrets-recovery\.sops\.yaml$
    age:
      - age1m69ep7lcjgzvdjc49gcaqszmw60u5xj4wfmsd7qcwayh47538shq3wa4xf

  # OS-level secrets, decrypted by sops-nix at activation. These are YAML, not
  # dotenv, because sops-install-secrets only applies the per-secret key for
  # yaml/json — for dotenv it writes the WHOLE decrypted file into every
  # /run/secrets/<name> (it treats dotenv exactly like binary, and its docs
  # only say "ignored if format is binary"). The tests/ lint
  # `sops-dotenv-extraction` guards against regressing this.
  - path_regex: secrets\.sops\.yaml$
    age:
      - age1m69ep7lcjgzvdjc49gcaqszmw60u5xj4wfmsd7qcwayh47538shq3wa4xf

  # Stack secrets (stacks/<name>/, komodo/ and forgejo/ secrets.sops.json)
  # and the cross-host values (secrets/shared.sops.json). JSON because
  # sops-nix extracts one key per secret only from yaml/json, and because Nix
  # can read the key names straight out of the encrypted file
  # (nixos/modules/stack-env.nix renders each stack's env from them).
  - path_regex: \.sops\.json$
    age:
      - age1m69ep7lcjgzvdjc49gcaqszmw60u5xj4wfmsd7qcwayh47538shq3wa4xf
