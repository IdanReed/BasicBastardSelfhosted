# Authentik — ships in the flake, applied by modules/authentik.nix on
# `nixos-rebuild switch` (no git-sync). Secrets come from the sops-nix
# rendered EnvironmentFile; there is no .env on disk. /srv/authentik paths
# are created by systemd.tmpfiles; ./blueprints is read-only from the store.

services:
  postgresql:
    image: postgres:16.13-alpine
    container_name: authentik_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - /srv/authentik/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik

  redis:
    image: redis:7.4-alpine
    container_name: authentik_redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - /srv/authentik/redis:/data

  server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik_server
    restart: unless-stopped
    command: server
    # WHY journald: the fail2ban 'authentik' jail (../configuration.nix)
    # reads login_failed events off the journal by CONTAINER_TAG — with
    # json-file the systemd backend sees nothing and the jail silently never
    # bans. login_failed is emitted by the SERVER container, not the worker
    # (verified empirically against the pinned 2026.5.6 image; worker emitted
    # zero). Tag must stay 'authentik-server': the jail's journalmatch pins
    # it (fail2ban-journal-contract lint).
    logging:
      driver: journald
      options:
        tag: authentik-server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      # Required for forward auth: without it the session cookie is host-only
      # and browsers will redirect-loop between auth.idanreed.com and each
      # protected service on a different subdomain.
      AUTHENTIK_COOKIE_DOMAIN: idanreed.com
    volumes:
      - /srv/authentik/media:/media
      - /srv/authentik/templates:/templates
      - ./blueprints/custom:/blueprints/custom:ro
    # Loopback only — Caddy terminates TLS and is the sole public path in;
    # 9443 (self-signed) is not published at all.
    ports:
      - "127.0.0.1:9000:9000"
    # Without this, `up -d --wait` returns when the container is *running*,
    # not when Authentik answers — a deploy mid-migration reports success.
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 8
      timeout: 30s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik_worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_COOKIE_DOMAIN: idanreed.com
      # Consumed by the headscale-oidc blueprint via its !Env tag.
      HEADSCALE_OIDC_CLIENT_SECRET: ${HEADSCALE_OIDC_CLIENT_SECRET:?oidc client secret required}
      # Consumed by the immich-oidc blueprint via its !Env tag; the stack-side
      # copy is stacks/immich/.sops.env (rendered into immich.json).
      IMMICH_OIDC_CLIENT_SECRET: ${IMMICH_OIDC_CLIENT_SECRET:?immich oidc client secret required}
      # Consumed by the outline-oidc blueprint via its !Env tag; the stack-side
      # copy is stacks/outline/.sops.env (OIDC_CLIENT_SECRET).
      OUTLINE_OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?outline oidc client secret required}
      # Consumed by the kavita-oidc blueprint via its !Env tag; the
      # stack-side copy is stacks/books/.sops.env (KAVITA_OIDC_CLIENT_SECRET,
      # rendered into Kavita's appsettings.json).
      KAVITA_OIDC_CLIENT_SECRET: ${KAVITA_OIDC_CLIENT_SECRET:?kavita oidc client secret required}
      # Fleet-wide OIDC rollout 2026-09-05: one passthrough per native-OIDC app,
      # consumed by the matching blueprints/custom/<app>-oidc.yaml via !Env. The
      # :?-guard aborts authentik.service at boot if the sops template did not
      # render the var — the loud half of the oidc-contract; the silent half (an
      # unset var → empty stored secret → token-exchange 401) is what the lint
      # guards against. Rendered from modules/authentik.nix's sops template.
      ABS_OIDC_CLIENT_SECRET: ${ABS_OIDC_CLIENT_SECRET:?audiobookshelf oidc client secret required}
      PAPERLESS_OIDC_CLIENT_SECRET: ${PAPERLESS_OIDC_CLIENT_SECRET:?paperless oidc client secret required}
      BOOKSTACK_OIDC_CLIENT_SECRET: ${BOOKSTACK_OIDC_CLIENT_SECRET:?bookstack oidc client secret required}
      HOMEBOX_OIDC_CLIENT_SECRET: ${HOMEBOX_OIDC_CLIENT_SECRET:?homebox oidc client secret required}
      KARAKEEP_OIDC_CLIENT_SECRET: ${KARAKEEP_OIDC_CLIENT_SECRET:?karakeep oidc client secret required}
      DAWARICH_OIDC_CLIENT_SECRET: ${DAWARICH_OIDC_CLIENT_SECRET:?dawarich oidc client secret required}
      TANDOOR_OIDC_CLIENT_SECRET: ${TANDOOR_OIDC_CLIENT_SECRET:?tandoor oidc client secret required}
      MEALIE_OIDC_CLIENT_SECRET: ${MEALIE_OIDC_CLIENT_SECRET:?mealie oidc client secret required}
      VAULTWARDEN_OIDC_CLIENT_SECRET: ${VAULTWARDEN_OIDC_CLIENT_SECRET:?vaultwarden oidc client secret required}
      GHOSTFOLIO_OIDC_CLIENT_SECRET: ${GHOSTFOLIO_OIDC_CLIENT_SECRET:?ghostfolio oidc client secret required}
      ACTUAL_OPENID_CLIENT_SECRET: ${ACTUAL_OPENID_CLIENT_SECRET:?actual oidc client secret required}
      WEALTHFOLIO_OIDC_CLIENT_SECRET: ${WEALTHFOLIO_OIDC_CLIENT_SECRET:?wealthfolio oidc client secret required}
      EXCALIDRAW_OIDC_CLIENT_SECRET: ${EXCALIDRAW_OIDC_CLIENT_SECRET:?excalidraw oidc client secret required}
      # First-start bootstrap of the `akadmin` superuser. Without these there is
      # no way to log in at all: the blueprint's `idan` user has no credential
      # and no SMTP is configured for a reset link. Ignored on later starts.
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@idanreed.com
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?bootstrap password required}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?bootstrap token required}
    volumes:
      - /srv/authentik/media:/media
      - /srv/authentik/certs:/certs
      - /srv/authentik/templates:/templates
      - ./blueprints/custom:/blueprints/custom:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 8
      timeout: 30s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
