# Authentik — applied by headscale-vps/modules/authentik.nix, not by any
# git-sync mechanism. This file ships in the flake and is deployed by
# `nixos-rebuild switch`.
#
# Secrets are interpolated from the systemd EnvironmentFile rendered by
# sops-nix (see modules/authentik.nix); there is no .env on disk.
#
# Bind-mounted paths under /srv/authentik are created by systemd.tmpfiles in
# configuration.nix. ./blueprints is served read-only from the Nix store.

services:
  postgresql:
    image: postgres:16.13-alpine
    container_name: authentik_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - /srv/authentik/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik

  redis:
    image: redis:7.4-alpine
    container_name: authentik_redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - /srv/authentik/redis:/data

  server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik_server
    restart: unless-stopped
    command: server
    # WHY journald: the fail2ban 'authentik' jail (../configuration.nix) reads
    # login_failed events off the journal by CONTAINER_TAG. With the default
    # json-file driver those lines live only in a per-container JSON file that
    # fail2ban's systemd backend cannot see — the jail would silently never
    # ban. The flow executor (and thus the login_failed event) runs in the
    # SERVER container, not the worker — verified empirically by driving a
    # failed API login against the pinned 2026.5.6 image and grepping both
    # containers (worker emitted zero login_failed lines). Tag must stay
    # 'authentik-server': the jail's journalmatch pins it.
    logging:
      driver: journald
      options:
        tag: authentik-server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      # Required for forward auth: without it the session cookie is host-only
      # and browsers will redirect-loop between auth.idanreed.com and each
      # protected service on a different subdomain.
      AUTHENTIK_COOKIE_DOMAIN: idanreed.com
    volumes:
      - /srv/authentik/media:/media
      - /srv/authentik/templates:/templates
      - ./blueprints/custom:/blueprints/custom:ro
    # Loopback only — Caddy terminates TLS for auth.idanreed.com and is the
    # sole public path in. 9443 (self-signed) is not published at all.
    ports:
      - "127.0.0.1:9000:9000"
    # Without a healthcheck here, `docker compose up -d --wait` in
    # modules/authentik.nix returns as soon as the container is *running* —
    # not when Authentik is answering requests — so a deploy still mid-migration
    # reports success.
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 8
      timeout: 30s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik_worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_COOKIE_DOMAIN: idanreed.com
      # Consumed by the headscale-oidc blueprint via its !Env tag.
      HEADSCALE_OIDC_CLIENT_SECRET: ${HEADSCALE_OIDC_CLIENT_SECRET:?oidc client secret required}
      # Consumed by the immich-oidc blueprint via its !Env tag; the stack-side
      # copy is stacks/immich/.sops.env (rendered into immich.json).
      IMMICH_OIDC_CLIENT_SECRET: ${IMMICH_OIDC_CLIENT_SECRET:?immich oidc client secret required}
      # Consumed by the outline-oidc blueprint via its !Env tag; the stack-side
      # copy is stacks/outline/.sops.env (OIDC_CLIENT_SECRET).
      OUTLINE_OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?outline oidc client secret required}
      # First-start bootstrap of the `akadmin` superuser. Without these there is
      # no way to log in at all: the blueprint's `idan` user has no credential
      # and no SMTP is configured for a reset link. Ignored on later starts.
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@idanreed.com
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?bootstrap password required}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?bootstrap token required}
    volumes:
      - /srv/authentik/media:/media
      - /srv/authentik/certs:/certs
      - /srv/authentik/templates:/templates
      - ./blueprints/custom:/blueprints/custom:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      retries: 8
      timeout: 30s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
