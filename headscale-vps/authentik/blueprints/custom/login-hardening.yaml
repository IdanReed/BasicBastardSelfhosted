# Login brute-force hardening, layer 2 of 2 (layer 1 is the fail2ban jail in
# ../../configuration.nix). Reputation scores persist per (identifier, ip), so
# an attacker rotating source IPs still accumulates score against the username —
# the thing an IP ban cannot catch. Every failed password and every
# unknown-username identification decrements by 1, expiring after
# AUTHENTIK_REPUTATION__EXPIRY (24h); threshold -10 = deny after 10 failures.
#
# 🚨 ReputationPolicy.passes() returns True when score <= threshold, i.e. the
# policy MATCHES BAD REPUTATION — it is a detector, not a gate. Bound directly
# to the flow it would DENY every normal user and wave attackers through. The
# correct idiom is upstream's own: a conditional deny stage.
version: 1
metadata:
  name: login-hardening
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_policies_reputation.reputationpolicy
    id: login-reputation-policy
    state: present
    identifiers:
      name: login-reputation
    attrs:
      check_ip: true
      check_username: true
      threshold: -10

  - model: authentik_stages_deny.denystage
    id: login-reputation-deny-stage
    state: present
    identifiers:
      name: login-reputation-deny
    attrs:
      deny_message: "Too many failed login attempts."

  # Order 15 sits between identification (10) and password (20) so the
  # re-evaluation runs with the plan's pending_user set and check_username
  # actually bites. evaluate_on_plan: false + re_evaluate_policies: true is the
  # load-bearing pair — flipping either evaluates at plan time with an anonymous
  # user and check_username goes silently inert. A policy execution ERROR
  # removes the deny stage: fail-open on purpose, since failing closed would
  # make a broken policy a fleet-wide login outage.
  - model: authentik_flows.flowstagebinding
    id: login-reputation-deny-binding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !KeyOf login-reputation-deny-stage
      order: 15
    attrs:
      evaluate_on_plan: false
      re_evaluate_policies: true

  - model: authentik_policies.policybinding
    id: login-reputation-policy-binding
    state: present
    identifiers:
      policy: !KeyOf login-reputation-policy
      target: !KeyOf login-reputation-deny-binding
      order: 0
    attrs:
      enabled: true
