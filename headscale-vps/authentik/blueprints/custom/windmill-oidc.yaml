# OIDC provider + application for Windmill (slug "windmill-sso").
# windmill-init.sh writes the matching `authentik` entry into Windmill's
# `oauths` instance setting; it uses Authentik's global authorize, token and
# userinfo endpoints, so no app-side URL names the slug. client_secret travels
# sops -> modules/authentik.nix template -> worker env -> !Env below; the app
# reads the SAME value from secrets/shared.sops.json through its env.nix. The
# shared blueprint conventions are documented in headscale-oidc.yaml.
#
# Native OIDC sits UNDER the forward auth, which stays: forward-auth.yaml's
# proxy provider "windmill" still guards the Caddy route. Both names here
# differ from forward-auth.yaml's on purpose: provider names are globally
# unique across types, and the application slug "windmill" already holds the
# proxy provider (an application has one provider).
#
# Only windmill-init.sh's roster has a Windmill account (SSO never creates
# one), so the policy stays open like every other per-user application's.
version: 1
metadata:
  name: windmill-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: windmill-sso-provider
    state: present
    identifiers:
      name: windmill-sso
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: windmill
      client_secret: !Env WINDMILL_OIDC_CLIENT_SECRET
      redirect_uris:
        # The path segment is the `oauths` key windmill-init.sh writes.
        - url: "https://windmill.svc.idanreed.com/user/login_callback/authentik"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: windmill-sso-app
    state: present
    identifiers:
      slug: windmill-sso
    attrs:
      name: Windmill SSO
      provider: !KeyOf windmill-sso-provider
      policy_engine_mode: any
      meta_launch_url: "https://windmill.svc.idanreed.com"
      meta_description: "Workflow orchestration login (Windmill)"
