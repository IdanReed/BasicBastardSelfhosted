# OIDC provider + application for Kavita (stacks/books on the services VM).
#
# Native OIDC: Kavita drives the browser flow itself (no outpost / no
# forward-auth entry; the Caddy route for kavita.svc.idanreed.com does not
# `import protected`). Kavita keeps LOCAL accounts working alongside OIDC —
# unlike Outline, this provider is additive, not the only door.
#
# .yaml extension is load-bearing (blueprint discovery globs **/*.yaml only,
# finding #7). No comment-only `attrs:` keys (finding #9).
#
# client_secret rides the fleet's normal path: `!Env KAVITA_OIDC_CLIENT_SECRET`
# from sops -> modules/authentik.nix template -> worker env -> blueprint. The
# SAME value sits in stacks/books/.sops.env as KAVITA_OIDC_CLIENT_SECRET
# (rendered into appsettings.json by kavita-config-init; sops-gen draws one
# value into both files as the kavita/oidc twin). Rotate = both sops files +
# VPS nixos-rebuild switch + re-up the books stack. A mismatch 401s at token
# exchange, silently. The oidc-contract lint ties the !Env name to the worker
# env + sops template, and the client_id/issuer/redirect strings across files.
#
# client_id "kavita" and issuer .../application/o/kavita/ must match
# stacks/books/appsettings.json.template (Authority + ClientId).
version: 1
metadata:
  name: kavita-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # OIDC Provider for Kavita
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: kavita-provider
    state: present
    identifiers:
      name: kavita
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # grant_types is REQUIRED on this authentik version: authorize.py rejects
      # the whole flow if empty (invalid_request — hit live 2026-09-03). Same
      # as outline/immich/headscale.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: kavita
      # !Env reads the worker environment (see header); "${VAR}" would be a
      # literal, not interpolated.
      client_secret: !Env KAVITA_OIDC_CLIENT_SECRET
      redirect_uris:
        # Kavita's fixed ASP.NET OIDC paths (authentik's own Kavita integration
        # guide): /signin-oidc for login, /signout-callback-oidc for logout.
        # Strict matching — a drifted URL fails at login, not with a warning.
        - url: "https://kavita.svc.idanreed.com/signin-oidc"
          matching_mode: strict
        - url: "https://kavita.svc.idanreed.com/signout-callback-oidc"
          matching_mode: strict
      property_mappings:
        # The standard three, exactly like outline/immich/headscale.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: kavita-app
    state: present
    identifiers:
      slug: kavita
    attrs:
      name: Kavita
      provider: !KeyOf kavita-provider
      policy_engine_mode: any
      meta_launch_url: "https://kavita.svc.idanreed.com"
      meta_description: "Manga / comic / ebook reader"
