# OIDC provider + application for Kavita (slug "kavita"). Native
# OIDC, so no forward-auth entry and no `import protected` on its Caddy
# route. client_secret travels sops -> modules/authentik.nix template ->
# worker env -> !Env below, twinned into the stack's own .sops.env; the
# shared blueprint conventions are documented in headscale-oidc.yaml.
version: 1
metadata:
  name: kavita-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: kavita-provider
    state: present
    identifiers:
      name: kavita
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: kavita
      client_secret: !Env KAVITA_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://kavita.svc.idanreed.com/signin-oidc"
          matching_mode: strict
        - url: "https://kavita.svc.idanreed.com/signout-callback-oidc"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: kavita-app
    state: present
    identifiers:
      slug: kavita
    attrs:
      name: Kavita
      provider: !KeyOf kavita-provider
      policy_engine_mode: any
      meta_launch_url: "https://kavita.svc.idanreed.com"
      meta_description: "Manga / comic / ebook reader"
