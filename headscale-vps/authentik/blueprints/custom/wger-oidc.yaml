# OIDC provider + application for Wger (slug "wger-sso"). wger-init.py writes
# the matching allauth SocialApp (provider_id "authentik", discovery under
# /application/o/wger-sso/). client_secret travels sops ->
# modules/authentik.nix template -> worker env -> !Env below; the app reads the
# SAME value from secrets/shared.sops.json through its env.nix. The shared
# blueprint conventions are documented in headscale-oidc.yaml.
#
# Native OIDC sits UNDER the forward auth, which stays: forward-auth.yaml's
# proxy provider "wger" still guards the Caddy route, and the seeded `admin`
# keeps its password as break-glass. Both names here differ from
# forward-auth.yaml's on purpose: provider names are globally unique across
# types, and the application slug "wger" already holds the proxy provider (an
# application has one provider).
#
# Every roster user gets a Wger account (wger-init.py), so the policy stays
# open like every other per-user application's.
version: 1
metadata:
  name: wger-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: wger-sso-provider
    state: present
    identifiers:
      name: wger-sso
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: wger
      client_secret: !Env WGER_OIDC_CLIENT_SECRET
      redirect_uris:
        # allauth's openid_connect callback: /account/ is wger's allauth
        # mount, oidc/ allauth's URL prefix, authentik the SocialApp's
        # provider_id.
        - url: "https://wger.svc.idanreed.com/account/oidc/authentik/login/callback/"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: wger-sso-app
    state: present
    identifiers:
      slug: wger-sso
    attrs:
      name: Wger SSO
      provider: !KeyOf wger-sso-provider
      policy_engine_mode: any
      meta_launch_url: "https://wger.svc.idanreed.com"
      meta_description: "Workout and nutrition tracker login (Wger)"
