# OIDC provider + application for Bitwarden backend SSO (Vaultwarden) (slug "vaultwarden").
#
# Native OIDC: the app drives the browser flow itself (no outpost / no
# forward-auth entry; the Caddy route does not `import protected`). OIDC is
# additive alongside the app's local accounts unless that app is configured
# otherwise (see stacks/<name>/compose.yaml for the per-app posture).
#
# .yaml extension is load-bearing (blueprint discovery globs **/*.yaml only,
# finding #7). No comment-only `attrs:` keys (finding #9).
#
# client_secret rides the fleet's normal path: `!Env VAULTWARDEN_OIDC_CLIENT_SECRET` from sops ->
# modules/authentik.nix template -> worker env -> blueprint. The SAME value
# sits in the stack's .sops.env (sops-gen draws one value into both files as an
# xhost twin — see secrets-gen/manifest.yaml). Rotate = both sops files + VPS
# nixos-rebuild switch + re-up the stack. A mismatch 401s at token exchange,
# silently. The oidc-contract lint ties the !Env name to the worker env + the
# sops template.
#
# client_id "vaultwarden" and issuer .../application/o/vaultwarden/ must match the app's
# OIDC config (see stacks/<name>/compose.yaml).
version: 1
metadata:
  name: vaultwarden-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # OIDC Provider
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: vaultwarden-provider
    state: present
    identifiers:
      # NOT "vaultwarden": forward-auth.yaml already owns a PROXY provider by
      # that name (the /admin forward-auth), and Authentik provider names are
      # globally unique across types — the collision left this oauth2 provider
      # unbound and /application/o/vaultwarden/ 404ing. The application slug
      # below stays "vaultwarden" (forward-auth's app is "vaultwarden-admin"),
      # so SSO_AUTHORITY .../application/o/vaultwarden is unchanged.
      name: vaultwarden-sso
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # grant_types is REQUIRED on this authentik version: authorize.py rejects
      # the whole flow if empty (invalid_request — hit live 2026-09-03). Same
      # as kavita/outline/immich/headscale.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: vaultwarden
      # !Env reads the worker environment (see header); "${VAR}" would be a
      # literal, not interpolated.
      client_secret: !Env VAULTWARDEN_OIDC_CLIENT_SECRET
      redirect_uris:
        # Strict matching — a drifted URL fails at login, not with a warning.
        - url: "https://vaultwarden.svc.idanreed.com/identity/connect/oidc-signin"
          matching_mode: strict
      property_mappings:
        # The standard three, exactly like kavita/outline/immich/headscale.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: vaultwarden-app
    state: present
    identifiers:
      slug: vaultwarden
    attrs:
      name: Vaultwarden
      provider: !KeyOf vaultwarden-provider
      policy_engine_mode: any
      meta_launch_url: "https://vaultwarden.svc.idanreed.com"
      meta_description: "Bitwarden backend SSO (Vaultwarden)"
