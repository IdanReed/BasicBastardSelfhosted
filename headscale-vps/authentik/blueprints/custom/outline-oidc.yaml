# OIDC provider + application for Outline (stacks/outline on the services VM).
#
# Outline has NO local accounts of any kind — no admin bootstrap, no password
# form, no CLI user-create. This provider is not hardening, it IS the login,
# and until it exists the service can be reached but not entered.
#
# NOTE the .yaml extension is load-bearing: authentik's blueprint discovery
# globs **/*.yaml only (finding #7 — as a .yml this would be mounted, visible,
# and silently never discovered). No comment-only `attrs:` keys anywhere
# (finding #9 — a key whose body is only comments parses as null and the
# importer's .items() call kills the ENTIRE blueprint apply, retried forever,
# with the error only in worker logs).
#
# This is an OIDC (native) provider: Outline drives the browser flow itself,
# so there is NO outpost entry here and forward-auth.yaml is untouched —
# outposts are for proxy providers only. The Caddy route for
# outline.svc.idanreed.com deliberately does not `import protected`.
#
# ---------------------------------------------------------------------------
# client_secret is on the fleet's normal footing (headscale-oidc.yaml,
# immich-oidc.yaml): `!Env OUTLINE_OIDC_CLIENT_SECRET`, travelling
# sops -> modules/authentik.nix template -> worker environment -> blueprint.
# The SAME value must sit in stacks/outline/.sops.env as OIDC_CLIENT_SECRET —
# the three-way rotation coupling immich documents. Rotating it = edit both
# sops files + VPS nixos-rebuild switch + re-up the outline stack. The
# oidc-contract lint ties the !Env name to the worker env and the sops
# template; a name unset in either stores an EMPTY secret and every token
# exchange 401s at login time, silently.
version: 1
metadata:
  name: outline-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # OIDC Provider for Outline
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: outline-provider
    state: present
    identifiers:
      name: outline
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # grant_types is REQUIRED on this authentik version: authorize.py checks
      # `grant_type not in provider.grant_types` and rejects the whole flow if
      # empty (invalid_request, every login broke — hit live 2026-09-03). The
      # field postdates the original blueprints, which defaulted it to [].
      grant_types:
        - authorization_code
        - refresh_token
      client_id: outline
      # !Env reads from the worker's environment (see header). Plain "${VAR}"
      # is NOT interpolated by authentik — it would be stored as a literal.
      client_secret: !Env OUTLINE_OIDC_CLIENT_SECRET
      redirect_uris:
        # Outline builds this itself as `${URL}/auth/oidc.callback` — read out
        # of the image's build/plugins/oidc/server/auth/oidcRouter.js, not
        # from documentation. Strict matching, so a drifted URL fails at
        # login rather than warning; the oidc-contract lint ties this string
        # to the compose file's URL.
        - url: "https://outline.svc.idanreed.com/auth/oidc.callback"
          matching_mode: strict
      property_mappings:
        # The standard three, exactly like headscale and immich. Outline reads
        # `email` to identify the account and `preferred_username` (from
        # profile) as the display username — OIDC_USERNAME_CLAIM in the
        # compose file names that claim, so the two must agree.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: outline-app
    state: present
    identifiers:
      slug: outline
    attrs:
      name: Outline
      provider: !KeyOf outline-provider
      policy_engine_mode: any
      meta_launch_url: "https://outline.svc.idanreed.com"
      meta_description: "Team wiki (database-backed)"
