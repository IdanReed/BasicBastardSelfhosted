# OIDC provider + application for Outline (stacks/outline on the services VM).
#
# Outline has NO local accounts of any kind — no admin bootstrap, no password
# form, no CLI user-create. This provider is not hardening, it IS the login,
# and until it exists the service can be reached but not entered.
#
# NOTE the .yaml extension is load-bearing: authentik's blueprint discovery
# globs **/*.yaml only (finding #7 — as a .yml this would be mounted, visible,
# and silently never discovered). No comment-only `attrs:` keys anywhere
# (finding #9 — a key whose body is only comments parses as null and the
# importer's .items() call kills the ENTIRE blueprint apply, retried forever,
# with the error only in worker logs).
#
# This is an OIDC (native) provider: Outline drives the browser flow itself,
# so there is NO outpost entry here and forward-auth.yaml is untouched —
# outposts are for proxy providers only. The Caddy route for
# outline.svc.idanreed.com deliberately does not `import protected`.
#
# ---------------------------------------------------------------------------
# 🚨 THE CLIENT SECRET IS NOT SET HERE YET — DELIBERATE, INCOMPLETE STATE.
#    READ THIS BEFORE ROTATING ANYTHING
# ---------------------------------------------------------------------------
# The fleet convention (headscale-oidc, immich-oidc) is `client_secret: !Env
# <NAME>`: sops -> modules/authentik.nix template -> worker environment ->
# blueprint. The oidc-contract lint fails the build if a blueprint reads an
# !Env name the worker environment and sops template do not both provide —
# correctly: applied against an unset variable it stores an EMPTY secret and
# every token exchange 401s at login time, silently.
#
# As shipped this provider has no client_secret attribute, so AUTHENTIK
# GENERATES ONE and the operator copies it out of the UI (Applications ->
# Providers -> outline) into stacks/outline/.sops.env as OIDC_CLIENT_SECRET —
# a manual step that a `state: present` re-apply will not re-teach you.
#
# TO PUT IT ON THE FLEET'S NORMAL FOOTING, four changes land together:
#   1. headscale-vps/secrets.sops.yaml (+ .example, + tests/fixtures/vps*.sops.yaml):
#      add key OUTLINE_OIDC_CLIENT_SECRET.
#   2. headscale-vps/modules/authentik.nix: declare
#      `sops.secrets.OUTLINE_OIDC_CLIENT_SECRET = { };` and add
#      `OUTLINE_OIDC_CLIENT_SECRET=${config.sops.placeholder.OUTLINE_OIDC_CLIENT_SECRET}`
#      to the "authentik.env" template.
#   3. headscale-vps/authentik/compose.yaml, worker environment:
#      `OUTLINE_OIDC_CLIENT_SECRET: ${OUTLINE_OIDC_CLIENT_SECRET:?outline oidc client secret required}`
#   4. here: uncomment the client_secret line below.
# Then the same value must also be in stacks/outline/.sops.env — the
# three-way rotation coupling immich already documents.
version: 1
metadata:
  name: outline-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # OIDC Provider for Outline
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: outline-provider
    state: present
    identifiers:
      name: outline
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: outline
      # See the header block: uncomment together with the three plumbing
      # changes it lists, never on its own.
      # client_secret: !Env OUTLINE_OIDC_CLIENT_SECRET
      redirect_uris:
        # Outline builds this itself as `${URL}/auth/oidc.callback` — read out
        # of the image's build/plugins/oidc/server/auth/oidcRouter.js, not
        # from documentation. Strict matching, so a drifted URL fails at
        # login rather than warning; the oidc-contract lint ties this string
        # to the compose file's URL.
        - url: "https://outline.svc.idanreed.com/auth/oidc.callback"
          matching_mode: strict
      property_mappings:
        # The standard three, exactly like headscale and immich. Outline reads
        # `email` to identify the account and `preferred_username` (from
        # profile) as the display username — OIDC_USERNAME_CLAIM in the
        # compose file names that claim, so the two must agree.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: outline-app
    state: present
    identifiers:
      slug: outline
    attrs:
      name: Outline
      provider: !KeyOf outline-provider
      policy_engine_mode: any
      meta_launch_url: "https://outline.svc.idanreed.com"
      meta_description: "Team wiki (database-backed)"
