# OIDC provider + application for Forgejo (stacks/forgejo on the services VM).
#
# Native OIDC, ADDITIVE: Forgejo keeps its seeded local admin as break-glass
# (login-tiers.md: tier 2a -> 1). The friends (all devs) auto-provision on first
# Authentik login — the Forgejo side sets oauth2_client.ENABLE_AUTO_REGISTRATION
# with DISABLE_REGISTRATION still true, so ONLY Authentik can mint accounts.
#
# Forgejo stores its OAuth *auth source* in its DATABASE, not app.ini/env, so
# unlike the env-only OIDC apps this pair is seeded by forgejo-init.sh
# (`forgejo admin auth add-oauth --name authentik`). The source name "authentik"
# is load-bearing: Forgejo's callback is /user/oauth2/<source-name>/callback, so
# it must match the redirect_uri below.
#
# .yaml extension is load-bearing (blueprint discovery globs **/*.yaml, #7).
# No comment-only attrs keys (#9).
#
# client_secret rides the fleet's normal path: `!Env FORGEJO_OIDC_CLIENT_SECRET`
# from sops -> modules/authentik.nix template -> worker env -> blueprint. The
# SAME value sits in stacks/forgejo/.sops.env as FORGEJO_OIDC_CLIENT_SECRET
# (read by forgejo-init; sops-gen draws one value into both as forgejo/oidc).
# Rotate = both sops files + VPS nixos-rebuild switch + re-up forgejo. A
# mismatch 401s at token exchange, silently. client_id "forgejo" and issuer
# .../application/o/forgejo/ must match forgejo-init.sh's add-oauth flags.
version: 1
metadata:
  name: forgejo-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # OIDC Provider for Forgejo
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-provider
    state: present
    identifiers:
      name: forgejo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: forgejo
      client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
      redirect_uris:
        # Forgejo builds its callback as <ROOT_URL>/user/oauth2/<source>/callback
        # where <source> is the auth-source name forgejo-init.sh registers
        # ("authentik"). Strict matching — a drift fails at login, not with a
        # warning.
        - url: "https://forgejo.svc.idanreed.com/user/oauth2/authentik/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: forgejo-app
    state: present
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-provider
      policy_engine_mode: any
      meta_launch_url: "https://forgejo.svc.idanreed.com"
      meta_description: "Git forge — the source-of-truth for the fleet"
