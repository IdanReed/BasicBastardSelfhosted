# OIDC provider + application for Forgejo (slug "forgejo"). Native
# OIDC, so no forward-auth entry and no `import protected` on its Caddy
# route. client_secret travels sops -> modules/authentik.nix template ->
# worker env -> !Env below; the app reads the SAME value from
# secrets/shared.sops.json through its env.nix. The shared blueprint conventions are documented in headscale-oidc.yaml.
version: 1
metadata:
  name: forgejo-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: forgejo-provider
    state: present
    identifiers:
      name: forgejo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: forgejo
      client_secret: !Env FORGEJO_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://forgejo.svc.idanreed.com/user/oauth2/authentik/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: forgejo-app
    state: present
    identifiers:
      slug: forgejo
    attrs:
      name: Forgejo
      provider: !KeyOf forgejo-provider
      policy_engine_mode: any
      meta_launch_url: "https://forgejo.svc.idanreed.com"
      meta_description: "Git forge — the source-of-truth for the fleet"
