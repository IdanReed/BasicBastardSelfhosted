# OIDC provider + application for Cleanuparr (slug "cleanuparr-sso"). The
# client_secret travels sops -> modules/authentik.nix template -> worker env ->
# !Env below; the media stack's cleanuparr-init reads the SAME value from
# secrets/shared.sops.json through stacks/media/env.cleanuparr.nix and writes
# it into Cleanuparr's OIDC settings, which live in its users database, not in
# env (stacks/media/cleanuparr-init.sh). The shared blueprint conventions are
# documented in headscale-oidc.yaml.
#
# Native OIDC sits UNDER the forward auth, which stays: forward-auth.yaml's
# proxy provider "cleanuparr" still guards the Caddy route, and Cleanuparr's
# password login stays beside this one as break-glass. Both names here differ
# from forward-auth.yaml's on purpose: provider names are globally unique
# across types, and the application slug "cleanuparr" already holds the proxy
# provider (an application has one provider; a second blueprint claiming the
# slug would re-point it and break the forward auth).
#
# The slug fixes the issuer: keep it in step with CLEANUPARR_OIDC_ISSUER_URL in
# stacks/media/compose.yaml. Cleanuparr appends its own callback paths to the
# configured redirect URL: /api/auth/oidc/callback (sign-in) and
# /api/account/oidc/link/callback (the optional Link Account step). Discovery
# is fetched at sign-in, never at boot.
version: 1
metadata:
  name: cleanuparr-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # The Admin group bound below is declared in headscale-oidc; applying it
  # first means the !Find resolves on a fresh install.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: headscale-oidc
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: cleanuparr-sso-provider
    state: present
    identifiers:
      name: cleanuparr-sso
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: cleanuparr
      client_secret: !Env CLEANUPARR_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://cleanuparr.svc.idanreed.com/api/auth/oidc/callback"
          matching_mode: strict
        - url: "https://cleanuparr.svc.idanreed.com/api/account/oidc/link/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: cleanuparr-sso-app
    state: present
    identifiers:
      slug: cleanuparr-sso
    attrs:
      name: Cleanuparr SSO
      provider: !KeyOf cleanuparr-sso-provider
      policy_engine_mode: any
      meta_launch_url: "https://cleanuparr.svc.idanreed.com"
      meta_description: "Download queue cleanup login (Admin group only)"

  # Admin-only: an admin tool, whose own login was a second lock only idan
  # held. With the one group binding, Authentik refuses everyone outside
  # `Admin` (declared in headscale-oidc.yaml) and hides the tile from them.
  # Cleanuparr itself admits any identity Authentik vouches for, as its one
  # account.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf cleanuparr-sso-app
      group: !Find [authentik_core.group, [name, Admin]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
