# OIDC provider + application for Headscale, plus the fleet's users and MFA.
#
# Conventions shared by every blueprint in this directory:
#   - The .yaml extension is load-bearing: discovery globs **/*.yaml only, so a
#     .yml file mounts, is visible, and silently never applies.
#   - No comment-only `attrs:` keys: a key whose body is only comments parses
#     as null and the importer's .items() kills the ENTIRE apply, retried
#     forever, with the error only in worker logs.
#   - `!Env NAME` reads the worker environment (authentik/compose.yaml, fed by
#     the sops template in modules/authentik.nix). Plain "${VAR}" is stored as
#     a literal. An unset name stores an EMPTY secret and every token exchange
#     401s at login time, silently — the oidc-contract lint guards it.
#   - grant_types is REQUIRED on this authentik version: authorize.py rejects
#     the whole flow when it is empty.
#   - redirect_uris use strict matching, so a drifted URL fails at login rather
#     than warning.
version: 1
metadata:
  name: headscale-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Discovery applies blueprints in no fixed order. These four create what
  # the entries below !Find, and the MFA stage they override; applying them
  # first makes a fresh install converge in one pass instead of erroring
  # until a retry.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  - model: authentik_core.group
    id: headscale-users-group
    state: present
    identifiers:
      name: headscale-users

  # idan alone. A superuser group, so he administers Authentik itself (and
  # mints invitations) without akadmin, and the group every app maps to its
  # own admin role — docs/accounts.md has the per-app list.
  - model: authentik_core.group
    id: group-admin
    state: present
    identifiers:
      name: Admin
    attrs:
      is_superuser: true

  - model: authentik_providers_oauth2.oauth2provider
    id: headscale-provider
    state: present
    identifiers:
      name: headscale
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: headscale
      # Must match services.headscale.settings.oidc.client_secret_path.
      client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://headscale.idanreed.com/oidc/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      access_token_validity: hours=1
      refresh_token_validity: days=30

  - model: authentik_core.application
    id: headscale-app
    state: present
    identifiers:
      slug: headscale
    attrs:
      name: Headscale VPN
      provider: !KeyOf headscale-provider
      policy_engine_mode: any
      meta_icon: https://raw.githubusercontent.com/juanfont/headscale/main/docs/logo/headscale3_header_stacked_left.png
      meta_description: "Tailscale-compatible VPN coordination server"

  # MFA
  # The built-in stage is overridden in place: a free-standing
  # authenticatorvalidatestage never runs (stages only run when bound), and a
  # new stage + binding would collide with the built-in one at order 30 and
  # prompt twice. not_configured_action is skip | deny | configure — there is
  # no "force"; `configure` is the enforcing option.
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp-setup-stage
    state: present
    identifiers:
      name: headscale-totp-setup
    attrs:
      friendly_name: "Authenticator App Setup"
      digits: 6

  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-validation-stage
    state: present
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: "configure"
      device_classes:
        - totp
        - webauthn
        - static
      configuration_stages:
        - !KeyOf totp-setup-stage

  # Users
  # idan is the one declared account. 🚨 His password is declaratively
  # managed: `password: !Env IDAN_INITIAL_PASSWORD` is re-asserted on every
  # apply, so a change made in Authentik reverts on the next deploy — the
  # password IS the sops value (`sopsgen rotate user/idan` changes it and
  # every copy). Everyone else enrolls through an invitation
  # (invite-enrollment.yaml) and owns their own password.
  - model: authentik_core.user
    id: user-idan
    state: present
    identifiers:
      username: idan
    attrs:
      name: Idan Reed
      email: idan@idanreed.com
      path: users
      is_active: true
      password: !Env IDAN_INITIAL_PASSWORD
      groups:
        - !Find [authentik_core.group, [name, headscale-users]]
        - !Find [authentik_core.group, [name, Admin]]

  # Declared once and never used: deleted, identifiers only. `last_login:
  # null` narrows each match to an account that has never logged in, so an
  # account later created under the same name by an invitation (enrollment
  # ends logged in) survives every apply. Drop these entries once the
  # deletion has applied on the live instance.
  - model: authentik_core.user
    state: absent
    identifiers:
      username: alondra
      last_login: null

  - model: authentik_core.user
    state: absent
    identifiers:
      username: cale
      last_login: null

  - model: authentik_core.user
    state: absent
    identifiers:
      username: zach
      last_login: null

  - model: authentik_core.user
    state: absent
    identifiers:
      username: rylan
      last_login: null

  - model: authentik_core.user
    state: absent
    identifiers:
      username: cameron
      last_login: null

  - model: authentik_core.user
    state: absent
    identifiers:
      username: justin
      last_login: null
