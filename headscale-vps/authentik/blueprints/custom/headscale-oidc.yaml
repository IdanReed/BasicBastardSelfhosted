        - !Find [authentik_core.group, [name, headscale-users]]

  - model: authentik_core.user
    id: user-cameron
    state: present
    identifiers:
      username: cameron
    attrs:
      name: Cameron
      email: camos3434@gmail.com
      path: users
      is_active: true
