# NOTE the .yaml extension is load-bearing: authentik's blueprint discovery
# globs **/*.yaml only. As headscale-oidc.yml this file was mounted, visible,
# and silently never discovered — no provider, no application, no users, no
# error anywhere. Caught by tests/suites/authentik.nix.
version: 1
metadata:
  name: headscale-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # Group for Headscale users
  # ===========================================
  # Membership granted in the users section below.
  #
  # NO `attrs:` key here on purpose: a key whose body is only comments parses
  # as null, and the importer's .items() on it kills the ENTIRE blueprint
  # apply, retried forever, error only in worker logs. Caught by
  # tests/suites/authentik.nix.
  - model: authentik_core.group
    id: headscale-users-group
    state: present
    identifiers:
      name: headscale-users

  # ===========================================
  # OIDC Provider for Headscale
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: headscale-provider
    state: present
    identifiers:
      name: headscale
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: headscale
      # !Env reads from the worker's environment, which systemd populates from
      # the sops-nix-rendered EnvironmentFile. Plain "${VAR}" is NOT
      # interpolated by authentik — it would be stored as a literal string.
      # Must match services.headscale.settings.oidc.client_secret_path.
      client_secret: !Env HEADSCALE_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://headscale.idanreed.com/oidc/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Token validity
      access_token_validity: hours=1
      refresh_token_validity: days=30

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: headscale-app
    state: present
    identifiers:
      slug: headscale
    attrs:
      name: Headscale VPN
      provider: !KeyOf headscale-provider
      policy_engine_mode: any
      meta_icon: https://raw.githubusercontent.com/juanfont/headscale/main/docs/logo/headscale3_header_stacked_left.png
      meta_description: "Tailscale-compatible VPN coordination server"

  # ===========================================
  # MFA (TOTP enforcement)
  # ===========================================
  # Overrides the built-in MFA stage in place: a free-standing
  # authenticatorvalidatestage does nothing (stages only run when bound), and
  # a new stage + binding would collide with the built-in one at order 30 of
  # default-authentication-flow and prompt twice.
  #
  # not_configured_action: skip | deny | configure — no "force" exists;
  # `configure` is the enforcing option (pushes users with no authenticator
  # through configuration_stages).

  # Enrollment stage for users with no TOTP device.
  - model: authentik_stages_authenticator_totp.authenticatortotpstage
    id: totp-setup-stage
    state: present
    identifiers:
      name: headscale-totp-setup
    attrs:
      friendly_name: "Authenticator App Setup"
      digits: 6

  # Built-in stage ships not_configured_action: skip (2FA optional); this
  # makes it mandatory.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: mfa-validation-stage
    state: present
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      not_configured_action: "configure"
      device_classes:
        - totp
        - webauthn
        - static
      configuration_stages:
        - !KeyOf totp-setup-stage

  # ===========================================
  # Users
  # Add new users here and push to git
  # ===========================================
  - model: authentik_core.user
    id: user-idan
    state: present
    identifiers:
      username: idan
    attrs:
      name: Idan Reed
      email: idan@idanreed.com
      path: users
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, headscale-users]]

  # Example: Add another user
  # - model: authentik_core.user
  #   state: present
  #   identifiers:
  #     username: alice
  #   attrs:
  #     name: Alice Smith
  #     email: alice@example.com
  #     path: users
  #     is_active: true
  #     groups:
  #       - !Find [authentik_core.group, [name, headscale-users]]
