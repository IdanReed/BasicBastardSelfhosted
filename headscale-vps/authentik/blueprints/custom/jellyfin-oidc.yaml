# Jellyfin does NOT use OIDC: TV and mobile clients cannot follow the redirect,
# so it keeps its own logins. This blueprint only REMOVES the provider and
# application an earlier deploy created — deleting the file alone would orphan
# them, since Authentik never deletes what a vanished blueprint made. Delete
# this file once a deploy has applied it.
version: 1
metadata:
  name: jellyfin-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: jellyfin

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: jellyfin
