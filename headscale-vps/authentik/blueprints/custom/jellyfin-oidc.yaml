# OIDC provider + application for Jellyfin (slug "jellyfin"), consumed by the
# SSO-Auth plugin (9p4/jellyfin-plugin-sso) that jellyfin-config-init installs.
# The plugin's provider name is "authentik", which is the last path segment of
# its callback. Jellyfin keeps its own login for native apps, so no
# forward-auth entry and no `import protected` on its Caddy route.
# client_secret travels sops -> modules/authentik.nix template -> worker env
# -> !Env below; Jellyfin reads the SAME value from secrets/shared.sops.json
# through stacks/media/env.nix. The shared blueprint conventions are documented in headscale-oidc.yaml.
version: 1
metadata:
  name: jellyfin-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: jellyfin-provider
    state: present
    identifiers:
      name: jellyfin
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: jellyfin
      client_secret: !Env JELLYFIN_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://jellyfin.svc.idanreed.com/sso/OID/redirect/authentik"
          matching_mode: strict
      # profile carries `groups`, which the plugin maps to Jellyfin admin
      # (members of Admin) via its RoleClaim.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: jellyfin-app
    state: present
    identifiers:
      slug: jellyfin
    attrs:
      name: Jellyfin
      provider: !KeyOf jellyfin-provider
      policy_engine_mode: any
      meta_launch_url: "https://jellyfin.svc.idanreed.com"
      meta_description: "Movies and TV"
