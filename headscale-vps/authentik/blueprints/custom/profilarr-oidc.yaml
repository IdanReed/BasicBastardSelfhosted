# OIDC provider + application for Profilarr (slug "profilarr-sso"). The
# client_secret travels sops -> modules/authentik.nix template -> worker env ->
# !Env below; Profilarr reads the SAME value from secrets/shared.sops.json
# through stacks/media/env.profilarr.nix. The shared blueprint conventions are
# documented in headscale-oidc.yaml.
#
# Native OIDC sits UNDER the forward auth, which stays: forward-auth.yaml's
# proxy provider "profilarr" still guards the Caddy route. Both names here
# differ from forward-auth.yaml's on purpose: provider names are globally
# unique across types, and the application slug "profilarr" already holds the
# proxy provider (an application has one provider; a second blueprint claiming
# the slug would re-point it and break the forward auth).
#
# The slug fixes the issuer: keep it in step with OIDC_DISCOVERY_URL in
# stacks/media/compose.yaml. The redirect URI is fixed by Profilarr as
# {ORIGIN}/auth/oidc/callback. It fetches discovery at sign-in, never at boot,
# so an unreachable Authentik fails the login and nothing else.
version: 1
metadata:
  name: profilarr-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # The Admin group bound below is declared in headscale-oidc; applying it
  # first means the !Find resolves on a fresh install.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: headscale-oidc
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: profilarr-sso-provider
    state: present
    identifiers:
      name: profilarr-sso
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: profilarr
      client_secret: !Env PROFILARR_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://profilarr.svc.idanreed.com/auth/oidc/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      # Profilarr verifies the ID token against the discovery jwks_uri, so it
      # must be RS256-signed: without a signing key Authentik signs HS256 with
      # the client secret and every login fails verification.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: profilarr-sso-app
    state: present
    identifiers:
      slug: profilarr-sso
    attrs:
      name: Profilarr SSO
      provider: !KeyOf profilarr-sso-provider
      policy_engine_mode: any
      meta_launch_url: "https://profilarr.svc.idanreed.com"
      meta_description: "Quality profile sync login (Admin group only)"

  # Admin-only: an admin tool, whose own login was a second lock only idan
  # held. With the one group binding, Authentik refuses everyone outside
  # `Admin` (declared in headscale-oidc.yaml) and hides the tile from them.
  # Profilarr itself admits any identity Authentik vouches for.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf profilarr-sso-app
      group: !Find [authentik_core.group, [name, Admin]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
