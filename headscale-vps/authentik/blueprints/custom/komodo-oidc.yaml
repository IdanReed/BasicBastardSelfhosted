# OIDC provider + application for Komodo Core (slug "komodo-sso"). The
# client_secret travels sops -> modules/authentik.nix template -> worker env ->
# !Env below; Core reads the SAME value from secrets/shared.sops.json through
# komodo/env.nix. The shared blueprint conventions are documented in
# headscale-oidc.yaml.
#
# Native OIDC sits UNDER the forward auth, which stays: forward-auth.yaml's
# proxy provider "komodo" still guards the Caddy route, and Core's local admin
# login stays beside this one as break-glass. Both names here differ from
# forward-auth.yaml's on purpose: provider names are globally unique across
# types, and the application slug "komodo" already holds the proxy provider
# (an application has one provider; a second blueprint claiming the slug would
# re-point it and break the forward auth).
#
# The slug fixes the issuer, and Komodo stores the issuer on every OIDC user as
# part of their identity: renaming it orphans those users. Keep it in step
# with KOMODO_OIDC_PROVIDER in komodo/compose.yaml.
version: 1
metadata:
  name: komodo-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: komodo-sso-provider
    state: present
    identifiers:
      name: komodo-sso
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: komodo
      client_secret: !Env KOMODO_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://komodo.svc.idanreed.com/auth/oidc/callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: komodo-sso-app
    state: present
    identifiers:
      slug: komodo-sso
    attrs:
      name: Komodo SSO
      provider: !KeyOf komodo-sso-provider
      policy_engine_mode: any
      meta_launch_url: "https://komodo.svc.idanreed.com"
      meta_description: "Komodo deploy plane login (ROOT-EQUIVALENT: new users land disabled until the admin enables them)"

  # Admin-only: an admin tool, whose own login was a second lock only idan
  # held. With the one group binding, Authentik refuses everyone outside
  # `Admin` (declared in headscale-oidc.yaml) and hides the tile from them.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf komodo-sso-app
      group: !Find [authentik_core.group, [name, Admin]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
