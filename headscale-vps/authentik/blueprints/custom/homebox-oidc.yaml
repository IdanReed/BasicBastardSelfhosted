# OIDC provider + application for Home inventory (Homebox) (slug "homebox").
#
# Native OIDC: the app drives the browser flow itself (no outpost / no
# forward-auth entry; the Caddy route does not `import protected`). OIDC is
# additive alongside the app's local accounts unless that app is configured
# otherwise (see stacks/<name>/compose.yaml for the per-app posture).
#
# .yaml extension is load-bearing (blueprint discovery globs **/*.yaml only,
# finding #7). No comment-only `attrs:` keys (finding #9).
#
# client_secret rides the fleet's normal path: `!Env HOMEBOX_OIDC_CLIENT_SECRET` from sops ->
# modules/authentik.nix template -> worker env -> blueprint. The SAME value
# sits in the stack's .sops.env (sops-gen draws one value into both files as an
# xhost twin — see secrets-gen/manifest.yaml). Rotate = both sops files + VPS
# nixos-rebuild switch + re-up the stack. A mismatch 401s at token exchange,
# silently. The oidc-contract lint ties the !Env name to the worker env + the
# sops template.
#
# client_id "homebox" and issuer .../application/o/homebox/ must match the app's
# OIDC config (see stacks/<name>/compose.yaml).
version: 1
metadata:
  name: homebox-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # OIDC Provider
  # ===========================================
  - model: authentik_providers_oauth2.oauth2provider
    id: homebox-provider
    state: present
    identifiers:
      name: homebox
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # grant_types is REQUIRED on this authentik version: authorize.py rejects
      # the whole flow if empty (invalid_request — hit live 2026-09-03). Same
      # as kavita/outline/immich/headscale.
      grant_types:
        - authorization_code
        - refresh_token
      client_id: homebox
      # !Env reads the worker environment (see header); "${VAR}" would be a
      # literal, not interpolated.
      client_secret: !Env HOMEBOX_OIDC_CLIENT_SECRET
      redirect_uris:
        # Strict matching — a drifted URL fails at login, not with a warning.
        - url: "https://homebox.svc.idanreed.com/api/v1/users/login/oidc/callback"
          matching_mode: strict
      property_mappings:
        # The standard three, exactly like kavita/outline/immich/headscale.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  # ===========================================
  # Application (ties provider to UI)
  # ===========================================
  - model: authentik_core.application
    id: homebox-app
    state: present
    identifiers:
      slug: homebox
    attrs:
      name: Homebox
      provider: !KeyOf homebox-provider
      policy_engine_mode: any
      meta_launch_url: "https://homebox.svc.idanreed.com"
      meta_description: "Home inventory (Homebox)"
