# OIDC provider + application for Grist (slug "grist"). Native OIDC is
# Grist's only login, so no forward-auth entry and no `import protected` on
# its Caddy route. client_secret travels sops -> modules/authentik.nix
# template -> worker env -> !Env below; the app reads the SAME value from
# secrets/shared.sops.json through stacks/grist/env.nix. The shared blueprint
# conventions are documented in headscale-oidc.yaml.
#
# Grist discovers this provider at boot (issuer .../application/o/grist/) and
# refuses to start without it; its logout needs the end_session_endpoint that
# discovery advertises.
version: 1
metadata:
  name: grist-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # The Admin group bound below is declared in headscale-oidc; applying it
  # first means the !Find resolves on a fresh install.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: headscale-oidc
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: grist-provider
    state: present
    identifiers:
      name: grist
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: grist
      client_secret: !Env GRIST_OIDC_CLIENT_SECRET
      redirect_uris:
        # APP_HOME_URL + /oauth2/callback (stacks/grist/compose.yaml).
        - url: "https://grist.svc.idanreed.com/oauth2/callback"
          matching_mode: strict
      # email_verified must be true or Grist refuses the login
      # (email-verified.yaml makes the email scope emit it).
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: grist-app
    state: present
    identifiers:
      slug: grist
    attrs:
      name: Grist
      provider: !KeyOf grist-provider
      policy_engine_mode: any
      meta_launch_url: "https://grist.svc.idanreed.com"
      meta_description: "Relational spreadsheets (evaluation, idan only)"

  # Evaluation stack, idan only: Authentik refuses everyone outside `Admin`
  # and hides the tile from them.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf grist-app
      group: !Find [authentik_core.group, [name, Admin]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
