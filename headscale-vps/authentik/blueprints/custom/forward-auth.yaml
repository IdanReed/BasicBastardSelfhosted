# Forward auth: proxy providers for services that have no usable auth of
# their own, served by authentik's EMBEDDED outpost.
#
# The consumer is stacks/caddy/Caddyfile's (protected) snippet: it
# forward_auths every request to
# https://auth.idanreed.com/outpost.goauthentik.io/auth/caddy, where the
# embedded outpost matches the X-Forwarded-Host against the external_host of
# the providers assigned to it. One forward_single provider + application per
# protected service; bentopdf is the pilot. Add the entry HERE and deploy the
# VPS before flipping `import protected` on a route in the Caddyfile — a
# protected host the outpost does not know is a lockout, not a login page.
#
# NOTE the .yaml extension is load-bearing (finding #7): authentik's blueprint
# discovery globs **/*.yaml only — as .yml this file would mount, be visible,
# and silently never apply.
#
# NO comment-only `attrs:` keys anywhere in this file (finding #9): a YAML key
# whose body is only comments parses as null and the importer's .items() call
# kills the ENTIRE blueprint apply, retried forever, error only in worker logs.
version: 1
metadata:
  name: forward-auth
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # ===========================================
  # Pilot: bentopdf
  # ===========================================
  # forward_single: the outpost only answers the forward-auth endpoint for
  # this one external host; Caddy stays the reverse proxy. external_host must
  # match the public name byte-for-byte — it is what the outpost compares the
  # forwarded Host against, and what unauthenticated visitors are sent back to
  # after login.
  - model: authentik_providers_proxy.proxyprovider
    id: bentopdf-provider
    state: present
    identifiers:
      name: bentopdf
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://bentopdf.svc.idanreed.com
      access_token_validity: hours=24

  # ===========================================
  # Application (ties provider to UI + policy engine)
  # ===========================================
  - model: authentik_core.application
    id: bentopdf-app
    state: present
    identifiers:
      slug: bentopdf
    attrs:
      name: BentoPDF
      provider: !KeyOf bentopdf-provider
      policy_engine_mode: any
      meta_description: "Client-side PDF toolbox"

  # ===========================================
  # Media stack (stacks/media): the six vhosts whose Caddyfile routes
  # import (protected)
  # ===========================================
  # These exist because the routes are ALREADY flipped in
  # stacks/caddy/Caddyfile — without a provider per external_host the outpost
  # has nothing to match the forwarded Host against and every request 404s or
  # redirect-loops (the exact lockout the Caddyfile header warns about). The
  # forward-auth-coverage lint in tests/lib/lints.nix now fails whenever a
  # protected Caddy host has no entry here, so this file can no longer lag
  # the Caddyfile silently.
  #
  # qBittorrent (10057) is deliberately ABSENT: its Caddy route does not
  # exist yet, and per the Caddyfile's media-section comment the blueprint
  # entry and the route land together in a follow-up.
  - model: authentik_providers_proxy.proxyprovider
    id: radarr-provider
    state: present
    identifiers:
      name: radarr
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://radarr.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: radarr-app
    state: present
    identifiers:
      slug: radarr
    attrs:
      name: Radarr
      provider: !KeyOf radarr-provider
      policy_engine_mode: any
      meta_description: "Movie management"

  - model: authentik_providers_proxy.proxyprovider
