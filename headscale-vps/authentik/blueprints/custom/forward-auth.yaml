      provider: !KeyOf firefly-importer-provider
      policy_engine_mode: any
      meta_description: "CSV / SimpleFIN import for Firefly III"

  # Owl (stacks/owl)
  # 🚨 Owl has NO authentication whatsoever — a Streamlit app with no login and
  # no session isolation. This entry is the only thing in front of it.
  #
  # 🚨 NO skip_path_regex, and adding one for /_stcore/* would make this entry
  # decorative: /_stcore/stream IS the application, so excluding it leaves the
  # app open to anyone who opens a socket. If the UI hangs on first deploy the
  # fix is `header_up -Connection` on the Caddy route, never an exclusion.
  #
  # ⚠ Not verified end to end (needs a live outpost and a real browser): on
  # first deploy load the page and change a widget by hand.
  - model: authentik_providers_proxy.proxyprovider
    id: owl-provider
    state: present
    identifiers:
      name: owl
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://owl.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: owl-app
    state: present
    identifiers:
      slug: owl
    attrs:
      name: Owl
      provider: !KeyOf owl-provider
      policy_engine_mode: any
      meta_description: "Retirement planner (Streamlit; no login of its own)"

  # Vaultwarden (stacks/vaultwarden): /admin only
  # The only entry whose Caddy route protects a PATH rather than a host — every
  # Bitwarden client authenticates with a bearer token and the notification
  # websocket shares the port, so a 302 there degrades clients to polling.
  # external_host is still the BARE vhost: the outpost matches by
  # X-Forwarded-Host and has no concept of the path Caddy chose to send it.
  # DISABLE_ADMIN_TOKEN is deliberately not set, so the argon2 ADMIN_TOKEN
  # stays as a second factor and as a forward-auth-outage way in.
  - model: authentik_providers_proxy.proxyprovider
    id: vaultwarden-provider
    state: present
    identifiers:
      name: vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://vaultwarden.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: vaultwarden-app
    state: present
    identifiers:
      slug: vaultwarden-admin
    attrs:
      name: Vaultwarden Admin
      provider: !KeyOf vaultwarden-provider
      policy_engine_mode: any
      meta_description: "Vaultwarden server administration panel (/admin only)"

  # Notes/sync (stacks/notes-sync): syncthing GUI only
  # rmfakecloud is deliberately absent and must stay that way: the reMarkable is
  # a non-interactive JWT client and nearly all its routes are tablet paths, so
  # an exclusion list would be its whole data plane. Syncthing keeps its own
  # seeded login underneath — its API key bypasses GUI auth, so anything
  # reaching the port directly must still meet a lock.
  - model: authentik_providers_proxy.proxyprovider
    id: syncthing-provider
    state: present
    identifiers:
      name: syncthing
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://syncthing.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: syncthing-app
    state: present
    identifiers:
