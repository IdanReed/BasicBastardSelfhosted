  # ===========================================
  # Infra: arcane and mazanoke
  # ===========================================
  # 🚨 arcane is the highest-privilege entry in this file. It mounts the Docker
  # socket, so its web UI is root-equivalent on the services VM, and its
  # _overview.md row has claimed FwdAuth since before the route existed — the
  # `auth-column-parity` lint is what finally caught the gap. Deploy this file
  # and rebuild the VPS BEFORE the Caddy route syncs: the tool you would
  # normally use to fix a bad deploy IS Arcane.
  #
  # mazanoke is the mundane other half of the same lint failure: a client-side
  # image optimiser with no auth of its own, marked FwdAuth and not protected.
  - model: authentik_providers_proxy.proxyprovider
    id: arcane-provider
    state: present
    identifiers:
      name: arcane
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://arcane.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: arcane-app
    state: present
    identifiers:
      slug: arcane
    attrs:
      name: Arcane
      provider: !KeyOf arcane-provider
      policy_engine_mode: any
      meta_description: "Container and stack management (ROOT-EQUIVALENT: mounts the Docker socket)"

  - model: authentik_providers_proxy.proxyprovider
    id: mazanoke-provider
    state: present
    identifiers:
      name: mazanoke
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://mazanoke.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: mazanoke-app
    state: present
    identifiers:
      slug: mazanoke
    attrs:
      name: Mazanoke
      provider: !KeyOf mazanoke-provider
      policy_engine_mode: any
      meta_description: "Client-side image optimiser"

  # ===========================================
  # Windmill (stacks/windmill)
  # ===========================================
  # Forward auth is the ONLY SSO Windmill can have — OIDC is an Enterprise
  # feature and the OSS build has no path to it. Note this gates ACCESS only:
  # Windmill does not read X-Authentik-* headers, so users still log in with a
  # local Windmill account afterwards.
  #
  # NO skip_path_regex here, deliberately. Carving out ^/api/.* would expose
  # the entire authenticated API to anyone who can reach the vhost. In-fleet
  # callers use the loopback/bridge address instead, which never traverses
  # Caddy — see the Caddyfile handle.
  - model: authentik_providers_proxy.proxyprovider
    id: windmill-provider
    state: present
    identifiers:
      name: windmill
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://windmill.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: windmill-app
    state: present
    identifiers:
      slug: windmill
    attrs:
      name: Windmill
      provider: !KeyOf windmill-provider
