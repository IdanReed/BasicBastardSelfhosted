      meta_description: "Workflow orchestration (browser access only)"

  # Food (stacks/wger)
  # Tandoor is deliberately absent: it drives its own OIDC, and it must NEVER be
  # given REMOTE_USER_AUTH — that puts RemoteUserBackend in
