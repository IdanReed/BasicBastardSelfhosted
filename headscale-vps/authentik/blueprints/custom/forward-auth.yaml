      provider: !KeyOf beszel-provider
      policy_engine_mode: any
      meta_description: "Host and container resource monitoring"

  # Ingestion never touches Caddy (Alloy pushes on the stack's own network), so
  # no carve-out is needed. There is deliberately no provider for VictoriaLogs
  # or Alloy — neither has a Caddy route.
  # ⚠ Enabling Grafana Live means adding a /api/live/* carve-out HERE first, not
  # just flipping the env var. Grafana's own admin login stays underneath.
  - model: authentik_providers_proxy.proxyprovider
    id: grafana-provider
    state: present
    identifiers:
      name: grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://grafana.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: grafana-app
    state: present
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      policy_engine_mode: any
      meta_description: "Fleet log search over Loki"

  # Embedded outpost assignment
  # `providers` REPLACES the list on every apply — every protected provider must
  # be listed, or adding service N+1 silently unassigns 1..N.
  #
  # config.authentik_host is REQUIRED for the embedded outpost: its API
  # connection is localhost, so without it the browser-facing authorize/logout
  # URLs are built from localhost and every login redirect dead-ends.
  - model: authentik_outposts.outpost
    id: embedded-outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      config:
        authentik_host: https://auth.idanreed.com
      providers:
        - !KeyOf bentopdf-provider
        - !KeyOf backrest-provider
        - !KeyOf radarr-provider
        - !KeyOf sonarr-provider
        - !KeyOf prowlarr-provider
        - !KeyOf bazarr-provider
        - !KeyOf profilarr-provider
        - !KeyOf cleanuparr-provider
        - !KeyOf shelfmark-provider
        - !KeyOf frigate-provider
        - !KeyOf firefly-provider
        - !KeyOf firefly-importer-provider
        - !KeyOf owl-provider
        - !KeyOf vaultwarden-provider
        - !KeyOf syncthing-provider
        - !KeyOf glance-provider
        - !KeyOf it-tools-provider
        - !KeyOf komodo-provider
        - !KeyOf mazanoke-provider
        - !KeyOf windmill-provider
        - !KeyOf wger-provider
        - !KeyOf gatus-provider
        - !KeyOf beszel-provider
        - !KeyOf silverbullet-provider
        - !KeyOf grafana-provider
