      name: Frigate
      provider: !KeyOf frigate-provider
      policy_engine_mode: any
      meta_description: "NVR and object detection"

  # ===========================================
  # Firefly stack (stacks/firefly): both vhosts
  # ===========================================
  # Firefly III is the only service in the fleet for which forward auth is
  # the ONLY possible SSO path — there is no OIDC in core at v6.6.6 or on
  # develop and the feature is milestoned v9.0.0 with no date. It is also the
  # highest-stakes entry here: its remote_user_guard does no validation of the
  # header at all, so whatever string the outpost sends IS the account, and
  # the first one becomes the owner. Deploy this file and rebuild the VPS
  # BEFORE the Caddy route syncs.
  #
  # skip_path_regex is what makes the API usable: Firefly authenticates API
  # requests with Passport personal access tokens under a SEPARATE guard, and
  # without this exclusion the outpost 302s every bearer-token client to a
  # login page before Firefly ever sees the token. It is scoped to ^/api/.*
  # only — the browser UI, /profile and /oauth stay protected.
  - model: authentik_providers_proxy.proxyprovider
    id: firefly-provider
    state: present
    identifiers:
      name: firefly
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://firefly.svc.idanreed.com
      skip_path_regex: "^/api/.*"
      access_token_validity: hours=24

  - model: authentik_core.application
    id: firefly-app
    state: present
    identifiers:
      slug: firefly
    attrs:
      name: Firefly III
      provider: !KeyOf firefly-provider
      policy_engine_mode: any
      meta_description: "Personal finance manager"

  # The data importer is a SEPARATE provider rather than a second host on the
  # Firefly one, because the embedded outpost matches forward-auth requests by
  # external_host — one provider answers for exactly one hostname in
  # forward_single mode.
  #
  # Its UI has no authentication of its own and cannot be given any in PAT
  # mode, while holding a full-privilege Firefly API token. No skip_path_regex:
  # it has no API clients, and its calls to firefly:8080 ride the compose
  # network without touching Caddy.
  - model: authentik_providers_proxy.proxyprovider
    id: firefly-importer-provider
    state: present
    identifiers:
      name: firefly-importer
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://firefly-importer.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: firefly-importer-app
    state: present
    identifiers:
      slug: firefly-importer
    attrs:
      name: Firefly III Data Importer
      provider: !KeyOf firefly-importer-provider
      policy_engine_mode: any
      meta_description: "CSV / SimpleFIN import for Firefly III"

  # The tracking and dawarich stacks are deliberately ABSENT: bookstack,
  # homebox, karakeep and dawarich all drive their own native OIDC (their own
  # -oidc blueprints, once the client secrets exist). Dawarich in particular
  # must NEVER be added here — its tracker clients pass an API key in the query
  # string and cannot follow a redirect, so the exclusion list would be its
  # entire data plane.
  #
  # Ghostfolio (stacks/ghostfolio, 10306) is absent for the first reason: it
  # authenticates with its own security token today and has native OIDC waiting
  # for a client secret. Owl (stacks/owl, 10307) is the exact opposite and is
  # RIGHT BELOW.

  # ===========================================
  # Owl (stacks/owl): the whole application
  # ===========================================
  # 🚨 Owl has NO AUTHENTICATION WHATSOEVER. Not a default password, not an open
  # registration — a Streamlit app with no login, no users and no session
  # isolation. Verified by reading the image: neither Dockerfile ships a
  # .streamlit/secrets.toml, nothing in ui/ or src/ references st.login, st.user
  # or any authenticator, and upstream documents it as a local calculator.
  #
  # So this entry is the ONLY thing standing between a tailnet user and
  # somebody else's retirement plan, in the same category as firefly-importer
  # rather than as the media *arrs. It must exist BEFORE stacks/caddy/Caddyfile
  # grows the `import protected` line, or the outpost matches nothing and every
  # request 404s (the forward-auth-coverage lint enforces the pairing; the
  # ORDER is on whoever deploys).
  #
  # 🚨 NO skip_path_regex, AND ADDING ONE FOR /_stcore/* WOULD MAKE THIS ENTRY
  # DECORATIVE. That is the trap worth writing down, because "exempt the
  # websocket" is the reflex when a Streamlit app misbehaves behind a proxy:
  # Streamlit's websocket at /_stcore/stream is not a side channel, it IS the
  # application — every widget interaction, every script rerun and every result
  # travels over it, and the HTML served at `/` is an empty shell without it.
  # An exclusion there would leave the login page protected and the entire app
  # open to anyone who opens a socket. This is the dawarich reasoning run
  # backwards: dawarich cannot be proxied BECAUSE excluding its data plane
  # would be vacuous; here the data plane is exactly what must stay covered.
  #
  # Why no exclusion is needed, traced through the outpost source rather than
  # assumed: forwardHandleCaddy (internal/outpost/proxyv2/application/
  # mode_forward.go) reconstructs the request URL from X-Forwarded-Proto/Host/
  # Uri, calls checkAuth, and on success simply RETURNS — Go writes an implicit
  # 200, which is the `@good status 2xx` case Caddy then passes through. There
  # is nothing websocket-aware in it, so /_stcore/stream is decided by the same
  # session cookie as `/`. Browsers cannot attach an Authorization header to a
  # handshake but do attach cookies, so authentik_proxy_<hash> is present.
  #
  # It also means this handler can NEVER answer 101, which is what makes the
  # arrangement safe: Caddy forwards the Upgrade/Connection headers to the auth
  # upstream, and an upstream naive enough to upgrade on them would leave
  # forward_auth hanging with nothing surfaced to the browser.
  #
  # ⚠ WHAT IS NOT VERIFIED, stated plainly: the chain has NOT been exercised end
  # to end. It cannot be from here — it needs the live VPS outpost, a real
  # Authentik session and a real browser, none of which the offline suites have.
  # `./tests/run.sh stack owl` proves the container serves the websocket; it
  # proves nothing about the outpost in front of it. FIRST DEPLOY MUST BE
  # CHECKED BY HAND: load the page, change a widget, confirm it updates. If it
  # hangs, the fix is `header_up -Connection` on the Caddy route — it is NOT an
  # exclusion for /_stcore/*.
  #
  # ⚠ Expected, not a bug: when this provider's 24h session expires with the tab
  # still open, the socket's reconnect gets a 302 and browsers do not follow
  # redirects on a handshake, so the UI quietly stops updating until reload.
  - model: authentik_providers_proxy.proxyprovider
    id: owl-provider
    state: present
    identifiers:
      name: owl
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://owl.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: owl-app
    state: present
    identifiers:
      slug: owl
    attrs:
      name: Owl
      provider: !KeyOf owl-provider
      policy_engine_mode: any
      meta_description: "Retirement planner (Streamlit; no login of its own)"

  # ===========================================
  # Vaultwarden (stacks/vaultwarden): /admin ONLY
  # ===========================================
  # The only entry here whose Caddy route protects a PATH rather than a host:
  # stacks/caddy/Caddyfile imports (protected) inside a `path /admin*` handle
  # and leaves everything else unauthenticated by Authentik, because every
  # Bitwarden client authenticates with a bearer token and the notification
  # websocket is on the same port — a 302 there makes clients fall back to
  # polling silently.
  #
  # external_host is still the BARE VHOST, not a path: the embedded outpost
  # matches forward-auth requests by X-Forwarded-Host and has no concept of the
  # path Caddy chose to send it. Restricting which paths are protected is
  # Caddy's job and Caddy's alone.
  #
  # Note DISABLE_ADMIN_TOKEN is deliberately NOT set on the container — the
  # argon2 ADMIN_TOKEN stays in place alongside this, so a forward-auth outage
  # still leaves a way in and a leaked token still needs an Authentik session.
  - model: authentik_providers_proxy.proxyprovider
    id: vaultwarden-provider
    state: present
    identifiers:
      name: vaultwarden
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://vaultwarden.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: vaultwarden-app
    state: present
    identifiers:
      slug: vaultwarden-admin
    attrs:
      name: Vaultwarden Admin
      provider: !KeyOf vaultwarden-provider
      policy_engine_mode: any
      meta_description: "Vaultwarden server administration panel (/admin only)"

  # ===========================================
  # Notes/Sync stack (stacks/notes-sync): syncthing GUI only
  # ===========================================
  # rmfakecloud is deliberately ABSENT and must stay that way: the reMarkable
  # is a non-interactive JWT client and roughly forty of its ~forty-five routes
  # are tablet paths, so a forward-auth exclusion list would be the entire data
  # plane. It authenticates its own /ui/* with argon2id + JWT.
  #
  # Syncthing's GUI is a browser surface and gets the full treatment. Note the
  # container ALSO keeps its own seeded user/password: the API key is a
  # full-admin credential that bypasses GUI auth, so anything reaching the port
  # directly must still meet a lock. The Caddy route strips a client-supplied
  # X-API-Key for the same reason.
  - model: authentik_providers_proxy.proxyprovider
    id: syncthing-provider
    state: present
    identifiers:
      name: syncthing
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://syncthing.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: syncthing-app
    state: present
    identifiers:
      slug: syncthing
    attrs:
      name: Syncthing
      provider: !KeyOf syncthing-provider
      policy_engine_mode: any
      meta_description: "File synchronisation (web GUI)"

  # ===========================================
  # SilverBullet (stacks/silverbullet)
  # ===========================================
  # A markdown wiki whose own auth is a single SB_USER credential; forward
  # auth is the primary lock and that credential stays underneath (two
  # logins, the Windmill/Syncthing posture — SilverBullet does not read
  # X-Authentik-* headers).
  #
  # NO skip_path_regex, measured rather than assumed. Against the pinned
  # 2.9.0 with SB_USER set, the only paths served without a session are `/`,
  # `/.ping`, `/.client/*`, `/service_worker.js` and `/.auth` — all
  # same-origin browser requests that carry the Authentik cookie. Nothing
  # dials this vhost non-interactively: the space is mirrored to Forgejo by a
  # sidecar that uses Forgejo's LOOPBACK publish, never Caddy. The one thing
  # forward auth genuinely breaks is the PWA service worker (a cached 302 for
  # a JS URL), and that is handled by turning the worker OFF in the compose
  # file rather than by opening a hole here.
  #
  # Outline, the other wiki landing at the same time, is deliberately ABSENT:
  # it drives its own OIDC (outline-oidc.yaml) and has no local accounts, so
  # proxy auth in front of it would 302 its own callback.
  - model: authentik_providers_proxy.proxyprovider
    id: silverbullet-provider
    state: present
    identifiers:
      name: silverbullet
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://silverbullet.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: silverbullet-app
    state: present
    identifiers:
      slug: silverbullet
    attrs:
      name: SilverBullet
      provider: !KeyOf silverbullet-provider
      policy_engine_mode: any
      meta_description: "Markdown wiki, git-mirrored to Forgejo"

