    state: present
    identifiers:
      slug: komodo
    attrs:
      name: Komodo
      provider: !KeyOf komodo-provider
      policy_engine_mode: any
      meta_description: "Container and stack management (ROOT-EQUIVALENT: Periphery mounts the Docker socket)"

  - model: authentik_providers_proxy.proxyprovider
    id: mazanoke-provider
    state: present
    identifiers:
      name: mazanoke
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://mazanoke.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: mazanoke-app
    state: present
    identifiers:
      slug: mazanoke
    attrs:
      name: Mazanoke
      provider: !KeyOf mazanoke-provider
      policy_engine_mode: any
      meta_description: "Client-side image optimiser"

  # Windmill (stacks/windmill)
  # Forward auth is the only SSO Windmill can have (OIDC is Enterprise), and it
  # gates ACCESS only — users still log in with a local Windmill account after.
  # No skip_path_regex: carving out ^/api/.* would expose the whole
  # authenticated API. In-fleet callers use the loopback address instead.
  - model: authentik_providers_proxy.proxyprovider
    id: windmill-provider
    state: present
    identifiers:
      name: windmill
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://windmill.svc.idanreed.com
      access_token_validity: hours=24

