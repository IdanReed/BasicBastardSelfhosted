  # SilverBullet (stacks/silverbullet)
  # Forward auth is the primary lock; its single SB_USER credential stays
  # underneath. No skip_path_regex, measured: nothing dials this vhost
  # non-interactively (the Forgejo mirror sidecar uses Forgejo's loopback
  # publish). The PWA service worker is turned off in the compose file rather
  # than opening a hole here. Outline is absent — it drives its own OIDC.
  - model: authentik_providers_proxy.proxyprovider
    id: silverbullet-provider
    state: present
    identifiers:
      name: silverbullet
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://silverbullet.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: silverbullet-app
    state: present
    identifiers:
      slug: silverbullet
    attrs:
      name: SilverBullet
      provider: !KeyOf silverbullet-provider
