  # Infra
  # 🚨 komodo is the highest-privilege entry in this file: its Core UI drives
  # Periphery, which mounts the Docker socket, so the UI is root-equivalent on
  # the services VM. Deploy this file and rebuild the VPS BEFORE the Caddy route
  # syncs — the tool you would use to fix a bad deploy IS Komodo.
  - model: authentik_providers_proxy.proxyprovider
    id: komodo-provider
    state: present
    identifiers:
      name: komodo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://komodo.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
