  # ===========================================
  # Infra: komodo and mazanoke
  # ===========================================
  # 🚨 komodo is the highest-privilege entry in this file. Its Core UI drives
  # Periphery, which mounts the Docker socket, so the UI is root-equivalent on
  # the services VM, and its _overview.md row has claimed FwdAuth since before
  # the route existed — the `auth-column-parity` lint is what finally caught the
  # gap. Deploy this file and rebuild the VPS BEFORE the Caddy route syncs: the
  # tool you would normally use to fix a bad deploy IS Komodo.
  #
  # mazanoke is the mundane other half of the same lint failure: a client-side
  # image optimiser with no auth of its own, marked FwdAuth and not protected.
  - model: authentik_providers_proxy.proxyprovider
    id: komodo-provider
    state: present
    identifiers:
      name: komodo
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://komodo.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: komodo-app
    state: present
    identifiers:
      slug: komodo
    attrs:
      name: Komodo
      provider: !KeyOf komodo-provider
      policy_engine_mode: any
      meta_description: "Container and stack management (ROOT-EQUIVALENT: Periphery mounts the Docker socket)"

  - model: authentik_providers_proxy.proxyprovider
    id: mazanoke-provider
    state: present
    identifiers:
      name: mazanoke
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://mazanoke.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: mazanoke-app
    state: present
    identifiers:
      slug: mazanoke
    attrs:
      name: Mazanoke
      provider: !KeyOf mazanoke-provider
      policy_engine_mode: any
      meta_description: "Client-side image optimiser"

  # ===========================================
  # Windmill (stacks/windmill)
  # ===========================================
  # Forward auth is the ONLY SSO Windmill can have — OIDC is an Enterprise
  # feature and the OSS build has no path to it. Note this gates ACCESS only:
  # Windmill does not read X-Authentik-* headers, so users still log in with a
  # local Windmill account afterwards.
  #
  # NO skip_path_regex here, deliberately. Carving out ^/api/.* would expose
  # the entire authenticated API to anyone who can reach the vhost. In-fleet
  # callers use the loopback/bridge address instead, which never traverses
  # Caddy — see the Caddyfile handle.
  - model: authentik_providers_proxy.proxyprovider
    id: windmill-provider
    state: present
    identifiers:
      name: windmill
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://windmill.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: windmill-app
    state: present
    identifiers:
      slug: windmill
    attrs:
      name: Windmill
      provider: !KeyOf windmill-provider
      policy_engine_mode: any
      meta_description: "Workflow orchestration (browser access only)"

  # ===========================================
  # Food domain (stacks/wger): wger only
  # ===========================================
  # Tandoor is deliberately ABSENT: it drives its own OIDC and ships
  # OIDC-ready/OIDC-off on a local superuser. Note it must NEVER be given
  # forward auth by setting REMOTE_USER_AUTH — that puts RemoteUserBackend in
  # AUTHENTICATION_BACKENDS, and Tandoor's /setup/ view refuses to run at all
  # when it is present, so a fresh instance would have no way in.
  - model: authentik_providers_proxy.proxyprovider
    id: wger-provider
    state: present
    identifiers:
      name: wger
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://wger.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: wger-app
    state: present
    identifiers:
      slug: wger
    attrs:
      name: Wger
      provider: !KeyOf wger-provider
      policy_engine_mode: any
      meta_description: "Workout and nutrition tracking"

  # ===========================================
  # Monitoring (stacks/gatus)
  # ===========================================
  # Gatus has no usable auth of its own — its `security` block leaves the SPA,
  # /api/v1/config and every uptime-history route on an UNPROTECTED router, so
  # this provider is the only thing guarding the fleet's availability data. Its
  # own OIDC is deliberately never enabled: it panics at startup if discovery
  # fails, which would restart-loop the monitoring service on a tailnet blip.
  #
  # DocSpace is deliberately ABSENT: it has real accounts and desktop/mobile
  # clients that a 302 would break, and its SSO is SAML rather than OIDC.
  - model: authentik_providers_proxy.proxyprovider
    id: gatus-provider
    state: present
    identifiers:
      name: gatus
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://gatus.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: gatus-app
    state: present
    identifiers:
      slug: gatus
    attrs:
      name: Gatus
      provider: !KeyOf gatus-provider
      policy_engine_mode: any
      meta_description: "Availability monitoring"

  # Beszel — resource monitoring (stacks/beszel, 10452). Browser surface only:
  # the agent reaches the hub on http://127.0.0.1:10452 over the host network
  # and never traverses Caddy, so there is no websocket for the outpost to 302
  # and no Unauthenticated-URL carve-out is needed. Beszel's own PocketBase
  # login stays underneath.
  - model: authentik_providers_proxy.proxyprovider
    id: beszel-provider
    state: present
    identifiers:
      name: beszel
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://beszel.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: beszel-app
    state: present
    identifiers:
      slug: beszel
    attrs:
      name: Beszel
      provider: !KeyOf beszel-provider
      policy_engine_mode: any
      meta_description: "Host and container resource monitoring"

  # Grafana — log search over VictoriaLogs (stacks/logging, 10455). Browser
  # surface only, and unusually clean for it: the INGESTION path never touches
  # Caddy at all (Alloy pushes to victorialogs:9428 on the stack's own compose
  # network, and Grafana queries the same address), so there is no API caller
  # for the outpost to 302 and no Unauthenticated-URL carve-out is needed.
  # There is deliberately NO provider for VictoriaLogs or Alloy — neither has
  # a Caddy route, and Alloy's UI is bound to its container's loopback and
  # never published.
  #
  # ⚠ The one carve-out this WOULD need is /api/live/* (Grafana Live
  # websockets, which the outpost 302s). It is not here because Live is
  # disabled in stacks/logging/compose.yaml — turning it on means adding the
  # carve-out here first, not just flipping the env var.
  #
  # Grafana's own admin login stays underneath, from stacks/logging/.sops.env:
  # two logins, on purpose. Grafana's auth.proxy header mode would trust
  # X-Authentik-* from anything that can reach the loopback publish, and this
  # is the service you most want working when the VPS running this outpost is
  # itself the thing that broke.
  - model: authentik_providers_proxy.proxyprovider
    id: grafana-provider
    state: present
    identifiers:
      name: grafana
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://grafana.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: grafana-app
    state: present
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      policy_engine_mode: any
      meta_description: "Fleet log search over Loki"

  # ===========================================
  # Embedded outpost assignment
  # ===========================================
  # The embedded outpost ships with authentik itself and answers on the server
  # container (:9000, i.e. behind auth.idanreed.com) — no extra proxy
  # container to run. Identified by its default name; the importer update-or-
  # creates by identifiers, and tests/suites/forward-auth.nix asserts via the
  # API that the outpost authentik actually created carries exactly this name,
  # so a rename upstream fails the suite instead of silently creating a
  # second, unconnected outpost here.
  #
  # `providers` REPLACES the assignment list on every apply — every protected
  # provider must be listed, or flipping this file for service N+1 silently
  # unassigns services 1..N.
  #
  # config.authentik_host is REQUIRED for the embedded outpost: its API
  # connection is localhost, so without it the outpost logs "Outpost has
  # localhost/blank API Connection but no authentik_host is configured" and
  # builds browser-facing authorize/logout URLs from localhost — every login
  # redirect dead-ends. (GetOIDCEndpoint in authentik's
  # internal/outpost/proxyv2/application/endpoint.go is where this bites.)
  - model: authentik_outposts.outpost
    id: embedded-outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      config:
        authentik_host: https://auth.idanreed.com
      providers:
        - !KeyOf bentopdf-provider
        - !KeyOf radarr-provider
        - !KeyOf sonarr-provider
        - !KeyOf prowlarr-provider
        - !KeyOf bazarr-provider
        - !KeyOf profilarr-provider
        - !KeyOf cleanuparr-provider
        - !KeyOf shelfmark-provider
        - !KeyOf frigate-provider
        - !KeyOf firefly-provider
        - !KeyOf firefly-importer-provider
        - !KeyOf owl-provider
        - !KeyOf vaultwarden-provider
        - !KeyOf syncthing-provider
        - !KeyOf glance-provider
        - !KeyOf it-tools-provider
        - !KeyOf komodo-provider
        - !KeyOf mazanoke-provider
        - !KeyOf windmill-provider
        - !KeyOf wger-provider
        - !KeyOf gatus-provider
        - !KeyOf beszel-provider
        - !KeyOf silverbullet-provider
        - !KeyOf grafana-provider
