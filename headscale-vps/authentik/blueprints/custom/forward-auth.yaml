  # ===========================================
  # Food domain (stacks/wger): wger only
  # ===========================================
  # Tandoor is deliberately ABSENT: it drives its own OIDC and ships
  # OIDC-ready/OIDC-off on a local superuser. Note it must NEVER be given
  # forward auth by setting REMOTE_USER_AUTH — that puts RemoteUserBackend in
  # AUTHENTICATION_BACKENDS, and Tandoor's /setup/ view refuses to run at all
  # when it is present, so a fresh instance would have no way in.
  - model: authentik_providers_proxy.proxyprovider
    id: wger-provider
    state: present
    identifiers:
      name: wger
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://wger.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: wger-app
    state: present
    identifiers:
      slug: wger
    attrs:
      name: Wger
      provider: !KeyOf wger-provider
      policy_engine_mode: any
      meta_description: "Workout and nutrition tracking"

  # ===========================================
  # Monitoring (stacks/gatus)
  # ===========================================
  # Gatus has no usable auth of its own — its `security` block leaves the SPA,
  # /api/v1/config and every uptime-history route on an UNPROTECTED router, so
  # this provider is the only thing guarding the fleet's availability data. Its
  # own OIDC is deliberately never enabled: it panics at startup if discovery
  # fails, which would restart-loop the monitoring service on a tailnet blip.
  #
  # DocSpace is deliberately ABSENT: it has real accounts and desktop/mobile
  # clients that a 302 would break, and its SSO is SAML rather than OIDC.
  - model: authentik_providers_proxy.proxyprovider
    id: gatus-provider
    state: present
    identifiers:
      name: gatus
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://gatus.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: gatus-app
    state: present
    identifiers:
      slug: gatus
    attrs:
      name: Gatus
      provider: !KeyOf gatus-provider
      policy_engine_mode: any
      meta_description: "Availability monitoring"

  # Beszel — resource monitoring (stacks/beszel, 10452). Browser surface only:
  # the agent reaches the hub on http://127.0.0.1:10452 over the host network
  # and never traverses Caddy, so there is no websocket for the outpost to 302
  # and no Unauthenticated-URL carve-out is needed. Beszel's own PocketBase
  # login stays underneath.
  - model: authentik_providers_proxy.proxyprovider
    id: beszel-provider
    state: present
    identifiers:
      name: beszel
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://beszel.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: beszel-app
    state: present
    identifiers:
      slug: beszel
    attrs:
      name: Beszel
      provider: !KeyOf beszel-provider
      policy_engine_mode: any
      meta_description: "Host and container resource monitoring"

  # ===========================================
  # Embedded outpost assignment
  # ===========================================
  # The embedded outpost ships with authentik itself and answers on the server
  # container (:9000, i.e. behind auth.idanreed.com) — no extra proxy
  # container to run. Identified by its default name; the importer update-or-
  # creates by identifiers, and tests/suites/forward-auth.nix asserts via the
  # API that the outpost authentik actually created carries exactly this name,
  # so a rename upstream fails the suite instead of silently creating a
  # second, unconnected outpost here.
  #
  # `providers` REPLACES the assignment list on every apply — every protected
  # provider must be listed, or flipping this file for service N+1 silently
  # unassigns services 1..N.
  #
  # config.authentik_host is REQUIRED for the embedded outpost: its API
  # connection is localhost, so without it the outpost logs "Outpost has
  # localhost/blank API Connection but no authentik_host is configured" and
  # builds browser-facing authorize/logout URLs from localhost — every login
  # redirect dead-ends. (GetOIDCEndpoint in authentik's
  # internal/outpost/proxyv2/application/endpoint.go is where this bites.)
  - model: authentik_outposts.outpost
    id: embedded-outpost
    state: present
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      config:
        authentik_host: https://auth.idanreed.com
      providers:
        - !KeyOf bentopdf-provider
        - !KeyOf radarr-provider
        - !KeyOf sonarr-provider
        - !KeyOf prowlarr-provider
        - !KeyOf bazarr-provider
        - !KeyOf profilarr-provider
        - !KeyOf cleanuparr-provider
        - !KeyOf shelfmark-provider
        - !KeyOf frigate-provider
        - !KeyOf firefly-provider
        - !KeyOf firefly-importer-provider
        - !KeyOf vaultwarden-provider
        - !KeyOf syncthing-provider
        - !KeyOf glance-provider
        - !KeyOf it-tools-provider
        - !KeyOf arcane-provider
        - !KeyOf mazanoke-provider
        - !KeyOf windmill-provider
        - !KeyOf wger-provider
        - !KeyOf gatus-provider
        - !KeyOf beszel-provider
