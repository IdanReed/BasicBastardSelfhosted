# Proxy providers for services with no usable auth of their own, served by
# authentik's EMBEDDED outpost.
#
# The consumer is stacks/caddy/Caddyfile's (protected) snippet: it forward_auths
# to /outpost.goauthentik.io/auth/caddy, where the outpost matches the
# X-Forwarded-Host against each provider's external_host — so external_host must
# be the public name byte-for-byte, and forward_single answers for exactly one
# hostname. Add the entry HERE and deploy the VPS BEFORE flipping `import
# protected` on a route: a protected host the outpost does not know is a
# lockout, not a login page. The forward-auth-coverage lint enforces the
# pairing; the order is on whoever deploys.
#
# Shared blueprint conventions (.yaml discovery, no comment-only `attrs:`) are
# documented in headscale-oidc.yaml.
version: 1
metadata:
  name: forward-auth
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # Pilot
  - model: authentik_providers_proxy.proxyprovider
    id: bentopdf-provider
    state: present
    identifiers:
      name: bentopdf
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://bentopdf.svc.idanreed.com
      access_token_validity: hours=24

  - model: authentik_core.application
    id: bentopdf-app
    state: present
    identifiers:
      slug: bentopdf
    attrs:
      name: BentoPDF
      provider: !KeyOf bentopdf-provider
      policy_engine_mode: any
      meta_description: "Client-side PDF toolbox"

  # Backups (stacks/backrest): holds the restic password and the VPS backup
  # key, so its own bcrypt login is not left as the only lock.
