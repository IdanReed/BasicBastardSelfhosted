    attrs:
      name: Frigate
      provider: !KeyOf frigate-provider
      policy_engine_mode: any
      meta_description: "NVR and object detection"

  # Firefly (stacks/firefly)
  # The highest-stakes entry here: Firefly's remote_user_guard does no
  # validation, so whatever string the outpost sends IS the account and the
  # first one becomes the owner. skip_path_regex is scoped to ^/api/.* only —
  # API clients authenticate with Passport tokens under a separate guard, and
  # without the exclusion the outpost 302s them before Firefly sees the token.
  - model: authentik_providers_proxy.proxyprovider
    id: firefly-provider
    state: present
    identifiers:
      name: firefly
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: forward_single
      external_host: https://firefly.svc.idanreed.com
      skip_path_regex: "^/api/.*"
      access_token_validity: hours=24

  - model: authentik_core.application
    id: firefly-app
    state: present
    identifiers:
      slug: firefly
    attrs:
      name: Firefly III
      provider: !KeyOf firefly-provider
      policy_engine_mode: any
      meta_description: "Personal finance manager"

  # A separate provider, not a second host on the Firefly one: forward_single
  # answers for one hostname. No skip_path_regex — it has no API clients, and
  # its calls to firefly:8080 ride the compose network.
  - model: authentik_providers_proxy.proxyprovider
    id: firefly-importer-provider
