  # Monitoring
  # Gatus's own `security` block leaves the SPA, /api/v1/config and every
  # uptime-history route unprotected, so this provider is the only guard on the
  # fleet's availability data. Its own OIDC is deliberately never enabled: it
  # panics at startup if discovery fails, which would restart-loop monitoring on
  # a tailnet blip. DocSpace is absent — real accounts, desktop/mobile clients,
  # SAML rather than OIDC.
  - model: authentik_providers_proxy.proxyprovider
    id: gatus-provider
    state: present
    identifiers:
      name: gatus
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
