# OIDC provider + application for Penpot (slug "penpot"). Native OIDC is
# Penpot's only login, so no forward-auth entry and no `import protected` on
# its Caddy route. client_secret travels sops -> modules/authentik.nix
# template -> worker env -> !Env below; the app reads the SAME value from
# secrets/shared.sops.json through stacks/penpot/env.nix. The shared blueprint
# conventions are documented in headscale-oidc.yaml.
#
# Penpot is given every endpoint explicitly and reads the userinfo endpoint,
# never the id_token, so nothing here is fetched at its boot.
version: 1
metadata:
  name: penpot-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  # The Admin group bound below is declared in headscale-oidc; applying it
  # first means the !Find resolves on a fresh install.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: headscale-oidc
      required: true

  - model: authentik_providers_oauth2.oauth2provider
    id: penpot-provider
    state: present
    identifiers:
      name: penpot
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: penpot
      client_secret: !Env PENPOT_OIDC_CLIENT_SECRET
      redirect_uris:
        # PENPOT_PUBLIC_URI + /api/auth/oidc/callback (stacks/penpot/compose.yaml).
        - url: "https://penpot.svc.idanreed.com/api/auth/oidc/callback"
          matching_mode: strict
      # profile carries `groups`, which Penpot checks for `Admin`
      # (PENPOT_OIDC_ROLES) before it creates or logs in a profile.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: penpot-app
    state: present
    identifiers:
      slug: penpot
    attrs:
      name: Penpot
      provider: !KeyOf penpot-provider
      policy_engine_mode: any
      meta_launch_url: "https://penpot.svc.idanreed.com"
      meta_description: "Design and prototyping (evaluation, idan only)"

  # Evaluation stack, idan only: Authentik refuses everyone outside `Admin`
  # and hides the tile from them.
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf penpot-app
      group: !Find [authentik_core.group, [name, Admin]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
