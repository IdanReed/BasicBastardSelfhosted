# Override the built-in OAuth "email" scope mapping so it emits
# `email_verified: true` for any account that has an email address. Authentik's
# default hardcodes false in this version, and strict OIDC clients (Kavita)
# refuse login on it. There is no open enrollment here: idan is declared, and
# everyone else enrolls through an invitation whose email the operator fixes
# and the invitee cannot edit (invite-enrollment.yaml) — so every account's
# email is operator-vouched.
#
# Matched by `managed` identifier, so this is a partial update of the single
# built-in mapping: every provider's `!Find [scopemapping, [scope_name, email]]`
# still resolves to one object. Adding a second email-scope mapping would make
# those lookups ambiguous.
version: 1
metadata:
  name: email-verified
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      managed: goauthentik.io/providers/oauth2/scope-email
    attrs:
      # bool(...) not a hardcoded True: an account with no email correctly
      # reports unverified rather than lying.
      expression: |
        return {
            "email": request.user.email,
            "email_verified": bool(request.user.email),
        }
