# OIDC provider + application for Immich (slug "immich"). Native
# OIDC, so no forward-auth entry and no `import protected` on its Caddy
# route. client_secret travels sops -> modules/authentik.nix template ->
# worker env -> !Env below, twinned into the stack's own .sops.env; the
# shared blueprint conventions are documented in headscale-oidc.yaml.
version: 1
metadata:
  name: immich-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    state: present
    identifiers:
      name: immich
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: immich
      client_secret: !Env IMMICH_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://immich.svc.idanreed.com/auth/login"
          matching_mode: strict
        - url: "https://immich.svc.idanreed.com/user-settings"
          matching_mode: strict
        - url: "app.immich:///oauth-callback"
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: immich-app
    state: present
    identifiers:
      slug: immich
    attrs:
      name: Immich
      provider: !KeyOf immich-provider
      policy_engine_mode: any
      meta_launch_url: "https://immich.svc.idanreed.com"
      meta_description: "Photo management"
