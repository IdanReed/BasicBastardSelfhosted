# The deploy plane's own two Komodo resources: the `fleet` sync and the `apply`
# procedure. komodo-sync-bootstrap (nixos/modules/deploy-plane.nix) creates them
# from this file and re-applies it whenever it changes — like every host-level
# change, it goes live with `nrs-vm`.
#
# Deliberately NOT in komodo/sync/: `apply` runs the sync, so a sync that
# declared either resource would be updating one that is busy running — Komodo
# refuses, the sync fails, and a failed sync fails `apply` before it deploys.
#
# The deploy path, end to end:
#   git push -> Forgejo push webhook (one, set once in the repo settings) ->
#   POST http://komodo:9120/listener/github/procedure/apply/main ->
#   stage 1: RunSync fleet — register / update / remove stacks per
#            komodo/sync/stacks.toml
#   stage 2: BatchDeployStackIfChanged "*" — each stack re-reads its files at the
#            new commit and compares them with what it last deployed; a changed
#            stack (compose, its secrets.sops.json, or the shared secrets it
#            reads) is redeployed, an unchanged one is left alone.
# Not the sync's own `deploy = true`: that compares against a cache only the
# hourly poll refreshes (upstream #1120), so compose-only changes never deploy.

[[resource_sync]]
name = "fleet"
description = "Every stack, from komodo/sync/ in the repo."
[resource_sync.config]
git_provider = "forgejo:3000"
git_https = false
git_account = "komodo"
repo = "idan/BasicBastardSelfhosted"
branch = "main"
resource_path = ["komodo/sync"]
# The sync manages ONLY resources tagged `gitops` — every block in
# komodo/sync/ carries the tag (komodo-sync-coverage). Everything else is out of
# its reach: Core's own `Local` server and system procedures, this sync, `apply`,
# anything made in the UI.
match_tags = ["gitops"]
# A stack removed from stacks.toml is destroyed (compose down) and deleted —
# the komodo-sync-coverage lint keeps every stacks/<name> declared.
delete = true
# The sync is run by `apply`, never by its own webhook.
webhook_enabled = false

[[procedure]]
name = "apply"
description = "Push to main -> register stacks, then deploy the ones that changed."
[procedure.config]
# Signed with KOMODO_WEBHOOK_SECRET (Forgejo sends X-Hub-Signature-256).
webhook_enabled = true

[[procedure.config.stage]]
name = "register"
enabled = true
executions = [
  { execution.type = "RunSync", execution.params.sync = "fleet", enabled = true },
]

[[procedure.config.stage]]
name = "deploy"
enabled = true
executions = [
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "*", enabled = true },
]
