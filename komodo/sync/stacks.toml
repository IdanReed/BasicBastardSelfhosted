# Every stack Komodo deploys: one block per stacks/<name>, all the same shape
# (the komodo-sync-coverage lint holds the fixed fields and the coverage).
# `webhook_enabled = false`: the one deploy entry point is `apply`'s webhook.
# `tags = ["gitops"]` is what puts a block in the `fleet` sync's reach
# (match_tags, komodo/fleet.toml): an untagged block is silently ignored.
#
# A git stack: Periphery clones the repo into /srv/komodo/stacks/<name> and runs
# compose in stacks/<name>. The rendered env /run/stack-env/<name>.env is passed
# with --env-file (compose.yaml's own `${VAR}` interpolation; the containers
# read it via env_file) and NOT tracked — Komodo stores tracked contents in its
# database and UI, and this file is plaintext. What IS tracked, as Redeploy, is
# the ciphertext the env is rendered from, so a secrets change in git redeploys
# the stack: its secrets.sops.json, and secrets/shared.sops.json for a stack
# whose env.nix reads it. (The env itself is re-rendered by `nixos-rebuild
# switch`, which therefore comes BEFORE the push.)
#
# Every repo file a service bind-mounts is tracked as Restart for the services
# that mount it (komodo-sync-coverage derives the list from compose.yaml and
# names any missing line): an untracked file never counts as a change, and
# `up -d` never re-binds a single-file mount — a restart re-binds by path. One
# push that changes compose.yaml AND such a file deploys the changed services
# only; restart the file's consumers from the UI.


[[stack]]
name = "actual"
tags = ["gitops"]
[stack.config]
server = "Local"
git_provider = "forgejo:3000"
git_https = false
git_account = "komodo"
repo = "idan/BasicBastardSelfhosted"
branch = "main"
run_directory = "stacks/actual"
file_paths = ["compose.yaml"]
webhook_enabled = false
additional_env_files = [{ path = "/run/stack-env/actual.env", track = false }]
config_files = [
  { path = "secrets.sops.json", requires = "Redeploy" },
  { path = "../../secrets/shared.sops.json", requires = "Redeploy" },
  { path = "actual-init.js", services = ["actual_init"], requires = "Restart" },
]

