# Komodo — the deploy plane for the services VM.
#
#   core       web UI + API, the ONLY published port (loopback 10000)
#   periphery  the socket-toucher; runs `docker compose up` for the stacks
#   ferretdb   Mongo-wire front Core talks to
#   postgres   FerretDB's backend; the only stateful component
#
# The age key never enters this compose: sops-nix renders every stack's env on
# the host at activation (nixos/modules/stack-env.nix) and Periphery only reads
# the copies in /run/stack-env. That keeps the KEY out, not the PLAINTEXT —
# Periphery is root and reads every deployed secret (arch-security AS-8). See
# ServerNotes/designs/komodo-migration.md.
services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    # komodo_db, NOT komodo_postgres: backup-prepare.sh's pg_dumpall loop and
    # the backup-coverage lint both key on container_name = "<svc>_db".
    container_name: komodo_db
    labels:
      komodo.skip: # never auto-stop own DB
    volumes:
      - /mnt/fast/komodo/pgdata:/var/lib/postgresql/data
    environment:
      # Fleet convention: POSTGRES_USER is the stack name, which is what
      # backup-prepare.sh's `pg_dumpall -U komodo` and the backup-coverage lint
      # expect. Only the password comes from /run/stack-env/komodo.env.
      POSTGRES_USER: komodo
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    # pg_cron runs DocumentDB's build_index_concurrently every 2 s, and with
    # the defaults each run writes two LOG lines (to stderr, so level=error in
    # VictoriaLogs) AND a cron.job_run_details row that nothing ever prunes —
    # ~2M rows / 360 MB inside every pg_dumpall. Both GUCs are
    # postmaster-context, hence flags rather than ALTER SYSTEM. The image's
    # CMD is plain ["postgres"]; everything else stays in postgresql.conf.
    command: ["postgres", "-c", "cron.log_run=off", "-c", "cron.log_statement=off"]
    # Core has NO DB retry — it exits FATAL and crash-loops until the cluster
    # accepts connections, so dependents gate on this. start_period covers
    # docdb's initdb.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komodo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - komodo
    restart: unless-stopped

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    container_name: komodo_ferretdb
    labels:
      komodo.skip:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - komodo_ferretdb_state:/state
    environment:
      # Keep the password hex (rand -hex) so no '$' / ':' / '@' / '/' breaks
      # this URL.
      FERRETDB_POSTGRESQL_URL: postgres://komodo:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
      # Default info logs every wire command ("Command handled") — ~90 lines a
      # minute of Core polling.
      FERRETDB_LOG_LEVEL: warn
    networks:
      - komodo
    restart: unless-stopped

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4
    container_name: komodo
    init: true
    labels:
      komodo.skip:
    depends_on:
      ferretdb:
        condition: service_healthy
    # Loopback only. Reach it through Caddy at komodo.svc.idanreed.com; the UI
    # drives Periphery (root-equivalent) so it must never bind the tailnet.
    ports:
      - '127.0.0.1:10000:9120'
    environment:
      KOMODO_HOST: https://komodo.svc.idanreed.com
      KOMODO_LOCAL_AUTH: 'true' # password login; default off
      KOMODO_DISABLE_USER_REGISTRATION: 'true' # single admin
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: komodo
      # v2 auth model, NOT the deprecated shared passkey. Core auto-creates an
      # enabled server named "Local" on first boot; Periphery dials Core and
      # attaches as it, authenticating with the Noise keypair both write into
      # the shared /config/keys volume.
      KOMODO_FIRST_SERVER_NAME: Local
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    volumes:
      # Noise keypairs, shared with periphery. Regenerable, so not backed up.
      - komodo_keys:/config/keys
      # The Forgejo git provider + read token (Core reads every *config.* file
      # under /config). Rendered by sops-nix and published by the host
      # (nixos/modules/deploy-plane.nix); Core re-reads it only on restart,
      # which the host does when the token changes.
      - /run/stack-env/komodo-core.config.toml:/config/git.config.toml:ro
    env_file: /run/stack-env/komodo.env
    networks:
      - komodo # reach ferretdb + periphery
      - homelab # reach forgejo (clones) and receive its push webhook
    restart: unless-stopped

  # No published port: Periphery dials OUT to Core and holds the connection
  # open. A published :8120 would be a root-equivalent interface on the tailnet.
  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    container_name: komodo_periphery
    init: true
    labels:
      komodo.skip:
    depends_on:
      - core
    volumes:
      - komodo_keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      # Each git stack is cloned under <root>/stacks/<name>. Same path in and
      # out: a compose file's `./` bind sources resolve in the clone, and the
      # host daemon must find them at that path.
      - /srv/komodo:/srv/komodo
      # The rendered stack envs, read by compose (env_file and --env-file).
      # Read-only, and a plain directory rather than /run/secrets (whose
      # generation symlink a bind mount would pin — nixos/modules/stack-env.nix).
      - /run/stack-env:/run/stack-env:ro
    environment:
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CONNECT_AS: Local
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      # Stack clones land in <root>/stacks/<name>.
      PERIPHERY_ROOT_DIRECTORY: /srv/komodo
    networks:
      - komodo
      - homelab # clone from forgejo:3000
    restart: unless-stopped

volumes:
  komodo_keys:
  komodo_ferretdb_state:

networks:
  komodo:
  homelab:
    external: true
