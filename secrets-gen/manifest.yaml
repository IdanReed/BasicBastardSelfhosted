secrets:
  # --- nixos/secrets.sops.yaml (services VM, OS-level) ---------------------
  - name: nixos/TAILSCALE_AUTH_KEY
    class: pull
    note: "changeme BY DESIGN until headscale mints it: `headscale preauthkeys create --user <user>` on the VPS"
    targets: [{ file: nixos/secrets.sops.yaml, key: TAILSCALE_AUTH_KEY }]
  - name: nixos/BACKUP_VPS_SSH_KEY
    class: derived
    recipe: ssh-ed25519
    freeze: true
    note: "done by hand — never touch; pubkey lives in ssh-pubkeys.nix x3 + VPS authorizedKeys (write-through is manual)"
    targets: [{ file: nixos/secrets.sops.yaml, key: BACKUP_VPS_SSH_KEY, part: private }]
  - name: nixos/BACKUP_STORAGEBOX_SSH_KEY
    class: derived
    recipe: ssh-ed25519
    freeze: true
    note: "done by hand — never touch; pubkey x3 + Hetzner ssh-copy-id; tmpfiles C+ copy for backrest"
    targets: [{ file: nixos/secrets.sops.yaml, key: BACKUP_STORAGEBOX_SSH_KEY, part: private }]
  - name: nixos/STACK_GIT_TOKEN
    class: pull
    note: "Forgejo read-only token; declared in nixos/configuration.nix:290 but ABSENT from the real yaml — sops-nix activation fails until added (SOPS-KEYGEN-PLAN §5)"
    targets: [{ file: nixos/secrets.sops.yaml, key: STACK_GIT_TOKEN }]

  # --- headscale-vps/secrets.sops.yaml -------------------------------------
  - name: vps/TAILSCALE_AUTH_KEY
    class: pull
    note: "chicken-and-egg: minted by headscale on this very host once it is up"
    targets: [{ file: headscale-vps/secrets.sops.yaml, key: TAILSCALE_AUTH_KEY }]
  - name: vps/PG_PASS
    class: generate
    recipe: hex:64
    note: "two consumers, one key; fires only on decrypted ^changeme"
    targets: [{ file: headscale-vps/secrets.sops.yaml, key: PG_PASS }]
  - name: vps/AUTHENTIK_SECRET_KEY
    class: generate
    recipe: hex:64
    freeze: true
    note: "session signing — rotation logs everyone out"
    targets: [{ file: headscale-vps/secrets.sops.yaml, key: AUTHENTIK_SECRET_KEY }]
  - name: vps/AUTHENTIK_BOOTSTRAP_PASSWORD
    class: generate
    recipe: base64:24
    freeze: true
    note: "first-start-only seed"
    targets: [{ file: headscale-vps/secrets.sops.yaml, key: AUTHENTIK_BOOTSTRAP_PASSWORD }]
  - name: vps/AUTHENTIK_BOOTSTRAP_TOKEN
    class: generate
    recipe: hex:64
    freeze: true
    note: "first-start-only seed"
    targets: [{ file: headscale-vps/secrets.sops.yaml, key: AUTHENTIK_BOOTSTRAP_TOKEN }]
  - name: headscale/oidc
    class: generate
    recipe: hex:64
    note: "done; one key, two VPS-side consumers (native headscale + blueprint !Env)"
    targets: [{ file: headscale-vps/secrets.sops.yaml, key: HEADSCALE_OIDC_CLIENT_SECRET }]
  # OIDC cross-host twins (one value, both sides; xhost edge)
  - name: immich/oidc
    class: generate
    recipe: hex:64
    copy_only: true
    note: "COPY-JOB: real value already on the VPS — propagate into the immich dotenv, NEVER fresh-generate"
    targets:
      - { file: headscale-vps/secrets.sops.yaml, key: IMMICH_OIDC_CLIENT_SECRET }
      - { file: stacks/immich/.sops.env, key: IMMICH_OIDC_CLIENT_SECRET }
  - name: outline/oidc
    class: generate
    recipe: hex:64
    note: "gen+twin xhost: ONE draw into both files; then VPS nixos-rebuild switch + re-up outline"
    targets:
      - { file: headscale-vps/secrets.sops.yaml, key: OUTLINE_OIDC_CLIENT_SECRET }
      - { file: stacks/outline/.sops.env, key: OIDC_CLIENT_SECRET }

  # --- nixos-de/secrets.sops.yaml (desktop) --------------------------------
  # SSH identities: all real, done by hand. sops-gen must never touch them;
  # new identities follow the CLAUDE.md flow (pubkey x3 + ssh-identities.nix).
  - name: de/ssh/github
