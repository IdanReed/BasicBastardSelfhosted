    targets: [{ file: stacks/excalidraw/secrets.sops.json, key: JWT_SECRET }]
  - name: excalidraw/ROOM_KEY_SECRET
    class: generate
    recipe: hex:64
    targets: [{ file: stacks/excalidraw/secrets.sops.json, key: ROOM_KEY_SECRET }]
  - name: excalidraw/ADMIN_PASSWORD
    class: generate
    recipe: base64:24
    targets: [{ file: stacks/excalidraw/secrets.sops.json, key: ADMIN_PASSWORD }]
  - name: excalidraw/oidc
    class: generate
    recipe: hex:64
    note: "one value in secrets/shared.sops.json; the VPS (Authentik / log shipper) and the services VM (the app's env.nix) both read it"
    targets:
      - { file: secrets/shared.sops.json, key: EXCALIDRAW_OIDC_CLIENT_SECRET }

  # --- stacks/proton/secrets.sops.json (hydroxide export sidecar; merged post-fork) -
  # Both are PULL-class: the account email and the bridge password printed once
  # by `hydroxide auth` — neither is generable.
  - name: proton/PROTON_ACCOUNT
    class: pull
    note: "the Proton account email the bridge was auth'd as"
    targets: [{ file: stacks/proton/secrets.sops.json, key: PROTON_ACCOUNT }]
  - name: proton/PROTON_BRIDGE_PASSWORD
    class: pull
    note: "printed exactly once by `hydroxide auth`; not derivable"
    targets: [{ file: stacks/proton/secrets.sops.json, key: PROTON_BRIDGE_PASSWORD }]

  # --- stacks/grist/secrets.sops.json (evaluation) -------------------------
  - name: grist/GRIST_SESSION_SECRET
    class: generate
    recipe: hex:64
    note: "signs session cookies; unset, Grist uses a public hard-coded default"
    targets: [{ file: stacks/grist/secrets.sops.json, key: GRIST_SESSION_SECRET }]
  - name: grist/GRIST_BOOT_KEY
    class: generate
    recipe: hex:64
    note: "install-admin break-glass login at /boot; printed to the container log at every start"
    targets: [{ file: stacks/grist/secrets.sops.json, key: GRIST_BOOT_KEY }]

  # --- stacks/penpot/secrets.sops.json (evaluation) ------------------------
  - name: penpot/pg
    class: generate
    recipe: hex:64
    note: "postgres reads it at initdb; the backend's PENPOT_DATABASE_PASSWORD is built from it (env.nix)"
    targets: [{ file: stacks/penpot/secrets.sops.json, key: POSTGRES_PASSWORD }]
  - name: penpot/PENPOT_SECRET_KEY
    class: generate
    recipe: hex:128
    note: "master key for sessions, invitations and the exporter; rotating logs everyone out"
    targets: [{ file: stacks/penpot/secrets.sops.json, key: PENPOT_SECRET_KEY }]
