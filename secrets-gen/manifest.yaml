# sops-gen manifest — every managed secret across all sops files.
# Schema: README.md. The bring-up-ordered inventory: docs/bring-up.md §4.
#
# Recipe units: hex:N = N hex CHARS (openssl rand -hex N/2);
#               base64:N = N random BYTES, base64-encoded.
# Classes: generate (plain draw; multiple targets = twins, one draw),
#          derived  (stored artifact is a transform of the draw),
#          pull     (minted elsewhere — generation is hard-refused),
#          config   (operator fact, not a secret — report-only).
# freeze: true  => rotate refuses without --force.
# copy_only: true => never fresh-draw; only propagate an existing real value.
# recovery: KEY => plaintext escrowed under KEY in secrets-recovery.sops.yaml
#                  and printed once at generation time.
# target `source: true` => (copy_only only) this one target holds the hand-set
#                  canonical plaintext; `rotate <name>` re-reads it and re-derives
#                  every OTHER target from it (plain copies + hash parts). This is
#                  how one edit to a source value fans out to all its copies+hashes.
#
# A value is stored ONCE. Cross-host values live in secrets/shared.sops.json;
# values BUILT from others (a URL around a password, an app's copy of a shared
# OIDC secret) are the stack's env.nix, rendered at activation — never a target
# here. Multiple targets remain only for hashes of one draw.

version: 1
recovery_file: secrets-recovery.sops.yaml

files:
