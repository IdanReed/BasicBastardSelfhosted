  # --- Per-user login passwords (rollout 2026-09-05) -----------------------
  # ONE human-memorable password per user, HAND-SET (copy_only = sops-gen never
  # draws these). Workflow: `sopsedit headscale-vps/secrets.sops.yaml`, type the
  # memorable value into <USER>_INITIAL_PASSWORD, then `sopsgen apply` copies it
  # to that user's Windmill (<USER>_INITIAL_PASSWORD) and Samba
  # (SAMBA_<USER>_PASSWORD) accounts. The same value is the user's login for
  # every tier-1 app (Authentik !Env, re-asserted each apply = option a),
  # Windmill, and Samba. idan's entry unifies + supersedes the former
  # windmill/WINDMILL_ADMIN_PASSWORD and samba/SAMBA_IDAN_PASSWORD.
  #
  # idan is SPECIAL: his one password is ALSO the admin for the second-login
  # services that cannot federate (Beszel, Backrest, qBittorrent) — superseding
  # the former separate `services-admin` entry. The VPS IDAN_INITIAL_PASSWORD is
  # the `source: true` target: the single hand-set value. `sopsgen rotate
  # user/idan` re-reads it and re-derives every other target — plain copies
  # (Samba/Windmill/Beszel/qBit-plain) verbatim and hashes (Backrest bcrypt,
  # qBittorrent pbkdf2) freshly hashed. So idan's admin password lives in ONE
  # place; edit it, `sopsgen rotate user/idan`, and every service follows.
  # (username is pinned to idan in each compose/config; plaintext is readable
  # from the source, so no recovery escrow is needed.)
  # MIGRATION: because Beszel/Backrest/qBit currently hold the old generated
  # services-admin value, a plain `apply` will refuse on "diverged twins" — run
  # `sopsgen rotate user/idan` ONCE to converge them onto idan's password.
  - name: user/idan
    class: generate
    recipe: base64:24
    copy_only: true
    note: "idan's ONE password (source = VPS IDAN_INITIAL_PASSWORD). rotate re-derives all copies + hashes below"
    targets:
      - { file: secrets/shared.sops.json, key: IDAN_INITIAL_PASSWORD, source: true }
      - { file: stacks/backrest/secrets.sops.json, key: BACKREST_ADMIN_PASSWORD_BCRYPT, part: bcrypt_b64 }
      - { file: stacks/media/secrets.sops.json, key: QBIT_WEBUI_PASSWORD_PBKDF2, part: pbkdf2_qbit }
      # Jellyfin's first admin, and the account SEERR authenticates against.
      # ⚠ Jellyfin has no headless password reset, so a rotation reaches
      # jellyfin-init's LOGIN, not the stored password: reset it in the UI
      # first (or wipe /mnt/fast/jellyfin/config) or the next deploy fails.
