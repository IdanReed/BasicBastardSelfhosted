# Notes/Sync — rmfakecloud + Syncthing (10200, 10201, 22000).
# Design: ServerNotes/designs/service-notes-sync-stack-research.md (the annex)
# and custom-remarkable-notes.md.
#
# Backup: no dump and no sqlite_backup line, deliberately. rmfakecloud has no
# database (YAML users, blob notebooks — the /mnt/fast include set covers it);
# Syncthing's index-v2/ is WAL-mode and entirely DERIVED, excluded in
# stacks/backrest. A speculative sqlite_backup line would be a silent no-op —
# the helper returns 0 for a missing source.

services:
  # rmfakecloud
  # 🚨 THE FIRST LOGIN CREATES THE ADMIN, AND THE ENDPOINT IS UNAUTHENTICATED.
  # No switch closes the window; the loopback publish and notes-sync-init racing
  # to be first are the only guards, so nothing may point Caddy here before the
  # admin exists.
  #
  # Runs as 1000:1000 (the image is FROM scratch with no PUID/PGID and would run
  # as root): Windmill mounts this tree read-only as uid 1000, and a root-owned
  # tree would make that scan silently see nothing. Changing the uid later means
  # chowning every notebook.
  rmfakecloud:
    # No `v` prefix; ghcr.io/ddvk/rmfakecloud does not exist.
    image: ddvk/rmfakecloud:0.0.31
    container_name: rmfakecloud
    user: "1000:1000"
    ports:
      - '127.0.0.1:10200:3000'
    volumes:
      - /mnt/fast/rmfakecloud/data:/data
    environment:
      - TZ=America/Chicago
      - PORT=3000
      - DATADIR=/data
      # 🚨 MUST be https:// and MUST NOT carry a port — tablet software >= 3.15
      # rejects both, as a log.Warn plus sync simply failing. And *.svc resolves
      # into 100.64.0.0/10, so THE REMARKABLE MUST BE ON THE TAILNET.
      - STORAGE_URL=https://rmfakecloud.svc.idanreed.com
      # Without this, SetTrustedProxies(nil) runs and every log line and rate
      # decision sees the docker bridge gateway.
      - RM_TRUST_PROXY=true
      # Caddy terminates TLS; unset means a non-Secure session cookie and a
      # warning every start. A browser on the plain-http loopback publish cannot
      # then hold a session — fine, init and the suite use the bearer token.
      - RM_HTTPS_COOKIE=true
      # JWT_SECRET_KEY arrives from the stack env.
      # 🚨 NEVER ROTATE IT, and never let it go unset. It signs device tokens —
      # rotation invalidates every tablet enrolment, and unset is worse: config.go
      # generates random bytes and carries on, so the NEXT restart silently
      # invalidates every token with no error anywhere.
    env_file: /run/stack-env/notes-sync.env
    healthcheck:
      # FROM-scratch image: no shell, curl or wget, so an HTTP probe is
      # impossible from inside. This CLI verb runs before the server starts —
      # exit 0 means the user store is readable, which is exactly the bind-mount
      # ownership mistake the uid decision above makes possible. HTTP is covered
      # by the suite and by Gatus.
      test: ['CMD', '/rmfakecloud-docker', 'listusers']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Syncthing identity
  # Writes cert.pem/key.pem and GUI credentials before syncthing starts.
  # `generate` refuses to overwrite an existing key, which protects the DEVICE
  # IDENTITY: key.pem IS the device ID, and regenerating it makes every peer
  # treat this host as a stranger.
  syncthing_generate:
    image: syncthing/syncthing:2.1.3
    container_name: syncthing_generate
    entrypoint: ['/bin/sh', '-c']
    # ⚠ NO `--config` flag: syncthing 2.x rejects it given alone ("either both
    # or none of --config and --data"), which would exit-1 this oneshot and
    # starve the app container of credentials. STHOMEDIR already guarantees both
    # containers resolve the same directory. Reuses the image's entrypoint to
    # keep its su-exec uid drop.
    #
    # ACCEPTED: the shell expands $$ST_GUI_PASSWORD into argv, so it is
    # host-visible in /proc/<pid>/cmdline for the second this oneshot runs.
    # Syncthing has env vars for STGUIADDRESS and STGUIAPIKEY but none for the
    # GUI user/password, and `generate` takes them as flags only — the only
    # alternative is hand-writing a bcrypt hash into config.xml, which would
    # also have to reproduce the cert/key half this command exists for.
    command:
      - 'exec /bin/entrypoint.sh /bin/syncthing generate --gui-user "$$ST_GUI_USER" --gui-password "$$ST_GUI_PASSWORD"'
    volumes:
      - /mnt/fast/syncthing/config:/var/syncthing/config
    environment:
      - PUID=1000
      - PGID=1000
    env_file: /run/stack-env/notes-sync.env
    restart: "no"

  # Syncthing
  # 🚨 Every bind-mounted tree must be PRE-OWNED 1000:1000 by tmpfiles: the
  # entrypoint's chown is non-recursive with a swallowed failure, so a wrong
  # owner yields a HEALTHY container whose folder errors on first scan.
  # ⚠ VERSION-LOCK, one-way: 2.0 migrated the index DB to SQLite and there is no
  # downgrade once index-v2/ exists. Keep update-images.sh off the `-rc` tags.
  syncthing:
    image: syncthing/syncthing:2.1.3
    container_name: syncthing
    depends_on:
      syncthing_generate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10201:8384'
      # 🚨 BARE PUBLISHES — the only ones in the fleet, and 22000 is reachable
      # from the whole LAN (docker DNATs in nat/PREROUTING, which the host
      # firewall's INPUT-only filtering never sees). BEP peers must dial THIS
      # host, and a loopback publish would leave only the public relay pool.
      # The only control in front of this port is BEP's mutual device-certificate
      # authentication. tests/lib/lints.nix carries a named loopback-binding
      # exemption for exactly these two lines. Do not bind the tailnet IP
      # instead: headscale assigns it at runtime.
      - '22000:22000/tcp'
      - '22000:22000/udp'
    volumes:
      - /mnt/fast/syncthing/config:/var/syncthing/config
      - /mnt/fast/vault:/var/syncthing/vault
    environment:
      - TZ=America/Chicago
      - PUID=1000
      - PGID=1000
      # 🚨 KEEP THIS. Unset installs localhostMiddleware, and every request with
      # `Host: syncthing.svc.idanreed.com` gets a bare 403 "Host check error"
      # with nothing in the logs. The netns is the boundary; the GUI publish is
      # loopback-only.
      - STGUIADDRESS=0.0.0.0:8384
      # The baked healthcheck hardcodes 127.0.0.1:8384, but ProbeFreePorts()
      # will MOVE the GUI on first run if 8384 looks taken.
      - STNOPORTPROBING=1
      # STGUIAPIKEY, ST_GUI_USER and ST_GUI_PASSWORD arrive from the stack env.
      # ⚠ The API key is a FULL-ADMIN credential that bypasses GUI auth, so the
      # Caddy vhost must never forward an attacker-supplied X-API-Key. It does
      # NOT override the random key `generate` wrote into config.xml — either is
      # accepted, so rotating this revokes nothing.
      #
      # The four egress switches are set by notes-sync-init over the REST API:
      # they live in config.xml, not the environment.
    env_file: /run/stack-env/notes-sync.env
    # NO healthcheck stanza: the builtin is a real HTTP probe of
    # /rest/noauth/health. Folder sync state is the suite's job.
    restart: unless-stopped

  # Init
  # Headless first-run for both services. Every mutation logs
  # "notes-sync-init: CHANGE: ..."; a second run must log ZERO.
  notes-sync-init:
    image: python:3.13-alpine
    container_name: notes_sync_init
    entrypoint: ['/bin/sh', '/init/notes-sync-init.sh']
    depends_on:
      rmfakecloud:
        condition: service_healthy
      syncthing:
        condition: service_healthy
    volumes:
      - ./notes-sync-init.sh:/init/notes-sync-init.sh:ro
      # READ-ONLY, and only so the CHANGE line can be honest: rmfakecloud's
      # login is create-or-authenticate, so the user store must be inspected
      # before logging in.
      - /mnt/fast/rmfakecloud/data:/rmdata:ro
    env_file: /run/stack-env/notes-sync.env
    restart: "no"
