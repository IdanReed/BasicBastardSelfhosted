# Proton — mail bridge + automated mailbox export (10003 SMTP, 10004 IMAP,
# 10005 CardDAV).
#
# NOT for ntfy's alert mail — that uses Proton's native SMTP submission tokens
# and needs no bridge. This stack exists for the two things a submission token
# cannot do: send as a real mailbox, and READ it over IMAP, which is what makes
# the automated export possible.
#
# 🚨 HYDROXIDE, NOT THE OFFICIAL BRIDGE. Decided on: degradation (hydroxide's
# listeners bind unconditionally and hold with no login and no egress, which the
# offline test contract requires, while the official bridge fronts a local
# replica it cannot build without an account); CardDAV (only hydroxide has it);
# and weight (a stateless translator vs a second copy of a ~100k-message
# mailbox). hydroxide's IMAP is upstream-flagged WIP, confined here to the
# export sidecar and never interactive.
#
# 🚨 CalDAV is NOT POSSIBLE through any bridge, whatever older notes claim:
# Proton serves no CalDAV or CardDAV endpoint of its own (only inbound
# calendar subscription), and neither bridge implements CalDAV. Contacts are the
# exception — hydroxide's CardDAV on 10005 is real.
#
# OPERATOR BOOTSTRAP — one interactive login, once per (re-keyed) volume:
#   docker exec -it hydroxide /app/hydroxide auth idan@idanreed.com
#     ... prints "Bridge password: <base64>" — shown ONCE, save it NOW
#   sopsedit stacks/proton/secrets.sops.json   # PROTON_BRIDGE_PASSWORD, PROTON_ACCOUNT
#   nrs-vm                                 # re-render the env, then push or Redeploy
#   docker restart proton_export           # or wait for the next daily tick
#   docker exec proton_export /sync        # first export on demand
#
# The state volume holds auth.json, encrypted with a key derived from that
# bridge password, which hydroxide prints once and does not store. So the volume
# alone is useless and secrets.sops.json alone is useless; both together are the mailbox.

services:
  # Bridge
  hydroxide:
    # The only version-pinned hydroxide image found; trails upstream by two
    # patch releases (v0.2.30 vs v0.2.32).
    image: ghcr.io/onemorebyte/hydroxide:v0.2.30
    container_name: hydroxide
    restart: unless-stopped

    # 🚨 ENTRYPOINT OVERRIDDEN — the load-bearing line of this service. The
    # image's entrypoint.py EXITS 1 when neither env credentials nor an auth.json
    # exist: a crash loop on every fresh host, and forever in the offline test
    # VM. That wrapper supports env-var logins, which this stack refuses anyway —
    # Proton account credentials in sops would persist the one secret the
    # interactive `auth` flow keeps off disk.
    entrypoint: ['/app/hydroxide']
    command:
      # 0.0.0.0 is IN-CONTAINER only (the binary's default 127.0.0.1 would be
      # unreachable through docker-proxy); host exposure is the publishes below.
      - '-smtp-host'
      - '0.0.0.0'
      - '-imap-host'
      - '0.0.0.0'
      - '-carddav-host'
      - '0.0.0.0'
      - serve

    volumes:
      # auth.json. Owned by uid 1000 — the image ends on `USER hydroxide` with
      # no chown-on-start, so a root-owned bind source means `auth` cannot write
      # its credential file.
      - /mnt/fast/proton/hydroxide:/home/hydroxide/.config/hydroxide

    ports:
      # Loopback only, NO Caddy vhost — SMTP and IMAP are not HTTP and can never
      # have one, so caddy-routes' unrouted-publish NOTE is correct here.
      # Consumers are host-side scripts and SSH-tunnelled clients:
      #   ssh -L 1025:127.0.0.1:10003 -L 1143:127.0.0.1:10004 idan@10.0.0.3
      # CardDAV IS HTTP and could take a vhost later for DAVx5-over-tailnet.
      - '127.0.0.1:10003:1025' # SMTP
      - '127.0.0.1:10004:1143' # IMAP
      - '127.0.0.1:10005:8080' # CardDAV

    # NO env_file, deliberately: this container consumes no environment, and
    # putting the account password in secrets.sops.json to feed the stock wrapper would
    # store exactly what the interactive flow exists not to store.

    healthcheck:
      # SMTP banner over a raw socket. One process, and any listener's error is
      # log.Fatal for all of them, so this is an honest proxy for IMAP and
      # CardDAV too. python3 is in the image; nothing here speaks HTTP except
      # CardDAV, whose every anonymous response is a 401 challenge.
      # ⚠ It can NEVER prove anyone is logged in or that Proton is reachable —
      # a bridge with no auth.json is green here and fails every client login.
      # Login state is `docker exec hydroxide /app/hydroxide status`.
      test:
        - CMD
        - python3
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',1025),5); d=s.recv(64); s.close(); raise SystemExit(0 if d.startswith(b'220') else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Export
  # mbsync pulling every folder through the bridge's IMAP into a maildir. The
  # semantics are set in ./mbsyncrc and they are ARCHIVE semantics: one-way pull,
  # Expunge None, so a message deleted (or ransomed) server-side is never deleted
  # from the archive.
  #
  # 🚨 /mnt/slow, not /mnt/fast: a full-mailbox maildir is append-mostly and
  # read-rarely. Unlike the log chunks it IS backed up — the archive is the point
  # — via the slow-tier Backrest plan.
  proton-export:
    # Actively maintained isync packaging; ships mbsync + busybox + curl. Its
    # stock CMD is a one-shot sync (/sync), so the schedule comes from the loop
    # below.
    image: theohbrothers/docker-isync:1.5.0
    container_name: proton_export
    restart: unless-stopped

    depends_on:
      # Ordering only in effect: healthy means the listeners answer, not that
      # anyone can log in. A sync that starts too early fails like the no-creds
      # case and retries next tick.
      hydroxide:
        condition: service_healthy

    env_file: /run/stack-env/proton.env

    volumes:
      - ./mbsyncrc:/mbsyncrc:ro
      # Written as root — the image sets no USER — so the volume root stays
      # root:root.
      - /mnt/slow/proton-mail-archive:/mail

    # A SHELL LOOP rather than the image's crond pattern: the credentials arrive
    # as compose env vars (mbsyncrc reads them via UserCmd/PassCmd) and a child
    # of this shell inherits them by construction, whereas busybox crond's env
    # inheritance is unmeasured here — and a cron job that silently saw an empty
    # password would fail auth forever while looking configured.
    #
    # No `$` anywhere in this block: compose interpolates the file itself.
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        while :; do
          if mbsync --config /mbsyncrc --all; then
            date -u +%s > /mail/.last-export-success
            echo "[proton-export] sync OK"
          else
            echo "[proton-export] sync FAILED - no login yet, or hydroxide/Proton unreachable; retrying in 24h"
          fi
          sleep 86400
        done

    # The loop spends 24h inside busybox `sleep`, which never sees SIGTERM (sh is
    # PID 1 and does not forward it), so every stop would wait out the grace
    # period. SIGKILL mid-sync is safe: mbsync's per-mailbox journal recovers on
    # the next tick.
    stop_signal: SIGKILL

    # NO healthcheck, deliberately: a probe can only see the sleep loop, which is
    # alive even when every sync has failed for a year, and a stamp-age check
    # would page unhealthy for the entire pre-bootstrap era. The honest signals
    # are the /mail/.last-export-success stamp and the FAILED log line —
    # ⚠ NOTHING ALERTS ON A STALE STAMP TODAY.
