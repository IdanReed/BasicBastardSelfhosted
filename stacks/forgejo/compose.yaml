# Forgejo — the git ROOT for everything in this homelab. GitHub is only a
# push mirror for select public repos (LONGRUN decision); this instance is
# the source of truth, including the remote the stack git sync pulls from.
#
# Access model (v1 HTTPS-only SUPERSEDED 2026-09-03, operator decision "full
# SSH for git"): SSH is enabled, LOOPBACK-ONLY — the container's sshd is
# published on 127.0.0.1:10551, same convention as the web port. Caddy cannot
# proxy SSH, so humans reach it via ProxyJump through the VM's own sshd (the
# desktop `forgejo` identity in nixos-de/ssh-identities.nix), and
# stack-git-sync on this host clones over loopback with a per-repo READ-ONLY
# deploy key (STACK_GIT_SSH_KEY). HTTPS+token is NOT removed: the web UI and
# git-over-https still ride Caddy at forgejo.svc.idanreed.com, and Renovate +
# the CI runner stay HTTP API-token consumers.
#
# NO .sops.env for v1, on purpose: Forgejo self-generates all of its private
# material — SECRET_KEY, INTERNAL_TOKEN, the JWT secrets — into
# /data/gitea/conf/app.ini (i.e. /mnt/fast/forgejo/data) on first start and
# reuses it thereafter. Nothing secret travels through git, so there is
# nothing to encrypt, no env_file to declare, and (unlike finding #11's
# stacks) no decrypt race to cover. The consequence is that app.ini is STATE
# and lives in the volume — which the fast-volume Backrest plan already
# covers (see designs/dev-forgejo.md).
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0
    container_name: forgejo
    environment:
      # The classic (root-entrypoint) image runs its `git` user at this uid,
      # so everything it writes matches the /srv/stacks + decrypt-chown
      # 1000:1000 ownership world (finding #10) and the fast-volume backup
      # reads it without surprises.
      - USER_UID=1000
      - USER_GID=1000
      - TZ=America/Chicago
      # Headless bring-up: no install wizard. With no DB configured the
      # image defaults to sqlite3 at /data/gitea/gitea.db — right-sized for
      # a single-user instance. (`forgejo dump` exists for consistent
      # exports; deferred — the design note has the backup story.)
      - FORGEJO__security__INSTALL_LOCK=true
      # What clone URLs and redirects are built from; must match the Caddy
      # route (the caddy-routes lint ties the published port to it).
      - FORGEJO__server__ROOT_URL=https://forgejo.svc.idanreed.com/
      # Explicit false, not merely absent: the classic image's setup runs
      # environment-to-ini, which PERSISTED the old DISABLE_SSH=true into the
      # stateful /data/gitea/conf/app.ini — only an explicit false overwrites
      # it on an instance that ever ran the v1 config.
      - FORGEJO__server__DISABLE_SSH=false
      # What the UI's ssh clone button advertises: git@forgejo:... where
      # "forgejo" is the desktop's ssh Host alias (ssh-identities.nix), which
      # carries the ProxyJump + port. SSH_PORT here is app.ini-level (clone
      # URLs only); the container's actual sshd listens on 22 — the s6
      # openssh setup templates its Port from the plain SSH_PORT *container*
      # env (default 22), which is deliberately left unset.
      - FORGEJO__server__SSH_DOMAIN=forgejo
      - FORGEJO__server__SSH_PORT=10551
      # Single-user instance: the admin is created headless with the CLI
      # (`forgejo admin user create`); nobody self-registers.
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # Push-to-create: `git push` to a URL whose repo does not exist yet
      # creates it under the pushing user instead of erroring ("Push to
      # create is not enabled for users"). Off upstream by default; on here
      # because this instance is the git ROOT and new repos start life as a
      # working copy on the desktop. Works on both transports; the path must
      # be under an owner that already exists (there are no orgs, so
      # ENABLE_PUSH_CREATE_ORG stays off).
      - FORGEJO__repository__ENABLE_PUSH_CREATE_USER=true
      # Repos born that way are private. Upstream default is already true —
      # pinned explicitly so an upstream flip cannot silently publish a repo
      # that was created by a push rather than through the UI.
      - FORGEJO__repository__DEFAULT_PUSH_CREATE_PRIVATE=true
      # Actions, off by default in Forgejo and easy to forget because GitHub
      # has no equivalent switch. This is only HALF the toggle: Actions must
      # also be turned on PER REPOSITORY (repo Settings -> Units -> Actions),
      # which is likewise off by default on new repos. Both are required
      # before nixos/modules/forgejo-runner.nix's registration means anything
      # or .forgejo/workflows/* ever fires.
      - FORGEJO__actions__ENABLED=true
      # OIDC auto-provisioning (login-tiers tier 1). The auth SOURCE itself is
      # seeded into the DB by forgejo_init (add-oauth); these app.ini settings
      # govern what happens on an Authentik login:
      #   ENABLE_AUTO_REGISTRATION — create a Forgejo account on first OIDC login.
      #     DISABLE_REGISTRATION stays true above, so ONLY Authentik can mint
      #     accounts — there is still no open self-signup.
      #   ACCOUNT_LINKING=auto — link to an existing local account by verified
      #     email instead of erroring/duplicating, so the seeded admin keeps its
      #     local (break-glass) password AND can log in via Authentik.
      #   USERNAME=preferred_username — take the Forgejo username from Authentik's
      #     preferred_username claim, not the email localpart.
      - FORGEJO__oauth2_client__ENABLE_AUTO_REGISTRATION=true
      - FORGEJO__oauth2_client__ACCOUNT_LINKING=auto
      - FORGEJO__oauth2_client__USERNAME=preferred_username
    volumes:
      - /mnt/fast/forgejo/data:/data
    ports:
      # Web UI and git-over-https on one port. Loopback-only: Caddy is the
      # only path in (loopback-binding lint enforces the pattern).
      - '127.0.0.1:10550:3000'
      # git-over-ssh, loopback-only (host port from the Infra block, next
      # free after 10550): the container's own sshd on its internal 22.
      # Consumers are on-host (stack-git-sync) or arrive via ProxyJump
      # through the VM's sshd — nothing on the LAN or tailnet reaches this
      # directly. Host keys self-generate into /data/ssh on first start.
      - '127.0.0.1:10551:22'
    healthcheck:
      # The dedicated health endpoint, not '/': it checks the DB and cache
      # backends, and both the suites and `up --wait` key off it.
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/healthz >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # forgejo_init — seed the Authentik OAuth2/OIDC auth source (see
  # forgejo-init.sh for why a container: the source lives in Forgejo's DB, not
  # app.ini/env). One-shot after the instance is healthy.
  # FORGEJO_OIDC_CLIENT_SECRET arrives from .sops.env -> .env — the stack's
  # FIRST secret (Forgejo otherwise self-generates all its private material).
  forgejo_init:
    image: codeberg.org/forgejo/forgejo:16.0
    container_name: forgejo_init
    user: "1000:1000"
    entrypoint: ['/bin/sh', '/init/forgejo-init.sh']
    depends_on:
      forgejo:
        condition: service_healthy
    volumes:
      - /mnt/fast/forgejo/data:/data
      - ./forgejo-init.sh:/init/forgejo-init.sh:ro
    # Long form + required:false (finding #11): a deploy can race the first
    # decrypt, and the plain form would abort the whole stack.
    env_file:
      - path: .env
        required: false
    restart: "no"
