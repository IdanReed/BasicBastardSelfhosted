# OnlyOffice DocSpace (10404).
# Design: ServerNotes/designs/service-onlyoffice-stack-research.md.
#
# There is ONE image; the edition is chosen at RUNTIME by whether a licence file
# is present, so this is Community permanently — unlicensed runs forever, the
# licence check is a local file-signature test with zero HTTP, and billing calls
# are gated on an unset core:payment:url.
#
# Three containers, one published port. Upstream's community compose has four;
# OpenSearch is dropped (its 4 GB JVM heap alone exceeds the suite's budget).
#
# SSO is SAML 2.0 against Authentik (DocSpace has no OIDC client), configured by
# docspace_init from the IdP's metadata; the IdP half is
# headscale-vps/authentik/blueprints/custom/docspace-saml.yaml. The owner's
# local login stays on the login page as the break-glass.
#
# Backup: docspace_db is MySQL 8.4, which still ships mysqldump — backup-prepare.sh
# needs a second branch in its MySQL section for it.

services:
  # Portal
  # nginx router, every ASC.* backend under one supervisord, the SPA, socket.io,
  # ASC.SsoAuth, and the /ds-vpath/ proxy to Document Server.
  # ⚠ `user: root`, following upstream: the entrypoint edits /etc/nginx and
  # /app/onlyoffice/config before dropping into supervisord.
  docspace:
    image: onlyoffice/docspace:3.7.2
    container_name: docspace
    user: root
    depends_on:
      docspace_db:
        condition: service_healthy
    ports:
      # ONE port for the whole product — Document Server is served at /ds-vpath/
      # by this container's nginx and must NOT get its own publish: that would
      # expose an unauthenticated /healthcheck and a converter on a second door.
      - '127.0.0.1:10404:80'
    volumes:
      - /mnt/fast/docspace/app:/app/onlyoffice/data
      - /mnt/fast/docspace/logs:/var/log/onlyoffice
    environment:
      - TZ=America/Chicago
      # 🚨 MUST STAY LITERALLY `localhost`: Standalone is computed as
      # `Basedomain == "localhost"`, so the real vhost here silently converts the
      # portal to SaaS mode — paywalling SSO — with no error.
      - APP_CORE_BASE_DOMAIN=localhost
      # 🚨 The in-container router, for the server-side calls ASC.SsoAuth,
      # Socket.IO and the Next.js apps make back into the portal. Unset, each
      # dials the PUBLIC origin it was reached through — https://docspace.svc…,
      # Caddy on the tailnet IP — which the host firewall drops from a docker
      # bridge, and SsoAuth fetches its config that way before every /sso/*
      # request, so SAML would fail on every route. The public URLs it hands
      # browsers still come from X-Forwarded-Host/-Proto.
      - API_HOST=http://127.0.0.1:80
      # 🚨 Defaults to http://host.docker.internal/, which does not resolve on
      # Linux. This is the base Document Server calls back on, so left alone
      # every document opens and every save silently 404s.
      - APP_URL_PORTAL=http://docspace:80
      - MYSQL_HOST=docspace_db
      - MYSQL_DATABASE=docspace
      - MYSQL_USER=docspace
      - DOCUMENT_SERVER_URL_PUBLIC=/ds-vpath/
      # 🚨 REQUIRED even though its branch is dead code here: the image's
      # upstream.conf.template references $DOCUMENT_CONTAINER_NAME, envsubst only
      # substitutes variables that are SET, and nginx rejects the whole file with
      # `unknown "document_container_name" variable` — openresty then crash-loops
      # to FATAL under supervisord while every other process starts normally.
      - DOCUMENT_CONTAINER_NAME=docspace_ds
      - DOCUMENT_SERVER_URL_EXTERNAL=http://docspace_ds:80
      - DOCUMENT_SERVER_JWT_HEADER=AuthorizationJwt
      # 🚨 ASC.Identity.minified (the Java OAuth/API-key service under the
      # same supervisord) reads NEITHER MYSQL_* NOR CONNECTION_STRING: its
      # Spring datasource is JDBC_*, defaulting to localhost:3306 as dev/dev,
      # and the entrypoint never maps them. Unset, it exits 1 about 15 s after
      # every spawn, forever — and its logback has no appender for the
      # `minified` profile, so the cause is logged nowhere. The password is
      # interpolated from the same .env at parse time; the parameters mirror
      # the .NET string's `SSL Mode=none;AllowPublicKeyRetrieval=true`.
      - JDBC_URL=docspace_db:3306
      - JDBC_DATABASE=docspace
      - JDBC_USER_NAME=docspace
      - JDBC_PASSWORD=${MYSQL_PASSWORD:-}
      - JDBC_PARAMETERS=allowPublicKeyRetrieval=true&useSSL=false
      # APP_CORE_MACHINEKEY, SPRING_APPLICATION_ENCRYPTION_SECRET,
      # DOCUMENT_SERVER_JWT_SECRET, MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD all
      # arrive from the stack env.
      # 🚨 APP_CORE_MACHINEKEY must be set explicitly. Left empty (upstream's
      # default) `ensure_secret` GENERATES one into the bind mount, invisible to
      # sops — and it derives the password salt and signs every confirm-scheme
      # link, so a restore from anything but a byte-exact copy locks everyone out.
    env_file: /run/stack-env/docspace.env
    healthcheck:
      # The baked check greps supervisorctl for FATAL|BACKOFF — no HTTP, no
      # database, and STARTING counts as healthy. This probes the portal's API.
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://127.0.0.1:80/api/2.0/settings']
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 300s
    # Co-editing state lives in Document Server's memory, so a hard kill loses
    # unsaved collaborative edits.
    stop_grace_period: 60s
    restart: unless-stopped

  # Document Server
  # 🚨 NO POSTGRES, NO REDIS, NO RABBITMQ since 9.4.0 — baseConnector.js is now
  # the memory connector. Co-editing state is in RAM, so a restart loses unsaved
  # collaborative edits and there is no database here to back up.
  # Runs as ROOT and chowns its own mounts on every start; never set `user:`.
  docspace_ds:
    image: onlyoffice/documentserver:9.4.0
    container_name: docspace_ds
    # NO `ports:` — see the portal's comment.
    volumes:
      - /mnt/fast/docspace/ds-data:/var/www/onlyoffice/Data
      - /mnt/fast/docspace/ds-lib:/var/lib/onlyoffice
      - /mnt/fast/docspace/ds-logs:/var/log/onlyoffice
    environment:
      - TZ=America/Chicago
      # 🚨 The JWT is not only authentication here: externalRequest.directIfIn.
      # jwtToken defaults true, so URLs inside a signed token bypass the
      # private-IP filter. Disabling JWT breaks every download and callback in a
      # private-address fleet.
      - JWT_ENABLED=true
      # Neither of these is this image's default, and both must match the
      # portal's DOCUMENT_SERVER_JWT_* settings.
      - JWT_HEADER=AuthorizationJwt
      - JWT_IN_BODY=true
      # JWT_SECRET arrives from the stack env and must equal DOCUMENT_SERVER_JWT_SECRET.
    env_file: /run/stack-env/docspace.env
    healthcheck:
      # 🚨 /healthcheck returns 200 with a body of `true` or `false`, so a
      # status-code probe is green on a broken converter.
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:80/healthcheck | grep -qx true']
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s
    stop_grace_period: 60s
    restart: unless-stopped

  # Database
  # container_name and MYSQL_USER are load-bearing for backup-prepare.sh.
  docspace_db:
    image: mysql:8.4.6
    # MariaDB/MySQL need longer than docker's 10 s default to stop cleanly. Killed
    # mid-close, MariaDB leaves tc.log with its first byte garbled (it marks the
    # file before deleting it) and the next start aborts: "Bad magic header in tc log".
    stop_grace_period: 2m
    container_name: docspace_db
    user: mysql
    # expose, not publish: nothing outside the compose network needs it.
    expose:
      - '3306'
    volumes:
      - /mnt/fast/docspace/mysqldata:/var/lib/mysql
    environment:
      - TZ=America/Chicago
      - MYSQL_DATABASE=docspace
      - MYSQL_USER=docspace
      # MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD arrive from the stack env.
    env_file: /run/stack-env/docspace.env
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped

  # Init
  # Completes the setup wizard headlessly, then points SAML SSO at Authentik.
  # Idempotent: `wizardToken` is populated only while the wizard is incomplete,
  # and the SSO settings are compared before anything is saved. An unreachable
  # Authentik leaves SSO as it is and still exits 0. See docspace-init.sh.
  docspace_init:
    image: python:3.13-alpine
    container_name: docspace_init
    entrypoint: ['/bin/sh', '/init/docspace-init.sh']
    depends_on:
      docspace:
        condition: service_healthy
    # 🚨 The IdP metadata URL redirects into /api/v3/, which the VPS Caddy
    # serves only to tailnet sources (publicly: 403), and the services VM
    # resolves auth.idanreed.com to the public IP. The same pin as the
    # desktop's networking.extraHosts: if the VPS's tailnet IP is not
    # 100.64.0.1, change both. Wrong, it costs SSO updates (a WARN), never
    # the stack.
    extra_hosts:
      - 'auth.idanreed.com:100.64.0.1'
    volumes:
      - ./docspace-init.sh:/init/docspace-init.sh:ro
    env_file: /run/stack-env/docspace.env
    restart: "no"
