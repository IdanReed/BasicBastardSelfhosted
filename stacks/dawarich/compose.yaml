# Dawarich — self-hosted location history (10304).
# Design: ServerNotes/designs/service-tracking-stack-research.md (the annex §6).
#
# One of three stacks in the 10300-10349 range (with stacks/tracking and
# stacks/firefly); the lints key on ports, not stack names.
#
# Backup: backup-prepare.sh's pg_dumpall loop derives `<svc>_db` and
# `pg_dumpall -U <svc>`, so `container_name: dawarich_db` and
# POSTGRES_USER=dawarich are both load-bearing (upstream uses neither).

services:
  # App
  # 🚨 NEVER set a compose `user:` — web-entrypoint.sh gosu-drops to PUID/PGID
  # only if it starts as uid 0, chowning the mounts on the way down. The
  # entrypoint is referenced BY BARE NAME because it sources a sibling via
  # `dirname "$0"`.
  dawarich:
    image: freikin/dawarich:1.14.0
    container_name: dawarich
    depends_on:
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:10304:3000'
    volumes:
      # App root is /var/app, not /app. Upstream's fourth mount
      # (dawarich_db_data) is deliberately absent — nothing references it and it
      # mounts live pgdata into the application container.
      - /mnt/fast/dawarich/public:/var/app/public
      - /mnt/fast/dawarich/storage:/var/app/storage
      - /mnt/fast/dawarich/watched:/var/app/tmp/imports/watched
    entrypoint: web-entrypoint.sh
    # `bundle exec` omitted: web-entrypoint.sh already ends in `exec bundle exec "${@}"`.
    command: ['bin/rails', 'server', '-p', '3000', '-b', '::']
    environment:
      - RAILS_ENV=production
      # Gates the self-hosted code paths, including OIDC. Not optional.
      - SELF_HOSTED=true
      - TIME_ZONE=America/Chicago
      - RAILS_LOG_TO_STDOUT=true
      # 🚨 BARE hostnames, comma-separated, no scheme. A wrong value does NOT
      # show up in the healthcheck (/api/v1/health is excluded from
      # host_authorization) — the container reports healthy while every browser
      # request 403s. localhost/127.0.0.1 let a shell curl the loopback publish.
      - APPLICATION_HOSTS=dawarich.svc.idanreed.com,localhost,127.0.0.1
      # 🚨 `https` installs force_ssl with no exclusions, so a request without
      # X-Forwarded-Proto is 301'd to https://127.0.0.1:3000 where Puma speaks
      # plain HTTP. Upstream's healthcheck sends no such header, which would
      # leave the container permanently unhealthy — and sidekiq, which gates on
      # service_healthy, would then never start. Kept at https (http would put
      # http:// into OIDC redirect_uris and mail); the healthcheck below carries
      # the header.
      - APPLICATION_PROTOCOL=https
      - DATABASE_HOST=dawarich_db
      - DATABASE_PORT=5432
      - DATABASE_NAME=dawarich
      - DATABASE_USERNAME=dawarich
      - REDIS_URL=redis://dawarich_redis:6379
      # Both entrypoints chown the mounts and gosu-drop to these.
      - PUID=1000
      - PGID=1000
      - WEB_CONCURRENCY=2
      # Reverse geocoding is OFF (no PHOTON_API_HOST): a self-hosted Photon
      # needs a ~150 GB index and the public one is rate-limited to 1 rps. Costs
      # only human-readable place names.
      - STORE_GEODATA=true
      - PROMETHEUS_EXPORTER_ENABLED=false
      # OIDC
      # Lazy discovery (per-request), so no boot hazard; email/password login
      # stays as fallback. OIDC_REDIRECT_URI is required on 1.14.0, not inferred.
      # Auto-register matches by email — the operator's Authentik email must
      # equal DAWARICH_ADMIN_EMAIL to land on the seeded admin.
      - OIDC_ISSUER=https://auth.idanreed.com/application/o/dawarich/
      - OIDC_CLIENT_ID=dawarich
      # Remap: the app reads OIDC_CLIENT_SECRET; .env carries the prefixed twin.
      - OIDC_CLIENT_SECRET=${DAWARICH_OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=https://dawarich.svc.idanreed.com/users/auth/openid_connect/callback
      - OIDC_PROVIDER_NAME=Authentik
      #
      # SECRET_KEY_BASE and DATABASE_PASSWORD arrive from .env.
      # 🚨 SECRET_KEY_BASE MUST NEVER ROTATE: the ActiveRecord encryption keys
      # are derived from it, so rotation makes every encrypted attribute
      # undecryptable — and Geocoding::Config only logs a warning, so the damage
      # is silent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Upstream's compose probe plus the header that survives
      # APPLICATION_PROTOCOL=https (see above). Grepping the body rather than
      # the status is upstream's own choice and worth keeping: the endpoint is
      # excluded from host authorization and request logging.
      test:
        - CMD-SHELL
        - >-
          wget -qO - --header='X-Forwarded-Proto: https'
          http://127.0.0.1:3000/api/v1/health | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
      interval: 10s
      timeout: 10s
      # Five minutes: the first boot migrates and seeds ~250 country
      # multipolygons into PostGIS.
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Worker
  # Gated on the app being HEALTHY, not started: the app runs migrations and
  # seeds. That is also what makes the healthcheck trap above fatal.
  dawarich_sidekiq:
    image: freikin/dawarich:1.14.0
    container_name: dawarich_sidekiq
    depends_on:
      dawarich:
        condition: service_healthy
      dawarich_db:
        condition: service_healthy
      dawarich_redis:
        condition: service_healthy
    volumes:
      - /mnt/fast/dawarich/public:/var/app/public
      - /mnt/fast/dawarich/storage:/var/app/storage
      - /mnt/fast/dawarich/watched:/var/app/tmp/imports/watched
    entrypoint: sidekiq-entrypoint.sh
    # NO `command:` — sidekiq-entrypoint.sh ends in a hardcoded
    # `exec bundle exec sidekiq` and ignores its arguments.
    environment:
      - RAILS_ENV=production
      - SELF_HOSTED=true
      # Upstream omits this here, silently leaving the worker on Europe/Berlin
      # while the web app runs in local time — enough to shift every daily
      # statistics bucket.
      - TIME_ZONE=America/Chicago
      - RAILS_LOG_TO_STDOUT=true
      - APPLICATION_HOSTS=dawarich.svc.idanreed.com,localhost,127.0.0.1
      - APPLICATION_PROTOCOL=https
      - DATABASE_HOST=dawarich_db
      - DATABASE_PORT=5432
      - DATABASE_NAME=dawarich
      - DATABASE_USERNAME=dawarich
      - REDIS_URL=redis://dawarich_redis:6379
      - PUID=1000
      - PGID=1000
      - BACKGROUND_PROCESSING_CONCURRENCY=3
      - STORE_GEODATA=true
      - PROMETHEUS_EXPORTER_ENABLED=false
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Sidekiq has no HTTP surface; a process check is the honest answer here.
      # The suite proves the worker actually drains a job.
      test: ['CMD-SHELL', 'pgrep -f sidekiq || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Init
  # db/seeds.rb creates demo@dawarich.app / safepassword as an ACTIVE ADMIN on
  # first boot and nothing upstream can change that — see dawarich-init.rb.
  # 🚨 The `unset` is load-bearing: the Dockerfile's BUNDLE_PATH contradicts
  # .bundle/config and Bundler prefers the environment, so a plain `bundle exec`
  # resolves against an empty gem path. Both real entrypoints do the same.
  dawarich_init:
    image: freikin/dawarich:1.14.0
    container_name: dawarich_init
    depends_on:
      # service_healthy, not service_started: the app runs the migrations and
      # the very seed this undoes.
      dawarich:
        condition: service_healthy
    volumes:
      - ./dawarich-init.rb:/init/dawarich-init.rb:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'unset BUNDLE_PATH BUNDLE_BIN; exec bundle exec rails runner /init/dawarich-init.rb'
    environment:
      # Boot requirements only. REDIS_URL is needed because production.rb
      # eager-loads and three initializers read it at boot.
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
      - DATABASE_HOST=dawarich_db
      - DATABASE_PORT=5432
      - DATABASE_NAME=dawarich
      - DATABASE_USERNAME=dawarich
      - REDIS_URL=redis://dawarich_redis:6379
      # DAWARICH_ADMIN_EMAIL/_PASSWORD, SECRET_KEY_BASE and DATABASE_PASSWORD
      # arrive from .env. SECRET_KEY_BASE is required even here — the OTP keys
      # are derived from it and application.rb raises without them.
    env_file:
      - path: .env
        required: false
    restart: "no"

  # Database
  # PostGIS, not plain Postgres: database.yml declares `adapter: postgis`.
  # ⚠ `17-3.5-alpine` is a MOVING tag and there is no patch-pinned alpine
  # alternative — the only image in the fleet whose host-side version can drift
  # without a compose change (images.nix pins the digest, so it surfaces as a
  # test/host mismatch). Do not switch to the non-alpine tag: it is 1 GB.
  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich_db
    # Docker's 64 MB default makes the country-boundary seed and later
    # statistics queries fail with "could not resize shared memory segment".
    shm_size: 1gb
    volumes:
      - /mnt/fast/dawarich/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=dawarich
      - POSTGRES_DB=dawarich
      # POSTGRES_PASSWORD arrives from .env and must match DATABASE_PASSWORD.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root), which is not
      # a role, and reports "no response" against a healthy server.
      test: ['CMD-SHELL', 'pg_isready -U dawarich -d dawarich']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Queue
  # Sidekiq's queue (DB 1) and the Rails cache (DB 0). Runs as uid 999 and does
  # not chown its data directory, hence the 999:999 tmpfiles rule.
  dawarich_redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    volumes:
      - /mnt/fast/dawarich/redis:/data
    environment:
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
