# SilverBullet — file-on-disk markdown wiki (Notes/Sync range, port 10202).
# _overview.md owns the port/auth row.
#
# Runs alongside BookStack (stacks/tracking) and Outline (stacks/outline) on
# purpose — a deliberate, temporary three-way comparison. SilverBullet is the
# file-on-disk end: the space IS a directory of .md files, which is what
# makes the git-sync sidecar possible (Obsidian edits the same files through
# a Forgejo repo).
#
# ---------------------------------------------------------------------------
# Three silent traps, all MEASURED against the pinned 2.9.0 (docker run +
# probe), not read off documentation:
# ---------------------------------------------------------------------------
#   1. 🚨 SHELL EXECUTION IS ON BY DEFAULT ("Local shell command execution
#      enabled for ALL commands." at start) — every logged-in wiki user can
#      run arbitrary commands. SB_SHELL_BACKEND=off disables it ("Shell
#      running disabled." is the line to grep for after a bump). Do NOT set
#      `local`: that is what the git plug wanted, and why it is not used.
#   2. 🚨 SB_READ_ONLY IS PRESENCE-TESTED: `SB_READ_ONLY=false` puts the wiki
#      in READ-ONLY MODE (measured). A wiki silently refusing every edit
#      while healthy is the worst failure here, so the variable is NOT SET
#      AT ALL — do not "document" it with a falsy string.
#   3. 🚨 /space/CONTAINER_BOOT.md IS EXECUTED AS BASH AT EVERY START. The
#      space is populated from a git remote, so push access = code execution
#      on next restart. git-sync.sh alerts if the file appears; it does not
#      delete it (silently reverting an operator-added file is worse).
#
# Backup contract: the space is inside backrest's fast-volume plan and there
# is no database — a STACKS_WITHOUT_DUMPS entry in tests/lib/lints.nix, no
# dump line. The Forgejo mirror is a SECOND copy, not the backup: it holds
# only what was committed and pushed, and Forgejo lives on the same host.

services:
  # ---------------------------------------------------------------------------
  # silverbullet — the server. Starts as ROOT and drops to the OWNER of
  # $SB_FOLDER unless PUID is set ("Will run SilverBullet with UID 1000,
  # inferred from the owner of /space" — measured). The space is declared
  # 1000:1000 by nixos/generate-stack-dirs.py — the same uid the git-sync
  # sidecar writes as. Getting that wrong does not crash: it silently runs
  # the wiki as root and leaves root-owned files the sidecar cannot commit.
  # ---------------------------------------------------------------------------
  silverbullet:
    # 2.9.0, ONE RELEASE BEHIND ON PURPOSE. (The campaign brief's reason was
    # wrong: 2.10.0 EXISTS as a tag; `latest` is a DIFFERENT branch build
    # labelled 2.10.0-runtime-api — never follow it; `v2` is the edge
    # channel.) The real reason: every trap above was measured on 2.9.0, and
    # 2.10.0 is a different runtime generation — healthcheck moved to
    # /.instance, new log format, and NO shell-backend line at start, so the
    # signal proving trap 1 is handled does not exist there.
    # TO BUMP: re-run the three measurements against 2.10.0, point the
    # healthcheck at /.instance, then ./tests/update-images.sh.
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0
    container_name: silverbullet
    ports:
      # Loopback only: Caddy is the sole path in (loopback-binding lint).
      - '127.0.0.1:10202:3000'
    volumes:
      # THE space: plain .md files plus SilverBullet's dotfiles; the sidecar
      # is a git working tree over exactly this directory.
      - /mnt/fast/silverbullet/space:/space
    environment:
      - TZ=America/Chicago
      # All three are image defaults, restated because they are load-bearing
      # elsewhere: SB_FOLDER decides the uid drop (above); SB_PORT is what
      # the loopback publish maps to. The healthcheck uses a LITERAL 3000,
      # not $SB_PORT — compose would interpolate the `$` first.
      - SB_FOLDER=/space
      - SB_PORT=3000
      - SB_HOSTNAME=0.0.0.0
      # See trap 1. `off` is the only value that disables it.
      - SB_SHELL_BACKEND=off
      # Service worker OFF rather than carved out of forward auth:
      #   - Nothing dials this vhost non-interactively (measured on 2.9.0
      #     with SB_USER set: only /, /.ping, /.client/*, /service_worker.js
      #     and /.auth answer 200 without a session), so the provider
      #     carries NO skip_path_regex (unlike Firefly's ^/api/.*).
      #   - What forward auth genuinely breaks is the PWA: a service worker
      #     caching an Authentik 302 for a JS URL wedges the app until a
      #     hard reload, and offline use is impossible behind forward auth
      #     anyway. Removing the worker removes the whole class.
      # For offline PWA use, the trade is: drop this line AND add
      # `skip_path_regex: "^/(service_worker\\.js|\\.client/.*)$"` to the
      # blueprint provider — both, or neither.
      - SB_DISABLE_SERVICE_WORKER=1
      # ⚠ SB_READ_ONLY is deliberately ABSENT — see trap 2.
      #
      # SB_USER (user:password) arrives from .env — a SECOND lock under
      # forward auth: keeps the service closed if a route is flipped or the
      # outpost is down. SilverBullet ignores X-Authentik-* headers, so this
      # is two logins permanently (the Windmill posture).
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # The image ships this exact command with NO interval/start_period, so
      # a slow first index reports unhealthy. Overridden, not replaced:
      # /.ping is right (unauthenticated even with SB_USER — measured).
      # Does NOT prove the space is WRITABLE: read-only mode answers /.ping
      # 200 (trap 2); the only honest signal is the log line at start.
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/.ping >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # silverbullet_gitsync — the two-writer story (see git-sync.sh's header).
  #
  # WHY A SIDECAR, NOT THE GIT PLUG: the plug is deprecated, its replacement
  # has no conflict handling and broken v2 auto-sync, and it SHELLS OUT —
  # i.e. needs SB_SHELL_BACKEND=local, turning trap 1 back on. Trading
  # arbitrary code execution for a git commit is not a trade.
  #
  # WHY network_mode: host — it pushes to Forgejo's LOOPBACK publish
  # (127.0.0.1:10550): the PAT never leaves the host, no DNS/TLS, nothing
  # depends on Caddy or the tailnet. A bridged container cannot reach a
  # loopback-bound host port (the gatus constraint). It LISTENS on nothing,
  # so host networking grants no exposure — host-network-declared entry in
  # tests/lib/lints.nix.
  # ---------------------------------------------------------------------------
  silverbullet_gitsync:
    # git baked into the image: `apk add git` at container start is finding
    # #4, and this host's whole point is surviving a dead network.
    image: alpine/git:v2.54.0
    container_name: silverbullet_gitsync
    network_mode: host
    # Same uid the server runs at, so neither side leaves files the other
    # cannot rewrite. The image's own default is root.
    user: '1000:1000'
    # The image's ENTRYPOINT is `git`; replace it or `command` is read as git
    # subcommands.
    entrypoint: ['/bin/sh', '/git-sync.sh']
    volumes:
      - ./git-sync.sh:/git-sync.sh:ro
      - /mnt/fast/silverbullet/space:/space
    environment:
      - TZ=America/Chicago
      # uid 1000 has no passwd entry in this image; git wants a writable HOME
      # and an identity, and both are supplied here so no config file is ever
      # needed (nothing is written outside /space and /tmp).
      - HOME=/tmp
      - GIT_AUTHOR_NAME=silverbullet
      - GIT_AUTHOR_EMAIL=silverbullet@svc.idanreed.com
      - GIT_COMMITTER_NAME=silverbullet
      - GIT_COMMITTER_EMAIL=silverbullet@svc.idanreed.com
      # 🚨 Without this a bad credential makes git BLOCK on a username prompt
      # forever instead of failing — the loop would stop syncing while the
      # container stayed happily "running".
      - GIT_TERMINAL_PROMPT=0
      - GIT_SYNC_BRANCH=main
      # Seconds between cycles, and how long the space must have been quiet
      # before a commit is taken (so a half-written page is not committed
      # mid-save).
      - GIT_SYNC_INTERVAL=60
      - GIT_SYNC_DEBOUNCE=30
      # ntfy runs on this host at 127.0.0.1:10001 with anonymous read-write
      # (stacks/ntfy/server.yml) and `alerts` is the topic every other failure
      # path in the fleet uses (nixos/configuration.nix notify-failure@).
      - GIT_SYNC_NTFY_URL=http://127.0.0.1:10001/alerts
      # Alerts are rate-limited: a remote that is down would otherwise publish
      # once a minute forever.
      - GIT_SYNC_ALERT_COOLDOWN=3600
      # GIT_SYNC_REMOTE arrives from .env — it carries the Forgejo PAT.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # 🚨 PROVES THE LOOP IS ALIVE, NOT THAT SYNC WORKS: the heartbeat is
      # touched before any git command, so unreachable Forgejo / expired PAT
      # / conflict all stay HEALTHY and alert via ntfy instead. Tying health
      # to sync success would flap on a Forgejo restart and fail `up --wait`
      # wherever the remote does not exist (offline test VM, first deploy).
      # (No command substitution here: compose reads a bare `$` as
      # interpolation.)
      test: ['CMD-SHELL', 'find /tmp/git-sync.alive -mmin -5 2>/dev/null | grep -q .']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
