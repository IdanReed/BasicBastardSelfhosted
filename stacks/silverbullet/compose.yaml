# SilverBullet — file-on-disk markdown wiki (10202). The space IS a directory of
# .md files, which is what makes the git-sync sidecar possible (Obsidian edits
# the same files through a Forgejo repo). Runs alongside BookStack and Outline
# as a temporary three-way comparison.
#
# Three silent traps, all measured against the pinned 2.9.0:
#   1. 🚨 SHELL EXECUTION IS ON BY DEFAULT — every logged-in wiki user can run
#      arbitrary commands. SB_SHELL_BACKEND=off disables it; `local` re-enables
#      it, which is why the git plug is not used.
#   2. 🚨 SB_READ_ONLY IS PRESENCE-TESTED: `SB_READ_ONLY=false` puts the wiki in
#      READ-ONLY mode. The variable is NOT SET AT ALL — do not "document" it
#      with a falsy string.
#   3. 🚨 /space/CONTAINER_BOOT.md IS EXECUTED AS BASH AT EVERY START, and the
#      space is populated from a git remote — so push access is code execution
#      on next restart. git-sync.sh alerts if the file appears.
#
# Backup: the space is inside backrest's fast-volume plan and there is no
# database — a STACKS_WITHOUT_DUMPS entry in tests/lib/lints.nix. The Forgejo
# mirror is a second copy, not a backup: it holds only what was pushed, and
# Forgejo lives on the same host.

services:
  # Server
  # Starts as ROOT and drops to the OWNER of $SB_FOLDER unless PUID is set. The
  # space is declared 1000:1000, the same uid the sidecar writes as. Getting that
  # wrong does not crash — it silently runs the wiki as root and leaves
  # root-owned files the sidecar cannot commit.
  silverbullet:
    # 2.9.0, one release behind ON PURPOSE: every trap above was measured on it,
    # and 2.10.0 is a different runtime generation (healthcheck moved to
    # /.instance, new log format, and no shell-backend line at start, so the
    # signal proving trap 1 is handled does not exist there). To bump: re-run the
    # three measurements, repoint the healthcheck, then ./tests/update-images.sh.
    # `latest` is a different branch build; `v2` is the edge channel.
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0
    container_name: silverbullet
    ports:
      - '127.0.0.1:10202:3000'
    volumes:
      - /mnt/fast/silverbullet/space:/space
    environment:
      - TZ=America/Chicago
      # Image defaults, restated because they are load-bearing elsewhere:
      # SB_FOLDER decides the uid drop, SB_PORT is what the publish maps to. The
      # healthcheck uses a LITERAL 3000 — compose would interpolate a `$`.
      - SB_FOLDER=/space
      - SB_PORT=3000
      - SB_HOSTNAME=0.0.0.0
      # Trap 1. `off` is the only value that disables it.
      - SB_SHELL_BACKEND=off
      # Service worker off rather than carved out of forward auth: a worker
      # caching an Authentik 302 for a JS URL wedges the app until a hard reload,
      # and offline PWA use is impossible behind forward auth anyway. Nothing
      # else dials this vhost non-interactively, so the provider carries no
      # skip_path_regex. For offline PWA use the trade is dropping this line AND
      # adding `skip_path_regex: "^/(service_worker\\.js|\\.client/.*)$"` to the
      # blueprint — both, or neither.
      - SB_DISABLE_SERVICE_WORKER=1
      # ⚠ SB_READ_ONLY is deliberately ABSENT — see trap 2.
      #
      # SB_USER (user:password) arrives from the stack env — a SECOND lock under forward
      # auth, so the service stays closed if a route is flipped or the outpost is
      # down. SilverBullet ignores X-Authentik-* headers, so this is two logins
      # permanently.
    env_file: /run/stack-env/silverbullet.env
    healthcheck:
      # The image ships this exact command with no interval/start_period, so a
      # slow first index reports unhealthy. Overridden, not replaced. /.ping is
      # unauthenticated even with SB_USER, and does NOT prove the space is
      # WRITABLE — read-only mode answers it 200 (trap 2).
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/.ping >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Git mirror
  # A sidecar, not the git plug: the plug is deprecated, has no conflict
  # handling, and SHELLS OUT — i.e. needs SB_SHELL_BACKEND=local, turning trap 1
  # back on. See git-sync.sh for the conflict story.
  #
  # network_mode: host because it pushes to Forgejo's LOOPBACK publish, which a
  # bridged container cannot reach — so the PAT never leaves the host and nothing
  # depends on DNS, TLS, Caddy or the tailnet. It LISTENS on nothing, so host
  # networking grants no exposure (host-network-declared entry in tests/lib/lints.nix).
  silverbullet_gitsync:
    # git baked into the image: `apk add git` at container start would make this
    # stack depend on a live network.
    image: alpine/git:v2.54.0
    container_name: silverbullet_gitsync
    network_mode: host
    # Same uid as the server, so neither side leaves files the other cannot
    # rewrite. The image's own default is root.
    user: '1000:1000'
    # The image's ENTRYPOINT is `git`; without replacing it `command` is read as
    # git subcommands.
    entrypoint: ['/bin/sh', '/git-sync.sh']
    volumes:
      - ./git-sync.sh:/git-sync.sh:ro
      - /mnt/fast/silverbullet/space:/space
    environment:
      - TZ=America/Chicago
      # uid 1000 has no passwd entry in this image; git wants a writable HOME and
      # an identity, both supplied here so no config file is ever written.
      - HOME=/tmp
      - GIT_AUTHOR_NAME=silverbullet
      - GIT_AUTHOR_EMAIL=silverbullet@svc.idanreed.com
      - GIT_COMMITTER_NAME=silverbullet
      - GIT_COMMITTER_EMAIL=silverbullet@svc.idanreed.com
      # 🚨 Without this a bad credential makes git BLOCK on a username prompt
      # forever instead of failing — the loop would stop syncing while the
      # container stayed happily "running".
      - GIT_TERMINAL_PROMPT=0
      - GIT_SYNC_BRANCH=main
      # Seconds between cycles, and how long the space must have been quiet
      # before a commit is taken (so a half-written page is not committed).
      - GIT_SYNC_INTERVAL=60
      - GIT_SYNC_DEBOUNCE=30
      # `alerts` is the topic every other failure path in the fleet uses.
      - GIT_SYNC_NTFY_URL=http://127.0.0.1:10001/alerts
      # A down remote would otherwise publish once a minute forever.
      - GIT_SYNC_ALERT_COOLDOWN=3600
      # GIT_SYNC_REMOTE arrives from the stack env — it carries the Forgejo PAT.
    env_file: /run/stack-env/silverbullet.env
    healthcheck:
      # 🚨 PROVES THE LOOP IS ALIVE, NOT THAT SYNC WORKS: the heartbeat is
      # touched before any git command, so unreachable Forgejo / expired PAT /
      # conflict all stay HEALTHY and alert via ntfy instead. Tying health to
      # sync success would flap on a Forgejo restart and fail `up --wait`
      # wherever the remote does not exist.
      test: ['CMD-SHELL', 'find /tmp/git-sync.alive -mmin -5 2>/dev/null | grep -q .']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
