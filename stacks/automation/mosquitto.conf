# Mosquitto broker config (annex §3.2). Git-managed, mounted read-only.
#
# Deliberately minimal: `Error: Unknown configuration variable '<x>'` is FATAL
# in mosquitto (removed options only warn; unrecognised ones refuse to start),
# so every line here is one that has been checked against the 2.0.22 binary.

# No bind address: the container listens on all of ITS interfaces, and the
# compose file's 127.0.0.1 publish is what constrains reachability — the same
# arrangement as every other stack. Frigate and Home Assistant reach the
# broker by service name on the compose network, which needs no publish at
# all; the loopback publish exists for host-side debugging and the suite.
listener 1883

# Defaults to false anyway, but stated because it is the whole security model
# here and a silent flip would be invisible.
allow_anonymous false
password_file /mosquitto/config/passwd

# NOT `per_listener_settings true`: it silently detaches a global
# password_file, and it would have to precede every other security setting.
# One listener, global settings.

persistence true
# NOT optional. Without it the persistence DB goes to the working directory,
# which is `/` in this image — so it either fails or is silently lost on
# every container recreate.
persistence_location /mosquitto/data/

# stdout, not a log file: this routes to journald like every other stack, and
# it removes the /mosquitto/log bind mount entirely — which is one less
# directory whose ownership has to match the uid the broker drops to (1883),
# and which mosquitto 2.1 would no longer chown for us.
log_dest stdout
log_type error
log_type warning
log_type notice
