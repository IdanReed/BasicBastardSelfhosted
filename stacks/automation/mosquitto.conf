# Mosquitto broker config. Git-managed, mounted read-only.
#
# Deliberately minimal: an unrecognised configuration variable is FATAL in
# mosquitto, so every line here has been checked against the pinned binary.

# No bind address: the compose file's 127.0.0.1 publish is what constrains
# reachability. Frigate and Home Assistant reach the broker by service name,
# which needs no publish at all.
listener 1883

# The whole security model here, so it is stated rather than defaulted.
allow_anonymous false
password_file /mosquitto/config/passwd

# NOT `per_listener_settings true`: it silently detaches a global
# password_file and would have to precede every other security setting.

persistence true
# NOT optional: without it the persistence DB goes to the working directory,
# which is `/` in this image, and is lost on every container recreate.
persistence_location /mosquitto/data/

# stdout routes to journald like every other stack and removes the
# /mosquitto/log bind mount, whose ownership would have to match uid 1883.
log_dest stdout
log_type error
log_type warning
log_type notice
