# Frigate config. Git-managed, mounted read-only at /config/config.yml.
#
# 🚨 The schema is extra="forbid", so ONE unknown or stale key is a hard
# ValidationError — and Frigate does not crash on that, it starts in SAFE MODE
# (zero cameras, MQTT off) while reporting healthy. `--validate-config` runs
# after that fallback and exits 0 regardless, so `/api/config` ->
# safe_mode == false is the only reliable signal.
#
# Keys deleted in recent majors: record.retain, record.events,
# live.stream_name.

# Pinned so the config migrator has nothing to do; otherwise Frigate tries to
# rewrite this file on every boot and logs a failure, since the mount is :ro.
version: "0.17-0"

mqtt:
  # By service name: this stack is bridged, not host-networked.
  host: mosquitto
  port: 1883
  user: frigate
  # SINGLE braces — python str.format over the FRIGATE_-prefixed environment,
  # not shell. A literal { or } in one of those values raises into safe mode.
  password: "{FRIGATE_MQTT_PASSWORD}"

detectors:
  # INTERIM: CPU. The target accelerator is the Arc A380 via OpenVINO, gated
  # on passing the GPU through to the services VM (it needs a Proxmox
  # upgrade first); until then this keeps frigate healthy instead of
  # crash-looping on an absent edgetpu. Fine for a few cameras, not for many.
  cpu1:
    type: cpu
    num_threads: 3

detect:
  # Defaults to FALSE since 0.14 — without this the cameras record and never
  # detect anything. Runs on the CPU detector above.
  enabled: true

# Both cameras read go2rtc's restreams (below) rather than the camera: one
# connection per camera stream however many consumers there are. Record from
# main, detect on the sub stream — detecting on main would cost a decode of
# the full-resolution stream per camera, and shm_size is sized for sub.
#
# Camera IPs are DHCP reservations on OPNsense; a camera that moves address
# silently records nothing.
cameras:
  cam_a:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_a
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/cam_a_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    live:
      streams:
        Main: cam_a
        Sub: cam_a_sub
  cam_b:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam_b
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/cam_b_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    live:
      streams:
        Main: cam_b
        Sub: cam_b_sub

record:
  # Defaults to FALSE, and easy to miss because the pre-0.17 schema expressed
  # retention and enablement in one block.
  enabled: true
  motion:
    days: 30
  continuous:
    days: 0

snapshots:
  enabled: true

objects:
  track:
    - person
    - car

telemetry:
  # Defaults to TRUE and sits on the SYNCHRONOUS startup path, so against
  # blackholed egress it is a ~10s stall on every boot.
  version_check: false

go2rtc:
  # Reolink over http-flv on the camera's HTTP port — upstream's recommendation
  # for models up to 5MP, where Reolink's RTSP server smears and stutters.
  # Requires HTTP enabled on the camera (Network -> Advanced -> Server
  # Settings), which ships OFF on current firmware.
  #
  # Credentials are SINGLE-brace {FRIGATE_*} again: Frigate's go2rtc
  # create_config.py str.format()s every stream item over the FRIGATE_
  # environment, and DROPS an item whose variable is unset rather than
  # failing. They land in a URL query string, so the password must be
  # letters and digits only — and go2rtc logs a failing stream's URL
  # verbatim, so the camera password reaches the journal and VictoriaLogs.
  streams:
    cam_a:
      - "ffmpeg:http://10.0.0.9/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_REOLINK_USER}&password={FRIGATE_REOLINK_PASSWORD}#video=copy#audio=copy#audio=opus"
    cam_a_sub:
      - "ffmpeg:http://10.0.0.9/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_REOLINK_USER}&password={FRIGATE_REOLINK_PASSWORD}"
    cam_b:
      - "ffmpeg:http://10.0.0.94/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_REOLINK_USER}&password={FRIGATE_REOLINK_PASSWORD}#video=copy#audio=copy#audio=opus"
    cam_b_sub:
      - "ffmpeg:http://10.0.0.94/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_REOLINK_USER}&password={FRIGATE_REOLINK_PASSWORD}"
  webrtc:
    # Explicitly empty: left unset, Frigate appends a STUN candidate that
    # resolves against stun.l.google.com — egress for a feature nothing uses.
    candidates: []

auth:
  # 🚨 Off because Caddy's (protected) snippet is the authenticator: Frigate's
  # nginx strips all inbound headers and re-injects a whitelist containing
  # verbatim the five X-authentik-* headers the snippet copies. Load-bearing
  # in one direction — this must not be false until the forward-auth blueprint
  # and the Caddy route are BOTH live, or 8971 is unauthenticated.
  enabled: false

tls:
  # Also on by default: out of the box 8971 serves HTTPS with a self-signed
  # certificate. Plain HTTP on loopback, TLS terminated at Caddy.
  enabled: false

proxy:
  header_map:
    user: x-authentik-username
    role: x-authentik-groups
    # NOT optional: without it Frigate grants admin only to a user whose
    # group list literally contains "admin", so the deployment is permanently
    # read-only — its own login is disabled above. `Admin` is the fleet admin
    # group, declared in headscale-vps/authentik/blueprints/custom/
    # headscale-oidc.yaml; the match is case-sensitive.
    role_map:
      admin:
        - Admin
  # Authentik joins group values with `|` and Frigate defaults to `,`. A
  # mismatch does NOT error — it silently collapses every user to
  # default_role.
  separator: "|"
  # Safe default: an unmapped or unmatched user gets read-only, not admin.
  default_role: viewer
