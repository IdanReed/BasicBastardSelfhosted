# Frigate config. Git-managed, mounted read-only at /config/config.yml.
#
# 🚨 The schema is extra="forbid", so ONE unknown or stale key is a hard
# ValidationError — and Frigate does not crash on that, it starts in SAFE MODE
# (zero cameras, MQTT off) while reporting healthy. `--validate-config` runs
# after that fallback and exits 0 regardless, so `/api/config` ->
# safe_mode == false is the only reliable signal.
#
# Keys deleted in recent majors: record.retain, record.events,
# live.stream_name.

# Pinned so the config migrator has nothing to do; otherwise Frigate tries to
# rewrite this file on every boot and logs a failure, since the mount is :ro.
version: "0.17-0"

mqtt:
  # By service name: this stack is bridged, not host-networked.
  host: mosquitto
  port: 1883
  user: frigate
  # SINGLE braces — python str.format over the FRIGATE_-prefixed environment,
  # not shell. A literal { or } in one of those values raises into safe mode.
  password: "{FRIGATE_MQTT_PASSWORD}"

detectors:
  # INTERIM: CPU. The target accelerator is the Arc A380 via OpenVINO, gated
  # on the passthrough in ServerNotes/designs/arc-a380-passthrough.md; until
  # then this keeps frigate healthy instead of crash-looping on an absent
  # edgetpu. Fine for a few cameras, not for many.
  cpu1:
    type: cpu
    num_threads: 3

# Operator-supplied. An empty map is explicitly supported, so the stack
# deploys and runs with no cameras rather than refusing to start.
#
# Each camera looks like:
#   front_door:
#     ffmpeg:
#       inputs:
#         - path: "{FRIGATE_CAM_FRONT_DOOR}"     # rtsp://user:pass@ip:554/...
#           roles: [detect, record]
#     detect: {width: 1920, height: 1080, fps: 5}
# Put the RTSP URL (which contains credentials) in .sops.env as
# FRIGATE_CAM_<NAME>; the substitution above covers camera input paths.
# Adding cameras means recomputing shm_size — see the compose file.
cameras: {}

record:
  # Defaults to FALSE, and easy to miss because the pre-0.17 schema expressed
  # retention and enablement in one block.
  enabled: true
  motion:
    days: 30
  continuous:
    days: 0

snapshots:
  enabled: true

objects:
  track:
    - person
    - car

telemetry:
  # Defaults to TRUE and sits on the SYNCHRONOUS startup path, so against
  # blackholed egress it is a ~10s stall on every boot.
  version_check: false

go2rtc:
  webrtc:
    # Explicitly empty: left unset, Frigate appends a STUN candidate that
    # resolves against stun.l.google.com — egress for a feature nothing uses.
    candidates: []

auth:
  # 🚨 Off because Caddy's (protected) snippet is the authenticator: Frigate's
  # nginx strips all inbound headers and re-injects a whitelist containing
  # verbatim the five X-authentik-* headers the snippet copies. Load-bearing
  # in one direction — this must not be false until the forward-auth blueprint
  # and the Caddy route are BOTH live, or 8971 is unauthenticated.
  enabled: false

tls:
  # Also on by default: out of the box 8971 serves HTTPS with a self-signed
  # certificate. Plain HTTP on loopback, TLS terminated at Caddy.
  enabled: false

proxy:
  header_map:
    user: x-authentik-username
    role: x-authentik-groups
    # NOT optional: without it Frigate grants admin only to a user whose
    # group list literally contains "admin", so the deployment is permanently
    # read-only — its own login is disabled above. The named group has to
    # exist in Authentik.
    role_map:
      admin:
        - frigate-admins
  # Authentik joins group values with `|` and Frigate defaults to `,`. A
  # mismatch does NOT error — it silently collapses every user to
  # default_role.
  separator: "|"
  # Safe default: an unmapped or unmatched user gets read-only, not admin.
  default_role: viewer
