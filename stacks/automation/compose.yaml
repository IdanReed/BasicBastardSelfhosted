# Automation — Home Assistant + Mosquitto + Frigate (Automation range, ports
# 10250-10252). docs/services.md owns the port/auth rows.
#
#   - BRIDGE networking with loopback-only publishes, NOT
#     `network_mode: host`, and not style: a host-networked service is
#     invisible to `loopback-binding` and to mk-stack-suite's port probe,
#     which build their lists from `ports:`. For Frigate that would put port
#     5000 — an unauthenticated forced-admin bypass — on every tailnet peer.
#   - The subnet is PINNED below because Home Assistant must trust the bridge
#     gateway by address.
#   - Mosquitto is reachable in-stack by service name; that is the whole
#     Frigate -> MQTT -> HA event chain. Reaching it from an IoT VLAN needs a
#     second NIC that does not exist yet.
#   - No `privileged:` anywhere. USB dongles get the guarded bind-mount +
#     cgroup-rule pattern instead (see frigate).
#   - All three databases are SQLite and WAL-mode, so the raw files in the
#     /mnt/fast include set are torn snapshots and backup-prepare.sh's
#     `.backup` dumps are the restorable copies. /mnt/slow/frigate is excluded
#     by omission from the slow plan's include list — do not add it.

networks:
  # Pinned: a loopback publish does NOT preserve 127.0.0.1 — docker-proxy
  # re-dials from the bridge gateway, which HA must therefore trust by
  # address, and unpinned subnets move with network-creation order.
  #
  # 10.89/16 rather than 172.x because docker's default pool is 172.17.0.0/12
  # carved into /16s, so pinning inside it risks an order-dependent "Pool
  # overlaps" failure.
  default:
    ipam:
      config:
        - subnet: 10.89.250.0/24
          gateway: 10.89.250.1

services:
  # Home Assistant
  #
  # 🚨 2026.8.0 RETIRED the `http:` YAML block: it is migrated once, staged
  # PENDING, and reverted after five minutes unless promoted in the UI — so a
  # headless deploy gets working reverse-proxy config for five minutes and
  # then restarts into one where Caddy is untrusted, healthcheck green
  # throughout. ha-config-init pre-seeds .storage/http instead.
  #
  # Runs as ROOT with no PUID/PGID, against the 1000:1000 convention;
  # /mnt/fast/homeassistant is declared root:root. Do not "fix" it.
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    container_name: homeassistant
    depends_on:
      ha-config-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    ports:
      - '127.0.0.1:10250:8123'
    volumes:
      # The whole /config tree, and it MUST be writable: .HA_VERSION is
      # rewritten on a version change with no try/except.
      - /mnt/fast/homeassistant:/config
      # Read-only-safe: HA's only write path to this file is dead code behind
      # a pre-0.92 version check. Secrets reach it as `!env_var` from the stack env
      # rather than a secrets.yaml, which would write decrypted secrets into
      # /config and duplicate the host's decrypt job.
      - ./configuration.yaml:/config/configuration.yaml:ro
    environment:
      - TZ=America/Chicago
    env_file: /run/stack-env/automation.env
    healthcheck:
      # The image ships none. /manifest.json is the only right probe: 200 both
      # before and after onboarding, where `/` redirects pre-onboarding and
      # `/api/` 401s in both states.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8123/manifest.json']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # Long enough for a clean stop's DB writes, short enough that a wedged
    # container does not stall a deploy; a SIGKILL is survivable under WAL.
    stop_grace_period: 60s
    restart: unless-stopped

  # MQTT
  #
  # 🚨 Pinned to 2.0.x, NOT 2.1: 2.1 is a materially different broker —
  # anonymous listener and HTTP dashboard in the default config, a chown that
  # no longer covers the config dir, mosquitto_passwd defaulting to argon2id
  # (unreadable by a 2.0 broker), renamed per-listener security options, and a
  # refusal to read "sensitive files" through symlinks, which is exactly how
  # sops-nix materialises secrets.
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10251:1883'
    volumes:
      # Bind-mounting this directory WITHOUT a mosquitto.conf is a hard
      # failure: the image's CMD hardcodes -c /mosquitto/config/mosquitto.conf.
      - /mnt/fast/mosquitto/config:/mosquitto/config
      # A declared VOLUME in the image; left unbound it silently becomes an
      # anonymous volume until a prune.
      - /mnt/fast/mosquitto/data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # No /mosquitto/log mount: `log_dest stdout` routes to journald and
    # removes an ownership trap. It is a declared VOLUME, so it becomes an
    # anonymous one per recreate — accepted, since nothing writes to it.
    environment:
      - TZ=America/Chicago
    healthcheck:
      # No builtin, and with allow_anonymous false there is no credential-free
      # probe — hence the dedicated `healthcheck` account.
      #
      # 🚨 TWO expansion layers. `$$` survives compose as a literal `$`, but
      # CMD-SHELL then hands the string to /bin/sh, which would expand the
      # unset `$SYS` inside double quotes and leave the topic
      # `/broker/uptime` — so the topic is single-quoted for the shell while
      # the password must be shell-expanded from the container env.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u healthcheck -P \"$$MQTT_HEALTHCHECK_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    env_file: /run/stack-env/automation.env
    restart: unless-stopped

  # NVR
  #
  # Three non-obvious traps:
  #   1. An invalid config does NOT crash it — SAFE MODE, with the container
  #      up, healthcheck green and zero cameras. `--validate-config` runs
  #      after that fallback and exits 0 regardless, so the only reliable
  #      signal is `/api/config` -> safe_mode == false.
  #   2. 🚨 PORT 5000 IS AN UNAUTHENTICATED FORCED-ADMIN BYPASS (api/auth.py
  #      returns admin for `x-server-port: 5000`), and it is in the image's
  #      EXPOSE list while the authenticated 8971 is not. Publish 8971 only.
  #   3. A missing detector accelerator is a CRASH LOOP, not a degradation:
  #      detectors start unconditionally and the watchdog SIGTERMs PID 1
  #      within 10s. `cameras: {}` does not save you.
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: frigate
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      # 8971 = the authenticated UI/API. Not 5000, and not go2rtc's 8554/8555
      # — nothing consumes them and WebRTC needs a routable path a loopback
      # publish cannot give.
      - '127.0.0.1:10252:8971'
    volumes:
      # Writable: /config holds frigate.db (events, review items, users).
      - /mnt/fast/frigate/config:/config
      # ...but the config FILE is read-only over that mount, so git stays the
      # single source of truth. Costs one benign "unable to migrate" line per
      # boot, and `version: "0.17-0"` leaves the migrator nothing to do.
      - ./frigate.yaml:/config/config.yml:ro
      - /mnt/slow/frigate:/media/frigate
      # A bind mount, NOT a `devices:` stanza: devices hard-fails creation
      # when the node is absent, this degrades instead. Whole USB tree, since
      # a Coral re-enumerates after its firmware upload.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # 189 = USB devices major.
      - 'c 189:* rmw'
    tmpfs:
      # In-flight recording segments, kept off the slow tier.
      - /tmp/cache:size=512m
    # Upstream's per-camera formula is (w*h*1.5*20 + 270480)/1048576 MB at the
    # DETECT resolution, plus 40MB for logs: the two Reolinks detecting on
    # their sub streams need well under 100MB. Recompute when adding a camera
    # or moving detect to a main stream.
    shm_size: '256mb'
    environment:
      - TZ=America/Chicago
      # Frigate substitutes {FRIGATE_*} (SINGLE braces — python str.format,
      # not shell) into six fields, all of them the secret ones, which is why
      # this stack needs no config-init container for Frigate.
    env_file: /run/stack-env/automation.env
    # NO healthcheck stanza: the image's builtin is correct and subtle — it
    # curls the port-5000 bypass, which works regardless of auth config, and
    # short-circuits on a /dev/shm/.frigate-is-stopping sentinel so a graceful
    # shutdown does not flap health. Its start_period is 300s and `up --wait`
    # honours it: budget the wait, do not shorten the probe.
    stop_grace_period: 30s
    restart: unless-stopped

  # Broker credentials
  #
  # The mosquitto image itself rather than alpine: mosquitto_passwd is already
  # in it, so there is no `apk add` in the boot path.
  mosquitto-init:
    image: eclipse-mosquitto:2.0.22
    container_name: automation_mqtt_init
    entrypoint: ['/bin/sh', '/init/passwd-init.sh']
    # Root, so it can chown the result to the uid the broker drops to.
    user: '0:0'
    volumes:
      - ./passwd-init.sh:/init/passwd-init.sh:ro
      - /mnt/fast/mosquitto/config:/mosquitto/config
    env_file: /run/stack-env/automation.env
    restart: "no"

  # HTTP config seed
  #
  # The workaround for the five-minute auto-revert above: a pre-seeded
  # `stable` config with `pending: null` and `yaml_migration_done: true`
  # resolves to STABLE, so no revert is ever scheduled. MERGE semantics — HA
  # owns everything else under .storage/.
  ha-config-init:
    image: python:3.13-alpine
    container_name: automation_config_init
    entrypoint: ['/bin/sh', '/init/ha-config-init.sh']
    environment:
      # The GATEWAY of the subnet pinned at the top of this file — edit the
      # two together. Not a secret: a hostile value breaks the site and leaks
      # nothing.
      - HA_TRUSTED_PROXY=10.89.250.1/32
    volumes:
      - ./ha-config-init.sh:/init/ha-config-init.sh:ro
      - ./http.json.template:/template/http.json.template:ro
      # The DIRECTORY, never the single file: HA writes .storage/http with an
      # atomic rename, which fails onto a bind-mounted file.
      - /mnt/fast/homeassistant:/config
    env_file: /run/stack-env/automation.env
    restart: "no"

  # Onboarding
  #
  # Four REST steps with the owner account from the stack env; see automation-init.sh
  # for the two idempotence regimes.
  automation-init:
    image: python:3.13-alpine
    container_name: automation_init
    entrypoint: ['/bin/sh', '/init/automation-init.sh']
    depends_on:
      homeassistant:
        condition: service_healthy
    volumes:
      - ./automation-init.sh:/init/automation-init.sh:ro
    env_file: /run/stack-env/automation.env
    restart: "no"
