# Automation — Home Assistant + Mosquitto + Frigate (Automation range, ports
# 10250-10252). Design:
# ServerNotes/designs/service-automation-stack-research.md (the annex; it
# corrects service-ha-frigate-stack.md in 18 places — read its §0 before
# changing anything here). _overview.md owns the port/auth rows.
#
# Shape (annex §2):
#   - BRIDGE networking with loopback-only publishes, NOT the design doc's
#     `network_mode: host`. Not style: `loopback-binding` and mk-stack-suite's
#     port probe are built from `ports:` entries, so a host-networked service
#     PASSES them with an empty set, and `trustedInterfaces = ["tailscale0"]`
#     means no firewall backstop. For Frigate that would put port 5000 — an
#     unauthenticated forced-ADMIN bypass, see its block — on every tailnet
#     peer, invisible to the lint that exists to stop exactly that.
#   - The subnet is PINNED below: Home Assistant must trust the bridge
#     gateway by address, and docker reallocates subnets in creation order.
#   - Mosquitto is reachable in-stack by service name — the whole Frigate ->
#     MQTT -> HA event chain. Exposing the broker to an IoT VLAN needs a
#     second NIC that does not exist yet and a firewall rule that cannot be
#     written until it does (annex §8.4) — an operator step, not a reason to
#     drop the guardrails now.
#   - No `privileged:` anywhere (no stack in the fleet uses it): USB dongles
#     and the Coral get the guarded bind-mount + cgroup-rule pattern (see
#     frigate).
#
# Backup contract (annex §5): no Postgres — all three DBs are SQLite, so
# backup-prepare.sh's pg_dumpall loop is untouched; its
# `sqlite_backup homeassistant /mnt/fast/homeassistant/home-assistant_v2.db`
# line predates this stack and only now stops being a no-op. Both databases
# are WAL-mode, so the raw files in the /mnt/fast include set are torn
# snapshots and the `.backup` dumps are the restorable copies.
# /mnt/slow/frigate is excluded from backup BY OMISSION — the slow plan is an
# explicit include list and recordings are not on it. Do not add it.

networks:
  # Pinned ON PURPOSE (annex §2.1). A loopback publish does NOT preserve
  # 127.0.0.1 — docker-proxy re-dials from the bridge gateway, so HA sees
  # THIS gateway and must trust it by address. Unpinned subnets move with
  # network-creation order; the day it moves, every proxied request 400s.
  #
  # 10.89/16 rather than 172.x ON PURPOSE too: docker's default pool is
  # 172.17.0.0/12 carved into /16s, so pinning inside it risks "Pool overlaps
  # with other one on this address space" when another network grabs the /16
  # first — order-dependent, and unreproducible in the test VM (three
  # networks, fresh daemon).
  default:
    ipam:
      config:
        - subnet: 10.89.250.0/24
          gateway: 10.89.250.1

services:
  # ---------------------------------------------------------------------------
  # homeassistant — automations, dashboards, device management.
  #
  # Annex §0.1: 2026.8.0 RETIRED the `http:` YAML block — migrated exactly
  # once into storage-backed config, staged PENDING, reverted after five
  # minutes unless promoted in the UI (then "never applied again"). A
  # headless deploy gets working reverse-proxy config for five minutes, then
  # restarts into one where Caddy is untrusted — passing its healthcheck the
  # whole time. So: no `http:` block in configuration.yaml; ha-config-init
  # pre-seeds .storage/http instead.
  #
  # Runs as ROOT, no PUID/PGID — opposite of the /srv/stacks 1000:1000
  # convention; /mnt/fast/homeassistant is declared root:root, do not "fix".
  # ---------------------------------------------------------------------------
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.8.3
    container_name: homeassistant
    depends_on:
      ha-config-init:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    # Loopback-only; Caddy (network_mode: host) is the only path in.
    ports:
      - '127.0.0.1:10250:8123'
    volumes:
      # Whole /config tree: .storage/ (credentials + http config),
      # home-assistant_v2.db (WAL), configuration.yaml, custom_components/.
      # MUST be writable — .HA_VERSION is rewritten on version change with no
      # try/except; a read-only mount kills startup.
      - /mnt/fast/homeassistant:/config
      # Git-managed and read-only-safe: HA's only write path to this file is
      # dead code behind a pre-0.92 version check. Secrets reach it as
      # `!env_var` from the .env below — not a secrets.yaml, which would
      # write decrypted secrets into /config and duplicate the host's
      # decrypt job.
      - ./configuration.yaml:/config/configuration.yaml:ro
    environment:
      - TZ=America/Chicago
      # Deliberately NOT setting http.server_port: the publish above already
      # satisfies the port convention at the host port, and leaving 8123 alone
      # keeps one more key out of the storage-config mechanism.
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the host-side decrypt (.env not yet written; timer lands it
    # ≤~1min after delivery), and the plain form aborts the whole stack.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Image ships NO healthcheck (upstream declined: users change the port
      # and disable the frontend); curl IS present. /manifest.json is the
      # right probe and the only one: requires_auth=False, upstream's "public
      # resource" for Core availability, 200 BOTH before and after onboarding
      # (`/` redirects pre-onboarding, `/api/` 401s in both states). The
      # socket does not accept until the route exists, so listening implies
      # 200.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:8123/manifest.json']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    # 60s deliberate cap (s6 would allow 240): long enough for a clean stop's
    # DB writes, short enough that a wedged container does not stall a
    # deploy; a pathological shutdown gets SIGKILLed, which WAL survives.
    stop_grace_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mosquitto — MQTT broker: Frigate publishes events, HA consumes them.
  #
  # Pinned to 2.0.22, NOT 2.1.x (annex §1) — 2.1 is a materially different
  # broker: anonymous listener AND HTTP dashboard in the default config,
  # entrypoint chowns only /mosquitto/data (a root-owned config dir now
  # fails), mosquitto_passwd defaults to argon2id (unreadable by a 2.0
  # broker), per-listener security options renamed, and it refuses
  # "sensitive files" through symlinks — exactly how sops-nix materialises
  # secrets. The 2.1 line is published ONLY as `-alpine`; a bare
  # `eclipse-mosquitto:2.1.2` is a 404.
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10251:1883'
    volumes:
      # mosquitto.conf (git) + the generated passwd. Bind-mounting this
      # directory WITHOUT a mosquitto.conf is a hard failure — the image's
      # CMD hardcodes `-c /mosquitto/config/mosquitto.conf` — hence the conf
      # ships in git and rides the stack git sync.
      - /mnt/fast/mosquitto/config:/mosquitto/config
      # Persistence. Bound explicitly: a declared VOLUME in the image — left
      # unbound it silently becomes an anonymous volume until a prune.
      - /mnt/fast/mosquitto/data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # No /mosquitto/log mount: `log_dest stdout` routes to journald like
    # every other stack and removes an ownership trap (broker drops to uid
    # 1883; 2.1 would no longer chown that path). It IS a declared VOLUME, so
    # unbound it creates an anonymous volume per recreate — accepted: nothing
    # ever writes to it, unlike /mosquitto/data above.
    environment:
      - TZ=America/Chicago
    healthcheck:
      # No builtin healthcheck, and with allow_anonymous false there is no
      # credential-free probe — hence the dedicated `healthcheck` account.
      # -C 1 exits after one message, -W 3 caps the wait.
      #
      # TWO expansion layers, different protection each: `$$` survives
      # compose interpolation as literal `$`, but CMD-SHELL hands the string
      # to /bin/sh, which expands `$SYS` (unset) inside DOUBLE quotes —
      # topic becomes `/broker/uptime`, probe never receives. So the topic is
      # SINGLE-quoted for the shell (forcing double-quoted YAML), while the
      # password is the opposite case: it MUST be shell-expanded from the
      # container env that env_file supplies.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u healthcheck -P \"$$MQTT_HEALTHCHECK_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    # Long form with required:false ON PURPOSE (finding #11): see homeassistant.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # frigate — NVR with object detection. THREE non-obvious traps:
  #
  # 1. An invalid config does NOT crash it — SAFE MODE: {"safe_mode": True,
  #    "cameras": {}, "mqtt": {"enabled": False}}; container up, healthcheck
  #    green, UI serving with no cameras and no MQTT. `--validate-config` is
  #    checked AFTER that fallback, so it exits 0 regardless. The suite
  #    asserts `/api/config` -> safe_mode == false; a plain health assertion
  #    proves nothing here.
  # 2. PORT 5000 IS AN UNAUTHENTICATED FORCED-ADMIN BYPASS. api/auth.py:
  #    `if request.headers.get("x-server-port") == 5000` returns success with
  #    remote-role: admin. It is in the image's EXPOSE list; 8971, the
  #    authenticated port, is not. Publish 8971 and only 8971.
  # 3. A MISSING CORAL IS A CRASH LOOP, not a degradation: the edgetpu
  #    delegate re-raises and the watchdog SIGTERMs PID 1 within 10s;
  #    `cameras: {}` does not save you — detectors start unconditionally. So
  #    production config carries the Coral and the suite overrides
  #    `detectors:` with `type: cpu` — the tested config differs from the
  #    deployed one in exactly the block that fails hardest (annex §6, §8.3).
  # ---------------------------------------------------------------------------
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    container_name: frigate
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      # 8971 = authenticated UI/API. NOT 5000 (see the header), and not
      # 8554/8555 (go2rtc restream + WebRTC) — nothing consumes them yet and
      # WebRTC needs a routable path a loopback publish cannot give.
      - '127.0.0.1:10252:8971'
    volumes:
      # Writable: /config holds frigate.db (events, review items, users).
      - /mnt/fast/frigate/config:/config
      # ...but the config FILE is read-only over that mount: Frigate migrates
      # config in place and the UI editor writes the same file; :ro logs one
      # benign "Config file is read-only, unable to migrate" per boot and
      # keeps git the single source of truth (`version: "0.17-0"` leaves the
      # migrator nothing to do anyway).
      - ./frigate.yaml:/config/config.yml:ro
      # Recordings, clips, exports. Bulk and re-recordable — excluded from
      # backup by omission from the slow plan's include list.
      - /mnt/slow/frigate:/media/frigate
      # Coral USB, GUARDED so it degrades in a VM: a `devices:` stanza
      # hard-fails creation when the node is absent, so the TPU rides a bind
      # mount (docker creates an empty dir if missing) plus the cgroup rule
      # below (valid either way). Same construct as the Arc A380 in
      # stacks/media. Whole USB tree, not one node: the Coral re-enumerates
      # after its firmware upload.
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      # 189 = USB devices major.
      - 'c 189:* rmw'
    tmpfs:
      # In-flight recording segments. tmpfs so they never thrash the slow
      # tier. Unrelated to shm_size below — different mount, different budget.
      - /tmp/cache:size=512m
    # Per-camera formula from upstream: (w * h * 1.5 * 20 + 270480)/1048576 MB,
    # PLUS 40MB for logs. ~67MB per 720p camera, ~136MB per 1080p one — so
    # this covers roughly three 720p cameras, and needs recomputing once the
    # real camera set is known (annex §8.2). /dev/shm also carries the nginx
    # proxy cache and go2rtc.yaml.
    shm_size: '256mb'
    environment:
      - TZ=America/Chicago
      # FRIGATE_MQTT_PASSWORD and FRIGATE_CAM_* RTSP URLs arrive from .env.
      # Frigate substitutes {FRIGATE_*} (SINGLE braces — python str.format,
      # not shell) into six EnvString fields (mqtt.host/user/password,
      # proxy.auth_secret, camera inputs, genai.api_key) — everything secret
      # here, which is why Frigate needs no config-init container.
    # Long form with required:false ON PURPOSE (finding #11): see homeassistant.
    env_file:
      - path: .env
        required: false
    # NO healthcheck stanza ON PURPOSE: the image's builtin is correct and
    # subtle — it curls http://127.0.0.1:5000/api/version, which works
    # regardless of the auth config (that is the port-5000 bypass, used here
    # for the one purpose it is good for), and it short-circuits on a
    # /dev/shm/.frigate-is-stopping sentinel so a graceful shutdown does not
    # flap health. Note its start_period is 300s and `up --wait` honours it:
    # budget the wait, do not shorten the probe.
    stop_grace_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mosquitto-init — generates /mosquitto/config/passwd before the broker
  # starts. Runs the MOSQUITTO IMAGE ITSELF rather than alpine: mosquitto_passwd
  # is already in it, so there is no `apk add` in the boot path (finding #4 —
  # a registry outage at boot must not take the stack down).
  # ---------------------------------------------------------------------------
  mosquitto-init:
    image: eclipse-mosquitto:2.0.22
    container_name: automation_mqtt_init
    entrypoint: ['/bin/sh', '/init/passwd-init.sh']
    # Root, so it can chown the result to the uid the broker drops to.
    user: '0:0'
    volumes:
      - ./passwd-init.sh:/init/passwd-init.sh:ro
      - /mnt/fast/mosquitto/config:/mosquitto/config
    # Long form with required:false ON PURPOSE (finding #11): see homeassistant.
    env_file:
      - path: .env
        required: false
    restart: "no"

  # ---------------------------------------------------------------------------
  # ha-config-init — renders /config/.storage/http before Home Assistant
  # starts. This is the workaround for the five-minute auto-revert described
  # in the homeassistant block: a pre-seeded `stable` config with
  # `pending: null` and `yaml_migration_done: true` resolves to
  # ActiveConfigType.STABLE, so no revert is ever scheduled and the log says
  # "Using stable HTTP config".
  #
  # MERGE semantics, like kavita-config-init: HA owns everything else under
  # .storage/, and this must never clobber a key it does not manage.
  # ---------------------------------------------------------------------------
  ha-config-init:
    image: python:3.13-alpine
    container_name: automation_config_init
    entrypoint: ['/bin/sh', '/init/ha-config-init.sh']
    environment:
      # The address HA must trust as its reverse proxy = the GATEWAY of the
      # subnet pinned at the top of this file; edit the two together. Not a
      # secret, so not in .env: a hostile value breaks the site, leaks
      # nothing.
      - HA_TRUSTED_PROXY=10.89.250.1/32
    volumes:
      - ./ha-config-init.sh:/init/ha-config-init.sh:ro
      - ./http.json.template:/template/http.json.template:ro
      # The DIRECTORY, never the single file: HA writes .storage/http with an
      # atomic rename, which fails onto a bind-mounted file.
      - /mnt/fast/homeassistant:/config
    # Long form with required:false ON PURPOSE (finding #11): see homeassistant.
    env_file:
      - path: .env
        required: false
    restart: "no"

  # ---------------------------------------------------------------------------
  # automation-init — headless Home Assistant onboarding (annex §3.1). Four
  # steps over REST; the owner account comes from .env. Idempotent in both of
  # HA's regimes: 403 "step already done" within a process, and a bare 404
  # once onboarding is complete and HA has restarted (the component returns
  # before registering any view).
  # ---------------------------------------------------------------------------
  automation-init:
    image: python:3.13-alpine
    container_name: automation_init
    entrypoint: ['/bin/sh', '/init/automation-init.sh']
    depends_on:
      homeassistant:
        condition: service_healthy
    volumes:
      - ./automation-init.sh:/init/automation-init.sh:ro
    # Long form with required:false ON PURPOSE (finding #11): see homeassistant.
    env_file:
      - path: .env
        required: false
    restart: "no"
