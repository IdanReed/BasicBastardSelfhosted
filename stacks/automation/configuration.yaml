# Home Assistant config. Git-managed, mounted read-only — HA's only write path
# to this file is dead code behind a pre-0.92 version check. The /config
# DIRECTORY must still be writable.
#
# ⚠ DELIBERATELY NO `http:` BLOCK: since 2026.8.0 a YAML `http:` is migrated
# once and auto-reverted after 5 minutes unless promoted in the UI, so
# headless Caddy is trusted for five minutes and then permanently is not.
# ha-config-init pre-seeds .storage/http instead.

# default_config spelled out MINUS `dhcp`. dhcp is not inert on a bridge: its
# network watcher reverse-resolves every address of the container's /24
# (10.89.250.0/24) once an hour, and each PTR walks docker's resolver ->
# MagicDNS -> the LAN router, which cannot answer RFC1918 reverse zones — ~515
# timeouts per burst, the only DNS failures on the host. Devices are added by
# IP or arrive over MQTT, so nothing here needs DHCP discovery.
# Keep in sync with default_config's manifest when bumping HA.
assist_pipeline:
cloud:
conversation:
energy:
go2rtc:
history:
homeassistant_alerts:
logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
webhook:
zeroconf:

homeassistant:
  # Still YAML-authoritative: not part of the http config that moved into
  # storage.
  internal_url: "https://homeassistant.svc.idanreed.com"
  external_url: "https://homeassistant.svc.idanreed.com"

# ⚠ DELIBERATELY NO `mqtt:` BLOCK either, though every guide shows one: the
# YAML schema accepts ONLY platform names, so broker/port/username/password
# are `extra keys not allowed` and there is no YAML-to-config-entry import
# path. The failure is silent — HA starts anyway, serves a healthy
# /manifest.json and never connects. automation-init creates the config entry
# over the config-flow REST API instead.

# No `automation:` include yet: `!include_dir_merge_list automations/` RAISES
# on a missing directory, so add the directory and the line together.

logger:
  default: info
