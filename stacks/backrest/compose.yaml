# Backrest — restic orchestrator + browse/restore UI.
#
# Deviations from ServerNotes/designs/core-backups.md, each a trap:
#
#   - No db-dump.sh command hook: dumps run on the HOST
#     (nixos/backup-prepare.sh). The image ships neither docker CLI nor
#     sqlite3, /mnt/fast is :ro here, and an ON_ERROR_CANCEL hook that always
#     fails cancels every snapshot.
#   - /config is a DIRECTORY, read-write: Backrest rewrites config.json on
#     any UI change (:ro breaks it), and bind-mounting a not-yet-existing
#     *file* makes Docker silently create a directory at that path.
#   - config-init runs once and exits, ordered by depends_on:
#     service_completed_successfully (a sleep-infinity sidecar is a race).
#   - Notifications go to http://ntfy/ on a shared docker network —
#     host.docker.internal does not resolve on Linux, which silently drops
#     every notification.
#   - Hooks use actionShoutrrr (ntfy) and actionHealthchecks (dead-man), NOT
#     actionWebhook: backrest 1.9.1 accepts actionWebhook in config but ships
#     NO handler ("no handler for hook type" at runtime, nothing delivered).
#     Caught by tests/suites/backrest.nix triggering a real backup.
#   - No `apk add gettext`/envsubst: that puts the registry in the boot path
#     (down at boot = backup stack down) and breaks the offline VM suite.
#     config-init.sh substitutes with busybox awk and treats missing/empty
#     vars as a hard error where envsubst wrote "".
services:
  config-init:
    image: alpine:3.21
    container_name: backrest_config_init
    # Seeds config.json ONCE — see config-init.sh for the full contract.
    # Backrest owns the file afterwards; the template is a bootstrap seed, not
    # a source of truth. To re-seed: delete /mnt/fast/backrest/config/config.json.
    entrypoint: ["/bin/sh", "/template/config-init.sh"]
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the host-side decrypt (.env not yet written; timer lands it ≤~1min
    # after delivery), and the plain form aborts the whole stack. Residual
    # window: a deploy racing the first decrypt starts with unset vars — the
    # loud guard is each service's own healthcheck/startup failure.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./config-init.sh:/template/config-init.sh:ro
      - ./config.template.json:/template/config.template.json:ro
      # ssh_config is read-only INPUT to the placeholder gate below, nothing
      # more: backrest itself gets its own copy via the backrest service's
      # mount. Mounted here so config-init can refuse to start the stack while
      # the committed uXXXXXX storage-box username placeholder is still in it —
      # an unedited ssh_config with real secrets otherwise starts Backrest
      # with every backup failing on DNS (uXXXXXX.your-storagebox.de).
      - ./ssh_config:/template/ssh_config:ro
      - /mnt/fast/backrest/config:/config
      # ONE FILE, not the whole /var/lib/backup directory — that also holds
      # vps_ed25519, the passwordless-sudo identity for the PUBLIC VPS, which
      # this container has no use for: config-init reads exactly one path,
      # the storage-box key, only to decide whether to let Backrest start.
      #
      # ⚠ Single-file binds with a MISSING source: docker manufactures a
      # DIRECTORY at the host path (verified; same trap as /config in the
      # header). Hence the `-f` before `-s` gate in config-init.sh; the
      # tmpfiles `C+` rule in nixos/configuration.nix removes whatever is at
      # the path before re-copying, so it self-heals.
      #
      # Source must stay a REAL FILE, never the /run/secrets symlink sops-nix
      # would install by default — a symlink target outside the bind dangles
      # in-container. That is why BACKUP_STORAGEBOX_SSH_KEY has no custom
      # `path` and a tmpfiles C+ rule materialises it instead.
      - /var/lib/backup/storagebox_ed25519:/keys/storagebox_ed25519:ro
    networks:
      - homelab
    restart: "no"

  backrest:
    image: garethgeorge/backrest:v1.9.1
    container_name: backrest
    hostname: services-vm
    depends_on:
      config-init:
        condition: service_completed_successfully
    environment:
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/data
      - XDG_CACHE_HOME=/cache
      - TZ=America/Chicago
    volumes:
      - /mnt/fast/backrest/config:/config
      - /mnt/fast/backrest/data:/data
      - /mnt/fast/backrest/cache:/cache
      # SSH key + config for the Hetzner Storage Box. The private key is
      # sops-managed (BACKUP_STORAGEBOX_SSH_KEY in nixos/secrets.sops.yaml)
      # and materialised at /var/lib/backup/storagebox_ed25519 by a tmpfiles
      # C+ rule — a REAL file, not a symlink, because this bind-mount would
      # dangle a /run/secrets symlink inside the container. Never ssh-keygen
      # into /var/lib/backup directly: the next boot overwrites it.
      - /var/lib/backup/storagebox_ed25519:/root/.ssh/id_ed25519:ro
      # System-wide ssh config path on purpose: ssh enforces root ownership
      # on /root/.ssh/config, but the stack git sync delivers this file
      # 1000-owned — mounting it there breaks every ssh with "Bad owner or
      # permissions". /etc/ssh/ssh_config carries no ownership check.
      - ./ssh_config:/etc/ssh/ssh_config:ro
      # Pinned Hetzner Storage Box host keys behind that config's
      # `StrictHostKeyChecking yes`. Read-only and OUTSIDE the writable layer
      # on purpose: ~/.ssh/known_hosts is discarded on every recreate, which
      # turns `accept-new` into a fresh TOFU each time. Verified against
      # Hetzner's published fingerprints — see the known_hosts header.
      - ./known_hosts:/etc/ssh/ssh_known_hosts:ro
      # Data to back up. Read-only: Backrest never needs to write here, and the
      # host-side dump job is what puts dumps into /mnt/fast/_dumps.
      - /mnt/fast:/mnt/fast:ro
      - /mnt/slow:/mnt/slow:ro
    ports:
      - '127.0.0.1:10002:9898'
    networks:
      - homelab
    # Long form with required:false ON PURPOSE (finding #11): see config-init.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

networks:
  homelab:
    external: true
