# Backrest — restic orchestrator + browse/restore UI.
# Design: ServerNotes/designs/core-backups.md; the deviations from it below
# are each a trap someone will otherwise "fix" back.
#
#   - No db-dump.sh command hook: dumps run on the HOST
#     (nixos/backup-prepare.sh). This image has neither the docker CLI nor
#     sqlite3, /mnt/fast is :ro here, and an ON_ERROR_CANCEL hook that always
#     fails cancels every snapshot.
#   - /config is a DIRECTORY, read-write: Backrest rewrites config.json on any
#     UI change, and bind-mounting a not-yet-existing *file* makes docker
#     silently create a directory at that path.
#   - Notifications go to http://ntfy/ over a shared docker network;
#     host.docker.internal does not resolve on Linux and drops them silently.
#   - Hooks use actionShoutrrr and actionHealthchecks, never actionWebhook:
#     1.9.1 accepts it in config but ships no handler, so nothing is
#     delivered.
#   - config-init.sh substitutes with busybox awk rather than envsubst: no
#     `apk add` in the boot path, and an unset var is a hard error where
#     envsubst would write "".
services:
  config-init:
    image: alpine:3.21
    container_name: backrest_config_init
    # Seeds config.json ONCE — see config-init.sh for the full contract.
    # Backrest owns the file afterwards; the template is a bootstrap seed, not
    # a source of truth. To re-seed: delete /mnt/fast/backrest/config/config.json.
    entrypoint: ["/bin/sh", "/template/config-init.sh"]
    env_file: /run/stack-env/backrest.env
    volumes:
      - ./config-init.sh:/template/config-init.sh:ro
      - ./config.template.json:/template/config.template.json:ro
      # Input to config-init's placeholder gate only; backrest gets its own
      # copy below. Without the gate an unedited ssh_config starts Backrest
      # with every backup failing on DNS, hours later.
      - ./ssh_config:/template/ssh_config:ro
      - /mnt/fast/backrest/config:/config
      # ONE FILE, not the /var/lib/backup directory, which also holds the
      # passwordless-sudo identity for the public VPS.
      #
      # ⚠ A single-file bind with a MISSING source makes docker manufacture a
      # DIRECTORY at the host path — hence the `-f` before `-s` in
      # config-init.sh. The source must stay a REAL file, never the
      # /run/secrets symlink sops-nix installs by default, because a symlink
      # target outside the bind dangles in-container; a tmpfiles C+ rule
      # materialises it and self-heals the directory case.
      - /var/lib/backup/storagebox_ed25519:/keys/storagebox_ed25519:ro
    networks:
      - homelab
    restart: "no"

  backrest:
    image: garethgeorge/backrest:v1.9.1
    container_name: backrest
    hostname: services-vm
    depends_on:
      config-init:
        condition: service_completed_successfully
    environment:
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/data
      - XDG_CACHE_HOME=/cache
      - TZ=America/Chicago
    volumes:
      - /mnt/fast/backrest/config:/config
      - /mnt/fast/backrest/data:/data
      - /mnt/fast/backrest/cache:/cache
      # sops-managed (BACKUP_STORAGEBOX_SSH_KEY). Never ssh-keygen into
      # /var/lib/backup directly: the next boot overwrites it.
      - /var/lib/backup/storagebox_ed25519:/root/.ssh/id_ed25519:ro
      # System-wide path, not /root/.ssh/config: ssh enforces root ownership
      # there and the stack git sync delivers this file 1000-owned.
      - ./ssh_config:/etc/ssh/ssh_config:ro
      # Host-key pin behind `StrictHostKeyChecking yes`, outside the writable
      # layer — ~/.ssh/known_hosts is discarded on every recreate, which would
      # turn `accept-new` into a fresh TOFU each time.
      - ./known_hosts:/etc/ssh/ssh_known_hosts:ro
      # Read-only: Backrest never writes here, and the host-side dump job is
      # what puts dumps into /mnt/fast/_dumps.
      - /mnt/fast:/mnt/fast:ro
      - /mnt/slow:/mnt/slow:ro
    ports:
      - '127.0.0.1:10002:9898'
    networks:
      - homelab
    env_file: /run/stack-env/backrest.env
    restart: unless-stopped

networks:
  homelab:
    external: true
