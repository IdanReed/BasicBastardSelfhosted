# Wealthfolio — wealth / portfolio tracker (10309). EVALUATION stack, the other
# half of the portfolio bake-off with stacks/ghostfolio: one container and one
# SQLite file vs app+Postgres+Redis. Deliberately lean — no SimpleFIN, no
# Firefly linkage, no OIDC.
#
# Rust/Axum with EMBEDDED migrations before the listener binds; nothing is
# fetched at boot, and the suite boots it with no route to the internet to keep
# that true.
#
# Backup: everything is under /mnt/fast/wealthfolio (bind of /data) —
# wealthfolio.db plus secrets.json, which is only useful with WF_SECRET_KEY from
# .sops.env. backup-prepare.sh needs exactly one line:
#   sqlite_backup wealthfolio /mnt/fast/wealthfolio/wealthfolio.db
# sqlite_backup returns 0 for a MISSING source, so the suite pins the real path.

services:
  wealthfolio:
    # Docker Hub `wealthfolio/` org — NOT `afadil/wealthfolio`, the pre-v3.4.0
    # name kept only for backward compatibility. The tag is BARE; no `v`-prefixed
    # tag exists.
    image: wealthfolio/wealthfolio:3.7.0
    container_name: wealthfolio
    ports:
      - '127.0.0.1:10309:8088'
    volumes:
      # The whole stack state. 🚨 Must be owned 1000:1000: the Dockerfile ends on
      # USER 1000:1000 with no root entrypoint and no chown, so a root-owned bind
      # is not healed — the first write fails and the container exits.
      - /mnt/fast/wealthfolio:/data
    environment:
      - TZ=America/Chicago
      # In-container bind. Explicit because config.rs REFUSES to start on a
      # non-loopback listen without auth, so this line and WF_AUTH_PASSWORD_HASH
      # are a pair. Under a decrypt race the missing WF_SECRET_KEY aborts boot
      # first: this stack fails CLOSED and loud, the opposite of tandoor.
      - WF_LISTEN_ADDR=0.0.0.0:8088
      # Image default already; explicit because backup-prepare.sh hardcodes the
      # host-side twin of this path and a silent upstream move would turn that
      # backup into a permanent no-op.
      - WF_DB_PATH=/data/wealthfolio.db
      # 🚨 REQUIRED and EXACT (scheme, host, port). Unset while auth is enabled
      # means the default "*" and config.rs PANICS at boot — loud. Set to the
      # wrong origin, every curl probe stays green while every BROWSER login
      # fails on CORS. Renaming the vhost means changing this in the same commit.
      - WF_CORS_ALLOW_ORIGINS=https://wealthfolio.svc.idanreed.com
      # Default, pinned: `auto` sets the cookie's Secure flag iff
      # X-Forwarded-Proto is https, so production cookies are Secure and the
      # suite's plain-http loopback login still works.
      - WF_COOKIE_SECURE=auto
      # WF_SECRET_KEY and WF_AUTH_PASSWORD_HASH arrive from .env; the rotation
      # rules and the 🚨 $-quoting trap on the Argon2 hash are in .sops.env.example.
      #
      # OIDC ships OFF, and OFF is load-bearing
      # 🚨 Discovery runs ONCE AT STARTUP and a failure PANICS the server — the
      # Ghostfolio trap with no escape hatch. Enabled, every `docker compose up`
      # would depend on a cross-tailnet call to the VPS. If taken knowingly:
      # WF_OIDC_ISSUER_URL + WF_OIDC_CLIENT_ID (+ secret via .env) +
      # WF_OIDC_REDIRECT_URL (.../api/v1/auth/oidc/callback) +
      # WF_OIDC_ALLOWED_EMAILS, which is fail-closed — empty without an explicit
      # WF_OIDC_ALLOW_ANY=true refuses to boot.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # /api/v1/healthz is a STATIC "ok", but the Axum server only binds AFTER
      # its embedded migrations, so 200 does mean a live listener over a migrated
      # schema. Cannot see a mangled password hash (login 404s while this stays
      # green — the suite covers it) or a locked SQLite after start.
      # /api/v1/readyz is byte-identical; never probe it expecting readiness.
      # ⚠ busybox `wget`, not curl: bare alpine base, curl never installed.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:8088/api/v1/healthz']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
