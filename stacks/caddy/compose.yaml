# Caddy with the cloudflare-dns plugin, for DNS-01 ACME on a tailnet-only host.
#
# Uses a prebuilt image rather than `build: .`. Building on the host required
# the Dockerfile to be present there, which stock Arcane's git sync does not
# deliver (it pulls only compose.yaml — upstream arcane#1619), and put a build
# toolchain in the deploy path. The image is built by
# .github/workflows/build-caddy.yml; run that workflow once before first
# deploy, or this will fail to pull.
#
# The Caddyfile itself still has to reach the host — that is the sibling-file
# problem arcane-sops exists to solve. See ServerNotes/issues/.
services:
  caddy:
    image: ghcr.io/idanreed/caddy-cloudflare:2.11.2
    container_name: caddy
    # Host networking so Caddy can bind the tailnet IP directly and reach
    # every service on 127.0.0.1 — which is where they all publish now, so
    # Caddy is the only path in.
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/fast/caddy/data:/data
      - /mnt/fast/caddy/config:/config
    env_file:
      - .env
    restart: unless-stopped
