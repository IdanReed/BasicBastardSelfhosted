# Ntfy — the single place failures get reported: systemd OnFailure= on the
# services VM, Backrest's snapshot hooks.
#
# Reachable two ways on purpose:
#   - 127.0.0.1:10001 for host systemd units (notify-failure@.service)
#   - http://ntfy/ on the shared `homelab` docker network, for containers —
#     containers cannot reach a loopback-bound host port.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    environment:
      - TZ=America/Chicago
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - /mnt/fast/ntfy/cache:/var/cache/ntfy
      - /mnt/fast/ntfy/lib:/var/lib/ntfy
    ports:
      - '127.0.0.1:10001:80'
    networks:
      - homelab
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/v1/health | grep -q healthy"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  homelab:
    external: true
