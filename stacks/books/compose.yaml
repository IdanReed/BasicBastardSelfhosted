# Books — ebooks + audiobooks (Books range, ports 10150-10152). Design:
# ServerNotes/designs/service-ebook-stack-research.md (the annex, which
# corrects service-ebook-stack.md); _overview.md owns the port/auth rows.
#
#   - TWO library trees on purpose: /mnt/slow/books/library for ebooks and
#     /mnt/slow/books/audiobooks for audiobooks, plus /mnt/slow/books/drop,
#     the media stack's hand-off, which audiobookshelf carries as a second
#     folder. The layouts genuinely conflict, and each app mounts only its
#     own tree, read-only. Both live under /mnt/slow/books, which backrest's
#     slow-volume-selective plan already includes — keep them there.
#   - SHELFMARK FEEDS THE EBOOK TREE ONLY, by upstream limit rather than
#     choice: its Direct Download source declares supported_content_types
#     ["ebook"]. Audiobooks are acquired by the media stack instead
#     (ServerNotes/designs/audiobook-acquisition.md), so nothing here mounts
#     the download tree or names a QBITTORRENT_* variable — the books suite
#     asserts that.
#   - Auth: kavita and audiobookshelf drive their own OIDC, shipping
#     ready-and-OFF until the operator lands the client secrets; shelfmark
#     has none of its own and gets Caddy forward auth. Forward auth is not an
#     option for kavita — OPDS and KOReader sync authenticate by API key in
#     the URL from clients that cannot follow a redirect.
#   - All three are SQLite, so backup-prepare.sh's pg_dumpall loop is
#     untouched and its sqlite_backup helper covers them.

services:
  # Ebooks
  #
  # Two facts about this image drive everything below:
  #   1. It takes NO configuration from environment variables — the rendered
  #      appsettings.json is the entire channel. (Four env vars are still read
  #      directly, DOTNET_RUNNING_IN_CONTAINER among them; do not "clean up"
  #      the image's defaults.)
  #   2. appsettings.json must be WRITABLE and must arrive with a real
  #      TokenKey. Every writer of it is wrapped in a bare `catch {}`, so a
  #      read-only mount does not crash — the server just signs every JWT with
  #      the placeholder key that ships in the public repo.
  # No PUID/PGID and no USER, so it runs as root and its bind sources are
  # declared root:root.
  kavita:
    image: jvmilazz0/kavita:0.9.1
    container_name: kavita
    depends_on:
      kavita-config-init:
        condition: service_completed_successfully
    # Kavita always ListenAnyIP(5000) inside the container (`IpAddresses` is
    # a dead key under Docker), so this prefix is the only thing binding it.
    ports:
      - '127.0.0.1:10150:5000'
    volumes:
      # Writable on purpose — see above.
      - /mnt/fast/kavita/config:/kavita/config
      # Read-only, and load-bearing rather than tidy: BookmarkDirectory is an
      # admin-settable arbitrary absolute path, and the routine validating it
      # calls a recursive delete with no "did I create this" guard. :ro turns
      # that into a 400.
      - /mnt/slow/books/library:/books:ro
    environment:
      - TZ=America/Chicago
    healthcheck:
      # The image's own test is kept; only the timing is overridden, because
      # first boot runs EF Core migrations under a 5-minute internal budget
      # while the builtin allows 30s + 3x30s. It probes the bare path with no
      # BaseUrl prefix, which is correct only while BaseUrl stays "/".
      start_period: 120s
    restart: unless-stopped

  # Search + download
  #
  # ONBOARDING=false skips the wizard; deployment-level env always wins over
  # UI and per-user settings, so everything below is the configuration.
  #
  # 🚨 Never add a compose `user:`. It flips the entrypoint out of
  # root-bootstrap mode, and the non-root branch write-probes a fixed list
  # that does NOT include INGEST_DIR — so the container boots healthy and
  # every download afterwards fails with "Destination not writable". Set
  # PUID/PGID instead and let it drop privileges itself.
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:1.3.13
    container_name: shelfmark
    # No depends_on: a scan-trigger target being down must never gate
    # shelfmark's own startup.
    ports:
      - '127.0.0.1:10151:8084'
    volumes:
      # settings.json, the user database and the cover cache. The entrypoint
      # RECURSIVELY chowns this at every boot, so it must stay small and
      # dedicated — never point it at a shared parent.
      - /mnt/fast/shelfmark/config:/config
      # Download staging, bound explicitly rather than left on the writable
      # layer: a large download would otherwise grow the overlay on the OS
      # disk, and the entrypoint hard-exits if /tmp is unwritable.
      - /mnt/fast/shelfmark/tmp:/tmp/shelfmark
      # The ebook tree, read-write — shelfmark is its only writer. The
      # audiobook tree is deliberately not mounted.
      - /mnt/slow/books/library:/books
      - ./post-download.sh:/scripts/post-download.sh:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Skip the setup wizard; everything below is the configuration.
      - ONBOARDING=false
      - FLASK_PORT=8084
      # --- auth: Caddy forward auth ----------------------------------------
      # The default is AUTH_METHOD=none, i.e. wide open behind the loopback
      # publish. The header name is explicit because upstream's default and
      # its worked example disagree; what actually arrives is what the
      # (protected) snippet in stacks/caddy/Caddyfile copies.
      - AUTH_METHOD=proxy
      - PROXY_AUTH_USER_HEADER=X-authentik-username
      # Inert on its own — group-based admin detection also needs
      # PROXY_AUTH_ADMIN_GROUP_NAME, left empty. Admin today comes from
      # shelfmark's fallback (the first proxy-auth user it sees); set the
      # group name before a second human exists.
      - PROXY_AUTH_ADMIN_GROUP_HEADER=X-authentik-groups
      # --- paths ------------------------------------------------------------
      - CONFIG_DIR=/config
      - TMP_DIR=/tmp/shelfmark
      # The (legacy-named) EBOOK destination — there is no DESTINATION_EBOOK,
      # and its audiobook counterpart is omitted on purpose.
      - INGEST_DIR=/books
      - BOOKS_OUTPUT_MODE=folder
      # {Author}/{Title} ({Year}), and not cosmetic: Kavita ignores files at
      # the library root entirely. Upstream warns against `organize` with
      # ingest folders, but that warning is about CWA-style watchers moving
      # files out from under shelfmark, which is not what happens here.
      - FILE_ORGANIZATION=organize
      # --- sources ----------------------------------------------------------
      - SEARCH_MODE=direct
      # Opt-in as of 1.3.x: this defaults to false and AA_MIRROR_URLS ships
      # empty, so a donator key alone gives a working UI and no source.
      - DIRECT_DOWNLOAD_ENABLED=true
      - USE_CF_BYPASS=true
      - BOOK_LANGUAGE=en
      # Paired with the library's fileGroupTypes [2,3] in books-init.sh —
      # change both together.
      - SUPPORTED_FORMATS=epub,pdf
      - MAX_CONCURRENT_DOWNLOADS=3
      # --- post-download scan trigger ---------------------------------------
      # Each completed download triggers a library scan instead of waiting for
      # the scheduled one. The hook always exits 0 — a non-zero exit marks a
      # successful download as Error in the UI.
      - CUSTOM_SCRIPT=/scripts/post-download.sh
      - CUSTOM_SCRIPT_JSON_PAYLOAD=true
      # Nav buttons in the UI, pointing at the two library apps.
      - CALIBRE_WEB_URL=https://kavita.svc.idanreed.com
      - AUDIOBOOK_LIBRARY_URL=https://audiobookshelf.svc.idanreed.com
      # ---------------------------------------------------------------------
      # 🚨 Secrets NAMED ONE BY ONE, and deliberately NO env_file here.
      # Shelfmark is the highest-exposure process in the stack (bundled
      # Chromium driven against Anna's Archive mirrors), and the shared .env
      # carries Kavita's and audiobookshelf's JWT SIGNING KEYS plus both OIDC
      # client secrets — code execution here must not be able to forge admin
      # tokens for the other two.
      #
      # `${VAR:-}` reads the same .env at parse time; the `:-` keeps a deploy
      # that races the decrypt degrading to "search finds nothing" rather than
      # aborting. The two admin passwords the post-download hook logs in with
      # stay in reach, unavoidably.
      - AA_DONATOR_KEY=${AA_DONATOR_KEY:-}
      - AA_MIRROR_URLS=${AA_MIRROR_URLS:-}
      - KAVITA_ADMIN_USER=${KAVITA_ADMIN_USER:-}
      - KAVITA_ADMIN_PASSWORD=${KAVITA_ADMIN_PASSWORD:-}
      - ABS_ADMIN_USER=${ABS_ADMIN_USER:-}
      - ABS_ADMIN_PASSWORD=${ABS_ADMIN_PASSWORD:-}
    # NO healthcheck stanza: the image's builtin is already right, and its
    # 90s start period is deliberate — a shorter one flaps the container while
    # Chromium initialises.
    restart: unless-stopped

  # Audiobooks
  #
  # 🚨 SOURCE=docker must stay exactly that: any other value makes
  # BinaryManager fetch ffmpeg/ffprobe from ffbinaries.com at boot and
  # process.exit(1) on failure — a guaranteed crash loop without egress. It is
  # the image default; the hazard is someone "tidying" the env.
  #
  # Runs as root (no PUID/PGID mechanism), bind sources declared root:root.
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    container_name: audiobookshelf
    ports:
      - '127.0.0.1:10152:80'
    volumes:
      # absdatabase.sqlite only; upstream requires local storage for it.
      - /mnt/fast/audiobookshelf/config:/config
      # Covers, metadata, transcode cache — random-access per page load.
      - /mnt/fast/audiobookshelf/metadata:/metadata
      # Read-only: safe only while storeMetadataWithItem and
      # storeCoverWithItem stay false and nothing is uploaded through the UI.
      - /mnt/slow/books/audiobooks:/audiobooks:ro
      # The media stack's hand-off, registered by books-init as a SECOND
      # FOLDER of the same library so a book that lands here is playable where
      # it lies. Read-only, like the tree above.
      - /mnt/slow/books/drop:/drop:ro
    environment:
      - PORT=80
      - CONFIG_PATH=/config
      - METADATA_PATH=/metadata
      - SOURCE=docker
      - TZ=America/Chicago
      # JWT_SECRET_KEY arrives from the stack env: without it the token secret is
      # generated into the database, so it cannot be rotated and a restore
      # from nothing invalidates every session.
    env_file: /run/stack-env/books.env
    healthcheck:
      # The image ships no healthcheck and has NO curl (only busybox wget), so
      # a curl-based probe fails 100% of the time and reads as an app failure.
      # /healthcheck answers only after every migration, so before that the
      # probe gets connection refused, which --spider handles. NOT /ping: it
      # logs a line per request, and a 10s interval is a log flood.
      test: ['CMD', 'wget', '-q', '--spider', '-T', '5', 'http://127.0.0.1:80/healthcheck']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Kavita config render
  #
  # appsettings.json IS Kavita's configuration channel, including the
  # OpenIdConnectSettings triple that Seed.SetOidcSettingsFromDisk re-applies
  # to the database on every boot — which is what makes sops-managed OIDC work
  # at all. MERGE semantics, because Kavita rewrites the file itself and it
  # accumulates keys this template does not own.
  kavita-config-init:
    # python rather than alpine+awk: this parses the existing JSON to merge
    # into it, which also removes the quote/backslash-corruption hazard.
    image: python:3.13-alpine
    container_name: books_config_init
    entrypoint: ['/bin/sh', '/init/kavita-config-init.sh']
    volumes:
      - ./kavita-config-init.sh:/init/kavita-config-init.sh:ro
      - ./appsettings.json.template:/template/appsettings.json.template:ro
      - /mnt/fast/kavita/config:/config
    env_file: /run/stack-env/books.env
    restart: "no"

  # Seeding
  #
  # Admin accounts, libraries, and audiobookshelf's OIDC settings when a
  # secret is present. Every mutation logs "books-init: CHANGE: ..." and a
  # second run must log zero.
  books-init:
    image: python:3.13-alpine
    container_name: books_init
    entrypoint: ['/bin/sh', '/init/books-init.sh']
    depends_on:
      kavita:
        condition: service_healthy
      audiobookshelf:
        condition: service_healthy
    volumes:
      - ./books-init.sh:/init/books-init.sh:ro
    environment:
      # Authentik's email for idan: audiobookshelf links the first SSO login
      # to root by it (authOpenIDMatchExistingBy=email).
      - ABS_ADMIN_EMAIL=idan@idanreed.com
    env_file: /run/stack-env/books.env
    restart: "no"
