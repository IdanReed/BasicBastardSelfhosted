# Outline — DB-backed team wiki (10203). Third of three wikis, a deliberate
# temporary comparison against BookStack (stacks/tracking) and SilverBullet.
#
# 🚨 AUTHENTICATION IS THE DESIGN CONSTRAINT: Outline has NO local accounts — no
# admin bootstrap, no password form, no CLI user-create. The Authentik OIDC
# provider IS the login. And the FIRST LOGIN CREATES THE TEAM AND OWNS IT, so
# visit it yourself once the blueprint is applied.
#
# ⚠ Measured against this pin: with manual endpoints (below) it boots, migrates
# and reports HEALTHY with an unresolvable issuer. What fails without a working
# IdP is LOGGING IN, which no healthcheck can see.
#
# Backup: backup-prepare.sh's pg_dumpall loop derives `<svc>_db` and
# `pg_dumpall -U <svc>`, so `container_name: outline_db` and
# POSTGRES_USER=outline are load-bearing — and `outline` must be in that loop's
# service list, because the plans exclude **/pgdata/**. Attachments under
# /mnt/fast/outline/data ride the fast-volume plan.

services:
  # App
  # Web, websockets and worker in one process. Runs as uid 1001 and the
  # entrypoint does NOT chown, so /mnt/fast/outline/data must be pre-owned
  # 1001:1001 — root-owned means uploads fail at runtime with no startup symptom.
  outline:
    # Version numbering IS the trap: Outline went 0.82 -> 0.87 -> 1.0, so 1.9.2
    # is NEWER than 0.87 while a string sort calls it a downgrade.
    image: outlinewiki/outline:1.9.2
    container_name: outline
    depends_on:
      outline_db:
        condition: service_healthy
      outline_redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:10203:3000'
    volumes:
      # FILE_STORAGE=local means this directory IS the object store.
      - /mnt/fast/outline/data:/var/lib/outline/data
    environment:
      - TZ=America/Chicago
      - NODE_ENV=production
      - PORT=3000
      # Outline builds its OIDC callbackURL from this (`${URL}/auth/oidc.callback`),
      # so it must match the blueprint's redirect_uri byte for byte — the
      # oidc-contract lint ties them.
      - URL=https://outline.svc.idanreed.com
      # Storage
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - FILE_STORAGE_UPLOAD_MAX_SIZE=26214400
      # Database
      # 🚨 MANDATORY: without it Sequelize demands TLS and the container dies at
      # start with "The server does not support SSL connections".
      - PGSSLMODE=disable
      # DATABASE_URL is BUILT from POSTGRES_PASSWORD (two copies drifted into a
      # password-auth crash loop), interpolated from the stack env that Komodo
      # passes with --env-file.
      - DATABASE_URL=postgres://outline:${POSTGRES_PASSWORD:-}@outline_db:5432/outline
      # Redis
      - REDIS_URL=redis://outline_redis:6379
      # OIDC — the only way to log in
      # Endpoints set MANUALLY rather than by OIDC_ISSUER_URL discovery, which
      # keeps the IdP out of the boot path. Authentik's authorize/token/userinfo
      # endpoints are global; only issuer and end-session carry the app slug.
      - OIDC_CLIENT_ID=outline
      - OIDC_AUTH_URI=https://auth.idanreed.com/application/o/authorize/
      - OIDC_TOKEN_URI=https://auth.idanreed.com/application/o/token/
      - OIDC_USERINFO_URI=https://auth.idanreed.com/application/o/userinfo/
      - OIDC_LOGOUT_URI=https://auth.idanreed.com/application/o/outline/end-session/
      - OIDC_DISPLAY_NAME=Authentik
      - OIDC_USERNAME_CLAIM=preferred_username
      - OIDC_SCOPES=openid profile email
      # OIDC_CLIENT_SECRET, SECRET_KEY and UTILS_SECRET arrive from the stack env.
      #
      # FORCE_HTTPS stays default (true): `/` 301s a plain-http request, but
      # /_health answers 200 regardless, so the healthcheck and Gatus keep
      # working. SMTP_* unset — every account arrives through Authentik.
    env_file: /run/stack-env/outline.env
    healthcheck:
      # The image ships this same wget with an interval and NOTHING else — no
      # start_period/retries/timeout (upstream #7547) — so cold-DB migrations
      # outrun the 0s grace and `up --wait` gives up on a normal first start.
      # Overridden, never disabled; same endpoint. Does NOT prove anyone can log
      # in — only Gatus covers that.
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/_health | grep -q OK || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # Database
  outline_db:
    # Same patch pin as paperless/firefly/windmill. Upstream says postgres:18;
    # stay on 17 — 18-alpine moved PGDATA and would silently initialise an empty
    # database beside the real one.
    image: postgres:17.9-alpine
    container_name: outline_db
    volumes:
      - /mnt/fast/outline/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=outline
      - POSTGRES_DB=outline
      # POSTGRES_PASSWORD arrives from the stack env; outline's DATABASE_URL is built
      # from it.
    env_file: /run/stack-env/outline.env
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root), which is not
      # a role.
      test: ['CMD-SHELL', 'pg_isready -U outline -d outline']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Queue
  # BullMQ plus websocket fan-out. No volume and persistence off: everything is
  # derived from Postgres, which also keeps it out of the backup conversation.
  outline_redis:
    image: redis:7.4-alpine
    container_name: outline_redis
    # --save "" disables RDB snapshots; otherwise redis writes dump.rdb into the
    # writable layer on a timer, a slow leak with no reader.
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--loglevel', 'warning']
    # The image declares VOLUME /data; without a mount there docker attaches a
    # fresh anonymous volume on every recreate and orphans the last one.
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
