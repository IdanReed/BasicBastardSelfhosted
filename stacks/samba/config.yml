# Samba configuration — consumed by crazymax/samba's entrypoint, which renders
# it into smb.conf and creates the users.
#
# 🚨 ${VAR} here is interpolated by the IMAGE (envsubst over every string
# node), not by Compose. Two consequences:
#   - An UNSET variable becomes "" SILENTLY: a user whose `smbpasswd -a -s`
#     fails, a HEALTHY container (anonymous probe), a share nobody can log
#     into. samba-init.sh's non-empty/changeme_ gate is the refusal to
#     start — NOT a `${SAMBA_*_PASSWORD:?}` in compose.yaml, which is
#     WRONG there (aborts a deploy racing the decrypt, finding #11); do not
#     add one.
#   - A password containing `$` must be SINGLE-QUOTED in the plaintext .env
#     before encryption (CLAUDE.md; finding #30 for the Compose half).
#
# `interfaces` and `bind interfaces only` are NOT here on purpose: they come
# from the SAMBA_INTERFACES env var, which emits both.
#
# ---------------------------------------------------------------------------
# MULTI-USER (rollout 2026-09-05). Usernames MIRROR Authentik usernames
# (compose.yaml header — the mitigation for no LDAP). Users are re-created from
# this file every start, so offboarding is `sopsedit` + delete the entry +
# restart. Each SAMBA_<USER>_PASSWORD is a copy_only twin of that user's
# Authentik password (secrets-gen/manifest.yaml user/*).
#
# 🚨 UID CONTRACT: distinct uids, ONE shared gid (1000). The gid is what lets
# everyone read/write the `shared` tree (1000:1000, 0775 — group bit); distinct
# uids are what make `personal/<name>` (owned <uid>:1000, 0700) private to one
# person. Each uid/gid MUST match the tmpfiles rule for its dir (DIR_NOTES in
# nixos/generate-stack-dirs.py); samba-init refuses to start on a mismatch.
# Block style, NOT flow `{ ... }`: a flow mapping treats the `{` and `}` in a
# `${VAR}` value as flow indicators, so `password: ${SAMBA_IDAN_PASSWORD}` inside
# `{ }` is INVALID YAML — the image's `yq` then fails to parse the WHOLE file,
# silently (2>/dev/null) creates zero users/shares, and smbd still starts with
# only [global] so the shallow healthcheck stays green. In block style an
# unquoted `${VAR}` is a plain scalar; the image's envsubst substitutes it.
auth:
  - user: idan
    group: shared
    uid: 1000
    gid: 1000
    password: ${SAMBA_IDAN_PASSWORD}
  - user: alondra
    group: shared
    uid: 1001
    gid: 1000
    password: ${SAMBA_ALONDRA_PASSWORD}
  - user: cale
    group: shared
    uid: 1002
    gid: 1000
    password: ${SAMBA_CALE_PASSWORD}
  - user: zach
    group: shared
    uid: 1003
    gid: 1000
    password: ${SAMBA_ZACH_PASSWORD}
  - user: rylan
    group: shared
    uid: 1004
    gid: 1000
    password: ${SAMBA_RYLAN_PASSWORD}
  - user: cameron
    group: shared
    uid: 1005
    gid: 1000
    password: ${SAMBA_CAMERON_PASSWORD}
  - user: justin
    group: shared
    uid: 1006
    gid: 1000
    password: ${SAMBA_JUSTIN_PASSWORD}

global:
  # Appended AFTER the image's hardcoded heredoc AND its SAMBA_INTERFACES block
  # (01-config.sh emits `interfaces = …` + `bind interfaces only = yes` first),
  # so these WIN on last-value.
  # SMB1 is the ransomware-worm protocol; no client here needs it.
  - "server min protocol = SMB3_00"
  - "smb encrypt = required"
  # 🚨 bind interfaces only = NO, overriding the yes that SAMBA_INTERFACES emits.
  # tailscale0 is a POINTOPOINT/NOARP /32 TUN; smbd excludes point-to-point
  # devices from its bindable set, so with `bind interfaces only = yes` it
  # silently refuses to listen on the tailnet address — by NAME *or* by explicit
  # IP (both verified). Since every client reaches this host over the tailnet,
  # we bind all addresses and gate access with `hosts allow` instead (=
  # SAMBA_HOSTS_ALLOW: loopback + LAN 10/8 + tailnet 100.64/10; SMB is also
  # credential-gated). `interfaces = …` stays set but is now advisory.
  - "bind interfaces only = no"

# `shared` is common to all (group-writable via gid 1000). Each `personal/<name>`
# is private: `validusers` gates it at the SMB layer AND the dir is 0700
# <uid>:1000 so the shared group can't enter either — belt and suspenders.
# 🚨 `map to guest = bad user` (from the generated [global]) maps a user whose
# seeding silently failed to GUEST, not a rejection; `guestok: no` + `validusers`
# on every share is what stops that from becoming anonymous access.
share:
  - name: shared
    path: /mnt/slow/samba/shared
    browsable: yes
    readonly: no
    guestok: no
    validusers: "idan alondra cale zach rylan cameron justin"
    veto: no
    recycle: no
  - name: idan
    path: /mnt/slow/samba/personal/idan
    browsable: yes
    readonly: no
    guestok: no
    validusers: idan
    veto: no
    recycle: no
  - name: alondra
    path: /mnt/slow/samba/personal/alondra
    browsable: yes
    readonly: no
    guestok: no
    validusers: alondra
    veto: no
    recycle: no
  - name: cale
    path: /mnt/slow/samba/personal/cale
    browsable: yes
    readonly: no
    guestok: no
    validusers: cale
    veto: no
    recycle: no
  - name: zach
    path: /mnt/slow/samba/personal/zach
    browsable: yes
    readonly: no
    guestok: no
    validusers: zach
    veto: no
    recycle: no
  - name: rylan
    path: /mnt/slow/samba/personal/rylan
    browsable: yes
    readonly: no
    guestok: no
    validusers: rylan
    veto: no
    recycle: no
  - name: cameron
    path: /mnt/slow/samba/personal/cameron
    browsable: yes
    readonly: no
    guestok: no
    validusers: cameron
    veto: no
    recycle: no
  - name: justin
    path: /mnt/slow/samba/personal/justin
    browsable: yes
    readonly: no
    guestok: no
    validusers: justin
    veto: no
    recycle: no
