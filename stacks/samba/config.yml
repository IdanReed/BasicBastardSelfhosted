# Samba configuration — crazymax/samba's entrypoint renders it into smb.conf
# and creates the users.
#
# 🚨 ${VAR} is interpolated by the IMAGE (envsubst), not by Compose, and an
# unset one becomes "" silently. samba-init.sh's gate is the refusal to start;
# never a `${SAMBA_*:?}` in compose.yaml, which aborts a deploy that races the
# decrypt. A password containing `$` must be single-quoted in the plaintext
# .env before encryption.
#
# `interfaces` / `bind interfaces only` are absent on purpose: SAMBA_INTERFACES
# emits both.
#
# 🚨 UID CONTRACT: distinct uids, ONE shared gid (1000). The gid is what lets
# everyone into the `shared` tree; the distinct uids are what keep
# `personal/<name>` (0700) private. Each must match the tmpfiles rule for its
# directory (DIR_NOTES in nixos/generate-stack-dirs.py) — samba-init refuses
# to start on a mismatch.
#
# 🚨 BLOCK STYLE, never flow `{ … }`: a flow mapping reads the braces of a
# `${VAR}` value as flow indicators, the image's `yq` then fails to parse the
# WHOLE file silently, zero users and shares are created, and smbd still
# starts with only [global] so the healthcheck stays green.
auth:
  - user: idan
    group: shared
    uid: 1000
    gid: 1000
    password: ${SAMBA_IDAN_PASSWORD}
  - user: alondra
    group: shared
    uid: 1001
    gid: 1000
    password: ${SAMBA_ALONDRA_PASSWORD}
  - user: cale
    group: shared
    uid: 1002
    gid: 1000
    password: ${SAMBA_CALE_PASSWORD}
  - user: zach
    group: shared
    uid: 1003
    gid: 1000
    password: ${SAMBA_ZACH_PASSWORD}
  - user: rylan
    group: shared
    uid: 1004
    gid: 1000
    password: ${SAMBA_RYLAN_PASSWORD}
  - user: cameron
    group: shared
    uid: 1005
    gid: 1000
    password: ${SAMBA_CAMERON_PASSWORD}
  - user: justin
    group: shared
    uid: 1006
    gid: 1000
    password: ${SAMBA_JUSTIN_PASSWORD}

global:
  # Appended after the image's own [global] and its SAMBA_INTERFACES block,
  # so these win on last-value.
  - "server min protocol = SMB3_00"
  - "smb encrypt = required"
  # 🚨 Overrides the `yes` SAMBA_INTERFACES emits. tailscale0 is a
  # POINTOPOINT/NOARP TUN and smbd excludes point-to-point devices from its
  # bindable set, so `bind interfaces only = yes` silently refuses to listen
  # on the tailnet address — by name or by explicit IP. Access is gated by
  # `hosts allow` (SAMBA_HOSTS_ALLOW) and credentials instead.
  - "bind interfaces only = no"

# 🚨 `map to guest = bad user` (from the generated [global]) maps a user whose
# seeding silently failed to GUEST rather than rejecting them; `guestok: no` +
# `validusers` on every share is what stops that becoming anonymous access.
share:
  - name: shared
    path: /mnt/slow/samba/shared
    browsable: yes
    readonly: no
    guestok: no
    validusers: "idan alondra cale zach rylan cameron justin"
    veto: no
    recycle: no
  - name: idan
    path: /mnt/slow/samba/personal/idan
    browsable: yes
    readonly: no
    guestok: no
    validusers: idan
    veto: no
    recycle: no
  - name: alondra
    path: /mnt/slow/samba/personal/alondra
    browsable: yes
    readonly: no
    guestok: no
    validusers: alondra
    veto: no
    recycle: no
  - name: cale
    path: /mnt/slow/samba/personal/cale
    browsable: yes
    readonly: no
    guestok: no
    validusers: cale
    veto: no
    recycle: no
  - name: zach
    path: /mnt/slow/samba/personal/zach
    browsable: yes
    readonly: no
    guestok: no
    validusers: zach
    veto: no
    recycle: no
  - name: rylan
    path: /mnt/slow/samba/personal/rylan
    browsable: yes
    readonly: no
    guestok: no
    validusers: rylan
    veto: no
    recycle: no
  - name: cameron
    path: /mnt/slow/samba/personal/cameron
    browsable: yes
    readonly: no
    guestok: no
    validusers: cameron
    veto: no
    recycle: no
  - name: justin
    path: /mnt/slow/samba/personal/justin
    browsable: yes
    readonly: no
    guestok: no
    validusers: justin
    veto: no
    recycle: no
