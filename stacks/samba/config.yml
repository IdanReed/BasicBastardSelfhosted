# Samba configuration — consumed by crazymax/samba's entrypoint, which renders
# it into smb.conf and creates the users.
#
# 🚨 ${VAR} here is interpolated by the IMAGE (envsubst over every string
# node), not by Compose. Two consequences:
#   - An UNSET variable becomes "" SILENTLY: a user whose `smbpasswd -a -s`
#     fails, a HEALTHY container (anonymous probe), a share nobody can log
#     into. samba-init.sh's non-empty/changeme_ gate is the refusal to
#     start — NOT a `${SAMBA_IDAN_PASSWORD:?}` in compose.yaml, which is
#     WRONG there (aborts a deploy racing the decrypt, finding #11); do not
#     add one.
#   - A password containing `$` must be SINGLE-QUOTED in the plaintext .env
#     before encryption (CLAUDE.md; finding #30 for the Compose half).
#
# `interfaces` and `bind interfaces only` are NOT here on purpose: they come
# from the SAMBA_INTERFACES env var, which emits both. Setting them in both
# places is a duplicated directive that `testparm` does not flag.

auth:
  # Username MIRRORS the Authentik username deliberately — the whole
  # mitigation for not having LDAP (compose.yaml header). Users are
  # re-created from this file every start, so offboarding is `sopsedit` +
  # restart.
  - user: idan
    group: idan
    # 🚨 A CONTRACT with the host, enforced only by samba-init: adduser -u
    # creates the user IN the container; the files land on
    # /mnt/slow/samba/shared, owned via a tmpfiles rule (DIR_NOTES in
    # nixos/generate-stack-dirs.py — rerun the generator). A mismatch is
    # files nothing else in the fleet can read, not a crash. The suite
    # measures it (write over SMB, stat on the host).
    #
    # A second SMB user gets a DISTINCT uid and a shared group — reusing
    # 1000 makes per-user ownership a fiction.
    uid: 1000
    gid: 1000
    password: ${SAMBA_IDAN_PASSWORD}

global:
  # Appended AFTER the image's hardcoded heredoc; last value wins.
  # SMB1 is the ransomware-worm protocol; no client here needs it.
  - "server min protocol = SMB3_00"
  - "smb encrypt = required"
  # Covers the LAN case if the firewall is ever opened; free on modern clients.

share:
  - name: shared
    path: /mnt/slow/samba/shared
    browsable: yes
    readonly: no
    # 🚨 Both load-bearing, non-obviously: the generated [global] carries
    # `map to guest = bad user` (= *not in the passdb*), so a user whose
    # seeding silently failed is mapped to GUEST, not rejected. These two
    # lines stop it there — removing either turns a failed user-creation
    # into anonymous access.
    guestok: no
    validusers: idan
    veto: no
    recycle: no
