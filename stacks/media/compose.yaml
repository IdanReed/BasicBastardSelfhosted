# Media — Jellyfin + *arr + qBittorrent-behind-Gluetun + ClamAV + Cleanuparr.
# Design: ServerNotes/designs/service-media-stack-research.md (the annex wins
# over service-media-stack.md); ports 10050-10058 per _overview.md.
#
# Invariants other files depend on:
#   - x265 is ENFORCED; media-init.sh re-scores profiles and Profilarr may
#     only sync Dictionarry (never trash-pcd).
#   - Everything provider-specific about the VPN comes from .env — gluetun is
#     handed the whole decrypted file.
#   - /mnt/slow is ONE filesystem so *arr imports are hardlinks; scan-
#     downloads.sh quarantines by inode because of it.
#   - Audiobooks are acquired here and handed to the books stack through
#     /mnt/slow/books/drop (ServerNotes/designs/audiobook-acquisition.md).

services:
  # VPN
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # qBittorrent's WebUI rides this publish (shared netns).
    ports:
      - '127.0.0.1:10057:8080'
    volumes:
      - /mnt/fast/gluetun:/gluetun
    environment:
      - TZ=America/Chicago
      # Without this gluetun's firewall drops the published-port traffic.
      - FIREWALL_INPUT_PORTS=8080
      # Only runs when .env sets VPN_PORT_FORWARDING=on. {{PORTS}} is
      # gluetun's v3.39+ placeholder; needs WebUI\LocalHostAuth=false.
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'''
    # Long form throughout this file: a deploy can race the host-side decrypt,
    # and the plain form aborts the whole stack when .env is absent.
    env_file:
      - path: .env
        required: false
    # No healthcheck stanza: the image's own dials through the tunnel, so VPN
    # down = unhealthy with the firewall still up (the kill-switch condition).
    restart: unless-stopped

  # Seeds qBittorrent.conf and categories.json ONCE, before qbit's first start
  # — the LSIO image otherwise prints a random temporary password every start.
  # qBittorrent owns both files afterwards; to re-seed, delete them.
  qbit-init:
    image: alpine:3.21
    container_name: media_qbit_init
    entrypoint:
      - /bin/sh
      - -ec
      # $$ everywhere: compose would otherwise interpolate at parse time.
      - |
        conf_dir=/config/qBittorrent
        conf="$$conf_dir/qBittorrent.conf"
        cats="$$conf_dir/categories.json"
        # Hard error on unset/empty: an empty PBKDF2 hash would seed a WebUI
        # nobody can ever log in to.
        [ -n "$${QBIT_WEBUI_USER:-}" ] || { echo "qbit-init: FATAL: QBIT_WEBUI_USER unset (decrypt race?)" >&2; exit 1; }
        [ -n "$${QBIT_WEBUI_PASSWORD_PBKDF2:-}" ] || { echo "qbit-init: FATAL: QBIT_WEBUI_PASSWORD_PBKDF2 unset" >&2; exit 1; }
        mkdir -p "$$conf_dir"
        # categories.json is a SIBLING of qBittorrent.conf and is read once in
        # the SessionImpl constructor, so it is what makes `audiobooks` exist
        # on a fresh volume even with the tunnel down — media-init's API
        # reconcile needs a STARTED qbit, which needs a healthy gluetun.
        # Seed-if-absent and writable: qbit rewrites it whole on any change.
        if [ ! -f "$$cats" ]; then
          printf '%s\n' '{"audiobooks":{"save_path":"/data/downloads/audiobooks"}}' > "$$cats.tmp"
          mv "$$cats.tmp" "$$cats"
          echo "qbit-init: CHANGE: seeded $$cats (audiobooks)"
        fi
        if [ -f "$$conf" ]; then
          echo "qbit-init: $$conf exists — qBittorrent owns it, not touching"
          # 🚨 DRIFT GUARD, not a repair. `sopsgen rotate user/idan` rewrites
          # QBIT_WEBUI_PASSWORD_PBKDF2 in sops, but this file is seed-once, so
          # the rotation never reaches qBittorrent: media-init's login 401s
          # forever (a WARN) while the arrs keep the old download-client
          # password and imports break, every container green. It cannot be
          # repaired here — `up -d` recreates this oneshot BEFORE stopping
          # qbit, and qbit rewrites the conf on shutdown. Repair on the host:
          # stop qbittorrent, rm the conf, up -d.
          if ! grep -qF "$$QBIT_WEBUI_PASSWORD_PBKDF2" "$$conf"; then
            echo "qbit-init: WARN: the stored WebUI password does NOT match" >&2
            echo "qbit-init: WARN: QBIT_WEBUI_PASSWORD_PBKDF2 in .env — a sops" >&2
            echo "qbit-init: WARN: rotation cannot reach a seed-once file. See" >&2
            echo "qbit-init: WARN: docs/for-shame.md (qBittorrent) for the repair." >&2
          fi
          chown -R 1000:1000 /config
          exit 0
        fi
        # Tmpfile+rename: the -f guard above is touch-once, so a crash
        # mid-write would leave a partial conf no later run repairs.
        {
          printf '%s\n' '[AutoRun]'
          printf '%s\n' 'enabled=false'
          printf '%s\n' ''
          printf '%s\n' '[BitTorrent]'
          printf '%s\n' 'Session\DefaultSavePath=/data/downloads'
          printf '%s\n' 'Session\TempPath=/data/downloads/.incomplete'
          printf '%s\n' 'Session\TempPathEnabled=true'
          printf '%s\n' ''
          printf '%s\n' '[LegalNotice]'
          printf '%s\n' 'Accepted=true'
          printf '%s\n' ''
          printf '%s\n' '[Preferences]'
          printf '%s\n' "WebUI\\Username=$$QBIT_WEBUI_USER"
          printf '%s\n' "WebUI\\Password_PBKDF2=\"$$QBIT_WEBUI_PASSWORD_PBKDF2\""
          # On: 401s any Host whose port differs from the listen port, which
          # rejects both the :10057 publish and Caddy's vhost, silently.
          printf '%s\n' 'WebUI\HostHeaderValidation=false'
          # Lets gluetun's port-forward UP_COMMAND post the listen port.
          printf '%s\n' 'WebUI\LocalHostAuth=false'
          printf '%s\n' 'WebUI\Port=8080'
        } > "$$conf.tmp"
        mv "$$conf.tmp" "$$conf"
        chown -R 1000:1000 /config
        echo "qbit-init: seeded $$conf"
    volumes:
      - /mnt/fast/qbittorrent/config:/config
    env_file:
      - path: .env
        required: false
    restart: "no"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    # Gluetun's netns: zero egress when the tunnel is down. The arrs reach it
    # at http://gluetun:8080.
    network_mode: 'service:gluetun'
    depends_on:
      gluetun:
        # restart: true — a gluetun restart re-creates the netns; without it
        # qbit keeps a dead namespace.
        condition: service_healthy
        restart: true
      qbit-init:
        condition: service_completed_successfully
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8080
    volumes:
      - /mnt/fast/qbittorrent/config:/config
      - /mnt/slow/data/downloads:/data/downloads
    healthcheck:
      # Deliberately NOT a connectivity check — tunnel state is gluetun's job.
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Library
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    depends_on:
      jellyfin-config-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10050:8096'
    volumes:
      - /mnt/fast/jellyfin/config:/config
      - /mnt/fast/jellyfin/cache:/cache
      - /mnt/slow/data/media:/data/media:ro
      # Bind mount, NOT a `devices:` stanza: devices hard-fails creation when
      # the node is absent, this degrades to software transcode instead.
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      # 226 = DRM major, so VA-API can open the render node.
      - 'c 226:* rmw'
    environment:
      - TZ=America/Chicago
      - JELLYFIN_PublishedServerUrl=https://jellyfin.svc.idanreed.com
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8096/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Seeds config/encoding.xml BEFORE jellyfin's first start: there is no env
  # var for any EncodingOptions field and the API needs an admin token that
  # does not exist yet, so a file is the only channel. Seed-if-absent, NOT
  # merge — jellyfin rewrites it whenever an admin saves the Transcoding page.
  #
  # ⚠ Deliberately does NOT seed config/system.xml; see jellyfin-init.sh.
  jellyfin-config-init:
    image: alpine:3.21
    container_name: media_jellyfin_config_init
    entrypoint:
      - /bin/sh
      - -ec
      - |
        dest=/config/config/encoding.xml
        if [ -f "$$dest" ]; then
          echo "jellyfin-config-init: $$dest exists - jellyfin owns it, not touching"
        else
          mkdir -p /config/config
          # Tmpfile+rename: the -f guard is touch-once, so a crash mid-write
          # would leave a partial XML that jellyfin logs and then ignores in
          # favour of defaults.
          cp /template/encoding.xml "$$dest.tmp"
          mv "$$dest.tmp" "$$dest"
          echo "jellyfin-config-init: CHANGE: seeded $$dest (vaapi)"
        fi

        # SSO-Auth plugin, pinned by version AND sha256. Installed here,
        # before jellyfin starts, because plugins load only at startup.
        # Downloaded once (the dir persists in the config volume); a failed
        # fetch or checksum is a WARN, never fatal — jellyfin must not depend
        # on GitHub to start, it just comes up without the SSO button.
        plugin="/config/plugins/SSO-Auth_$$SSO_VERSION"
        if [ -f "$$plugin/SSO-Auth.dll" ]; then
          echo "jellyfin-config-init: SSO-Auth $$SSO_VERSION already installed - no change"
        else
          tmp=$$(mktemp -d)
          url="https://github.com/9p4/jellyfin-plugin-sso/releases/download/v$$SSO_VERSION/sso-authentication_$$SSO_VERSION.zip"
          if wget -q -T 60 -O "$$tmp/sso.zip" "$$url" \
             && echo "$$SSO_SHA256  $$tmp/sso.zip" | sha256sum -c -s - \
             && mkdir "$$tmp/x" && unzip -q "$$tmp/sso.zip" -d "$$tmp/x"; then
            mkdir -p /config/plugins
            # A version bump leaves the old dir behind; jellyfin would load both.
            rm -rf /config/plugins/SSO-Auth_*
            mv "$$tmp/x" "$$plugin"
            echo "jellyfin-config-init: CHANGE: installed SSO-Auth $$SSO_VERSION"
          else
            echo "jellyfin-config-init: WARN: SSO-Auth $$SSO_VERSION not installed (download or sha256 failed: $$url) - jellyfin starts without SSO"
          fi
          rm -rf "$$tmp"
        fi
        # Jellyfin rewrites meta.json in place; a store-copied (0444) seed
        # would refuse that.
        [ -d "$$plugin" ] && chmod -R u+w "$$plugin" || true
    environment:
      # Bump both together; the sha256 is the release's published checksum.
      # 4.0.0.x targets Jellyfin 10.11 (meta.json targetAbi).
      - SSO_VERSION=4.0.0.4
      - SSO_SHA256=c09f16ba31059a434ddd7f811e4f9608d4b4c4514cc80a5bf1ca33bee61e1107
    volumes:
      - ./jellyfin-encoding.xml:/template/encoding.xml:ro
      - /mnt/fast/jellyfin/config:/config
    restart: "no"

  # Drives the startup wizard, the first admin and the two libraries over REST
  # — anonymous while the wizard is open, token-authed afterwards, so it
  # reconciles on every redeploy. See jellyfin-init.sh. The admin it creates is
  # ALSO what Seerr authenticates against.
  jellyfin-init:
    image: python:3.13-alpine
    container_name: media_jellyfin_init
    entrypoint: ['/bin/sh', '/init/jellyfin-init.sh']
    environment:
      # SSO-Auth plugin provider, contract-checked against
      # headscale-vps/authentik/blueprints/custom/jellyfin-oidc.yaml. The
      # callback is <PUBLIC_URL>/sso/OID/redirect/<PROVIDER>.
      - JELLYFIN_SSO_PROVIDER=authentik
      - JELLYFIN_OIDC_ENDPOINT=https://auth.idanreed.com/application/o/jellyfin/
      - JELLYFIN_OIDC_CLIENT_ID=jellyfin
      - JELLYFIN_PUBLIC_URL=https://jellyfin.svc.idanreed.com
    depends_on:
      jellyfin:
        condition: service_healthy
      # The library paths must exist before POST /Library/VirtualFolders —
      # LibraryManager throws otherwise, and media-init creates the skeleton.
      media-init:
        condition: service_completed_successfully
    volumes:
      - ./jellyfin-init.sh:/init/jellyfin-init.sh:ro
    env_file:
      - path: .env
        required: false
    restart: "no"

  # Arrs
  #
  # API keys are pushed DOWN via the Servarr {APP}__AUTH__APIKEY overrides in
  # .env, so every consumer knows them a priori. AUTH__METHOD=External means
  # Caddy's forward auth is the login; the API still requires the key.
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    ports:
      - '127.0.0.1:10051:7878'
    volumes:
      - /mnt/fast/radarr/config:/config
      # Whole /data: downloads AND library on one mount = hardlink imports.
      - /mnt/slow/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=Enabled
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7878/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    ports:
      - '127.0.0.1:10052:8989'
    volumes:
      - /mnt/fast/sonarr/config:/config
      - /mnt/slow/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - SONARR__AUTH__METHOD=External
      - SONARR__AUTH__REQUIRED=Enabled
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8989/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  prowlarr:
    # NOT behind gluetun on purpose: indexers dialled through VPN exit IPs
    # attract Cloudflare blocks.
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    ports:
      - '127.0.0.1:10053:9696'
    volumes:
      - /mnt/fast/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PROWLARR__AUTH__METHOD=External
      - PROWLARR__AUTH__REQUIRED=Enabled
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9696/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Requests
  #
  # /config ownership (seerr runs as uid 1000 and cannot chown a root-owned
  # bind source) plus the settings.json seed, both BEFORE seerr starts.
  seerr-init:
    image: python:3.13-alpine
    container_name: media_seerr_init
    entrypoint: ['/bin/sh', '/init/seerr-init.sh']
    volumes:
      - ./seerr-init.sh:/init/seerr-init.sh:ro
      - ./seerr-settings.json:/template/settings.json:ro
      - /mnt/fast/seerr/config:/config
    env_file:
      - path: .env
        required: false
    restart: "no"

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    depends_on:
      seerr-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10054:5055'
    volumes:
      - /mnt/fast/seerr/config:/app/config
    environment:
      - TZ=America/Chicago
      # API_KEY forces main.apiKey on EVERY load, so the headless key is a sops
      # value rather than something scraped out of settings.json. Named, not
      # env_file: seerr needs this one value, not the whole media .env (D-08).
      # `${VAR:-}` interpolates from the project .env at parse time.
      - API_KEY=${SEERR_API_KEY:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5055/api/v1/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # The three calls settings.json cannot make. Separate from seerr-init because
  # they sit on opposite sides of seerr's own start: the file must be there
  # BEFORE seerr reads it, these calls need it RUNNING. See seerr-bootstrap.sh.
  seerr-bootstrap:
    image: python:3.13-alpine
    container_name: media_seerr_bootstrap
    entrypoint: ['/bin/sh', '/init/seerr-bootstrap.sh']
    depends_on:
      seerr:
        condition: service_healthy
      # The Jellyfin admin it authenticates as has to exist first.
      jellyfin-init:
        condition: service_completed_successfully
    volumes:
      - ./seerr-bootstrap.sh:/init/seerr-bootstrap.sh:ro
    env_file:
      - path: .env
        required: false
    restart: "no"

  # Subtitles
  #
  # Seeds config/config.yaml (note the doubled `config`: that is where Dynaconf
  # looks) with the Radarr/Sonarr connections and a pinned auth.apikey, before
  # bazarr's first start.
  bazarr-config-init:
    image: python:3.13-alpine
    container_name: media_bazarr_config_init
    entrypoint: ['/bin/sh', '/init/bazarr-config-init.sh']
    volumes:
      - ./bazarr-config-init.sh:/init/bazarr-config-init.sh:ro
      - /mnt/fast/bazarr/config:/config
    env_file:
      - path: .env
        required: false
    restart: "no"

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    depends_on:
      bazarr-config-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10055:6767'
    volumes:
      - /mnt/fast/bazarr/config:/config
      - /mnt/slow/data/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6767 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Profiles
  #
  # Syncs Dictionarry (only Dictionarry) profiles and custom formats into
  # Radarr/Sonarr. The parser sidecar is CF-testing only, deliberately absent.
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0
    container_name: profilarr
    ports:
      - '127.0.0.1:10056:6868'
    volumes:
      - /mnt/fast/profilarr/config:/config
    environment:
      - TZ=America/Chicago
      - AUTH=on
      # PROFILARR_API_KEY (>=32 chars) arrives from .env below.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Toolset not pinned down (python base): try curl, wget, then python.
      # Any 2xx/3xx on the SPA root is up.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:6868/ >/dev/null 2>&1
          || wget -q -O /dev/null http://localhost:6868/ 2>/dev/null
          || python3 -c "import urllib.request;urllib.request.urlopen('http://localhost:6868/',timeout=5)"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Queue hygiene
  #
  # v2 is configured through its web UI into /config, not env vars; point the
  # malware blocker at a LOCAL blocklist under /config so it works offline.
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.5
    container_name: cleanuparr
    ports:
      - '127.0.0.1:10058:11011'
    volumes:
      - /mnt/fast/cleanuparr/config:/config
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:11011/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Antivirus
  #
  # clamd on the stack-internal network (:3310, never published). Cleanuparr
  # is the pre-download layer; the two meet indirectly, since a quarantined
  # payload fails arr import and Cleanuparr then blocklists the release.
  clamav:
    image: clamav/clamav:1.5
    container_name: clamav
    volumes:
      # freshclam state — the plain tag ships a database, the _base variant
      # does not, hence the pin.
      - /mnt/fast/clamav/db:/var/lib/clamav
      # Same path the scanner sees, so path-based clamdscan requests resolve.
      - /mnt/slow/data/downloads:/data/downloads:ro
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG']
      interval: 60s
      timeout: 10s
      retries: 5
      # DB load into memory takes a while on first start.
      start_period: 300s
    restart: unless-stopped

  # A SECOND container from the same pinned image: it keeps the scan loop out
  # of qbit's gluetun-firewalled netns, and clamdscan already ships in it.
  clamav-scanner:
    image: clamav/clamav:1.5
    container_name: clamav_scanner
    entrypoint: ['/bin/sh', '/scan/scan-downloads.sh']
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      - NTFY_URL=http://ntfy/media
      - SCAN_INTERVAL_SECONDS=60
      - AUDIOBOOK_DROP_DIR=/drop
    volumes:
      - ./scan-downloads.sh:/scan/scan-downloads.sh:ro
      # WHOLE /data, read-write: quarantine is an inode operation, so the
      # scanner must be able to unlink the *arr hardlinks in /data/media too.
      - /mnt/slow/data:/data
      # The books stack's drop dir — clean audiobook entries are moved here
      # after their verdict, and that is the whole coupling between the stacks.
      - /mnt/slow/books/drop:/drop
      - /mnt/fast/clamav/scanner:/state
    networks:
      # default for clamd, homelab for ntfy (a container cannot reach the
      # loopback-bound host port).
      - default
      - homelab
    healthcheck:
      # MUST override the inherited one: it probes a LOCAL clamd this
      # container does not run, so it would be permanently unhealthy.
      test: ['CMD-SHELL', 'echo PING | nc -w 5 clamav 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Reconciler
  #
  # Idempotent oneshot; see media-init.sh for what it reconciles. python-alpine
  # rather than curl+jq because no image ships both and `apk add` at container
  # start is banned.
  media-init:
    image: python:3.13-alpine
    container_name: media_init
    entrypoint: ['/bin/sh', '/init/media-init.sh']
    depends_on:
      # Deliberately NOT gluetun/qbittorrent: a down tunnel keeps qbit down,
      # and media-init must still reconcile everything else. It retries the
      # download-client POST for ~2min, then WARNs for the next run.
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      profilarr:
        condition: service_healthy
    volumes:
      - ./media-init.sh:/init/media-init.sh:ro
      # For the /data skeleton (mkdir + chown 1000:1000).
      - /mnt/slow/data:/data
    env_file:
      - path: .env
        required: false
    restart: "no"

networks:
  homelab:
    external: true
