# Media stack — Jellyfin + *arr suite + qBittorrent-behind-Gluetun + ClamAV +
# Cleanuparr. Design: ServerNotes/designs/service-media-stack.md + research
# annex service-media-stack-research.md (annex wins; ports from _overview.md).
#
# LOCKED DECISIONS (LONGRUN.md — do not revisit here):
#   - x265/H265 is ENFORCED. Profiles come from Profilarr syncing Dictionarry
#     ONLY ('1080p Efficient' default, '2160p Efficient' for 4K). Never link
#     trash-pcd — TRaSH's "golden rule" scores 'x265 (HD)' at -10000;
#     media-init.sh additionally zeroes any negative x265/HEVC score.
#   - Gluetun is fully PROVIDER-AGNOSTIC: provider, credentials, server
#     selection and port-forwarding all flow from .sops.env (gluetun gets the
#     whole decrypted .env). New gluetun vars also go in .sops.env.example and
#     the test fixture — the stack-env-drift lint keeps the key sets identical.
#   - DEFERRED, with costs: flaresolverr (some Cloudflare-protected indexers
#     will not resolve), unpackerr (RAR'd releases will not import),
#     qbit_manage (no orphan/share-limit/tag hygiene; _overview.md keeps its
#     row for the follow-up).
#   - Seerr stays on stable v3.4.1 + Jellyfin-account auth: preview-new-oidc
#     lacks the CVE-2026-40175 patch — re-evaluate when OIDC lands in a
#     stable tag. Session-authed, NOT forward-authed: its mobile/API clients
#     authenticate themselves.
#
# Layout (hardlink requirement — ONE filesystem, /mnt/slow; media-init
# creates the skeleton, owned 1000:1000):
#   /mnt/slow/data/downloads/{movies,tv}   qBittorrent categories
#   /mnt/slow/data/downloads/audiobooks    qBittorrent category, NOT arr-imported
#   /mnt/slow/data/downloads/.incomplete   qBittorrent temp path
#   /mnt/slow/data/downloads/.quarantine   ClamAV quarantine (scan-downloads.sh)
#   /mnt/slow/data/media/{movies,tv}       Radarr/Sonarr roots, Jellyfin libraries
#   /mnt/slow/books/drop                   audiobook hand-off to the books stack
#
# Audiobooks (Option C — ServerNotes/designs/audiobook-acquisition.md):
# acquisition happens HERE, in qBittorrent's `audiobooks` category, and
# scan-downloads.sh MOVES a clean entry into /mnt/slow/books/drop after its
# verdict. Buys: the books stack needs no network path to qBittorrent and no
# mount of the download tree. Costs, accepted: requests happen here (not
# Shelfmark's UI) and a promoted entry stops seeding.
#
# Wiring (headless, nixflix pattern): API keys are pushed DOWN via the
# Servarr {APP}__AUTH__APIKEY env overrides; media-init.sh (oneshot)
# reconciles the rest over REST — "CHANGE:" lines on first run, zero on the
# second (the audit trail).
#
# Ports 10050-10058 per _overview.md, all loopback-bound (Caddy on the host
# network is the only path in). qBittorrent publishes NOTHING itself: its UI
# rides gluetun's 127.0.0.1:10057 publish (network_mode: service:gluetun).

services:
  # ---------------------------------------------------------------------------
  # Gluetun — VPN netns + kill-switch for qBittorrent
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # qBittorrent's WebUI, published from the shared netns; loopback-bound.
    # The kill-switch never applies to this path (docker DNAT +
    # FIREWALL_INPUT_PORTS below).
    ports:
      - '127.0.0.1:10057:8080'
    volumes:
      - /mnt/fast/gluetun:/gluetun
    environment:
      - TZ=America/Chicago
      # Without this gluetun's firewall drops the published-port traffic —
      # UI dead even on loopback.
      - FIREWALL_INPUT_PORTS=8080
      # Port-forwarding hook: runs only when .env sets VPN_PORT_FORWARDING=on.
      # Posts the forwarded port into qbit's API; needs WebUI\LocalHostAuth=false
      # (qbit-init seeds it). {{PORTS}} is gluetun's v3.39+ placeholder; the
      # /tmp/gluetun/forwarded_port polling is deprecated.
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'''
      # Everything provider-specific (VPN_SERVICE_PROVIDER, VPN_TYPE,
      # credentials, server selection, VPN_PORT_FORWARDING) comes from .env.
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the host-side decrypt (timer, ≤~1min), and the plain form aborts
    # the whole stack when .env is absent. Long form is docker compose's own
    # contract, so it holds under either deploy plane. Residual window: a
    # deploy racing the first decrypt starts with unset vars — the loud guard
    # is each service's own healthcheck/startup failure.
    env_file:
      - path: .env
        required: false
    # Healthcheck: the image's own (dials through the tunnel). VPN unreachable
    # = UNHEALTHY with the firewall UP — the offline-testable kill-switch
    # condition the media suite asserts.
    restart: unless-stopped

  # Seeds qBittorrent.conf ONCE, before qbit's first start — the LSIO image
  # otherwise prints a random temporary password every start (no env override
  # for WebUI credentials). qBittorrent owns the file afterwards (rewrites it
  # on shutdown); to re-seed, delete it.
  qbit-init:
    image: alpine:3.21
    container_name: media_qbit_init
    entrypoint:
      - /bin/sh
      - -ec
      # $$ everywhere: compose would otherwise interpolate at parse time.
      - |
        conf_dir=/config/qBittorrent
        conf="$$conf_dir/qBittorrent.conf"
        if [ -f "$$conf" ]; then
          echo "qbit-init: $$conf exists — qBittorrent owns it, not touching"
          exit 0
        fi
        # Hard error on unset/empty: an empty PBKDF2 hash would seed a WebUI
        # nobody can ever log in to.
        [ -n "$${QBIT_WEBUI_USER:-}" ] || { echo "qbit-init: FATAL: QBIT_WEBUI_USER unset (decrypt race? finding #11)" >&2; exit 1; }
        [ -n "$${QBIT_WEBUI_PASSWORD_PBKDF2:-}" ] || { echo "qbit-init: FATAL: QBIT_WEBUI_PASSWORD_PBKDF2 unset" >&2; exit 1; }
        mkdir -p "$$conf_dir"
        # Tmpfile+rename: the -f guard above is touch-once, so a crash
        # mid-write would leave a partial conf no later run repairs.
        {
          printf '%s\n' '[AutoRun]'
          printf '%s\n' 'enabled=false'
          printf '%s\n' ''
          printf '%s\n' '[BitTorrent]'
          printf '%s\n' 'Session\DefaultSavePath=/data/downloads'
          printf '%s\n' 'Session\TempPath=/data/downloads/.incomplete'
          printf '%s\n' 'Session\TempPathEnabled=true'
          printf '%s\n' ''
          printf '%s\n' '[LegalNotice]'
          printf '%s\n' 'Accepted=true'
          printf '%s\n' ''
          printf '%s\n' '[Preferences]'
          printf '%s\n' "WebUI\\Username=$$QBIT_WEBUI_USER"
          printf '%s\n' "WebUI\\Password_PBKDF2=\"$$QBIT_WEBUI_PASSWORD_PBKDF2\""
          # Host-header validation 401s any Host whose PORT differs from the
          # listen port (found by the media suite: rejects both the :10057
          # publish and Caddy's vhost, nothing in the logs). DNS-rebinding
          # defense, moot here: loopback-bound, Caddy is the only path in.
          printf '%s\n' 'WebUI\HostHeaderValidation=false'
          # Lets gluetun's port-forward UP_COMMAND post the listen port
          # without credentials (same netns = localhost).
          printf '%s\n' 'WebUI\LocalHostAuth=false'
          printf '%s\n' 'WebUI\Port=8080'
        } > "$$conf.tmp"
        mv "$$conf.tmp" "$$conf"
        chown -R 1000:1000 /config
        echo "qbit-init: seeded $$conf"
    volumes:
      - /mnt/fast/qbittorrent/config:/config
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    restart: "no"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    # Shares gluetun's netns: no ports or DNS of its own, ZERO egress when
    # the tunnel is down (gluetun's firewall default-drops from process
    # start). The arrs reach it at http://gluetun:8080.
    network_mode: 'service:gluetun'
    depends_on:
      gluetun:
        # restart: true is load-bearing: a gluetun restart re-creates the
        # netns; without it qbit keeps a dead namespace.
        condition: service_healthy
        restart: true
      qbit-init:
        condition: service_completed_successfully
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8080
    volumes:
      - /mnt/fast/qbittorrent/config:/config
      - /mnt/slow/data/downloads:/data/downloads
    healthcheck:
      # Deliberately NOT a connectivity check — tunnel state is gluetun's job.
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jellyfin
  # ---------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    ports:
      - '127.0.0.1:10050:8096'
    volumes:
      - /mnt/fast/jellyfin/config:/config
      - /mnt/fast/jellyfin/cache:/cache
      - /mnt/slow/data/media:/data/media:ro
      # GPU passthrough, GUARDED to degrade in VMs: a `devices:` stanza
      # hard-fails creation when the node is absent, so the render node rides
      # a bind mount (docker makes an empty dir if /dev/dri is missing) plus
      # the cgroup rule below (valid either way). No /dev/dri -> software
      # transcode, container still starts. The media suite asserts the stanza
      # EXISTS; HW transcode is untestable in a VM (annex §8.18).
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      # 226 = DRM major (card*/renderD*): rmw so VA-API can open the render
      # node through the bind mount above.
      - 'c 226:* rmw'
    environment:
      - TZ=America/Chicago
      - JELLYFIN_PublishedServerUrl=https://jellyfin.svc.idanreed.com
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8096/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # The arrs. API keys arrive via the Servarr {APP}__AUTH__APIKEY overrides
  # from .env — pushed down, never scraped up, so every consumer knows them a
  # priori. AUTH__METHOD=External: Caddy's forward auth (Authentik) is the
  # login in front; the API still requires the key.
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    ports:
      - '127.0.0.1:10051:7878'
    volumes:
      - /mnt/fast/radarr/config:/config
      # Whole /data on purpose: downloads AND library on one mount = hardlink
      # imports, not copies.
      - /mnt/slow/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=Enabled
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7878/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    ports:
      - '127.0.0.1:10052:8989'
    volumes:
      - /mnt/fast/sonarr/config:/config
      - /mnt/slow/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - SONARR__AUTH__METHOD=External
      - SONARR__AUTH__REQUIRED=Enabled
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8989/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  prowlarr:
    # NOT behind gluetun on purpose: indexers dialled through VPN exit IPs
    # attract Cloudflare blocks.
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    ports:
      - '127.0.0.1:10053:9696'
    volumes:
      - /mnt/fast/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PROWLARR__AUTH__METHOD=External
      - PROWLARR__AUTH__REQUIRED=Enabled
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9696/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Seerr — request UI. Stable tag + Jellyfin-account auth (locked decision,
  # see header). First-run setup is a UI step; headless settings.json seeding
  # is an open annex question (§6).
  # ---------------------------------------------------------------------------
  # Seerr runs as USER node (uid 1000) and cannot chown its own config dir;
  # docker creates bind-mount sources root-owned, so without this oneshot
  # seerr crash-loops on EACCES mkdir /app/config/logs on ANY first deploy
  # (found by the media suite, not just a test artifact).
  seerr-init:
    image: alpine:3.21
    container_name: media_seerr_init
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown -R 1000:1000 /config
        echo "seerr-init: /config owned 1000:1000"
    volumes:
      - /mnt/fast/seerr/config:/config
    restart: "no"

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    depends_on:
      seerr-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10054:5055'
    volumes:
      - /mnt/fast/seerr/config:/app/config
    environment:
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5055/api/v1/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Bazarr — subtitles. Arr connections seeded on first login for now (annex
  # §6: which of config.yaml/config.ini Bazarr 1.6 reads is UNCERTAIN —
  # verify before scripting it into media-init).
  # ---------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    ports:
      - '127.0.0.1:10055:6767'
    volumes:
      - /mnt/fast/bazarr/config:/config
      - /mnt/slow/data/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6767 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profilarr — syncs Dictionarry (ONLY Dictionarry — see header) profiles
  # and custom formats into Radarr/Sonarr. The parser sidecar is deliberately
  # absent (CF-testing only, per upstream README).
  # ---------------------------------------------------------------------------
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0
    container_name: profilarr
    ports:
      - '127.0.0.1:10056:6868'
    volumes:
      - /mnt/fast/profilarr/config:/config
    environment:
      - TZ=America/Chicago
      - AUTH=on
      # PROFILARR_API_KEY (>=32 chars) arrives from .env below.
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Toolset not pinned down (python base): try curl, wget, then python.
      # Any 2xx/3xx on the SPA root is up.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:6868/ >/dev/null 2>&1
          || wget -q -O /dev/null http://localhost:6868/ 2>/dev/null
          || python3 -c "import urllib.request;urllib.request.urlopen('http://localhost:6868/',timeout=5)"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Cleanuparr — strike system for stalled/failed queue items + pre-download
  # malware blocker. v2 is configured through its web UI into /config, NOT
  # env vars (annex §0.2); point the malware blocker at a LOCAL blocklist
  # under /config so it works offline.
  # ---------------------------------------------------------------------------
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.5
    container_name: cleanuparr
    ports:
      - '127.0.0.1:10058:11011'
    volumes:
      - /mnt/fast/cleanuparr/config:/config
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:11011/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClamAV — clamd on the stack-internal network (:3310, never published).
  # Post-download scanning; Cleanuparr is the pre-download layer, and the two
  # meet indirectly: a quarantined payload fails arr import, Cleanuparr
  # strikes it out and blocklists the release. No custom glue (annex §5).
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.5
    container_name: clamav
    volumes:
      # freshclam state — the plain tag ships a database (the _base variant
      # does not, hence the pin); freshclam updates it when egress exists.
      - /mnt/fast/clamav/db:/var/lib/clamav
      # Read-only: clamd only reads scan targets. Same path the scanner sees,
      # so path-based clamdscan requests resolve.
      - /mnt/slow/data/downloads:/data/downloads:ro
    healthcheck:
      # PING/PONG over clamd's TCP socket (busybox nc is in the image) — no
      # dependence on helper-script paths.
      test: ['CMD-SHELL', 'echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG']
      interval: 60s
      timeout: 10s
      retries: 5
      # DB load into memory takes a while on first start.
      start_period: 300s
    restart: unless-stopped

  # Poll-watcher (annex §5): scans completed downloads via clamd-over-TCP,
  # quarantines infected files, pings ntfy. A SECOND container from the same
  # pinned image — keeps the scan loop out of qbit's gluetun-firewalled netns
  # (no FIREWALL_OUTBOUND_SUBNETS widening), and clamdscan ships in the image
  # (no apk at boot, finding #4).
  clamav-scanner:
    image: clamav/clamav:1.5
    container_name: clamav_scanner
    entrypoint: ['/bin/sh', '/scan/scan-downloads.sh']
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      - NTFY_URL=http://ntfy/media
      - SCAN_INTERVAL_SECONDS=60
      - AUDIOBOOK_DROP_DIR=/drop
    volumes:
      - ./scan-downloads.sh:/scan/scan-downloads.sh:ro
      # The WHOLE /data tree, read-write — BOTH halves load-bearing:
      #   - write: quarantining is not a rename. /mnt/slow is one filesystem
      #     (hardlink imports), so `mv` into .quarantine leaves the inode and
      #     every *arr hardlink in /data/media still resolves to the infected
      #     content — the scanner unlinks those itself.
      #   - /data, not /data/downloads: those links live in /data/media and a
      #     container cannot unlink what it cannot see.
      # clamd's own mount stays narrow and read-only (see the clamav service).
      - /mnt/slow/data:/data
      # The books stack's drop directory — the ONE thing the two stacks share
      # (Option C, ServerNotes/designs/audiobook-acquisition.md). Clean
      # `audiobooks` entries are moved in after their verdict; audiobookshelf
      # reads it read-only. No network path between the stacks, and the books
      # stack never sees the download tree.
      - /mnt/slow/books/drop:/drop
      - /mnt/fast/clamav/scanner:/state
    networks:
      # default for clamd, homelab for ntfy (containers cannot reach the
      # loopback-bound host port — same reason backrest/ntfy share it).
      - default
      - homelab
    healthcheck:
      # MUST override the inherited healthcheck: it probes a LOCAL clamd this
      # container deliberately does not run — permanently unhealthy, fails
      # any `up --wait`. Healthy = the path the loop depends on: clamd over
      # TCP in the clamav service.
      test: ['CMD-SHELL', 'echo PING | nc -w 5 clamav 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # media-init — idempotent oneshot reconciler (nixflix pattern, annex §6):
  # /data skeleton, root folders, qbit download client, the `audiobooks` qbit
  # category, TRaSH naming (codec tokens = on-disk x265 audit trail),
  # Prowlarr -> arr push-sync, Dictionarry link into Profilarr, x265 scoring
  # guard. Redeploy-safe: second run logs zero CHANGE lines (the suite greps
  # for exactly that).
  #
  # python3-alpine rather than curl+jq: no official image ships both, apk at
  # container start is banned (finding #4 — registry outage = stack outage,
  # offline suite could never pass), and the merges need real JSON anyway.
  # ---------------------------------------------------------------------------
  media-init:
    image: python:3.13-alpine
    container_name: media_init
    entrypoint: ['/bin/sh', '/init/media-init.sh']
    depends_on:
      # Deliberately NOT gluetun/qbittorrent: tunnel down = gluetun never
      # healthy = qbit never starts, and media-init must still reconcile the
      # rest. The download-client POST is the one step that needs qbit
      # (forceSave=true does not override severity:error connection failures);
      # media-init retries ~2min, then degrades to a loud WARN the next run
      # (any redeploy) reconciles.
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      profilarr:
        condition: service_healthy
    volumes:
      - ./media-init.sh:/init/media-init.sh:ro
      # For the /data skeleton (mkdir + chown 1000:1000).
      - /mnt/slow/data:/data
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    restart: "no"

networks:
  homelab:
    external: true
