# Media stack — Jellyfin + *arr suite + qBittorrent-behind-Gluetun + ClamAV +
# Cleanuparr. Design: ServerNotes/designs/service-media-stack.md, updated by
# the research annex service-media-stack-research.md (the annex wins where
# they disagree — ports come from _overview.md, which is authoritative).
#
# LOCKED DECISIONS (recorded in LONGRUN.md — do not revisit here):
#   - x265/H265 is ENFORCED. Quality profiles come from Profilarr syncing the
#     Dictionarry database ONLY ('1080p Efficient' default, '2160p Efficient'
#     for 4K). Never link trash-pcd — it reintroduces TRaSH's x264 bias
#     (their "golden rule" scores the 'x265 (HD)' custom format at -10000).
#     media-init.sh additionally zeroes any negative x265/HEVC score it finds.
#   - Gluetun is fully PROVIDER-AGNOSTIC: this file hardcodes nothing about
#     any VPN provider. Provider choice, credentials, server selection and
#     port-forwarding on/off all flow from .sops.env — gluetun receives the
#     whole decrypted .env, so any gluetun variable can be added there without
#     touching this file (add it to .sops.env.example and the test fixture
#     too: the stack-env-drift lint keeps the three key sets identical).
#   - DEFERRED services and the cost of deferring them:
#       flaresolverr — some Cloudflare-protected indexers will not resolve in
#                      Prowlarr until it exists;
#       unpackerr    — RAR'd releases will not import (mitigate by preferring
#                      non-scene releases);
#       qbit_manage  — no automated orphan/share-limit/tag hygiene yet
#                      (_overview.md keeps its row for the follow-up).
#   - Seerr stays on stable v3.4.1 with Jellyfin-account auth. The
#     preview-new-oidc tag lacks the CVE-2026-40175 patch from v3.1.1 —
#     security call, re-evaluate when OIDC lands in a stable tag. Seerr is
#     session-authed (NOT forward-authed): its mobile/API clients
#     authenticate themselves.
#
# Layout (hardlink requirement — ONE filesystem, /mnt/slow):
#   /mnt/slow/data/downloads/{movies,tv}   qBittorrent categories
#   /mnt/slow/data/downloads/.incomplete   qBittorrent temp path
#   /mnt/slow/data/downloads/.quarantine   ClamAV quarantine (scan-downloads.sh)
#   /mnt/slow/data/media/{movies,tv}       Radarr/Sonarr roots, Jellyfin libraries
# media-init creates this skeleton (owned 1000:1000) on first run.
#
# Wiring (headless, no UI clicks — nixflix pattern): all API keys are
# pre-determined secrets pushed DOWN via the Servarr {APP}__AUTH__APIKEY env
# overrides; media-init.sh (oneshot) reconciles the rest over REST. Its log is
# the audit trail — "CHANGE:" lines on first run, zero on the second.
#
# Ports 10050-10058 per _overview.md, all loopback-bound (Caddy on the host
# network is the only path in). qBittorrent publishes NOTHING itself: its UI
# rides gluetun's 127.0.0.1:10057 publish (network_mode: service:gluetun).

services:
  # ---------------------------------------------------------------------------
  # Gluetun — VPN netns + kill-switch for qBittorrent
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # qBittorrent's WebUI, published from the shared netns. Loopback-bound like
    # every other stack port; the kill-switch never applies to this path
    # (docker's DNAT + gluetun's FIREWALL_INPUT_PORTS below).
    ports:
      - '127.0.0.1:10057:8080'
    volumes:
      - /mnt/fast/gluetun:/gluetun
    environment:
      - TZ=America/Chicago
      # The qbit WebUI port inside the netns — without this gluetun's firewall
      # drops the published-port traffic and the UI is dead even on loopback.
      - FIREWALL_INPUT_PORTS=8080
      # Provider-agnostic port-forwarding hook: only runs when the .env sets
      # VPN_PORT_FORWARDING=on (provider must support it). Posts the forwarded
      # port straight into qbit's API; needs WebUI\LocalHostAuth=false, which
      # qbit-init seeds. {{PORTS}} is gluetun's placeholder (v3.39+); the old
      # /tmp/gluetun/forwarded_port file polling is deprecated.
      - 'VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c ''wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'''
      # Everything provider-specific (VPN_SERVICE_PROVIDER, VPN_TYPE,
      # credentials, server selection, VPN_PORT_FORWARDING) comes from .env.
    # Long form with required:false ON PURPOSE (finding #11): Arcane's
    # gitops sync VALIDATES the compose in a staging directory before copying,
    # where the host-side decrypted .env cannot exist yet — a plain
    # `env_file: .env` fails that validation and the sync of the whole stack
    # aborts. required:false passes staging; at deploy time the project dir
    # has the real .env (decrypt timer, ≤~1min after delivery). Residual
    # window: a deploy racing the first decrypt starts with unset vars — the
    # loud guard is each service's own healthcheck/startup failure.
    env_file:
      - path: .env
        required: false
    # Healthcheck: the image's own (dials through the tunnel). While the VPN is
    # unreachable gluetun stays UNHEALTHY with the firewall UP — that is the
    # offline-testable kill-switch condition the media suite asserts.
    restart: unless-stopped

  # Seeds qBittorrent.conf ONCE, before qbit's first start — the LSIO image
  # otherwise prints a random temporary password on every start and there is
  # no env override for WebUI credentials. qBittorrent owns the file
  # afterwards (it rewrites it on shutdown); to re-seed, delete it.
  qbit-init:
    image: alpine:3.21
    container_name: media_qbit_init
    entrypoint:
      - /bin/sh
      - -ec
      # $$ everywhere: compose would otherwise interpolate at parse time.
      - |
        conf_dir=/config/qBittorrent
        conf="$$conf_dir/qBittorrent.conf"
        if [ -f "$$conf" ]; then
          echo "qbit-init: $$conf exists — qBittorrent owns it, not touching"
          exit 0
        fi
        # Hard error on unset/empty, like backrest's config-init: an empty
        # PBKDF2 hash would seed a WebUI nobody can ever log in to.
        [ -n "$${QBIT_WEBUI_USER:-}" ] || { echo "qbit-init: FATAL: QBIT_WEBUI_USER unset (decrypt race? finding #11)" >&2; exit 1; }
        [ -n "$${QBIT_WEBUI_PASSWORD_PBKDF2:-}" ] || { echo "qbit-init: FATAL: QBIT_WEBUI_PASSWORD_PBKDF2 unset" >&2; exit 1; }
        mkdir -p "$$conf_dir"
        {
          printf '%s\n' '[AutoRun]'
          printf '%s\n' 'enabled=false'
          printf '%s\n' ''
          printf '%s\n' '[BitTorrent]'
          printf '%s\n' 'Session\DefaultSavePath=/data/downloads'
          printf '%s\n' 'Session\TempPath=/data/downloads/.incomplete'
          printf '%s\n' 'Session\TempPathEnabled=true'
          printf '%s\n' ''
          printf '%s\n' '[LegalNotice]'
          printf '%s\n' 'Accepted=true'
          printf '%s\n' ''
          printf '%s\n' '[Preferences]'
          printf '%s\n' "WebUI\\Username=$$QBIT_WEBUI_USER"
          printf '%s\n' "WebUI\\Password_PBKDF2=\"$$QBIT_WEBUI_PASSWORD_PBKDF2\""
          # qBittorrent's host-header validation 401s any Host whose PORT
          # differs from its own listen port (found by the media suite: it
          # rejects both the 127.0.0.1:10057 publish and Caddy's
          # qbit.svc.idanreed.com vhost — production access would be dead,
          # with nothing in the logs). It is a DNS-rebinding defense, moot
          # here: the UI is loopback-bound and Caddy is the only path in.
          printf '%s\n' 'WebUI\HostHeaderValidation=false'
          # Localhost bypass is what lets gluetun's port-forward UP_COMMAND
          # post the listen port without credentials (same netns = localhost).
          printf '%s\n' 'WebUI\LocalHostAuth=false'
          printf '%s\n' 'WebUI\Port=8080'
        } > "$$conf"
        chown -R 1000:1000 /config
        echo "qbit-init: seeded $$conf"
    volumes:
      - /mnt/fast/qbittorrent/config:/config
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    restart: "no"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3
    container_name: qbittorrent
    # Shares gluetun's network namespace: no ports of its own, no DNS of its
    # own (gluetun's DNS-over-TLS through the tunnel), and ZERO egress when
    # the tunnel is down — gluetun's firewall default-drops from process
    # start. The arrs reach it at http://gluetun:8080 (compose DNS name).
    network_mode: 'service:gluetun'
    depends_on:
      gluetun:
        # restart: true is load-bearing: a gluetun restart re-creates the
        # netns, and without it qbit keeps a dead namespace (classic failure
        # mode — no network until someone notices).
        condition: service_healthy
        restart: true
      qbit-init:
        condition: service_completed_successfully
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - WEBUI_PORT=8080
    volumes:
      - /mnt/fast/qbittorrent/config:/config
      - /mnt/slow/data/downloads:/data/downloads
    healthcheck:
      # The WebUI answering on the shared netns' loopback. Deliberately NOT a
      # connectivity check — tunnel state is gluetun's healthcheck's job.
      test: ['CMD-SHELL', 'curl -sf http://localhost:8080 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Jellyfin
  # ---------------------------------------------------------------------------
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    ports:
      - '127.0.0.1:10050:8096'
    volumes:
      - /mnt/fast/jellyfin/config:/config
      - /mnt/fast/jellyfin/cache:/cache
      - /mnt/slow/data/media:/data/media:ro
      # GPU passthrough, GUARDED so it degrades in VMs: a `devices:` stanza
      # hard-fails container creation when the node is absent, so the Arc
      # A380's render node rides a bind mount (docker creates an empty dir if
      # /dev/dri is missing) plus the cgroup rule below, which is valid
      # whether or not the device exists. No /dev/dri -> software transcode,
      # container still starts. The media suite asserts this stanza EXISTS
      # (drift guard); actual HW transcode is untestable in a VM — documented
      # in the research annex (§8.18).
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      # 226 = DRM major (card*/renderD*): allow read/write/mknod so VA-API
      # can open the render node through the bind mount above.
      - 'c 226:* rmw'
    environment:
      - TZ=America/Chicago
      - JELLYFIN_PublishedServerUrl=https://jellyfin.svc.idanreed.com
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8096/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # The arrs. API keys arrive via the Servarr {APP}__AUTH__APIKEY env
  # overrides from .env — pushed down, never scraped up, so every consumer
  # (media-init, Prowlarr, the future suite) knows them a priori.
  # AUTH__METHOD=External because Caddy's forward auth (Authentik) is the
  # login in front of these; the API still requires the key.
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0
    container_name: radarr
    ports:
      - '127.0.0.1:10051:7878'
    volumes:
      - /mnt/fast/radarr/config:/config
      # Whole /data on purpose: downloads AND library on one mount is what
      # makes imports hardlinks instead of copies.
      - /mnt/slow/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - RADARR__AUTH__METHOD=External
      - RADARR__AUTH__REQUIRED=Enabled
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:7878/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19
    container_name: sonarr
    ports:
      - '127.0.0.1:10052:8989'
    volumes:
      - /mnt/fast/sonarr/config:/config
      - /mnt/slow/data:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - SONARR__AUTH__METHOD=External
      - SONARR__AUTH__REQUIRED=Enabled
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:8989/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  prowlarr:
    # NOT behind gluetun on purpose (nixflix's default, citing TRaSH):
    # indexers dialled through VPN exit IPs attract Cloudflare blocks.
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    ports:
      - '127.0.0.1:10053:9696'
    volumes:
      - /mnt/fast/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - PROWLARR__AUTH__METHOD=External
      - PROWLARR__AUTH__REQUIRED=Enabled
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9696/ping >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Seerr — request UI. Stable tag + Jellyfin-account auth (locked decision,
  # see header). First-run setup (Jellyfin + arr connections) is currently a
  # UI step; headless settings.json seeding is an open annex question (§6).
  # ---------------------------------------------------------------------------
  # Seerr's image runs as USER node (uid 1000) and cannot chown its own
  # config dir — unlike the LSIO images (PUID entrypoint runs as root) and
  # jellyfin (runs as root). docker creates bind-mount sources root-owned, so
  # without this oneshot seerr crash-loops on EACCES mkdir /app/config/logs
  # on ANY first deploy (found by the media suite, not just a test artifact).
  seerr-init:
    image: alpine:3.21
    container_name: media_seerr_init
    entrypoint:
      - /bin/sh
      - -ec
      - |
        chown -R 1000:1000 /config
        echo "seerr-init: /config owned 1000:1000"
    volumes:
      - /mnt/fast/seerr/config:/config
    restart: "no"

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    depends_on:
      seerr-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10054:5055'
    volumes:
      - /mnt/fast/seerr/config:/app/config
    environment:
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:5055/api/v1/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Bazarr — subtitles. Arr connections are seeded via its config file/API on
  # first login for now (annex §6: which of config.yaml/config.ini Bazarr 1.6
  # reads is UNCERTAIN — verify before scripting it into media-init).
  # ---------------------------------------------------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    ports:
      - '127.0.0.1:10055:6767'
    volumes:
      - /mnt/fast/bazarr/config:/config
      - /mnt/slow/data/media:/data/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:6767 >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Profilarr — syncs Dictionarry (ONLY Dictionarry — see header) profiles
  # and custom formats into Radarr/Sonarr. The parser sidecar is deliberately
  # absent (CF-testing only, per upstream README).
  # ---------------------------------------------------------------------------
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:2.2.0
    container_name: profilarr
    ports:
      - '127.0.0.1:10056:6868'
    volumes:
      - /mnt/fast/profilarr/config:/config
    environment:
      - TZ=America/Chicago
      - AUTH=on
      # PROFILARR_API_KEY (>=32 chars) arrives from .env below.
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # The image's toolset is not pinned down (python base): try curl, then
      # busybox wget, then python itself. Any 2xx/3xx on the SPA root is up.
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:6868/ >/dev/null 2>&1
          || wget -q -O /dev/null http://localhost:6868/ 2>/dev/null
          || python3 -c "import urllib.request;urllib.request.urlopen('http://localhost:6868/',timeout=5)"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Cleanuparr — strike system for stalled/failed queue items and the
  # pre-download malware blocker. v2 is configured through its web UI into
  # /config (EF-Core/SQLite), NOT env vars (annex §0.2); point the malware
  # blocker at a LOCAL blocklist file under /config so it works offline.
  # ---------------------------------------------------------------------------
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.5
    container_name: cleanuparr
    ports:
      - '127.0.0.1:10058:11011'
    volumes:
      - /mnt/fast/cleanuparr/config:/config
    environment:
      - PORT=11011
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:11011/health >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClamAV — clamd on the stack-internal network (:3310, never published).
  # Post-download content scanning; Cleanuparr's malware blocker is the
  # pre-download pattern layer, and the two meet indirectly: a quarantined
  # payload fails arr import, Cleanuparr strikes it out and blocklists the
  # release. No custom glue needed (annex §5).
  # ---------------------------------------------------------------------------
  clamav:
    image: clamav/clamav:1.5
    container_name: clamav
    volumes:
      # freshclam state — the image ships a database (the _base variant does
      # not, which is why the plain tag is pinned), freshclam updates it when
      # egress exists.
      - /mnt/fast/clamav/db:/var/lib/clamav
      # Read-only: clamd only ever reads scan targets. Same path as qbit and
      # the scanner see, so path-based clamdscan requests resolve.
      - /mnt/slow/data/downloads:/data/downloads:ro
    healthcheck:
      # Self-contained PING/PONG over clamd's TCP socket (busybox nc is in the
      # alpine-based image) — no dependence on helper-script paths.
      test: ['CMD-SHELL', 'echo PING | nc -w 5 127.0.0.1 3310 | grep -q PONG']
      interval: 60s
      timeout: 10s
      retries: 5
      # DB load into memory takes a while on first start.
      start_period: 300s
    restart: unless-stopped

  # Poll-watcher (annex §5 recommended shape): scans completed downloads via
  # clamd-over-TCP, moves infected files to .quarantine/, pings ntfy. Runs in
  # a SECOND container from the same pinned image — the scan loop stays out
  # of qbit's gluetun-firewalled netns, so no FIREWALL_OUTBOUND_SUBNETS
  # widening, and clamdscan ships in the image (no apk at boot, finding #4).
  clamav-scanner:
    image: clamav/clamav:1.5
    container_name: clamav_scanner
    entrypoint: ['/bin/sh', '/scan/scan-downloads.sh']
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      - NTFY_URL=http://ntfy/media
      - SCAN_INTERVAL_SECONDS=60
    volumes:
      - ./scan-downloads.sh:/scan/scan-downloads.sh:ro
      # Read-write: quarantining is a rename into .quarantine/.
      - /mnt/slow/data/downloads:/data/downloads
      - /mnt/fast/clamav/scanner:/state
    networks:
      # default for clamd, homelab for ntfy (containers cannot reach the
      # loopback-bound host port — same reason backrest/ntfy share it).
      - default
      - homelab
    healthcheck:
      # MUST override the image's inherited healthcheck: it probes a LOCAL
      # clamd, which this container deliberately does not run, so the scanner
      # would sit permanently unhealthy (and fail any `up --wait`). Healthy
      # here means the path the scan loop actually depends on: clamd over TCP
      # in the clamav service.
      test: ['CMD-SHELL', 'echo PING | nc -w 5 clamav 3310 | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # media-init — idempotent oneshot reconciler (nixflix pattern, annex §6):
  # /data skeleton, root folders, qbit download client (host gluetun:8080),
  # TRaSH naming (codec tokens kept — the on-disk x265 audit trail), Prowlarr
  # -> arr application push-sync, Dictionarry link into Profilarr, and the
  # x265 scoring guard. Safe under Arcane redeploys: second run logs zero
  # CHANGE lines (the suite greps for exactly that).
  #
  # python3-alpine rather than curl+jq: no official image ships both, apk at
  # container start is banned (finding #4 — registry outage = stack outage,
  # and the offline suite could never pass), and the naming/profile merges
  # need real JSON manipulation anyway.
  # ---------------------------------------------------------------------------
  media-init:
    image: python:3.13-alpine
    container_name: media_init
    entrypoint: ['/bin/sh', '/init/media-init.sh']
    depends_on:
      # Deliberately NOT gluetun/qbittorrent: with the tunnel down gluetun
      # never turns healthy and qbittorrent never starts, and media-init must
      # still reconcile everything else. The download-client POST is the one
      # step that needs qbit answering (the arrs' connection test runs even
      # with forceSave=true — severity:error failures are not overridable);
      # media-init retries it for ~2min, then degrades to a loud WARN that
      # the next run (any Arcane redeploy) reconciles.
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
      profilarr:
        condition: service_healthy
    volumes:
      - ./media-init.sh:/init/media-init.sh:ro
      # For the /data skeleton (mkdir + chown 1000:1000).
      - /mnt/slow/data:/data
    # Long form with required:false ON PURPOSE (finding #11): see gluetun.
    env_file:
      - path: .env
        required: false
    restart: "no"

networks:
  homelab:
    external: true
