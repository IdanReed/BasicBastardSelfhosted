services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20
    container_name: paperless
    depends_on:
      - redis
      - db
      - tika
      - gotenberg
    # Bound to loopback so Caddy (network_mode: host) is the only path in.
    # On 0.0.0.0 this was directly reachable from the tailnet, bypassing any
    # reverse-proxy auth.
    ports:
      - '127.0.0.1:10100:8000'
    volumes:
      - /mnt/fast/paperless/data:/usr/src/paperless/data
      - /mnt/fast/paperless/media:/usr/src/paperless/media
      - /mnt/fast/paperless/consume:/usr/src/paperless/consume
      - /mnt/fast/paperless/export:/usr/src/paperless/export
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS=paperless
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIME_ZONE=America/Chicago
      - PAPERLESS_OCR_LANGUAGE=eng
      - USERMAP_UID=1000
      - USERMAP_GID=1000
    # Long form with required:false ON PURPOSE (finding #11): Arcane's
    # gitops sync VALIDATES the compose in a staging directory before copying,
    # where the host-side decrypted .env cannot exist yet — a plain
    # `env_file: .env` fails that validation and the sync of the whole stack
    # aborts. required:false passes staging; at deploy time the project dir
    # has the real .env (decrypt timer, ≤~1min after delivery). Residual
    # window: a deploy racing the first decrypt starts with unset vars — the
    # loud guard is each service's own healthcheck/startup failure.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine
    container_name: paperless_db
    volumes:
      - /mnt/fast/paperless/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD=paperless
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: paperless_redis
    volumes:
      - paperless_redisdata:/data
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.0.0
    container_name: paperless_tika
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.31
    container_name: paperless_gotenberg
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    restart: unless-stopped

volumes:
  paperless_redisdata:
