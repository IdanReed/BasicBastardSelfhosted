services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20
    container_name: paperless
    depends_on:
      - redis
      - db
      - tika
      - gotenberg
    # Loopback: Caddy (host network) is the only path in — on 0.0.0.0 this
    # was reachable from the tailnet, bypassing reverse-proxy auth.
    ports:
      - '127.0.0.1:10100:8000'
    volumes:
      - /mnt/fast/paperless/data:/usr/src/paperless/data
      - /mnt/fast/paperless/media:/usr/src/paperless/media
      - /mnt/fast/paperless/consume:/usr/src/paperless/consume
      - /mnt/fast/paperless/export:/usr/src/paperless/export
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBUSER=paperless
      # PAPERLESS_SECRET_KEY, PAPERLESS_ADMIN_USER, PAPERLESS_ADMIN_PASSWORD
      # and PAPERLESS_DBPASS arrive from .env (DBPASS was a committed literal
      # `paperless` until 2026-08-31 — see the db service's initdb note).
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIME_ZONE=America/Chicago
      - PAPERLESS_OCR_LANGUAGE=eng
      # Feeds CSRF_TRUSTED_ORIGINS / ALLOWED_HOSTS / CORS. Without it Django
      # 403s every POST through the https vhost — login form included, and
      # that login IS the auth here. The suite can't see the break: it probes
      # loopback, where the Origin matches.
      - PAPERLESS_URL=https://paperless.svc.idanreed.com
      # OIDC — ENABLED (fleet rollout 2026-09-05, paperless-oidc.yaml blueprint)
      # via django-allauth's openid_connect provider. Lazy discovery (first
      # login), so no boot hazard; the local PAPERLESS_ADMIN_USER superuser
      # stays as break-glass. ${PAPERLESS_OIDC_CLIENT_SECRET} is interpolated by
      # compose from .env at parse time. provider_id "authentik" fixes the
      # callback path /accounts/oidc/authentik/login/callback/ (must match the
      # blueprint redirect_uri). Do NOT set PAPERLESS_DISABLE_REGULAR_LOGIN or
      # PAPERLESS_REDIRECT_LOGIN_TO_SSO until a first SSO login is verified.
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - 'PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"paperless","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://auth.idanreed.com/application/o/paperless/.well-known/openid-configuration"}}]}}'
      # Auto-provision SSO users (allauth SOCIALACCOUNT_AUTO_SIGNUP); accounts
      # link by email and land as regular (non-staff) users — grant admin in
      # /admin if needed. Local self-registration stays closed.
      - PAPERLESS_SOCIAL_AUTO_SIGNUP=true
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      # PAPERLESS_OIDC_CLIENT_SECRET arrives from .env.
      - USERMAP_UID=1000
      - USERMAP_GID=1000
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine
    container_name: paperless_db
    volumes:
      - /mnt/fast/paperless/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      # POSTGRES_PASSWORD arrives from .env and must equal PAPERLESS_DBPASS.
      #
      # 🚨 initdb applies it on FIRST start only. A cluster already
      # initialised with the old hardcoded `paperless` keeps that password
      # forever no matter what this file says — see .sops.env.example for the
      # ALTER USER one-liner.
    # Same long form and same reason as the app service above (finding #11):
    # this stack's secrets are one .env shared by both containers, so the db
    # needs the env_file it never had.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: paperless_redis
    volumes:
      - paperless_redisdata:/data
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.0.0
    container_name: paperless_tika
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.31
    container_name: paperless_gotenberg
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    restart: unless-stopped

volumes:
  paperless_redisdata:
