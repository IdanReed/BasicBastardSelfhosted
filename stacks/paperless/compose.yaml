# Paperless-ngx — document management (10100).
# docs/services.md owns the port/auth row.

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.20
    container_name: paperless
    depends_on:
      - redis
      - db
      - tika
      - gotenberg
    ports:
      - '127.0.0.1:10100:8000'
    volumes:
      - /mnt/fast/paperless/data:/usr/src/paperless/data
      - /mnt/fast/paperless/media:/usr/src/paperless/media
      - /mnt/fast/paperless/consume:/usr/src/paperless/consume
      - /mnt/fast/paperless/export:/usr/src/paperless/export
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBENGINE=postgresql
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBUSER=paperless
      # PAPERLESS_SECRET_KEY, PAPERLESS_ADMIN_USER/_PASSWORD and PAPERLESS_DBPASS
      # arrive from the stack env.
      - PAPERLESS_TIKA_ENABLED=1
      - PAPERLESS_TIKA_GOTENBERG_ENDPOINT=http://gotenberg:3000
      - PAPERLESS_TIKA_ENDPOINT=http://tika:9998
      - PAPERLESS_TIME_ZONE=America/Chicago
      - PAPERLESS_OCR_LANGUAGE=eng
      # Feeds CSRF_TRUSTED_ORIGINS / ALLOWED_HOSTS / CORS. Without it Django 403s
      # every POST through the https vhost, login included — and the suite cannot
      # see it, because it probes loopback where the Origin matches.
      - PAPERLESS_URL=https://paperless.svc.idanreed.com
      # OIDC
      # django-allauth, lazy discovery (first login), so no boot hazard; the
      # local PAPERLESS_ADMIN_USER superuser stays as break-glass. provider_id
      # "authentik" fixes the callback path the blueprint registers. Do NOT set
      # PAPERLESS_DISABLE_REGULAR_LOGIN or _REDIRECT_LOGIN_TO_SSO until a first
      # SSO login is verified.
      - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
      - 'PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"paperless","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://auth.idanreed.com/application/o/paperless/.well-known/openid-configuration"}}]}}'
      # SSO users are auto-provisioned and linked by email, landing as regular
      # (non-staff) users; local self-registration stays closed.
      - PAPERLESS_SOCIAL_AUTO_SIGNUP=true
      - PAPERLESS_ACCOUNT_ALLOW_SIGNUPS=false
      - USERMAP_UID=1000
      - USERMAP_GID=1000
    env_file: /run/stack-env/paperless.env
    restart: unless-stopped

  db:
    image: postgres:17.9-alpine
    container_name: paperless_db
    volumes:
      - /mnt/fast/paperless/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER=paperless
      # POSTGRES_PASSWORD arrives from the stack env and must equal PAPERLESS_DBPASS.
      # 🚨 initdb applies it on FIRST start only — an already-initialised
      # cluster keeps its old password whatever this file says (secrets.example.env
      # has the ALTER USER one-liner).
    env_file: /run/stack-env/paperless.env
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: paperless_redis
    volumes:
      - paperless_redisdata:/data
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.0.0
    container_name: paperless_tika
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.31
    container_name: paperless_gotenberg
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    restart: unless-stopped

volumes:
  paperless_redisdata:
