# Windmill — workflow orchestration (10253).
# Design: ServerNotes/designs/service-notes-sync-stack-research.md (the annex,
# §3.4/§4.4/§7.4) and custom-finance.md.
#
# 🚨 THE WORKER'S CACHE VOLUME IS THE THING MOST LIKELY TO BE "FIXED"
# INCORRECTLY. It is a NAMED volume deliberately: the image bakes CPython into
# /tmp/windmill/cache/py_runtime at build time, a named volume is seeded from the
# image on first use, and a bind mount is never seeded and shadows it empty. With
# UV_PYTHON_PREFERENCE=only-managed there is no system-python fallback, so the
# first Python job would `uv python install` (needs egress) and hang.
#
# Backup: backup-prepare.sh's pg_dumpall loop derives `<svc>_db` and
# `pg_dumpall -U <svc>`, so `container_name: windmill_db` and
# POSTGRES_USER=windmill are load-bearing, and `windmill` must be in that loop's
# service list. The dependency cache lives under /var/lib/docker, outside every
# include set — correct, it is regenerable.

services:
  # Server
  # 1000:1000 with HOME=/tmp, both required together: the image creates a
  # uid-1000 user and never USERs to it, so without this it executes arbitrary
  # user scripts as ROOT — with docker client, crane, nsjail and kubectl on $PATH.
  windmill_server:
    # No `v` prefix. 🚨 `latest` is the MAIN BRANCH BUILD, not the newest
    # release, and `1.798` is a moving minor alias — pin all three parts.
    # 1.798.1 is the newest PUBLISHED image (GitHub's latest is v1.799.0 but that
    # tag 404s on ghcr). `windmill-ee` and `windmill-full` are different images.
    image: ghcr.io/windmill-labs/windmill:1.798.1
    container_name: windmill_server
    user: "1000:1000"
    depends_on:
      windmill_db:
        condition: service_healthy
    ports:
      - '127.0.0.1:10253:8000'
    environment:
      - TZ=America/Chicago
      - MODE=server
      # Required alongside `user:` — see this service's header.
      - HOME=/tmp
      - BASE_URL=https://windmill.svc.idanreed.com
      - RUST_LOG=info
      # ⚠ Do NOT add a /var/run/docker.sock mount, however many upstream examples
      # do — it "grants user scripts full access to the host Docker daemon"
      # (upstream's own warning). This fleet has exactly one socket-mounting
      # container by design.
      # ⚠ FAVOR_UNSHARE_PID stays UNSET: it only works with `privileged: true`,
      # used nowhere here, and one without the other yields workers that fail to
      # start jobs.
      #
      # DATABASE_URL and SUPERADMIN_SECRET arrive from .env.
    env_file: /run/stack-env/windmill.env
    healthcheck:
      # /api/health/status, NOT /api/version, which answers from the binary and
      # says nothing about the DB. Honest limits: 503 only when the DATABASE is
      # unreachable, 200 for a degraded instance with no workers, and cached 5s.
      # "No workers running" is a suite assertion.
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://127.0.0.1:8000/api/health/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # Worker
  windmill_worker:
    image: ghcr.io/windmill-labs/windmill:1.798.1
    container_name: windmill_worker
    user: "1000:1000"
    depends_on:
      windmill_db:
        condition: service_healthy
      windmill_server:
        condition: service_healthy
    volumes:
      # 🚨 NAMED VOLUME, NOT A BIND MOUNT — see this file's header.
      - windmill_dependency_cache:/tmp/windmill/cache
    environment:
      - TZ=America/Chicago
      - MODE=worker
      - HOME=/tmp
      # worker.rs UNIONS the database's worker_tags with this for
      # WORKER_GROUP=default; the "silently ignored" behaviour applies only to
      # named groups.
      - WORKER_GROUP=default
      - RUST_LOG=info
      # DATABASE_URL arrives from .env.
    env_file: /run/stack-env/windmill.env
    healthcheck:
      # No HTTP listener, and a `pgrep` probe would be a lie that `up --wait`
      # reports as success. Worker liveness is asserted FROM THE SERVER SIDE (the
      # suite queries the worker list) — the only place the answer lives.
      disable: true
    restart: unless-stopped

  # Database
  # ⚠ Upstream's compose uses POSTGRES_USER=postgres; renaming it here is a
  # deliberate deviation that DATABASE_URL in .env and the healthcheck must both
  # follow. Stay on 17: postgres:18-alpine moved PGDATA.
  windmill_db:
    image: postgres:17.9-alpine
    container_name: windmill_db
    shm_size: 1gb
    volumes:
      - /mnt/fast/windmill/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=windmill
      - POSTGRES_DB=windmill
      # POSTGRES_PASSWORD arrives from .env and must match DATABASE_URL's.
    env_file: /run/stack-env/windmill.env
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root), not a role.
      test: ['CMD-SHELL', 'pg_isready -U windmill -d windmill']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Init
  # Upstream's path leaves admin@windmill.dev / changeme live until a human
  # intervenes; SUPERADMIN_SECRET is the way around it. See windmill-init.sh.
  windmill_init:
    image: python:3.13-alpine
    container_name: windmill_init
    entrypoint: ['/bin/sh', '/init/windmill-init.sh']
    depends_on:
      windmill_server:
        condition: service_healthy
    volumes:
      - ./windmill-init.sh:/init/windmill-init.sh:ro
    env_file: /run/stack-env/windmill.env
    restart: "no"

volumes:
  # See the worker's volume comment. This must stay a named volume.
  windmill_dependency_cache:
