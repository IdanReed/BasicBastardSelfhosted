# Tracking — Bookstack + Homebox + Karakeep (Tracking range, ports
# 10300-10302). Design:
# ServerNotes/designs/service-tracking-stack-research.md; _overview.md owns
# the port/auth rows.
#
# ONE OF THREE STACKS IN THE TRACKING RANGE: Firefly III and Dawarich are
# separate projects, because thirteen containers do not fit the generic
# suite's budget and one .sops.env over five unrelated apps would make every
# rotation touch every fixture. All three stay inside 10300-10349; the lints
# key on ports, not stack names.
#
#   - All three apps drive native OIDC, shipping ready-and-OFF on local
#     accounts until the operator lands the Authentik client secrets.
#   - FOUR different uid conventions live in this file; normalising any one
#     breaks it. See each service.
#   - Backups: bookstack is MariaDB, dumped by backup-prepare.sh's mysqldump
#     branch, which needs `container_name: bookstack_db` AND
#     MYSQL_ROOT_PASSWORD in that container's env. Homebox and Karakeep are
#     SQLite via sqlite_backup — ⚠ Karakeep's path is ${DATA_DIR}/db.db and
#     queue.db, never data.db. MariaDB's datadir carries an explicit backrest
#     exclude, since raw live InnoDB files are unrestorable next to a dump.

services:
  # Wiki
  #
  # NO HTTP PATH TO A FIRST ADMIN: the initial migration seeds
  # admin@admin.com / password with no env override, and the REST API needs a
  # UI-minted token. bookstack-admin-init.sh runs an artisan command inside
  # this container through LSIO's /custom-cont-init.d hook instead of a
  # socket-mounting init container.
  bookstack:
    image: lscr.io/linuxserver/bookstack:version-v26.05.4
    container_name: bookstack
    depends_on:
      bookstack_db:
        condition: service_healthy
    ports:
      - '127.0.0.1:10300:80'
    volumes:
      - /mnt/fast/bookstack/config:/config
      # Runs as root during s6 init, before the app starts (LSIO-documented
      # hook) — first admin created without a docker socket anywhere.
      - ./bookstack-admin-init.sh:/custom-cont-init.d/10-admin:ro
    environment:
      # This image fixes its own bind-mount ownership at every start
      # (`lsiown -R abc:abc /config`).
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # 🚨 LOAD-BEARING, and its failure is silent: the session cookie path
      # and `secure` flag derive from it, so a wrong value is an infinite
      # login redirect loop with no error. No trailing slash. To change it:
      # `artisan bookstack:update-url <old> <new>`.
      - APP_URL=https://bookstack.svc.idanreed.com
      - APP_PROXIES=*
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      # APP_KEY and DB_PASSWORD arrive from .env. A MISSING APP_KEY makes the
      # init script `sleep infinity` — running forever with no crash to alert
      # on, which is what the healthcheck below catches.
      #
      # Kills Gravatar and drawio, the only egress this image makes.
      - DISABLE_EXTERNAL_SERVICES=true
      # 🚨 HARD CUTOVER: `oidc` REMOVES the local login form, there is no dual
      # mode. So the VPS blueprint must deploy BEFORE this stack, or OIDC is
      # on with no provider and nobody can log in; break-glass is reverting
      # this to `standard` and redeploying. New OIDC users auto-register with
      # the default role and link by the `sub` claim, plus whatever the group
      # sync below grants.
      - AUTH_METHOD=oidc
      - OIDC_NAME=Authentik
      - OIDC_ISSUER=https://auth.idanreed.com/application/o/bookstack/
      # ⚠ EXPLICIT: the code defaults this FALSE while the docs say true, and
      # without it the provider cannot find its endpoints.
      - OIDC_ISSUER_DISCOVER=true
      - OIDC_CLIENT_ID=bookstack
      # 🚨 THIS IS WHAT MAKES ADMIN DECLARATIVE — it replaces the old "promote
      # yourself in the UI" step. GroupSyncService matches an IdP group name
      # against each role's display_name (lowercased, hyphenated) and does NOT
      # exclude the built-in Admin role, whose display_name is "Admin". So
      # membership of an Authentik group named `Admin` grants BookStack admin
      # on EVERY login, which also re-promotes after a rebuilt MySQL volume.
      # Authentik's default `profile` mapping already emits `groups`.
      #
      # ⚠ OIDC_REMOVE_FROM_GROUPS stays UNSET (false): the sync then only ADDS
      # roles. On, every login is a full replace — a role granted in the UI is
      # stripped, and a groups claim that fails to arrive demotes you, with no
      # last-admin exemption.
      - OIDC_USER_TO_GROUPS=true
      - OIDC_GROUPS_CLAIM=groups
      # Remapped: the shared .env carries prefixed names (three apps, one
      # file); BookStack reads the bare one.
      - OIDC_CLIENT_SECRET=${BOOKSTACK_OIDC_CLIENT_SECRET:-}
    # Long form throughout this file: a deploy can race the first host-side
    # decrypt, and the plain form aborts the whole stack when .env is absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # No builtin. /status is 200 only if database, cache AND session are
      # healthy, which catches both the `sleep infinity` state above and
      # "nginx up, app broken".
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:80/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # BookStack supports MySQL/MariaDB only. container_name and
  # MYSQL_ROOT_PASSWORD are both load-bearing for backup-prepare.sh's
  # mariadb-dump, which reads that variable out of this container's
  # environment — so the MYSQL_ spelling is required even though MariaDB also
  # accepts MARIADB_.
  bookstack_db:
    # NOT `mariadb:lts` or `latest`: both resolve to 12.3.3, not the 11.4 LTS
    # line — the `lts` tag is mistagged upstream. Pin the patch version.
    image: mariadb:11.8.9
    container_name: bookstack_db
    volumes:
      - /mnt/fast/bookstack/db:/var/lib/mysql
    environment:
      - TZ=America/Chicago
      - MARIADB_DATABASE=bookstack
      - MARIADB_USER=bookstack
      # MYSQL_ROOT_PASSWORD (not MARIADB_) and MYSQL_PASSWORD arrive from
      # .env — see above.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # --innodb_initialized proves recovery finished, which matters on first
      # boot: BookStack's 30s wait would otherwise expire and migrate against
      # a half-open server.
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Inventory
  #
  # Runs as ROOT in the default variant with no PUID/PGID and no chown at
  # start, so /mnt/fast/homebox is declared root:root. The -rootless and
  # -hardened variants need 65532:65532 pre-owned or they crash-loop on the
  # SQLite open — use the plain tag.
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.26.2
    container_name: homebox
    ports:
      - '127.0.0.1:10301:7745'
    volumes:
      - /mnt/fast/homebox:/data
    environment:
      - TZ=America/Chicago
      - HBOX_MODE=production
      # Registration OPEN: the first register with an empty group token
      # becomes the group owner, which is the entire headless bootstrap.
      # Closing it is a deliberate operator step after the first deploy.
      - HBOX_OPTIONS_ALLOW_REGISTRATION=true
      # BOTH, not just TRUST_PROXY: Homebox builds its OIDC redirect URI
      # per-request from headers, which behind Caddy is an http:// callback
      # Authentik rejects. HOSTNAME overrides the headers entirely.
      - HBOX_OPTIONS_TRUST_PROXY=true
      - HBOX_OPTIONS_HOSTNAME=homebox.svc.idanreed.com
      # Hourly failed egress from a tailnet-only host; noise, not fatal.
      - HBOX_OPTIONS_GITHUB_RELEASE_CHECK=false
      # 🚨 EAGER DISCOVERY: the issuer's .well-known is resolved AT START on a
      # ~7.5s retry ladder, so a tailnet blip to the VPS during `up`
      # restart-loops this container. Accepted cost of enabling OIDC; it
      # self-heals once the VPS is reachable. The client secret is only used
      # at token exchange, so an empty one does not crash boot.
      - HBOX_OIDC_ENABLED=true
      - HBOX_OIDC_ISSUER_URL=https://auth.idanreed.com/application/o/homebox/
      - HBOX_OIDC_CLIENT_ID=homebox
      - HBOX_OIDC_CLIENT_SECRET=${HOMEBOX_OIDC_CLIENT_SECRET:-}
      - HBOX_OIDC_SCOPE=openid profile email
      # HBOX_AUTH_API_KEY_PEPPER arrives from .env and is REQUIRED — boot
      # refuses under 32 bytes, and it is absent from every compose example
      # online.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # The builtin returns 200 unconditionally, dead SQLite included, so this
      # is liveness only; the suite asserts /api/v1/status CONTENT instead.
      #
      # 🚨 `-O /dev/null`, NOT `--spider`: --spider issues a HEAD and this
      # route is GET-only, so it 405s and stays unhealthy forever while the
      # app serves fine.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:7745/api/v1/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Bookmarks
  #
  # 🚨 NEVER set a compose `user:` here: a non-root uid dies with EACCES on a
  # path INSIDE the image, which chowning the bind mount cannot fix (upstream
  # #1324, closed unfixed). /mnt/fast/karakeep must be ROOT-owned — the
  # inverse of the 1000:1000 convention, i.e. exactly what a reviewer will
  # "fix" incorrectly.
  karakeep:
    # `latest` is the NIGHTLY build of main; the release alias is `release`.
    # The suite asserts /api/version equals this pin, which is the only way an
    # accidental `latest` becomes visible.
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    container_name: karakeep
    depends_on:
      meilisearch:
        condition: service_healthy
    ports:
      - '127.0.0.1:10302:3000'
    volumes:
      - /mnt/fast/karakeep/data:/data
    environment:
      - TZ=America/Chicago
      # MUST be explicit: the schema default is the EMPTY STRING, i.e. db.db
      # in the working directory, lost on every recreate.
      - DATA_DIR=/data
      - NEXTAUTH_URL=https://karakeep.svc.idanreed.com
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      # Defaults TRUE, and worker init AWAITS an EasyList fetch cached only
      # to /tmp — on a blackholed network that stalls worker boot.
      - CRAWLER_ENABLE_ADBLOCKER=false
      # Client-side check that hangs the UI when there is no egress.
      - DISABLE_NEW_RELEASE_CHECK=true
      # OIDC is enabled purely by the PRESENCE of this URL, and discovery is
      # lazy, so there is no boot hazard.
      # ⚠ Password auth is LEFT ON so tracking-init can still provision the
      # admin; do not set DISABLE_PASSWORD_AUTH until after a successful
      # deploy. OAUTH_AUTO_REDIRECT is a silent no-op until it is.
      - OAUTH_WELLKNOWN_URL=https://auth.idanreed.com/application/o/karakeep/.well-known/openid-configuration
      - OAUTH_PROVIDER_NAME=Authentik
      - OAUTH_CLIENT_ID=karakeep
      - OAUTH_CLIENT_SECRET=${KARAKEEP_OIDC_CLIENT_SECRET:-}
      - OAUTH_SCOPE=openid email profile
      # Links the OIDC identity to the existing local admin by verified email,
      # instead of minting a second non-admin account. Safe because Authentik
      # is the only IdP and it verifies emails.
      - OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING=true
      # NEXTAUTH_SECRET and MEILI_MASTER_KEY arrive from .env.
    env_file:
      - path: .env
        required: false
    # NO healthcheck stanza: the image's builtin is already correct, and
    # liveness is all it can prove — DB and Meili are the suite's job.
    restart: unless-stopped

  # Search index
  #
  # 🚨 VERSION-LOCKED by Karakeep: a newer engine REFUSES to open an existing
  # data.ms and recovery is destructive (delete the index, reindex
  # everything). A version float passes the registry check and bricks search
  # on the next restart, so do not let update-images.sh move this without
  # checking what Karakeep expects.
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep_meilisearch
    volumes:
      - /mnt/fast/karakeep/meili:/meili_data
    environment:
      - TZ=America/Chicago
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      # NAMED, not env_file — the shelfmark precedent (stacks/books). This is
      # the one value meilisearch uses, and the shared tracking .env also
      # carries BookStack's MySQL root password, karakeep's NEXTAUTH_SECRET,
      # HBOX_AUTH_API_KEY_PEPPER and three OIDC client secrets. `${VAR:-}`
      # interpolates at parse time, so a deploy that races the decrypt still
      # degrades (empty -> production mode refuses to start, loudly) rather
      # than aborting the whole stack. Production mode requires a key of at
      # least 16 bytes.
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:7700/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Crawler browser
  #
  # DELIBERATELY no healthcheck and nothing depends_on it: Karakeep tolerates
  # its absence and retries forever, and the image has neither curl nor wget,
  # so there is no probe to write.
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
    container_name: karakeep_chrome
    # Chrome spawns a process tree; without an init it leaks zombies.
    init: true
    # Upstream's command verbatim. Do NOT add --remote-debugging-port (the
    # entrypoint runs chrome on 9223 and socat-forwards 9222) or --no-sandbox,
    # which is already supplied.
    command:
      - --headless
      - --no-pdf-header-footer
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  # Seeding
  #
  # Homebox and Karakeep only; BookStack has no HTTP path to a first admin and
  # is handled by bookstack-admin-init.sh inside its own container.
  tracking-init:
    image: python:3.13-alpine
    container_name: tracking_init
    entrypoint: ['/bin/sh', '/init/tracking-init.sh']
    depends_on:
      homebox:
        condition: service_healthy
      karakeep:
        condition: service_healthy
    volumes:
      - ./tracking-init.sh:/init/tracking-init.sh:ro
    env_file:
      - path: .env
        required: false
    restart: "no"
