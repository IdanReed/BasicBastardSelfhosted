# Tracking — Bookstack + Homebox + Karakeep (Tracking range, ports
# 10300-10302). Design:
# ServerNotes/designs/service-tracking-stack-research.md (the annex).
# _overview.md owns the port/auth rows.
#
# ONE OF THREE STACKS IN THE TRACKING RANGE (annex §1): Firefly III
# (10303/10305) and Dawarich (10304) are separate projects — thirteen
# containers and ~6 GB of images do not fit the generic suite's 3 GB/8 GB
# budget, and one `.sops.env` spanning five unrelated apps would make every
# rotation touch every fixture. All three stay inside 10300-10349 (lints key
# on ports, not stack names).
#
# Shape (annex §2, §8):
#   - Three apps, all native OIDC, shipping OIDC-READY and OFF: local
#     accounts until the operator lands the Authentik client secrets (the
#     books-stack posture).
#   - FOUR different uid conventions live in this file; normalising any one
#     breaks it. See each service.
#   - meilisearch and chrome sidecars are optional upstream; here because
#     search and crawling are the point, but nothing gates on chrome.
#
# Backup contract (annex §0.1): bookstack is MariaDB, dumped by
# backup-prepare.sh's mysqldump branch (requires `container_name:
# bookstack_db` + MYSQL_ROOT_PASSWORD in that container's env). Homebox and
# Karakeep are SQLite via `sqlite_backup` — ⚠ the Karakeep path is
# ${DATA_DIR}/db.db and queue.db, NOT data.db (a committed path was wrong
# once). MariaDB's datadir gets an explicit backrest exclude (no
# `**/pgdata/**`-style match) — raw live InnoDB files are unrestorable noise
# next to a working mysqldump.

services:
  # ---------------------------------------------------------------------------
  # bookstack — personal wiki. NO HTTP PATH TO A FIRST ADMIN: the initial
  # migration seeds admin@admin.com / password (no env override), and the
  # REST API needs a UI-minted token. The fix is an artisan command run
  # INSIDE this container via LSIO's /custom-cont-init.d hook (see
  # bookstack-admin-init.sh) — not a socket-mounting init container.
  # ---------------------------------------------------------------------------
  bookstack:
    image: lscr.io/linuxserver/bookstack:version-v26.05.4
    container_name: bookstack
    depends_on:
      bookstack_db:
        condition: service_healthy
    ports:
      - '127.0.0.1:10300:80'
    volumes:
      - /mnt/fast/bookstack/config:/config
      # Runs as root during s6 init, before the app starts (LSIO-documented
      # hook) — first admin created without a docker socket anywhere.
      - ./bookstack-admin-init.sh:/custom-cont-init.d/10-admin:ro
    environment:
      # s6 runs `lsiown -R abc:abc /config` every start — this image FIXES
      # ITS OWN bind-mount ownership, so the finding-#14 crash-loop class
      # does not apply here.
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # LOAD-BEARING, silent failure: the session cookie path and `secure`
      # flag derive from APP_URL — wrong value = infinite login redirect
      # loop, no error anywhere. No trailing slash. If it changes:
      # `artisan bookstack:update-url <old> <new>`.
      - APP_URL=https://bookstack.svc.idanreed.com
      - APP_PROXIES=*
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      # APP_KEY and DB_PASSWORD arrive from .env. A MISSING APP_KEY makes
      # the init script `sleep infinity` — "running" forever, no crash to
      # alert on; the healthcheck below is what catches it.
      #
      # Kills Gravatar and drawio; also the only egress this image makes.
      - DISABLE_EXTERNAL_SERVICES=true
      # OIDC ships READY and OFF (annex §4): flipping to `oidc` plus three
      # OIDC_* values is the whole change.
      # ⚠ When that happens, set OIDC_ISSUER_DISCOVER EXPLICITLY: the code
      # defaults it FALSE while the docs say true — trusting the docs yields
      # a provider that cannot discover its endpoints.
      - AUTH_METHOD=standard
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # No builtin. /status returns 200 only if database, cache AND session
      # are healthy — catches the `sleep infinity` state above and "nginx up,
      # app broken" (the image's 30s DB wait runs `migrate` anyway, no
      # `set -e`).
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:80/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # bookstack_db — MariaDB (BookStack supports MySQL/MariaDB only).
  #
  # container_name and MYSQL_ROOT_PASSWORD are BOTH load-bearing for
  # nixos/backup-prepare.sh's mariadb-dump: it reads that variable from the
  # container's environment, so the MYSQL_ spelling is required even though
  # MariaDB also accepts MARIADB_. (MYSQL_PWD, not -p on argv: argv was
  # host-visible in /proc/<pid>/cmdline.)
  # ---------------------------------------------------------------------------
  bookstack_db:
    # NOT `mariadb:lts` and NOT `mariadb:latest` — both resolve to the same
    # digest, which is 12.3.3, not the 11.4 LTS line. The `lts` tag is
    # mistagged upstream. Pin the patch version.
    image: mariadb:11.8.9
    container_name: bookstack_db
    volumes:
      - /mnt/fast/bookstack/db:/var/lib/mysql
    environment:
      - TZ=America/Chicago
      - MARIADB_DATABASE=bookstack
      - MARIADB_USER=bookstack
      # MYSQL_ROOT_PASSWORD (not MARIADB_) and MYSQL_PASSWORD arrive from
      # .env — see the container_name note above.
    # Long form with required:false ON PURPOSE (finding #11): see bookstack.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Upstream-blessed probe: --connect proves connections accepted;
      # --innodb_initialized proves recovery finished — matters on first
      # boot, where BookStack's 30s wait would otherwise expire and migrate
      # against a half-open server.
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # homebox — home inventory. SQLite, single container. sysadminsmedia is
  # the maintained successor (hay-kot/homebox archived June 2024).
  #
  # Runs as ROOT in the default variant, no PUID/PGID, no chown at start —
  # so /mnt/fast/homebox is declared root:root. (-rootless/-hardened need
  # 65532:65532 pre-owned or crash-loop on the SQLite open; -hardened is
  # distroless, no shell, no codec libs. Use the plain tag.)
  # ---------------------------------------------------------------------------
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.26.2
    container_name: homebox
    ports:
      - '127.0.0.1:10301:7745'
    volumes:
      - /mnt/fast/homebox:/data
    environment:
      - TZ=America/Chicago
      - HBOX_MODE=production
      # Registration OPEN: the first register with an empty group token
      # becomes the group owner — the entire headless bootstrap.
      # tracking-init cannot flip an env var, so this stays true; closing it
      # is a deliberate operator step after first deploy (annex).
      - HBOX_OPTIONS_ALLOW_REGISTRATION=true
      # BOTH, not just TRUST_PROXY: Homebox builds its OIDC redirect URI
      # per-request from headers — behind Caddy that is an http:// callback
      # Authentik rejects. HOSTNAME overrides the headers entirely.
      - HBOX_OPTIONS_TRUST_PROXY=true
      - HBOX_OPTIONS_HOSTNAME=homebox.svc.idanreed.com
      # Hourly failed egress from a tailnet-only host. Non-fatal, just noise.
      - HBOX_OPTIONS_GITHUB_RELEASE_CHECK=false
      # ⚠ OIDC OFF, not merely "unconfigured": Homebox resolves discovery
      # EAGERLY at start (retry ladder ~7.5s, tuned for a sibling service,
      # not a cross-tailnet VPS) — enabled, a tailnet blip during `up`
      # restart-loops this container. Turning it on carries that cost
      # (annex §7).
      - HBOX_OIDC_ENABLED=false
      # HBOX_AUTH_API_KEY_PEPPER arrives from .env, REQUIRED (boot refuses
      # under 32 bytes) — absent from essentially every compose example
      # online, so a copied blog post will not start.
    # Long form with required:false ON PURPOSE (finding #11): see bookstack.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # The builtin is worthless: `ReadyFunc = func() bool { return true }` —
      # 200 unconditionally, dead SQLite included. Liveness either way; no
      # better endpoint exists. The SUITE proves the app works by asserting
      # /api/v1/status CONTENT.
      #
      # 🚨 `-O /dev/null`, NOT `--spider`: --spider issues a HEAD and
      # /api/v1/status is GET-only — 405, unhealthy FOREVER while the app
      # serves fine (verified: 152s in the suite). Do not "simplify" back to
      # --spider without checking the route's methods.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:7745/api/v1/status']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # karakeep — bookmark everything. SQLite for main DB and job queue
  # (liteque); no Postgres, no Redis.
  #
  # 🚨 NEVER set a compose `user:` here: a non-root uid dies with EACCES on
  # /app/apps/web/.next/cache, INSIDE THE IMAGE — chowning the bind mount
  # cannot fix it (upstream #1324, closed unfixed). /mnt/fast/karakeep must
  # be ROOT-owned — the inverse of the 1000:1000 convention, i.e. exactly
  # what a reviewer will "fix" incorrectly.
  # ---------------------------------------------------------------------------
  karakeep:
    # `latest` is the NIGHTLY build of main (SERVER_VERSION=nightly); the
    # release alias is `release`. The suite asserts /api/version equals this
    # pin — the only way an accidental `latest` becomes visible.
    image: ghcr.io/karakeep-app/karakeep:0.33.2
    container_name: karakeep
    depends_on:
      meilisearch:
        condition: service_healthy
    ports:
      - '127.0.0.1:10302:3000'
    volumes:
      - /mnt/fast/karakeep/data:/data
    environment:
      - TZ=America/Chicago
      # MUST be explicit: the schema default is the EMPTY STRING — db.db in
      # the working directory, lost on every recreate.
      - DATA_DIR=/data
      - NEXTAUTH_URL=https://karakeep.svc.idanreed.com
      - MEILI_ADDR=http://meilisearch:7700
      - BROWSER_WEB_URL=http://chrome:9222
      # Defaults TRUE; worker init AWAITS an EasyList fetch (cached only to
      # /tmp, so every restart) — on a blackholed network it stalls worker
      # boot on TCP timeouts.
      - CRAWLER_ENABLE_ADBLOCKER=false
      # Client-side check that hangs the UI when there is no egress.
      - DISABLE_NEW_RELEASE_CHECK=true
      # OIDC ships OFF: enabled purely by the PRESENCE of
      # OAUTH_WELLKNOWN_URL, so unset is the off state.
      # ⚠ ORDERING when enabling: DISABLE_PASSWORD_AUTH=true disables BOTH
      # users.create AND apiKeys.exchange (how tracking-init provisions).
      # Bootstrap first, lock down second — and OAUTH_AUTO_REDIRECT silently
      # does nothing unless DISABLE_PASSWORD_AUTH is also true.
      #
      # NEXTAUTH_SECRET and MEILI_MASTER_KEY arrive from .env.
    # Long form with required:false ON PURPOSE (finding #11): see bookstack.
    env_file:
      - path: .env
        required: false
    # NO healthcheck stanza ON PURPOSE: the builtin (`wget --spider
    # /api/health`) is correct — rare here. Liveness only; DB/Meili are the
    # suite's job.
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # meilisearch — Karakeep's search index.
  #
  # 🚨 VERSION-LOCKED to 1.41.0 by Karakeep: a newer engine REFUSES to open
  # an existing data.ms and recovery is destructive (delete the index,
  # "Reindex All Bookmarks"). A version float PASSES the registry check and
  # bricks search on the next restart — do not let update-images.sh move
  # this without checking what Karakeep expects.
  #
  # Note the `v` prefix — karakeep and karakeep-chrome have none.
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: karakeep_meilisearch
    volumes:
      - /mnt/fast/karakeep/meili:/meili_data
    environment:
      - TZ=America/Chicago
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      # MEILI_MASTER_KEY arrives from .env — production mode REQUIRES it and
      # refuses to start without one at least 16 bytes long.
    # Long form with required:false ON PURPOSE (finding #11): see bookstack.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # No builtin; /health is unauthenticated and curl is present.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:7700/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # chrome — Karakeep's crawler browser (first-party image now).
  #
  # DELIBERATELY no healthcheck and nothing depends_on it: Karakeep
  # tolerates its absence ("Running in browserless mode", retries forever,
  # never fatal), so gating on it would be wrong — and the image has NEITHER
  # curl NOR wget (debian-slim + socat), so there is no probe to write.
  # ---------------------------------------------------------------------------
  chrome:
    image: ghcr.io/karakeep-app/karakeep-chrome:151.0.7922.47-r1
    container_name: karakeep_chrome
    # Chrome spawns a process tree; without an init it leaks zombies.
    init: true
    # Upstream's command verbatim. Do NOT add --remote-debugging-port (the
    # entrypoint runs chrome on 9223, socat-forwards 9222) or --no-sandbox
    # (already supplied).
    command:
      - --headless
      - --no-pdf-header-footer
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # tracking-init — headless first-run for Homebox and Karakeep (annex §3).
  # BookStack is NOT here: no HTTP path to a first admin — handled inside its
  # own container by bookstack-admin-init.sh.
  #
  # Every mutation logs "tracking-init: CHANGE: ...". A second run — every
  # redeploy reruns this container — must log ZERO change lines.
  # ---------------------------------------------------------------------------
  tracking-init:
    image: python:3.13-alpine
    container_name: tracking_init
    entrypoint: ['/bin/sh', '/init/tracking-init.sh']
    depends_on:
      homebox:
        condition: service_healthy
      karakeep:
        condition: service_healthy
    volumes:
      - ./tracking-init.sh:/init/tracking-init.sh:ro
    # Long form with required:false ON PURPOSE (finding #11): see bookstack.
    env_file:
      - path: .env
        required: false
    restart: "no"
