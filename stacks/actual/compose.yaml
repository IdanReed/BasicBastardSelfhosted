# Actual Budget — sync server (10308). EVALUATION stack: the bake-off rival to
# stacks/firefly.
# No backup-prepare.sh line yet — /mnt/fast/actual rides the raw fast-volume set.

services:
  actual:
    image: actualbudget/actual-server:26.9.0
    container_name: actual
    # The image ships no USER instruction; without this it runs as root.
    user: "1001:1001"
    ports:
      - '127.0.0.1:10308:5006'
    volumes:
      - /mnt/fast/actual:/data
    environment:
      - TZ=America/Chicago
      # The published port above depends on it.
      - ACTUAL_PORT=5006
      # OIDC
      # 🚨 No ACTUAL_OPENID_* and no stack env on this service, on purpose: at
      # every start the server force-bootstraps OpenID from those vars before
      # it listens (app.ts run()). On a fresh volume that is before actual_init
      # has set a password — an OpenID-only server, no password fallback, and
      # the first Authentik user in owns it without the server-password gate.
      # The login method lives in the database; actual_init sets it, password
      # first. ACTUAL_OPENID_ENFORCE stays UNSET: it hides the password method,
      # the only way in while Authentik is down.
      # SimpleFIN needs no wiring: the credential is pasted in the client UI
      # and stored in account.sqlite.
    healthcheck:
      # Upstream's own script; the final image has no curl/wget, only node.
      # Liveness only — /health is a bare express 200.
      test: ['CMD', 'node', 'scripts/health-check.js']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Bootstrap
  # The server password, then OpenID, over the project network — the endpoints
  # the browser forms call (/account/bootstrap, /openid/enable). Same image so
  # the pin moves in one place. See actual-init.js.
  actual_init:
    image: actualbudget/actual-server:26.9.0
    container_name: actual_init
    user: "1001:1001"
    depends_on:
      # Bootstrap is an HTTP call, so it waits for healthy, not started.
      actual:
        condition: service_healthy
    volumes:
      - ./actual-init.js:/init/actual-init.js:ro
      # Read-only, for the drift check against the stored OpenID client.
      - /mnt/fast/actual:/data:ro
    command: ['node', '/init/actual-init.js']
    environment:
      - INIT_URL=http://actual:5006
      # OIDC
      # Authentik provider `actual` (actual-oidc.yaml; its redirect URI is
      # SERVER_HOSTNAME + /openid/callback). The client secret comes from the
      # stack env (env.nix). actual_init seats ACTUAL_ADMIN_USER as ADMIN
      # before OpenID exists, so idan's first login lands on that seat and no
      # other first login can claim the server. Anyone else exists only once
      # an admin adds them in the client's user directory
      # (ACTUAL_USER_CREATION_MODE stays manual).
      - ACTUAL_ADMIN_USER=idan
      - ACTUAL_OPENID_DISCOVERY_URL=https://auth.idanreed.com/application/o/actual/.well-known/openid-configuration
      - ACTUAL_OPENID_SERVER_HOSTNAME=https://actual.svc.idanreed.com
      # Beats the stack env's vestigial ACTUAL_OPENID_CLIENT_ID (environment
      # wins over env_file).
      - ACTUAL_OPENID_CLIENT_ID=actual
    env_file: /run/stack-env/actual.env
    restart: "no"
