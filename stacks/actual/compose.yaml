# Actual Budget — envelope budgeting sync server (Tracking range, port 10308).
# Design: ServerNotes/designs/service-bakeoff.md (§ Firefly III vs Actual
# Budget) and ServerNotes/designs/custom-finance.md. _overview.md owns the
# port/auth row.
#
# ⚠ EVALUATION STACK — the bake-off rival to stacks/firefly (10303/10305),
# run side by side: native SimpleFIN + native OIDC in one SQLite container.
# Deliberately lean: no SimpleFIN credential seeded, OIDC ready-and-off, no
# linkage to the rest of the fleet.
#
# Headless bootstrap verified in the v26.9.0 source (src/app-account.js:
# POST /bootstrap accepts {password}, refuses with "already-bootstrapped"
# once the auth table is non-empty) — actual_init drives it, so first-run is
# never briefly-open in a browser.
#
# Backup contract: NONE YET — no line in nixos/backup-prepare.sh;
# /mnt/fast/actual is covered only by the raw fast-volume include set, and
# account.sqlite is written by a live server, so a raw copy can catch a torn
# write. If the stack graduates, add
#   sqlite_backup actual /mnt/fast/actual/server-files/account.sqlite
# (password, sessions, file index, SimpleFIN credential). user-files/ blobs
# are rewritten wholesale on sync; the raw include set is right for those.

services:
  # ---------------------------------------------------------------------------
  # actual — the sync server. One container; all state under /data.
  #
  # 🚨 RUNS AS UID 1001 ONLY BECAUSE `user:` SAYS SO — the image creates uid
  # 1001 but ships no USER instruction (measured on 26.9.0: skopeo inspect
  # --config shows "User": null; the suite's first unpinned run wrote
  # account.sqlite as 0:0). Pinning is safe: entrypoint is bare tini +
  # `node app.js`, no chown or root-only setup, and /mnt/fast/actual is
  # pre-owned 1001:1001 by tmpfiles (nixos/generate-stack-dirs.py) either way.
  # ---------------------------------------------------------------------------
  actual:
    # Docker Hub (ghcr.io mirrors it). Bare docker tag — `26.9.0`: the git
    # tag has a `v`, the image tag does not (the v-or-not trap has burned two
    # stacks). `-alpine` tags are a parallel variant, not newer builds.
    # CalVer, monthly: expect the pin to look stale fast.
    image: actualbudget/actual-server:26.9.0
    container_name: actual
    # See header: without this a finance server runs as root.
    user: "1001:1001"
    ports:
      # Loopback only: the way in is Caddy at actual.svc.idanreed.com.
      - '127.0.0.1:10308:5006'
    volumes:
      - /mnt/fast/actual:/data
    environment:
      - TZ=America/Chicago
      # Pinned: the published port above depends on it (ghostfolio PORT
      # precedent).
      - ACTUAL_PORT=5006
      # ACTUAL_TRUSTED_PROXIES deliberately UNSET: the default already covers
      # the ranges Caddy and the docker bridge arrive from, and it feeds only
      # rate-limit IP resolution — no header-trusting auth guard here (that
      # is Firefly).
      #
      # First run is headless: see actual_init below. ACTUAL_INIT_PASSWORD
      # arrives via .env; this server ignores the unknown name.
      #
      # ---- OIDC ships READY and OFF (native; Authentik on upstream's
      # tested-provider list). OFF is the true default: after bootstrap the
      # login method lives in the DATABASE, and the two ACTUAL_OPENID_*
      # values from .env are inert until an explicit enable — nothing is
      # fetched at boot, so no eager-discovery hazard (unlike Homebox and
      # Ghostfolio).
      # To enable, when the Authentik client secret lands:
      #   1. Register redirect https://actual.svc.idanreed.com/openid/callback
      #      in Authentik; real client id/secret into .sops.env.
      #   2. Uncomment both lines below and redeploy.
      #   3. docker exec actual node scripts/enable-openid.js
      #      (refuses if bootstrap never ran — actual_init guarantees it did).
      # 🚨 Then LOG IN THROUGH AUTHENTIK IMMEDIATELY: the first OIDC login
      # becomes the server OWNER, permanently — not reassignable from the UI;
      # on a tailnet "whoever clicks first" is every enrolled device.
      # ⚠ ACTUAL_OPENID_ENFORCE=true (kills the password fallback) only
      # AFTER a verified OIDC login, or it is a lockout.
      # - ACTUAL_OPENID_DISCOVERY_URL=https://auth.idanreed.com/application/o/actual/.well-known/openid-configuration
      # - ACTUAL_OPENID_SERVER_HOSTNAME=https://actual.svc.idanreed.com
      #
      # SimpleFIN: native, and NO wiring here — that is the feature. The
      # credential is pasted once in the client UI and stored in
      # account.sqlite (secret table, migration 1694362247011) — inside the
      # backup payload, no claim URL in sops. No scheduler: upstream's doc
      # still says Actual does not sync bank data automatically; a scheduling
      # sidecar is NOT part of this trial.
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the host-side decrypt (.env not yet written), and the plain form
    # aborts the whole stack.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # Image ships NO healthcheck (verified: no HEALTHCHECK line in either
      # Dockerfile; upstream puts this probe in its example compose). `node`
      # and ONLY node: the final stage has no curl/wget (finding #34's
      # failure mode). The script is upstream's own: GET /health (honors
      # ACTUAL_PORT), exit 1 unless {"status":"UP"}.
      # ⚠ HONESTY LIMIT: /health is a bare express 200 — liveness only.
      # SQLite is in-process so there is no dead-DB state to probe; a full or
      # read-only /data is invisible. The suite asserts the real contract
      # (bootstrap + login); Gatus watches the running one.
      test: ['CMD', 'node', 'scripts/health-check.js']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # actual_init — headless first-run: POST /account/bootstrap over the
  # project network (the endpoint the in-browser form itself calls; no env
  # var, no CLI exists). Same image ON PURPOSE: node+fetch already in it, the
  # pin moves in one place, the suite's offline image set stays at one entry.
  # Fails CLOSED (exit 1) on empty or changeme_ password; idempotent — every
  # redeploy reruns it, no CHANGE line and exit 0 once bootstrapped. See
  # actual-init.js.
  # ---------------------------------------------------------------------------
  actual_init:
    image: actualbudget/actual-server:26.9.0
    container_name: actual_init
    # Same uid as the server (image ships no USER — unpinned would be root).
    user: "1001:1001"
    depends_on:
      # service_healthy: bootstrap is an HTTP call — the reverse of the usual
      # seed-files-then-start init shape.
      actual:
        condition: service_healthy
    volumes:
      - ./actual-init.js:/init/actual-init.js:ro
    command: ['node', '/init/actual-init.js']
    environment:
      - INIT_URL=http://actual:5006
      # ACTUAL_INIT_PASSWORD arrives from .env.
    env_file:
      - path: .env
        required: false
    restart: "no"
