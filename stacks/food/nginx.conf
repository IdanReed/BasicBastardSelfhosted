# nginx for wger. This sidecar is NOT optional: `wger/server` serves no static
# files at all — there is no whitenoise in INSTALLED_APPS — so publishing
# gunicorn directly yields an app that renders, answers the API, and has no CSS
# and no JS. Plausible-looking and completely broken. Upstream's own compose
# says the same thing in its first comment.
#
# 🚨 WRITTEN HERE RATHER THAN COPIED FROM UPSTREAM, and that is the point.
# `wger-project/docker@master`'s config/nginx.conf opens with
#
#     upstream powersync { server powersync:8080; }
#
# for the PowerSync service its compose pulls in via an `include:`. nginx
# resolves upstream server names AT CONFIGURATION LOAD, so with no powersync
# container the whole vhost dies at startup with
# `[emerg] host not found in upstream "powersync"` — including /static/. The
# obvious "just copy upstream's nginx.conf" move fails closed, which is at
# least loud, but it fails before anything you would think to look at.
#
# The alias paths below are the SIDECAR's mount points (/wger/static,
# /wger/media), not /home/wger/... which is where they live in the app
# container. Getting that wrong gives 404s on every asset with nginx running
# happily.

upstream wger {
    server wger:8000;
}

# Caddy terminates TLS and sets X-Forwarded-Proto. Preserve it if present and
# fall back to the scheme nginx actually saw, so a direct loopback request
# still gets a coherent value rather than an empty one.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Exercise images and videos can be large, and so can a user's gallery
    # upload. The Django side has its own limit; this is the one that would
    # otherwise 413 first.
    client_max_body_size 100M;

    # Hashed by collectstatic, so the long immutable cache is safe HERE and
    # nowhere else — do not copy this header onto /media/, whose filenames are
    # user-supplied and stable.
    location /static/ {
        alias /wger/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /wger/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_redirect off;

        # First boot migrates and loads 872 exercise bases plus 2429
        # translations; a request arriving during that must not 504 before
        # gunicorn answers.
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }
}
