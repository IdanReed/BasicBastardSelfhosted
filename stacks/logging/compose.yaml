# Logging — VictoriaLogs + Alloy + Grafana (Monitoring range, 10455 and 10456).
# Design: ServerNotes/designs/service-monitoring-stack-research.md; the
# retention arithmetic lives in the victorialogs block below (there is no
# config file any more — VictoriaLogs is flag-driven) and the journald half of
# it in nixos/configuration.nix.
#
# WHY THIS EXISTS, when gatus probes every vhost and beszel trends every
# resource: both of those answer "is it up". Neither can answer "why did it
# stop", and the fleet's only tool for that today is `docker logs` on a
# guessed container name — which shows one container, only while it still
# exists, with no search and no history across a restart. Grafana over
# VictoriaLogs turns the whole fleet's output into one queryable window.
#
# 🔄 VICTORIALOGS REPLACED LOKI HERE (2026-09). The reason is the one knob
# Loki structurally lacks: SIZE-BASED RETENTION. Loki's only retention is
# time, so the 100 GB budget was a 720h window plus a daily du alarm and a
# human; VictoriaLogs enforces it natively with
# -retention.maxDiskSpaceUsageBytes (details in the victorialogs block).
# The old store at /mnt/slow/loki is ABANDONED — it was reconstructible
# telemetry, deliberately never backed up, and nothing migrates from it;
# delete the directory whenever the space is wanted. Alloy stays; only its
# sink URL changed (see config.alloy).
#
# 🚨 JOURNALD, NOT THE DOCKER SOCKET. This is the load-bearing decision of the
# whole stack and it is Idan's hard rule. The obvious design — Alloy with
# discovery.docker + loki.source.docker, or a "read-only" socket proxy —
# requires mounting /var/run/docker.sock into a networked container, and that
# socket is root on this host. Instead nixos/configuration.nix sets docker's
# DAEMON-LEVEL log driver to journald with `tag={{.Name}}`, so every container's
# stdout lands in the host journal, and Alloy reads the journal through two
# READ-ONLY bind mounts with no privilege whatsoever. See config.alloy.
#
#   ⚠ That switch is fleet-wide and it changes `docker logs`, which 131 call
#   sites in tests/ depend on. It was measured, not assumed: under the journald
#   driver `docker logs` returns every line, keeps stdout and stderr on
#   separate streams, and orders `2>&1` byte-identically to json-file. The one
#   thing that genuinely changes is journald's rate limit, which silently drops
#   lines from `docker logs` too — hence services.journald.rateLimitBurst = 0
#   in the SAME commit. Never move one without the other.
#
# Three services:
#
#   victorialogs  the store. Runs as ROOT (image config User "0"; unlike
#                 loki's 10001), data on /mnt/slow. NO healthcheck is
#                 possible — see its block.
#   alloy         the collector. Runs as ROOT (the image sets no USER), which
#                 is what lets it read root:systemd-journal 0640 journal
#                 files. No published port, no socket, no vhost.
#   grafana       the UI. uid 472, published loopback-only, behind Caddy with
#                 `import protected`. Needs the victoriametrics-logs-datasource
#                 plugin, installed by a ONE-TIME operator step — see its block.
#
# Everything talks over the compose project's own default bridge network, by
# SERVICE NAME. Nothing here joins `homelab`: the only cross-container traffic
# is alloy -> victorialogs and grafana -> victorialogs, and both are inside
# this project.

services:
  # ---------------------------------------------------------------------------
  # VictoriaLogs — the log store
  # ---------------------------------------------------------------------------
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    restart: unless-stopped

    # ⚠ The tag has a `v` AND no suffix. Older VictoriaLogs tags looked like
    # `v1.0.0-victorialogs`; the suffix is gone as of the 2026 releases
    # (v1.52.0 verified to exist on Docker Hub, pushed 2026-07-16 — the
    # chronologically newer v1.51.1 is a cluster-upgrade backport, not the
    # latest release). Run ./tests/update-images.sh after any change here.

    # VictoriaLogs has NO config file — every knob is a flag, so the whole
    # config surface is this list (loki.yaml is gone with Loki). Spelled out
    # rather than defaulted so the retention contract is visible in one place.
    command:
      # The bind target below. The image default is a RELATIVE
      # "victoria-logs-data" under WorkingDir "/", which happens to be the
      # same path — pinned absolutely anyway so the bind mount and the flag
      # cannot drift apart.
      - -storageDataPath=/victoria-logs-data

      # 🚨 THE 100 GB CAP, NATIVE AT LAST — the headline reason this replaced
      # Loki. When total disk usage at -storageDataPath exceeds this,
      # VictoriaLogs drops the OLDEST per-day partitions until it fits.
      # Honest fine print (upstream-documented): it always keeps at least the
      # two most recent days, so a burst bigger than 100 GiB in two days
      # would overshoot the cap rather than drop today's logs — for this
      # fleet that failure mode is science fiction, but it is why the
      # du-quota alarm in nixos/configuration.nix survives as a failsafe
      # (retargeted at this directory) instead of being retired.
      # Verified against this pinned image: the flag parses and the process
      # boots with exactly this value; the victorialogs suite asserts it in
      # the running argv.
      - -retention.maxDiskSpaceUsageBytes=100GiB

      # Time-based retention is SECONDARY now — the disk cap is the budget.
      # 1y is an honesty bound, not a target: at the ingest rates this fleet
      # has measured, the 100 GiB cap trims the window long before a year.
      # Side effect worth knowing: ingested entries with timestamps older
      # than now-retentionPeriod are REJECTED (this replaces Loki's
      # reject_old_samples; at 1y it only ever bites a clock catastrophe,
      # and Alloy's max_age=12h bounds cold-start replay anyway).
      - -retentionPeriod=1y

      # The image default already listens on 9428 on all interfaces of the
      # container's own network namespace — spelled out so the listener is
      # visible. Only the compose bridge and the loopback publish below can
      # reach it.
      - -httpListenAddr=:9428

      # No analytics flag, and none is needed: unlike Loki (reporting to
      # stats.grafana.org unless disabled) and Grafana (four env vars below),
      # VictoriaLogs has no usage-reporting to turn off — verified against
      # the pinned binary's full flag list. It boots and serves fully
      # offline, which the suites depend on.

    volumes:
      # 🚨 /mnt/slow, not /mnt/fast. Log data is append-mostly and
      # query-rarely, which is exactly what _overview.md's hardware section
      # says belongs on the 80 TB HDD tier; 100 GB of it is 0.125% of that
      # volume, against ~1.25% of the SSD. Everything lives under this ONE
      # directory (per-day partitions carry their own indexes — there is no
      # separate index tier to place): one directory is one thing to reason
      # about for the retention cap, for the disk alarm and for
      # `NOT_BACKED_UP`. Owner is root:root — the image runs as uid 0
      # (config User "0", read from the pinned image), NOT loki's 10001;
      # nixos/generate-stack-dirs.py carries the note.
      - /mnt/slow/victorialogs:/victoria-logs-data

    ports:
      # Loopback only. Nothing routes to it through Caddy — Grafana is the UI
      # and Alloy pushes over the compose network — so this publish exists
      # for the host-side consumers: gatus's /health probe (the container
      # cannot carry a healthcheck, below, so without this publish its
      # liveness would be observed by nothing), the query API for an ingest
      # probe (`/select/logsql/query` answers plain GETs — something Loki
      # never offered gatus), and vmui at /select/vmui/ for debugging when
      # Grafana itself is the broken thing. The `caddy-routes` lint prints a
      # NOTE about the unrouted publish; that NOTE is correct and this
      # comment is the answer to it. Same port Loki held — same role.
      - "127.0.0.1:10456:9428"

    # NO healthcheck stanza, and none is possible: the image is DISTROLESS
    # (v1.52.0 switched from Alpine precisely to shed the shell) — one static
    # binary at /victoria-logs-prod, no sh, no wget, no curl (verified:
    # `docker exec ... sh` fails with "executable file not found"). This is
    # the loki/gatus/karakeep-chrome situation and it gets the same
    # treatment: declare nothing rather than something that lies, and NEVER
    # make anything `depends_on: {condition: service_healthy}` against it —
    # compose errors outright (finding #42). GET /health (a literal "OK",
    # 200) is the probe, asserted by gatus and the victorialogs suite, not
    # by Docker.
    #
    # For sizing expectations: measured cold start to HTTP 200 on /health
    # with an empty data dir was under 3 s — a single binary opening an
    # empty directory, nothing like Loki's 17 s ring-and-WAL dance.

  # ---------------------------------------------------------------------------
  # Alloy — the collector
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: unless-stopped

    # ⚠ Note the `v`. grafana/alloy tags carry one and grafana/grafana does
    # not — two images from the same vendor, two conventions (victorialogs
    # above also carries one). Run ./tests/update-images.sh after any change
    # here; the image-pins lint is what stops a tag that does not exist from
    # shipping.

    # No `user:` — and that is deliberate, not an omission. The image sets no
    # USER, so this runs as uid 0, which is what makes the journal readable:
    # journal files are root:systemd-journal 0640 and the directories are
    # 2755, so a reader is either root (owner-read) or in gid 62. Adding
    # `user:` here without also granting group 62 turns this container into a
    # healthy process that collects nothing.
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # 🚨 THE TWO READ-ONLY MOUNTS THAT REPLACE THE DOCKER SOCKET.
      #   /var/log/journal  the persistent journal (services.journald.storage
      #                     is pinned to "persistent" for this reason).
      #   /etc/machine-id   the host's id, so the reader can find the
      #                     per-machine journal directory by name.
      # Together with config.alloy's `path = "/var/log/journal"` these are
      # belt AND braces: measured, EITHER the path or the machine-id mount is
      # enough on its own, and losing BOTH gives a healthy container that
      # forwards zero entries forever. The matrix is in config.alloy.
      # /run/log/journal is deliberately absent — see config.alloy.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Positions file + the write-ahead log that survives a VictoriaLogs
      # restart.
      - /mnt/fast/alloy:/var/lib/alloy/data

    # Spelled out rather than inherited from the image's CMD so the listen
    # address is visible: Alloy's UI/metrics server is bound to the
    # container's own loopback and is NOT published, has no Caddy route and no
    # Authentik application. It would otherwise be a second, unauthenticated
    # window onto the same data Grafana guards.
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345

    healthcheck:
      # The image has bash but NO curl, wget or nc (verified by exporting its
      # filesystem), so this speaks HTTP over bash's /dev/tcp. Measured
      # working inside the pinned image — /-/ready answers "HTTP/1.1 200 OK".
      #
      # ⚠ What it proves: the config parsed and the HTTP server is serving.
      # What it does NOT prove — and this is the failure mode that matters —
      # is that a single journal entry has been read or shipped. A wrong
      # `path`, a lost bind mount or a `user:` added to this service all leave
      # this container green and forwarding nothing.
      #
      # The victorialogs suite now covers that gap (it was uncovered in the
      # Loki era, stated loudly here): a container writes a marker line and
      # the suite polls VictoriaLogs' query API until it arrives — the whole
      # journald -> alloy -> store chain, or a red build. In production the
      # same check is the recommended gatus ingest probe against
      # /select/logsql/query; Alloy's loki_source_journal_target_lines_total
      # metric (loopback:12345, unpublished) is the manual cross-check.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      # Ordering only, NOT service_healthy — VictoriaLogs has no healthcheck
      # and naming it in a health condition is a hard compose error. Alloy
      # tolerates an absent store anyway: its WAL buffers and it retries.
      - victorialogs

  # ---------------------------------------------------------------------------
  # Grafana — the UI
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped

    ports:
      # Loopback only. Caddy is the only path in, and
      # grafana.svc.idanreed.com is `import protected`.
      - "127.0.0.1:10455:3000"

    volumes:
      - /mnt/fast/grafana:/var/lib/grafana
      # Provisioned datasource — the VictoriaLogs connection exists before
      # anyone logs in, and re-asserts itself on every deploy. Zero-UI
      # deployment is a stated principle of this fleet (_overview.md), and a
      # hand-clicked datasource lives only in grafana.db, i.e. only in the
      # backup.
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/victorialogs.yaml:ro

    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first decrypt (the .env not yet written), and the plain form
    # aborts the whole stack.
    env_file:
      - path: .env
        required: false

    environment:
      - TZ=America/Chicago

      # Grafana builds every absolute link (OAuth redirects, share URLs, alert
      # links) from this. Without it they point at localhost:3000.
      - GF_SERVER_ROOT_URL=https://grafana.svc.idanreed.com

      # 🚨 NO SIGN-UP, NO ANONYMOUS ACCESS. Forward auth is the outer gate but
      # Grafana's own login is the inner one, and its defaults are permissive
      # enough to matter if the outer gate is ever misconfigured.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false

      # 🚨 EGRESS OFF. Grafana phones home on a timer by default: usage
      # analytics, a version check against grafana.com, and a plugin-update
      # check, plus a news feed fetched when the home dashboard renders. The
      # test VMs run fully offline and this host has no reason to dial out;
      # each of these is a slow spinner or a stalled panel when it cannot.
      # This is also why the datasource plugin is NOT installed via
      # GF_INSTALL_PLUGINS, which downloads on every container create — see
      # the plugin note below.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false

      # ⚠ Grafana Live (websockets at /api/live/ws) is the one feature forward
      # auth will interfere with; the outpost answers the upgrade request with
      # a 302 and the socket never establishes. Nothing here needs it —
      # streaming panels are a real-time-dashboard feature and this is a log
      # search UI — so it is turned OFF explicitly rather than left to fail
      # confusingly. Turning it back on means carving /api/live/* out in
      # Authentik, not just flipping this.
      - GF_LIVE_MAX_CONNECTIONS=0

      # GF_SECURITY_ADMIN_USER and GF_SECURITY_ADMIN_PASSWORD come from .env
      # (see .sops.env.example). They are read ONLY on first start, when
      # grafana.db is created; changing them later needs `grafana-cli admin
      # reset-admin-password` or a wiped database.

    # 🚨 THE DATASOURCE PLUGIN IS A ONE-TIME OPERATOR STEP, NOT PART OF THE
    # DEPLOY. VictoriaLogs has NO Loki-compatible QUERY API (its ingestion
    # speaks Loki's push protocol; its query side is LogsQL only — verified
    # against the v1.52 docs), so a stock Grafana cannot query it: the
    # victoriametrics-logs-datasource plugin is required. Every hands-off
    # install path downloads at container create (GF_INSTALL_PLUGINS and
    # its preinstall successor both), which the offline test VMs and this
    # fleet's no-runtime-downloads rule forbid. So, ONCE, on the host:
    #
    #   curl -fL -o /tmp/vl-ds.zip \
    #     https://grafana.com/api/plugins/victoriametrics-logs-datasource/versions/0.31.0/download
    #   mkdir -p /mnt/fast/grafana/plugins
    #   unzip /tmp/vl-ds.zip -d /mnt/fast/grafana/plugins
    #   chmod +x /mnt/fast/grafana/plugins/victoriametrics-logs-datasource/victoriametrics_logs_backend_plugin_*
    #   docker restart grafana
    #
    # Grafana's default plugin dir is /var/lib/grafana/plugins — INSIDE the
    # bind above — so the plugin survives every redeploy with no compose
    # change. The catalog zip is SIGNED (no allow_loading_unsigned_plugins
    # needed) and the chmod is load-bearing: an extractor that drops
    # permission bits leaves the backend binary non-executable, and Grafana
    # logs "Could not start plugin backend" while reporting itself healthy.
    # All of this measured against grafana:13.2.0 + plugin v0.31.0 + the
    # pinned VictoriaLogs: datasource health answers "Data source is
    # working".
    #
    # Until that step runs, Grafana is HEALTHY BUT CANNOT QUERY — the
    # provisioned datasource sits unusable ("plugin not found" in the UI;
    # measured: startup, provisioning and /api/health are all unaffected,
    # which is what keeps the offline suites green with no plugin). The
    # stopgap log UI is vmui on the store's own loopback publish,
    # http://127.0.0.1:10456/select/vmui/ — debug-only, no vhost, by design.

    healthcheck:
      # -O /dev/null, NOT --spider: --spider issues a HEAD, and a route
      # registered GET-only answers 405, which leaves the container
      # permanently unhealthy while the app is fine.
      #
      # /api/health is honest here in a way most images' are not — it returns
      # {"database":"ok",...} and the `ok` is a real query against grafana.db,
      # so this catches an unwritable /mnt/fast/grafana rather than just
      # proving a socket is open. Measured cold start to healthy: 17 s.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    depends_on:
      # Ordering only; Grafana starts fine against an absent datasource and
      # the panel simply errors. VictoriaLogs has no healthcheck to condition
      # on.
      - victorialogs
