# Logging — VictoriaLogs + Alloy + Grafana (Monitoring range, 10455/10456).
# Design: ServerNotes/designs/service-monitoring-stack-research.md.
#
# 🚨 JOURNALD, NOT THE DOCKER SOCKET, and that is a hard rule: Alloy's
# discovery.docker/loki.source.docker path (and every "read-only" socket
# proxy) needs the root-equivalent docker socket in a networked container.
# nixos/configuration.nix sets docker's daemon-level log driver to journald
# with tag={{.Name}} instead, so Alloy reads the host journal through two
# read-only bind mounts. That switch also needs
# services.journald.rateLimitBurst = 0 — journald's rate limit drops lines
# from `docker logs` too. Never move one without the other.
#
# Uid conventions, all deliberate: victorialogs and alloy run as root (alloy
# needs it to read root:systemd-journal 0640 journal files), grafana as 472.
# Everything talks over the project's own bridge network by service name.

services:
  # Store
  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victorialogs
    restart: unless-stopped

    # VictoriaLogs has NO config file — every knob is a flag, so this list is
    # the whole config surface.
    command:
      - -storageDataPath=/victoria-logs-data

      # THE 100 GB CAP: over this, the oldest per-day partitions are dropped.
      # It always keeps the two most recent days, so a >100GiB two-day burst
      # overshoots — which is why the du-quota alarm in
      # nixos/configuration.nix survives as a failsafe.
      - -retention.maxDiskSpaceUsageBytes=100GiB

      # Secondary to the disk cap; an honesty bound, not a target. Entries
      # older than this are REJECTED at ingest (Alloy's max_age=12h bounds
      # cold-start replay anyway).
      - -retentionPeriod=1y

      - -httpListenAddr=:9428

    volumes:
      # /mnt/slow, not /mnt/fast: append-mostly, query-rarely. One directory
      # holds everything (per-day partitions carry their own indexes), which
      # is what the retention cap, the disk alarm and NOT_BACKED_UP key on.
      - /mnt/slow/victorialogs:/victoria-logs-data

    ports:
      # Loopback only, and unrouted by Caddy on purpose — Grafana and Alloy
      # reach it over the compose network. This publish is for the host-side
      # consumers: gatus's /health probe (the only liveness signal, since the
      # container can carry no healthcheck), the query API for the ingest
      # probe, and vmui when Grafana itself is the broken thing.
      #
      # 🚨 UNAUTHENTICATED, AND NOT ONLY TO THE LISTED CONSUMERS. VictoriaLogs
      # has no auth; this publish exposes /select/* (query) AND /insert/*
      # (write) to EVERY local uid on this host — including the Forgejo
      # runner's DynamicUser, which runs workflow code and cannot read
      # /var/log/journal (0640 root:systemd-journal). ACCEPTED, carried over
      # from code-review-2026-08-31 #11, whose marker lived in the deleted
      # loki.yaml: the same data is already on this host in the journal, and
      # dropping the publish costs gatus its liveness and ingest probes.
      # WIDER than Loki was: /insert/* means a local uid can also poison the
      # store, which is now where fail2ban and Authentik login_failed
      # forensics land. arch-security AS-9.
      - "127.0.0.1:10456:9428"

    # NO healthcheck stanza, and none is possible: the image is DISTROLESS —
    # one static binary, no shell. So nothing may ever `depends_on:
    # {condition: service_healthy}` against it; compose errors outright.
    # GET /health is the probe, run by gatus and the victorialogs suite.

  # Collector
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: alloy
    restart: unless-stopped

    # No `user:` — deliberate. The image sets no USER, so this runs as uid 0,
    # which is what makes the journal readable (root:systemd-journal 0640).
    # A `user:` without gid 62 gives a healthy container that collects nothing.
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # THE TWO READ-ONLY MOUNTS THAT REPLACE THE DOCKER SOCKET: the
      # persistent journal, and the host's machine-id so the reader can find
      # the per-machine journal directory. Either alone is sufficient
      # (measured); losing BOTH gives a healthy container forwarding zero
      # entries forever, so both are configured. See config.alloy.
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      # Positions file + the WAL that survives a VictoriaLogs restart.
      - /mnt/fast/alloy:/var/lib/alloy/data

    # Spelled out so the listen address is visible: Alloy's UI/metrics server
    # is container-loopback only, unpublished and unrouted — it would
    # otherwise be a second unauthenticated window onto Grafana's data.
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345

    healthcheck:
      # The image has bash but no curl, wget or nc, so this speaks HTTP over
      # bash's /dev/tcp.
      #
      # ⚠ It proves the config parsed and the server is serving — NOT that a
      # single journal entry was read. A wrong `path`, a lost bind mount or an
      # added `user:` all leave this green and forwarding nothing; the
      # victorialogs suite and the gatus ingest probe cover that gap.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      # Ordering only, never service_healthy — see the victorialogs block.
      - victorialogs

  # UI
  grafana:
    image: grafana/grafana:13.2.0
    container_name: grafana
    restart: unless-stopped

    ports:
      # Loopback only. Caddy is the only path in, and
      # grafana.svc.idanreed.com is `import protected`.
      - "127.0.0.1:10455:3000"

    volumes:
      - /mnt/fast/grafana:/var/lib/grafana
      # Provisioned, not hand-clicked: a datasource or dashboard built in the
      # UI lives only in grafana.db, i.e. only in the backup. Read-only
      # because allowUiUpdates is false and Grafana never writes back.
      #
      # ⚠ All three must be WORLD-READABLE on the host — grafana is uid 472
      # in-container. A 0600 uid-1000 delivery EACCESes the provisioner,
      # which Grafana treats as FATAL (an ~11s crash loop behind a 502).
      # Periphery's git clone gives 0644/0755 from the repo modes; a file
      # committed 0600 is the first thing to check.
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/victorialogs.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/fleet.yaml:ro
      - ./dashboards:/etc/grafana/dashboards:ro

    env_file: /run/stack-env/logging.env

    environment:
      - TZ=America/Chicago

      # Every absolute link (OAuth redirects, share URLs, alerts) is built
      # from this; without it they point at localhost:3000. The OAuth
      # redirect_uri is <this>/login/generic_oauth, byte for byte the one
      # grafana-oidc.yaml allows under strict matching.
      - GF_SERVER_ROOT_URL=https://grafana.svc.idanreed.com

      # Grafana's own login is the inner gate behind forward auth, with two
      # ways in on its login page: "Sign in with Authentik" (Admin group
      # only, below) and the local admin form. 🚨 The form is the BREAK-GLASS
      # — the one login that does not depend on the OIDC leg — so the login
      # form and basic auth are never disabled. The defaults are permissive,
      # hence no self sign-up and no anonymous access.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false

      # Authentik — native generic OAuth, provider + application "grafana-sso"
      # in headscale-vps/authentik/blueprints/custom/grafana-oidc.yaml (not
      # "grafana": that slug is forward auth's). Not auth.proxy, which the
      # Caddyfile explains.
      #
      # Endpoints set MANUALLY rather than by discovery, which keeps the IdP
      # out of the boot path: nothing is fetched from Authentik until someone
      # clicks the button, so an unreachable VPS costs the button, never the
      # boot. Authentik's authorize/token/userinfo endpoints are global; only
      # end-session carries the app slug.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.idanreed.com/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.idanreed.com/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.idanreed.com/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=https://auth.idanreed.com/application/o/grafana-sso/end-session/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET arrives from the stack env, built
      # by env.nix from secrets/shared.sops.json.
      #
      # An Admin member's first Authentik login creates the account;
      # GF_USERS_ALLOW_SIGN_UP above governs only the local form.
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      # A button, not a redirect. auto_login would bounce /login straight to
      # Authentik, and reaching the break-glass form would then need
      # /login?disableAutoLogin — a URL nobody remembers mid-outage. Sessions
      # last days, so the cost is one click per session.
      - GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN=false
      # Login is the email, NOT preferred_username. Grafana links an OAuth
      # user by `sub` alone (email lookup is off by default, and login is
      # never consulted), so an Authentik username equal to the local admin's
      # login fails that user's first sign-up with "user already exists".
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=email
      # 🚨 ADMIN-ONLY. Members of Authentik's Admin group get org Admin; the
      # expression yields NO role for anyone else, and strict mode refuses a
      # login without one, so no account is ever created for them. Not a
      # Viewer fallback: Viewer would be READ ACCESS TO EVERY LOG LINE for
      # the six friends — OSS Grafana has no datasource permissions, so any
      # signed-in user can POST arbitrary LogsQL to /api/ds/query, with or
      # without Explore.
      #
      # The role re-syncs on EVERY login, so one changed in the UI reverts.
      # Not GrafanaAdmin: server administration (users across orgs, plugins,
      # server settings) stays with the local break-glass account, so a
      # stolen Authentik session gets the org, not the server.
      - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'Admin') && 'Admin'"
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      # Off, and the default: once the login completes the session is
      # Grafana's own (7d idle / 30d max) and Authentik is not consulted
      # again — forward auth in front is what keeps checking the Authentik
      # session. On, Grafana would also track the access token's expiry and
      # log the user out whenever a refresh failed.
      - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=false

      # EGRESS OFF: analytics, version check, plugin-update check and the
      # news feed all phone home by default, and each is a stalled panel on
      # an offline host.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false

      # Grafana Live (websockets at /api/live/ws) is the one feature forward
      # auth breaks — the outpost 302s the upgrade. Nothing here needs it.
      # Turning it back on means an Authentik carve-out for /api/live/*.
      - GF_LIVE_MAX_CONNECTIONS=0

      # GF_SECURITY_ADMIN_USER/PASSWORD come from the stack env. Read ONLY on first
      # start; changing them later needs `grafana-cli admin
      # reset-admin-password` or a wiped grafana.db.

    # 🚨 THE DATASOURCE PLUGIN IS STILL A ONE-TIME OPERATOR STEP, and this pin
    # is why. VictoriaLogs has no Loki-compatible QUERY api, so a stock
    # Grafana cannot query it; until the plugin lands Grafana is HEALTHY BUT
    # CANNOT QUERY, with vmui at http://127.0.0.1:10456/select/vmui/ as the
    # stopgap.
    #
    # THE FIX IS BUILT AND WAITING: ./Dockerfile bakes the plugin in the way
    # stacks/caddy does, and .github/workflows/build-grafana-vlogs.yml
    # publishes ghcr.io/idanreed/grafana-vlogs:<grafana>-vl<plugin>. Moving
    # this `image:` to that tag deletes the step — deliberately NOT done here,
    # because the tag does not exist until the workflow has run once (see
    # docs/decisions.md).
    #
    # Interim, once, on the host:
    #
    #   curl -fL -o /tmp/vl-ds.zip \
    #     https://grafana.com/api/plugins/victoriametrics-logs-datasource/versions/0.31.0/download
    #   mkdir -p /mnt/fast/grafana/plugins
    #   unzip /tmp/vl-ds.zip -d /mnt/fast/grafana/plugins
    #   chmod +x /mnt/fast/grafana/plugins/victoriametrics-logs-datasource/victoriametrics_logs_backend_plugin_*
    #   docker restart grafana
    #
    # The plugin dir is inside the bind above, so it survives redeploys. The
    # chmod is load-bearing (`grafana cli` in the Dockerfile does it for you):
    # a non-executable backend binary logs "Could not start plugin backend"
    # while Grafana still reports itself healthy.

    healthcheck:
      # -O /dev/null, NOT --spider: --spider issues a HEAD and a GET-only
      # route answers 405, leaving the container unhealthy while it is fine.
      # /api/health really queries grafana.db, so this catches an unwritable
      # /mnt/fast/grafana rather than just an open socket.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    depends_on:
      # Ordering only; a panel against an absent datasource just errors.
      - victorialogs
