# Grafana dashboard provisioning — dashboards as files, not grafana.db rows,
# so they are reviewable, diffable and restored by a redeploy.
#
# ⚠ `allowUiUpdates: false` makes these read-only IN THE UI deliberately: you
# can still edit and explore, you just get "Save JSON to file" instead of
# saving over the file. The alternative lets the database and the file drift,
# and the file quietly loses.
#
# ⚠ `apiVersion: 1` is the provisioning schema version, not a Grafana
# version. Still 1 in 13.x; do not "update" it.

apiVersion: 1

providers:
  - name: fleet
    type: file
    # General folder; one dashboard today.
    folder: ""
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
