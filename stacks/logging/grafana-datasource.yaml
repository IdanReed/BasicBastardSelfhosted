# Grafana datasource provisioning — the VictoriaLogs connection, declared as a
# file so it is not a grafana.db row that exists only in the nightly dump.
# Mounted read-only; Grafana reconciles this directory at every start.
#
# 🚨 THE TYPE BELOW IS A PLUGIN, AND INSTALLING IT IS AN OPERATOR STEP (see
# compose.yaml's grafana block). VictoriaLogs has no Loki-compatible query
# api, so `type: loki` cannot point at it. Provisioning this without the
# plugin present is safe and measured: startup, provisioning and /api/health
# are unaffected, and the datasource just sits unusable until it lands.
#
# ⚠ `apiVersion: 1` is the provisioning schema version, not a Grafana
# version. Still 1 in 13.x; do not "update" it.

apiVersion: 1

datasources:
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource

    # 🚨 PINNED, NOT GENERATED, which is what makes a provisioned dashboard
    # possible: without it Grafana mints a random uid per install and every
    # panel comes up "datasource not found" on a fresh host.
    # dashboards/login-attempts.json hardcodes this string.
    uid: victorialogs
    # The service name on the compose bridge. NOT 127.0.0.1:10456 (a bridged
    # container cannot reach a loopback-bound host publish) and not a vhost.
    url: http://victorialogs:9428
    access: proxy

    isDefault: true

    # Reconcile on every start; without it a change here is ignored once the
    # datasource exists in grafana.db.
    editable: false

    jsonData:
      # Lines per query, raised from the 1000 default for incident
      # scrollback. Unrelated to retention, which is a victorialogs flag.
      maxLines: 5000

    # No `secureJsonData`: VictoriaLogs runs unauthenticated, so there is no
    # credential to provision and nothing here belongs in .sops.env.
