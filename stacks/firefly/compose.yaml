# Firefly III + data importer — personal finance (10303, 10305).
# Design: ServerNotes/designs/custom-finance.md and
# service-tracking-stack-research.md (the annex).
#
# 🚨 THE ONLY STACK WHOSE AUTHENTICATION IS ENTIRELY OUTSIDE ITSELF. Firefly has
# no OIDC at v6.6.6, so forward auth is the only SSO path — and remote_user_guard
# does NO VALIDATION of the header it trusts: whatever string arrives IS the
# account, and the first one seen becomes the owner. Hence the loopback-only
# publish, the HTTP_X_AUTHENTIK_EMAIL spelling (a header Caddy's copy_headers
# overwrites on every request), and the importer's own Authentik application.
#
# Backup: backup-prepare.sh's pg_dumpall loop derives `<svc>_db` and
# `pg_dumpall -U <svc>`, so `container_name: firefly_db` and
# POSTGRES_USER=firefly are load-bearing. Attachments live in
# /mnt/fast/firefly/upload, covered by the fast-volume include set.

services:
  # App
  # Runs as 33:33 (www-data) at build time; PUID/PGID are INERT here, so
  # /mnt/fast/firefly/upload must be pre-owned 33:33 by tmpfiles. Getting that
  # wrong produces a container that starts, serves, and fails only when someone
  # attaches a receipt.
  firefly:
    # Docker tag `version-6.6.6`; the git tag is `v6.6.6`, and `version-6.6.5`
    # does not exist. Bump CORE FIRST — the importer hard-gates on core >= 6.6.0.
    image: fireflyiii/core:version-6.6.6
    container_name: firefly
    depends_on:
      firefly_db:
        condition: service_healthy
    ports:
      - '127.0.0.1:10303:8080'
    volumes:
      - /mnt/fast/firefly/upload:/var/www/html/storage/upload
    environment:
      - TZ=America/Chicago
      - DEFAULT_LANGUAGE=en_US
      - APP_URL=https://firefly.svc.idanreed.com
      # Upstream's own documented value for "behind a reverse proxy"; safe
      # precisely because the publish is loopback-only.
      - TRUSTED_PROXIES=**
      - SITE_OWNER=idan@idanreed.com
      - DB_CONNECTION=pgsql
      - DB_HOST=firefly_db
      - DB_PORT=5432
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      # Forward auth
      - AUTHENTICATION_GUARD=remote_user_guard
      # 🚨 The default `REMOTE_USER` can NEVER match: RemoteUserGuard reads the
      # raw $_SERVER bag and the image's nginx never sets it. Inbound headers
      # arrive there CGI-mangled, hence this spelling.
      - AUTHENTICATION_GUARD_HEADER=HTTP_X_AUTHENTIK_EMAIL
      # The same header again, deliberately: this one is stored as the user's
      # remote_guard_alt_email preference and has no default at all.
      - AUTHENTICATION_GUARD_EMAIL=HTTP_X_AUTHENTIK_EMAIL
      # ⚠ NEVER set FIREFLY_III_CLIENT_ID: /oauth/authorize needs a StatefulGuard
      # and RemoteUserGuard is not one, so the flow fatals. Personal access
      # tokens only — minting one is an operator step (secrets.example.env).
      #
      # 🚨 LOAD-BEARING, and a bug fix rather than a nicety. Passport signs
      # every access token with an RSA pair at storage/oauth-{public,private}
      # .key, which CreateStuff generates only when ABSENT — and `storage` is
      # NOT persisted here (only storage/upload is). Without these, every
      # container recreate mints a NEW pair and silently invalidates the
      # hand-minted FIREFLY_III_ACCESS_TOKEN: the importer starts 401ing with
      # nothing said at deploy time. config/passport.php reads them, and
      # PassportServiceProvider::makeCryptKey does
      # str_replace('\n', "\n", ...) — which is why the stored value is ONE
      # LINE with literal \n (the rendered env single-quotes it, so compose
      # leaves the backslashes alone).
      - PASSPORT_PRIVATE_KEY=${PASSPORT_PRIVATE_KEY:-}
      - PASSPORT_PUBLIC_KEY=${PASSPORT_PUBLIC_KEY:-}
      #
      # Healthcheck
      # The image's own HEALTHCHECK is correct; only its default path is a lie —
      # `/healthcheck` routes to php-fpm's ping, which answers before Laravel is
      # invoked and so reports healthy against a dead database. `/health` is a
      # real Laravel route running User::count(). Repairing the variable is why
      # there is no `healthcheck:` block here.
      - HEALTHCHECK_PATH=/health
      # Offline / quiet. All three already default this way at v6.6.6; set
      # explicitly because they are the settings that would otherwise reach out
      # from a tailnet-only host, and because the env var only seeds the admin-UI
      # value. SEND_ERROR_MESSAGE defaults TRUE and mails stack traces.
      - ENABLE_EXTERNAL_MAP=false
      - ENABLE_EXTERNAL_RATES=false
      - SEND_ERROR_MESSAGE=false
      - MAIL_MAILER=log
      # APP_KEY, DB_PASSWORD and STATIC_CRON_TOKEN arrive from .env.
      # ⚠ APP_KEY must be EXACTLY 32 characters (or `base64:` + 32 bytes). A
      # wrong length fails as "Auth driver [remote_user_guard] ... is not
      # defined": the encrypter fails during config resolution and guard
      # registration collapses downstream.
    env_file: /run/stack-env/firefly.env
    # Interval ONLY — test, timeout and retries still come from the image
    # (docker merges an unset `test` from the image's HEALTHCHECK). The image
    # probes every 5 s, and every probe reaches RemoteUserGuard without the
    # forward-auth header and logs `production.ERROR: No user in header` —
    # 12 false errors a minute. start_interval keeps first-boot readiness
    # (the importer's service_healthy gate) as fast as before.
    healthcheck:
      interval: 60s
      # start_interval is rejected without start_period; 5 min covers a
      # first-boot migration.
      start_period: 300s
      start_interval: 5s
    restart: unless-stopped

  # Database
  # Stay on 17: postgres:18-alpine moved PGDATA to /var/lib/postgresql/18/docker.
  # Same patch pin as paperless so the two share one images.nix entry.
  firefly_db:
    image: postgres:17.9-alpine
    container_name: firefly_db
    volumes:
      - /mnt/fast/firefly/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=firefly
      - POSTGRES_DB=firefly
      # POSTGRES_PASSWORD arrives from .env and must match DB_PASSWORD.
    env_file: /run/stack-env/firefly.env
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root), which is not
      # a role, and reports "no response" against a healthy server.
      test: ['CMD-SHELL', 'pg_isready -U firefly -d firefly']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Importer
  # 🚨 IT HAS NO AUTHENTICATION AND CANNOT BE GIVEN ANY in personal-access-token
  # mode, while holding a token with full access to every transaction. Its own
  # Authentik application (firefly-importer.svc.idanreed.com) is a hard
  # requirement, not defence in depth — one forward_single provider answers for
  # exactly one hostname, so it cannot be merged into Firefly's.
  #
  # No volume: its state is uploaded import configurations held in the session.
  firefly_importer:
    # The importer's repo carries BOTH tag conventions live, and its `-cli`
    # variants are a DIFFERENT (headless) image. Core and importer version
    # independently — never assume matching pins.
    image: fireflyiii/data-importer:version-2.3.4
    container_name: firefly_importer
    depends_on:
      # service_healthy: the importer checks /api/v1/about at runtime and
      # hard-gates on core >= 6.6.0, so starting against a still-migrating
      # Firefly produces a confusing version error.
      firefly:
        condition: service_healthy
    ports:
      - '127.0.0.1:10305:8080'
    environment:
      - TZ=America/Chicago
      # Internal, over the compose network — what the version gate and every API
      # call use. No trailing slash.
      - FIREFLY_III_URL=http://firefly:8080
      # The browser-facing name, used to build links back into Firefly.
      - VANITY_URL=https://firefly.svc.idanreed.com
      - TRUSTED_PROXIES=**
      - EXPECT_SECURE_URL=true
      # Same php-fpm ping lie as core, same one-variable fix. The importer's
      # /health is a bare 200 with no upstream check — it will NOT detect a
      # broken connection to Firefly.
      - HEALTHCHECK_PATH=/health
      # The image default is debug: ~8 lines per request, including one
      # "Have NO valid secrets" per gatus probe while no token is minted.
      - LOG_LEVEL=info
      # CAN_POST_AUTOIMPORT, CAN_POST_FILES and IMPORT_DIR_ALLOWLIST are
      # deliberately UNSET: they turn on unauthenticated POST endpoints gated
      # only by AUTO_IMPORT_SECRET, on a service that already has no auth.
      #
      # FIREFLY_III_ACCESS_TOKEN arrives from .env and must be minted by hand
      # once — there is no CLI or API path to it.
      #
      # SimpleFIN: configured but NOT scheduled, and that is the point.
      # SIMPLEFIN_TOKEN (from .env) is a base64 CLAIM URL that the Bridge
      # invalidates on first use; the resulting access URL lands in the
      # importer's downloadable Configuration JSON, which is session state
      # because this service has no volume. Scheduling it would need a volume,
      # an unauthenticated POST endpoint and a plaintext file that reads every
      # linked bank account — an OPERATOR decision, see ServerNotes/designs/_todo.md.
      # The SIMPLEFIN_* tuning knobs stay unset; config/simplefin.php defaults
      # them all.
    env_file: /run/stack-env/firefly.env
    restart: unless-stopped

# NO cron sidecar: upstream's runs `apk add tzdata` at container start, which
# this host's offline rule forbids. Firefly's recurring transactions come from a
# systemd timer hitting GET /api/v1/cron/$STATIC_CRON_TOKEN (nixos/configuration.nix).
# That route takes no auth and the token must be EXACTLY 32 characters — at any
# other length it falls through to per-user token handling and 500s.
