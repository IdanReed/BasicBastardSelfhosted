# Excalidraw workspace — AstraDraw (10406 app, 10408 collab ws, 10409 api).
# Design: ServerNotes/designs/service-bakeoff.md (2026-09-01).
#
# ⚠ ALPHA by a solo developer, chosen because it is the only 2026 option that
# delivers a persistent server-side scene library at all. Every load-bearing
# behaviour below was measured against the pinned images; treat version bumps as
# re-verification events.
#
# ONE VHOST, PATH-ROUTED — the frontend expects same-origin siblings:
#   /           -> app  (10406)   static SPA shell, nginx
#   /socket.io  -> room (10408)   collab websocket relay
#   /api/v2     -> api  (10409)   auth + workspace + scene storage
# Postgres is deliberately not published.
#
# AUTH: no forward auth (the outline/tandoor posture) — AstraDraw has a local
# admin seeded from env plus native OIDC. ENABLE_REGISTRATION=false is
# load-bearing. The room relay is unauthenticated by design: joining needs the
# room id AND its E2E key, which travels in the URL fragment.
#
# EGRESS: containers make none (proven on a no-egress network). The user's
# BROWSER prefers Excalidraw's font CDN and one fonts.googleapis.com face, both
# with working fallbacks; simpleanalytics is gated off below.
#
# BACKUP: one Postgres cluster holds both databases — `excalidraw` (Prisma) and
# `excalidraw_storage` (keyv scene payloads) — so one pg_dumpall captures
# everything. backup-prepare.sh derives container `excalidraw_db` and
# POSTGRES_USER=excalidraw; /mnt/fast/excalidraw/pgdata is excluded from the raw
# snapshot like every pgdata.
#
# ⚠ The api PROCESS EXITS when its Postgres goes away (unhandled pool error);
# restart: unless-stopped is the recovery path. Expect one restart cycle after
# any db restart — it is not a crash loop.

services:
  # Frontend
  # Static SPA under nginx. The entrypoint writes the VITE_* values below into
  # /env-config.js at start, which is what makes a PREBUILT image deployable
  # behind our vhost — stock Excalidraw bakes these at compile time.
  excalidraw:
    image: astradraw/app:1.0.1
    container_name: excalidraw
    ports:
      - '127.0.0.1:10406:80'
    environment:
      # WS_SERVER_URL is the ORIGIN only — the socket.io client appends
      # /socket.io itself, which is the path Caddy routes to :10408.
      - VITE_APP_WS_SERVER_URL=https://excalidraw.svc.idanreed.com
      - VITE_APP_BACKEND_V2_GET_URL=https://excalidraw.svc.idanreed.com/api/v2/scenes/
      - VITE_APP_BACKEND_V2_POST_URL=https://excalidraw.svc.idanreed.com/api/v2/scenes/
      - VITE_APP_STORAGE_BACKEND=http
      - VITE_APP_HTTP_STORAGE_BACKEND_URL=https://excalidraw.svc.idanreed.com/api/v2
      # Load-bearing: index.html only injects the simpleanalytics <script> when
      # this is not "true". FIREBASE_CONFIG stays unset (defaults to "{}").
      - VITE_APP_DISABLE_TRACKING=true
    healthcheck:
      # Proves nginx serves AND the entrypoint completed (it writes env-config.js
      # before exec'ing nginx); cannot prove the injected URLs are right — the
      # suite greps env-config.js for that.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Collab relay
  # Stateless: scene bytes ride the sockets end-to-end encrypted.
  excalidraw_room:
    image: astradraw/room:1.0.1
    container_name: excalidraw_room
    ports:
      - '127.0.0.1:10408:80'
    environment:
      # Pinned so the publish above cannot silently diverge on a bump.
      - PORT=80
      # Exact origin, not upstream's '*'. CORS is browser-enforced, so this does
      # not gate curl — it stops other tailnet origins scripting the relay from
      # a logged-in browser.
      - CORS_ORIGIN=https://excalidraw.svc.idanreed.com
    healthcheck:
      # Engine.IO polling handshake — a 200 means socket.io answered with a
      # session id, not merely that the port accepted.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:80/socket.io/?EIO=4&transport=polling']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # API
  # Auth, workspaces, scene storage (NestJS + Prisma). Stateless itself.
  excalidraw_api:
    image: astradraw/api:1.0.1
    container_name: excalidraw_api
    ports:
      - '127.0.0.1:10409:8080'
    # Carries POSTGRES_PASSWORD, STORAGE_URI, JWT_SECRET, ROOM_KEY_SECRET and
    # ADMIN_PASSWORD — see secrets.example.env.
    env_file: /run/stack-env/excalidraw.env
    environment:
      - TZ=America/Chicago
      # Flips the session cookie to Secure, correct behind the HTTPS vhost.
      - NODE_ENV=production
      - PORT=8080
      # keyv = scene blobs in Postgres, chosen over S3/MinIO so this stack has
      # one stateful store and one dump line.
      # 🚨 STORAGE_URI (from .env) must point at the excalidraw_storage database,
      # NOT at `excalidraw` — see keyv-init.sql. And it must be SET at all: unset,
      # the api logs one WARN and stores scenes in process memory.
      - STORAGE_BACKEND=keyv
      - POSTGRES_HOST=excalidraw_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=excalidraw
      - POSTGRES_DB=excalidraw
      # OIDC redirects and invite links are built from this.
      - APP_URL=https://excalidraw.svc.idanreed.com
      # Auth posture: local admin seeded at first boot, registration closed so
      # reaching the vhost does not mint accounts. Super-admin is matched by
      # email, so add the operator's Authentik address before enabling OIDC.
      - ENABLE_LOCAL_AUTH=true
      - ENABLE_REGISTRATION=false
      - ADMIN_USERNAME=admin
      - ADMIN_EMAIL=admin@idanreed.com
      - SUPERADMIN_EMAILS=admin@idanreed.com
      # OIDC
      # Ready but OFF (empty issuer = local auth only). Turning it on needs an
      # Authentik provider plus, in .env, OIDC_ISSUER_URL / OIDC_CLIENT_ID /
      # OIDC_CLIENT_SECRET / OIDC_CALLBACK_URL (.../api/v2/auth/callback) — and
      # a key-set change, so the stack-env-drift lint applies.
      # Discovery is boot-safe (measured: the suite with an unreachable issuer
      # comes up healthy offline), unlike wealthfolio's.
      #
      # Prisma CLI phone-home during the boot-time migrate — off.
      - CHECKPOINT_DISABLE=1
    depends_on:
      excalidraw_db:
        # Real condition, not ordering: the entrypoint migrates immediately and
        # its fallback chain ends in "continue anyway", so racing an unready db
        # would serve against an empty schema instead of failing loudly.
        condition: service_healthy
    healthcheck:
      # node:20-slim ships no wget and no curl, so node itself is the probe.
      # /api/v2/auth/status touches no table, so a dead db leaves this GREEN —
      # smaller than it looks, because the api process exits on a lost
      # connection and shows up as a restarting container.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8080/api/v2/auth/status').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Database
  # The only stateful service here. Stay on 17 (18 moved PGDATA).
  excalidraw_db:
    image: postgres:17.9-alpine
    container_name: excalidraw_db
    volumes:
      - /mnt/fast/excalidraw/pgdata:/var/lib/postgresql/data
      # 🚨 Load-bearing: creates the SECOND database with the keyv table
      # pre-made. Runs once, during initdb, when postgres is not yet accepting
      # TCP — so the api cannot race it. See keyv-init.sql.
      - ./keyv-init.sql:/docker-entrypoint-initdb.d/10-keyv-init.sql:ro
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=excalidraw
      - POSTGRES_DB=excalidraw
      # POSTGRES_PASSWORD arrives from .env and must match the password embedded
      # in STORAGE_URI.
    env_file: /run/stack-env/excalidraw.env
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root), which is not
      # a role.
      test: ['CMD-SHELL', 'pg_isready -U excalidraw -d excalidraw']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
