# Tandoor Recipes (Food range, port 10350).
# Design: ServerNotes/designs/service-food-stack-research.md.
# _overview.md owns the port/auth row.
#
# SEPARATE FROM WGER — a real collision, not tidiness: both Django apps read
# the BARE name `SECRET_KEY` (and `POSTGRES_PASSWORD`), and `env_file` hands
# every service the whole .env — one stack would silently share one
# session-signing key. Prefixing does not help (finding #25 in reverse).
# Two stacks, two .env files, no collision.
#
# Backup contract: `tandoor` is named in nixos/backup-prepare.sh's pg_dumpall
# loop, so `container_name: tandoor_db` and `POSTGRES_USER=tandoor` are
# load-bearing.

services:
  # ---------------------------------------------------------------------------
  # tandoor — recipe manager.
  #
  # 🚨 DATABASE SETTINGS LIVE HERE, NOT IN .env — THE WHOLE POINT.
  # settings.py falls back to sqlite when DB_ENGINE/POSTGRES_DB are absent,
  # with no error, warning, or log line (boot.sh's Postgres wait is itself
  # gated on DB_ENGINE). So finding #11's residual window is NOT a loud
  # guard for Tandoor: a deploy that races the decrypt gets a green
  # healthcheck, an ephemeral SQLite in the writable layer, a working setup
  # wizard, and an idle tandoor_db — recipes vanish on the next `up` while
  # backup-prepare.sh dumps the real (empty) Postgres nightly with rc=0.
  # None of the five is a secret; pinning them here turns that silent
  # failure into a Postgres authentication error.
  # ---------------------------------------------------------------------------
  tandoor:
    # No `v` prefix.
    image: ghcr.io/tandoorrecipes/recipes:2.6.13
    container_name: tandoor
    depends_on:
      tandoor_db:
        condition: service_healthy
    ports:
      - '127.0.0.1:10350:80'
    volumes:
      # Recipe images — the payload, and the only thing here worth backing up.
      - /mnt/fast/tandoor/mediafiles:/opt/recipes/mediafiles
      # staticfiles is a NAMED volume because boot.sh runs
      # `collectstatic --clear` on every start: it is derived, it is rewritten
      # wholesale, and a bind mount would put churn into the /mnt/fast include
      # set for no benefit.
      - tandoor_staticfiles:/opt/recipes/staticfiles
    environment:
      - TZ=America/Chicago
      # The five that must not be in .env — see this service's header.
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tandoor
      - POSTGRES_USER=tandoor
      # ⚠ DATABASE_URL is deliberately UNSET and must stay that way: it is
      # checked BEFORE the POSTGRES_* branch, so setting it silently
      # overrides everything above (and accepts sqlite://).
      - ALLOWED_HOSTS=tandoor.svc.idanreed.com,127.0.0.1,localhost
      - CSRF_TRUSTED_ORIGINS=https://tandoor.svc.idanreed.com
      # Nginx inside the container serves media; gunicorn should not.
      - GUNICORN_MEDIA=0
      # No open registration. The superuser is created by tandoor_init.
      - ENABLE_SIGNUP=0
      # POSTGRES_PASSWORD and SECRET_KEY arrive from .env.
      # ⚠ An unset SECRET_KEY does NOT crash: settings.py falls back to the
      # published literal 'INSECURE_STANDARD_KEY_SET_IN_ENV' with only a
      # [WARNING] — every session cookie signed with a public, CONSTANT key,
      # so nothing looks wrong across restarts. Same class as finding #17.
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # ⚠ `wget`, not `curl`: the image apk-dels curl with its build-deps;
      # busybox wget is what is left.
      # /openapi/ is drf-spectacular's schema view, AllowAny. It introspects
      # every serializer — not free; keep the interval at 30s.
      # ⚠ A `/`-shaped probe proves nothing: cookbook.urls ends in a
      # CATCH-ALL to the Vue frontend, so any path returns 200 with the SPA
      # shell — "path → 200" is meaningless without checking the body.
      # NOT covered: a Postgres that dies AFTER start (boot.sh only gates
      # start). The honest mitigation is Gatus on a real page, not a
      # cleverer probe.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '10', 'http://127.0.0.1:80/openapi/']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  tandoor_db:
    image: postgres:17.9-alpine
    container_name: tandoor_db
    volumes:
      - /mnt/fast/tandoor/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=tandoor
      - POSTGRES_DB=tandoor
      # POSTGRES_PASSWORD arrives from .env and is shared with the app.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root here), which
      # does not exist as a role.
      test: ['CMD-SHELL', 'pg_isready -U tandoor -d tandoor']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # tandoor_init — headless first-run (annex §3.1; see tandoor-init.py):
  # Tandoor's only path to a first superuser is a browser form, no management
  # command. Runs from the SAME image so the ORM/settings/django-scopes are
  # the app's own — a python:alpine sidecar could not import cookbook.
  # ---------------------------------------------------------------------------
  tandoor_init:
    image: ghcr.io/tandoorrecipes/recipes:2.6.13
    container_name: tandoor_init
    depends_on:
      # service_healthy, not service_started: boot.sh runs the migrations, and
      # this script queries tables they create.
      tandoor:
        condition: service_healthy
    volumes:
      - ./tandoor-init.py:/init/tandoor-init.py:ro
    # `venv/bin/python`, not the system python3: the image installs its
    # dependencies into /opt/recipes/venv, and /usr/local/bin/python3 cannot
    # import django at all.
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'cd /opt/recipes && exec venv/bin/python manage.py shell < /init/tandoor-init.py'
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tandoor
      - POSTGRES_USER=tandoor
    env_file:
      - path: .env
        required: false
    restart: "no"

volumes:
  # Derived: collectstatic --clear rewrites it on every start.
  tandoor_staticfiles:
