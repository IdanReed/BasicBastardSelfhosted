# Tandoor Recipes (10350).
#
# SEPARATE FROM WGER — a real collision, not tidiness: both are Django apps
# reading the BARE names `SECRET_KEY` and `POSTGRES_PASSWORD`, and `env_file`
# hands every service the whole .env, so one stack would share one
# session-signing key.
#
# Backup: `tandoor` is named in backup-prepare.sh's pg_dumpall loop, so
# `container_name: tandoor_db` and POSTGRES_USER=tandoor are load-bearing.

services:
  # App
  # 🚨 DATABASE SETTINGS LIVE HERE, NOT IN .env — the whole point. settings.py
  # falls back to sqlite when DB_ENGINE/POSTGRES_DB are absent, with no error,
  # warning or log line, so a deploy that races the decrypt would get a green
  # healthcheck, an ephemeral SQLite in the writable layer, and an idle
  # tandoor_db — recipes vanishing on the next `up` while backup-prepare.sh
  # dumps the real (empty) Postgres nightly with rc=0. None of the five is a
  # secret; pinning them turns that into a Postgres authentication error.
  tandoor:
    # No `v` prefix.
    image: ghcr.io/tandoorrecipes/recipes:2.6.13
    container_name: tandoor
    depends_on:
      tandoor_db:
        condition: service_healthy
    ports:
      - '127.0.0.1:10350:80'
    volumes:
      # Recipe images — the payload, and the only thing here worth backing up.
      - /mnt/fast/tandoor/mediafiles:/opt/recipes/mediafiles
      # NAMED volume: boot.sh runs `collectstatic --clear` on every start, so
      # this is derived and rewritten wholesale — a bind mount would put churn
      # into the /mnt/fast include set.
      - tandoor_staticfiles:/opt/recipes/staticfiles
    environment:
      - TZ=America/Chicago
      # The five that must not be in the stack env — see this service's header.
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tandoor
      - POSTGRES_USER=tandoor
      # ⚠ DATABASE_URL is deliberately UNSET and must stay that way: it is
      # checked BEFORE the POSTGRES_* branch, so setting it silently overrides
      # everything above (and accepts sqlite://).
      - ALLOWED_HOSTS=tandoor.svc.idanreed.com,127.0.0.1,localhost
      - CSRF_TRUSTED_ORIGINS=https://tandoor.svc.idanreed.com
      # Nginx inside the container serves media; gunicorn should not.
      - GUNICORN_MEDIA=0
      # No open local registration; the superuser comes from tandoor_init.
      - ENABLE_SIGNUP=0
      # OIDC
      # django-allauth, lazy discovery (first login), so no boot hazard; the
      # local superuser stays as fallback.
      # 🚨 Python-literal JSON (True, not true): settings.py runs
      # ast.literal_eval first and lowercase true is a ValueError. provider_id
      # "authentik" fixes the callback path the blueprint registers.
      - SOCIAL_PROVIDERS=allauth.socialaccount.providers.openid_connect
      - 'SOCIALACCOUNT_PROVIDERS={"openid_connect":{"OAUTH_PKCE_ENABLED":True,"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"tandoor","secret":"${TANDOOR_OIDC_CLIENT_SECRET}","settings":{"server_url":"https://auth.idanreed.com/application/o/tandoor/.well-known/openid-configuration"}}]}}'
      # allauth's default, pinned so a future change cannot silently close it.
      # ⚠ REMOTE_USER_AUTH must NEVER be set — it removes /setup/.
      - SOCIALACCOUNT_AUTO_SIGNUP=1
      # POSTGRES_PASSWORD, SECRET_KEY and TANDOOR_OIDC_CLIENT_SECRET arrive from the stack env.
      # ⚠ An unset SECRET_KEY does NOT crash: settings.py falls back to the
      # published literal 'INSECURE_STANDARD_KEY_SET_IN_ENV' with only a
      # [WARNING], so every session cookie is signed with a public constant key
      # and nothing looks wrong across restarts.
    env_file: /run/stack-env/tandoor.env
    healthcheck:
      # ⚠ `wget`, not `curl`: the image apk-dels curl with its build-deps.
      # /openapi/ is drf-spectacular's AllowAny schema view — it introspects
      # every serializer, so keep the interval at 30s. A `/`-shaped probe would
      # prove nothing: cookbook.urls ends in a CATCH-ALL to the Vue frontend, so
      # any path returns 200 with the SPA shell.
      # NOT covered: a Postgres that dies AFTER start (boot.sh only gates start).
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '10', 'http://127.0.0.1:80/openapi/']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Database
  tandoor_db:
    image: postgres:17.9-alpine
    container_name: tandoor_db
    volumes:
      - /mnt/fast/tandoor/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=tandoor
      - POSTGRES_DB=tandoor
      # POSTGRES_PASSWORD arrives from the stack env and is shared with the app.
    env_file: /run/stack-env/tandoor.env
    healthcheck:
      # -U is required: pg_isready defaults to the OS user (root), not a role.
      test: ['CMD-SHELL', 'pg_isready -U tandoor -d tandoor']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Init
  # Tandoor's only path to a first superuser is a browser form. Runs from the
  # SAME image so the ORM/settings/django-scopes are the app's own — a
  # python:alpine sidecar could not import cookbook. See tandoor-init.py.
  tandoor_init:
    image: ghcr.io/tandoorrecipes/recipes:2.6.13
    container_name: tandoor_init
    depends_on:
      # service_healthy: boot.sh runs the migrations this script's queries need.
      tandoor:
        condition: service_healthy
    volumes:
      - ./tandoor-init.py:/init/tandoor-init.py:ro
    # `venv/bin/python`, not the system python3: the image installs its
    # dependencies into /opt/recipes/venv and /usr/local/bin/python3 cannot
    # import django at all.
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'cd /opt/recipes && exec venv/bin/python manage.py shell < /init/tandoor-init.py'
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor_db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tandoor
      - POSTGRES_USER=tandoor
    env_file: /run/stack-env/tandoor.env
    restart: "no"

volumes:
  tandoor_staticfiles:
