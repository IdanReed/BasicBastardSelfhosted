  # Static SPA shell from nginx; nothing deeper to ask it.
  - name: "excalidraw-app (service)"
    group: "service"
    url: "http://127.0.0.1:10406/"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  # Engine.IO handshake — socket.io answering, not merely a TCP accept.
  - name: "excalidraw-room (service)"
    group: "service"
    url: "http://127.0.0.1:10408/socket.io/?EIO=4&transport=polling"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  # Liveness plus "auth config parsed" — it touches no table, so a dead Postgres
  # leaves it green (the api process exits on db loss, which is that signal).
  # The body pins keep registration closed.
  - name: "excalidraw-api (service)"
    group: "service"
    url: "http://127.0.0.1:10409/api/v2/auth/status"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].localAuthEnabled == true"
      - "[BODY].registrationEnabled == false"
    alerts:
      - type: ntfy

