# Gatus — availability monitoring for the whole fleet.
# Design: ServerNotes/designs/service-monitoring-stack-research.md.
#
# WHY GATUS AND NOT UPTIME KUMA. Kuma has no headless path at all: its v2
# removed the JSON backup/restore ("backing up the data directory is the only
# supported method"), its first admin exists only as a socket.io event on an
# API whose own wiki disclaims stability, and its image healthcheck LOGS the
# status code and exits 0 regardless — green on a 500, green on the setup
# wizard. Gatus is a config file. This file IS the deployment.
#
# 🚨 TWO PROBES PER SERVICE, MEASURING DIFFERENT THINGS. Monitoring only
# through Caddy is wrong here, and monitoring only loopback is wrong here, for
# opposite reasons:
#
#   path probe    https://<svc>.svc.idanreed.com/  proves Caddy is up, the
#                 wildcard cert is valid, DNS resolves, and — for protected
#                 hosts — that the tailnet hop and the VPS outpost work.
#                 BLIND to the service, because a protected route 302s before
#                 reaching it.
#   service probe http://127.0.0.1:<port>/         proves the app answers.
#                 BLIND to Caddy, TLS, host routing and forward auth.
#
# 🚨 A PATH PROBE AGAINST A PROTECTED VHOST MEASURES AUTHENTIK, NOT THE
# SERVICE. The (protected) snippet 302s an unauthenticated request, so a
# default `[STATUS] == 200` marks every forward-auth service DOWN forever — and
# "fixing" that by accepting 200-399 turns the probe into an Authentik liveness
# check wearing the service's name. Protected hosts therefore assert `== 302`
# explicitly and are NAMED as what they measure.
#
# 🚨 SERVICE PROBES SEND THE REAL Host HEADER where the app is host-sensitive.
# Findings #27 and #15: Dawarich's host_authorization explicitly EXCLUDES
# /api/v1/health, so a wrong APPLICATION_HOSTS is invisible to a health
# endpoint and fatal to every browser request; qBittorrent 401s when the Host
# port differs. One line each, and it is the highest-value thing in this file.
#
# ⚠ NO `security:` BLOCK. Gatus's OIDC calls oidc.NewProvider at startup with
# no retry and PANICS on failure, so a tailnet blip during a redeploy would
# restart-loop the monitoring service. And its own security block does not
# protect the uptime history anyway — the SPA, /api/v1/config and every
# /v1/endpoints/:key/uptimes route are on the UNPROTECTED router. Caddy's
# forward auth plus the loopback bind is the real control.
#
# ⚠ Gatus expands $VAR in this YAML, and Compose expands env_file values too
# (finding #30) — any secret reaching here passes TWO expansion layers. Keep
# values $-free.

storage:
  type: sqlite
  path: /data/gatus.db

web:
  # Bound to loopback even though the container is on the HOST network, which
  # is the whole reason this stack needs a host-network-declared entry: it has
  # no `ports:` for loopback-binding to check. A container on a bridge cannot
  # reach a 127.0.0.1 publish, and only three stacks join the shared `homelab`
  # network — so a prober that wants to see the services themselves has to be
  # here.
  address: 127.0.0.1
  port: 10450

alerting:
  ntfy:
    url: http://127.0.0.1:10001
    topic: monitoring
    priority: 4
    # NO `token`. Validate() rejects any token not starting with `tk_`, and the
    # fleet's ntfy sets auth-default-access: read-write, so anonymous publish
    # works. A placeholder here would reject the whole provider.
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: "arcane (path: caddy -> authentik outpost)"
    group: "path"
    url: "https://arcane.svc.idanreed.com/"
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"
      - "[CERTIFICATE_EXPIRATION] > 240h"

    alerts:
      - type: ntfy

  - name: "arcane (service)"
    group: "service"
    url: "http://127.0.0.1:10000/"
    interval: 1m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] < 400"
    alerts:
