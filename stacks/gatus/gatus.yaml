  # which failing would hide the dashboard during the outage it is reporting.
  # No service twin: 10450 is in gatus-target-coverage's EXEMPT_SERVICE, because
  # probing itself is a tautology.
  - name: "gatus (path: caddy -> authentik outpost)"
    group: "path"
    url: "https://gatus.svc.idanreed.com/"
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy

  # Not behind forward auth (own security-token login), so no 302 is expected.
  # `/` is an Angular SPA shell that 302s to a locale-prefixed route, hence
