  # Asserts the BODY: "database":"ok" is a real query against grafana.db, so a
  # bare [STATUS] == 200 would be satisfied by an unwritable database.
  - name: "grafana (service)"
    group: "service"
    url: "http://127.0.0.1:10455/api/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].database == ok"
    alerts:
