  # 🚨 THE ONLY LIVENESS SIGNAL VICTORIALOGS HAS: its distroless image carries
  # no healthcheck, so the unhealthy-containers timer is blind to it, and it has
  # no vhost, so no path probe is possible.
  - name: "victorialogs (service)"
    group: "service"
    url: "http://127.0.0.1:10456/health"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  # 🚨 THE INGEST PROBE: any journal line from the last 15 minutes. An empty
  # result is 200 with a ZERO-BYTE body, so len([BODY]) > 0 means the pipeline
  # shipped something recently — a healthy-but-collecting-nothing Alloy fails
  # THIS while passing every healthcheck.
  - name: "victorialogs (ingest)"
    group: "service"
    url: "http://127.0.0.1:10456/select/logsql/query?query=_time%3A15m%20%7Bjob%3D%22systemd-journal%22%7D&limit=1"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) > 0"
    alerts:
      - type: ntfy

  # 🚨 THE ONLY ALARM ON THE VPS SHIPPER, and every part of that path fails
  # QUIETLY: a one-sided token rotation or a lost tailnet route makes caddy 401
  # while Alloy retries into its WAL and alloy.service stays `active`. The probe
  # above cannot cover it — this host's own Alloy satisfies that one alone.
  # 30m, not 15m: the WAL rides out short outages and then replays, so a shorter
  # window would alert on the recovery it exists to make invisible.
  - name: "victorialogs (vps ingest)"
    group: "service"
    url: "http://127.0.0.1:10456/select/logsql/query?query=_time%3A30m%20%7Bhost%3D%22headscale-vps%22%7D&limit=1"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY]) > 0"
    alerts:
      - type: ntfy

  # 401 IS the healthy answer: an unauthenticated GET must hit the Caddyfile's
  # token gate and go no further. A 200 would mean the log store had become
  # writable by anything on the tailnet.
  - name: "vlogs-ingest (path: caddy -> token gate)"
    group: "path"
    url: "https://vlogs-ingest.svc.idanreed.com/"
    interval: 2m
    conditions:
      - "[STATUS] == 401"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy

  # Liveness only: a TCP accept proves `serve` is up, never that anyone is
  # logged in or that Proton is reachable. SMTP/IMAP have no path to GET, so
