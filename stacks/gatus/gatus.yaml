# Gatus — availability monitoring for the whole fleet. This file IS the
# deployment. Design: ServerNotes/designs/service-monitoring-stack-research.md.
#
# 🚨 TWO PROBES PER SERVICE, MEASURING DIFFERENT THINGS:
#   path probe    https://<svc>.svc.idanreed.com/  proves Caddy, the wildcard
#                 cert, DNS and — for protected hosts — the tailnet hop and the
#                 VPS outpost. BLIND to the service, because a protected route
#                 302s before reaching it.
#   service probe http://127.0.0.1:<port>/         proves the app answers.
#                 BLIND to Caddy, TLS, host routing and forward auth.
# gatus-target-coverage in tests/lib/lints.nix enforces both halves per vhost.
#
# 🚨 A PATH PROBE AGAINST A PROTECTED VHOST MEASURES AUTHENTIK, NOT THE SERVICE.
# Those assert `== 302` explicitly and are NAMED as what they measure —
# "fixing" a default 200 by accepting 200-399 turns the probe into an Authentik
# liveness check wearing the service's name.
#
# 🚨 SERVICE PROBES SEND THE REAL Host HEADER where the app is host-sensitive.
# Dawarich's host_authorization excludes /api/v1/health and qBittorrent 401s on
# a wrong Host port: both are "healthy container, every browser request fails",
# which no container healthcheck can see.
#
# ⚠ NO `security:` BLOCK. Gatus's OIDC calls oidc.NewProvider at startup with no
# retry and PANICS on failure, so a tailnet blip during a redeploy would
# restart-loop the monitoring service — and its security block does not protect
# the uptime history anyway (the SPA, /api/v1/config and the uptimes routes are
# on the unprotected router). Caddy's forward auth plus the loopback bind is the
# real control.
#
# ⚠ Gatus expands $VAR in this YAML and Compose expands env_file values too, so
# any secret reaching here passes TWO expansion layers. Keep values $-free.

storage:
  type: sqlite
  path: /data/gatus.db

web:
  # Loopback, even though the container is on the HOST network — this bind IS
  # the boundary a `ports:` entry would otherwise provide, which is why the
  # stack needs a host-network-declared entry.
  address: 127.0.0.1
  port: 10450

alerting:
  ntfy:
    url: http://127.0.0.1:10001
    topic: monitoring
    priority: 4
    # NO `token`: Validate() rejects anything not starting with `tk_`, and the
    # fleet's ntfy allows anonymous publish. A placeholder rejects the provider.
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  # Not behind forward auth (native login), so the path probe expects the SPA
  # shell, not a 302.
  - name: "actual (path: caddy -> service)"
    group: "path"
    url: "https://actual.svc.idanreed.com/"
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 240h"

    alerts:
      - type: ntfy

  # Liveness only — a bare express 200 with no storage check. Still better than
  # `/`, a static SPA shell that stays green with the API dead.
  - name: "actual (service)"
    group: "service"
    url: "http://127.0.0.1:10308/health"
    interval: 1m
    headers:
      Host: "actual.svc.idanreed.com"
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
    alerts:
      - type: ntfy

  - name: "komodo (path: caddy -> authentik outpost)"
    group: "path"
    url: "https://komodo.svc.idanreed.com/"
