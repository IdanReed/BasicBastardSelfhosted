  # The VPS
  # 🚨 THE ONLY OUT-OF-BAND ALERT PATH THE FLEET HAS. Everything above measures
  # a host Gatus shares with ntfy; these three dial the VPS's PUBLIC names over
  # the internet, so they still alert when the tailnet is what has failed —
  # which matters because the VPS's own OnFailure notifiers publish to ntfy OVER
  # the tailnet. No service twins: that would need a Gatus on the VPS, which is
  # out of scope, so each is aimed at a health endpoint that exercises the
  # backend rather than at `/`.
  #
  # ⚠ Configuring headscale `extra_records` to map these names to the VPS's
  # tailnet IP would silently turn them into tailnet probes and destroy that
  # independence. Split-DNS for admin access only, or pin these three to the
  # public IP with `client.dns-resolver`.

  - name: "headscale (vps: public https -> caddy -> headscale)"
    group: "vps"
    url: "https://headscale.idanreed.com/health"
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      # headscale's own handler PINGS THE DATABASE. Asserting the body is what
      # catches an up-but-unreadable-sqlite headscale — the state where the
      # tailnet stops being able to re-register.
      - "[STATUS] == 200"
      - "[BODY].status == pass"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy

  - name: "authentik (vps: public https -> caddy -> authentik)"
    group: "vps"
    url: "https://auth.idanreed.com/-/health/ready/"
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      # ready/ forces a database connection; live/ is deliberately NOT used —
      # it returns 200 as long as the process exists. Neither path is under
      # /api/v3, so the VPS Caddy's @restricted matcher does not block this
      # probe's off-tailnet source.
      - "[STATUS] == 200"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy

  - name: "headscale OIDC discovery (vps: the auth.* 404 regression)"
    group: "vps"
    url: "https://auth.idanreed.com/application/o/headscale/.well-known/openid-configuration"
    interval: 5m
    client:
      ignore-redirect: true
    conditions:
      # The regression: auth.idanreed.com once had nothing listening on it, so
      # discovery fell through to headscale and 404'd — and with
      # oidc.only_start_if_oidc_is_available false, headscale stayed green while
      # every browser login was broken. Both other probes stay green in that
      # state; this one does not. Pinning the issuer also catches the blueprint
      # being un-applied or the provider renamed.
      - "[STATUS] == 200"
      - "[BODY].issuer == https://auth.idanreed.com/application/o/headscale/"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
      - type: ntfy
