  # all of which failing would make the dashboard unreachable during exactly
  # the outage it is reporting. (The alert path does not traverse Caddy, so
  # ntfy still gets through.)
  #
  # There is deliberately NO matching service probe: Gatus fetching
  # http://127.0.0.1:10450/ is a tautology — if it can run the check, the
  # answer is yes. gatus-target-coverage carries 10450 in EXEMPT_SERVICE with
  # this reason rather than letting a meaningless probe satisfy it.
  - name: "gatus (path: caddy -> authentik outpost)"
    group: "path"
    url: "https://gatus.svc.idanreed.com/"
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - "[STATUS] == 302"
      - "[CERTIFICATE_EXPIRATION] > 240h"
    alerts:
