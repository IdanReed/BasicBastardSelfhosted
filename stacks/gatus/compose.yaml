# Gatus — availability monitoring (10450). Config is the deployment: gatus.yaml.
# Design: ServerNotes/designs/service-monitoring-stack-research.md.
#
# network_mode: host is not optional — every stack here publishes on
# 127.0.0.1:PORT, which a bridged container cannot reach, and only three stacks
# join the shared `homelab` network. That makes this service invisible to
# loopback-binding and to mk-stack-suite's port probe, so it carries a
# host-network-declared entry in tests/lib/lints.nix and gatus.yaml binds
# web.address 127.0.0.1 itself.

services:
  gatus:
    # `v` prefix REQUIRED — `ghcr.io/twin/gatus:5.36.0` is a 404.
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: gatus
    network_mode: host
    volumes:
      # The stack git sync delivers by rename-replace, which never reaches a
      # mounted inode — a changed gatus.yaml needs a container recreate.
      - ./gatus.yaml:/config/config.yaml:ro
      - /mnt/fast/gatus:/data
    environment:
      - TZ=America/Chicago
      - GATUS_CONFIG_PATH=/config/config.yaml
    # NO healthcheck, and none is possible: the image is FROM scratch with one
    # binary — no shell, no curl, no `gatus healthcheck` subcommand. GET /health
    # is the probe, asserted by the suite; never `depends_on: service_healthy`
    # against this.
    restart: unless-stopped
