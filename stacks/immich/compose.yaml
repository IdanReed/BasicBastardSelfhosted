# Immich — photo management (Data range, port 10102).
# docs/services.md owns the port/auth row.
#
#   - Only immich-server publishes. The ML API, postgres and valkey are
#     compose-internal: ML is unauthenticated and the API serves every
#     original photo, so any 0.0.0.0 bind is a whole-tailnet exposure.
#   - server and machine-learning ship as ONE unit upstream — bump both tags
#     together, then run tests/update-images.sh.
#   - Everything here runs as root and the bind sources are declared root:root
#     (no PUID/PGID mechanism exists in these images).
#   - Config is a RENDERED FILE, not UI state: immich-config-init substitutes
#     the OIDC secret into immich.json.template and the server reads it via
#     IMMICH_CONFIG_FILE, which also locks the UI settings read-only.
#   - container_name immich_db + POSTGRES_USER=immich are LOAD-BEARING for
#     nixos/backup-prepare.sh's `docker exec ${svc}_db pg_dumpall -U ${svc}`
#     loop; rename either and the nightly dump silently stops matching.

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.1.0
    container_name: immich_server
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      immich-config-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:10102:2283'
    volumes:
      # The whole UPLOAD_LOCATION tree: originals, regenerable derivatives,
      # and Immich's own daily pg_dump (kept on for the web restore flow; the
      # host-side dump stays authoritative).
      - /mnt/slow/photos:/data
      # Rendered immich.json — immich-config-init owns it.
      - /mnt/fast/immich/config:/config:ro
    environment:
      - DB_HOSTNAME=database
      - DB_USERNAME=immich
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=redis
      - TZ=America/Chicago
      - IMMICH_CONFIG_FILE=/config/immich.json
      # DB_PASSWORD arrives from the stack env.
    env_file: /run/stack-env/immich.env
    healthcheck:
      # The image's own test is kept (it probes the server this container
      # really runs); only the timing is overridden, because first boot
      # migrates the schema and creates the vchord/vector extensions.
      start_period: 180s
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.1.0
    container_name: immich_machine_learning
    # No dependencies in either direction: the server degrades gracefully
    # without ML (only smart search/faces/OCR fail), so it must never gate the
    # stack. First real use downloads ~1 GB of models — egress, on demand.
    volumes:
      - /mnt/fast/immich/model-cache:/cache
    environment:
      - TZ=America/Chicago
    healthcheck:
      # Image's own test kept; headroom only.
      start_period: 60s
    restart: unless-stopped

  database:
    # Upstream's own postgres image: VectorChord + pgvector + earthdistance
    # preconfigured. Restoring the dump needs this same image, because the
    # dump references those extensions.
    image: ghcr.io/immich-app/postgres:17-vectorchord1.1.1
    container_name: immich_db
    volumes:
      - /mnt/fast/immich/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
      # POSTGRES_PASSWORD arrives from the stack env and must equal DB_PASSWORD — two
      # names because the two images read different vars.
    env_file: /run/stack-env/immich.env
    # Postgres wants more than docker's 64mb default for parallel workers.
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U immich -d immich']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis:
    # Cache/queue only: no volume, no password, compose-internal.
    image: valkey/valkey:9.1-alpine
    container_name: immich_redis
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Config render
  #
  # Immich does NO env interpolation inside the config file, so the OIDC
  # secret has to be substituted in. MAKE-STYLE, not touch-once: a rotated
  # secret must reach the rendered file on the next stack up.
  immich-config-init:
    image: alpine:3.21
    container_name: immich_config_init
    entrypoint:
      - /bin/sh
      - -ec
      # $$ everywhere: compose would otherwise interpolate at parse time.
      - |
        # 0600 from birth: /mnt/fast/immich/config is 0755, so a
        # umask-default write would expose the secret until the chmod.
        umask 077
        tmpl=/template/immich.json.template
        out=/config/immich.json
        # An empty clientSecret renders an immich.json whose OIDC can never
        # log in, so refuse rather than write one.
        [ -n "$${IMMICH_OIDC_CLIENT_SECRET:-}" ] || { echo "immich-config-init: FATAL: IMMICH_OIDC_CLIENT_SECRET unset (decrypt race?)" >&2; exit 1; }
        # The value lands inside a JSON string, where a quote or backslash
        # would corrupt the file silently.
        case "$$IMMICH_OIDC_CLIENT_SECRET" in *'"'*|*'\'*)
          echo "immich-config-init: FATAL: secret contains \" or \\ — would break the rendered JSON" >&2; exit 1;;
        esac
        # busybox awk over ENVIRON, not sed/envsubst: no apk at container
        # start, and sed would mangle & or \ in the value. Single
        # left-to-right pass, so substituted output is never rescanned.
        awk '{
          line = ""
          rest = $$0
          while ((i = index(rest, "__IMMICH_OIDC_CLIENT_SECRET__")) > 0) {
            line = line substr(rest, 1, i - 1) ENVIRON["IMMICH_OIDC_CLIENT_SECRET"]
            rest = substr(rest, i + 29)
          }
          print line rest
        }' "$$tmpl" > "$$out.tmp"
        chmod 600 "$$out.tmp"
        # Replace only on content change, tmpfile+rename, so the server never
        # sees a half-written file and a second run is provably a no-op.
        if [ -f "$$out" ] && cmp -s "$$out.tmp" "$$out"; then
          rm -f "$$out.tmp"
          echo "immich-config-init: immich.json up to date — no change"
        else
          mv "$$out.tmp" "$$out"
          echo "immich-config-init: CHANGE: rendered immich.json"
        fi
    volumes:
      - ./immich.json.template:/template/immich.json.template:ro
      - /mnt/fast/immich/config:/config
    env_file: /run/stack-env/immich.env
    restart: "no"

  # Admin seed
  #
  # The seeded local admin is the bootstrap and password-login fallback; OIDC
  # users auto-register as non-admin, and seeding IMMICH_ADMIN_EMAIL with the
  # real Authentik email merges the two on first OIDC login.
  immich-init:
    image: python:3.13-alpine
    container_name: immich_init
    entrypoint: ['/bin/sh', '/init/immich-init.sh']
    depends_on:
      immich-server:
        condition: service_healthy
    volumes:
      - ./immich-init.sh:/init/immich-init.sh:ro
    env_file: /run/stack-env/immich.env
    restart: "no"
