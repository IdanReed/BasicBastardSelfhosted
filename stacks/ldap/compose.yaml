# Authentik's LDAP outpost, the directory Jellyfin's LDAP plugin logs users in
# against (headscale-vps/authentik/blueprints/custom/jellyfin-ldap.yaml holds
# the provider, the bind flow and the outpost object; stacks/media configures
# the plugin). Its own stack so a broken outpost never holds up a media deploy.
#
# Jellyfin reaches it as authentik-ldap:3389 on `homelab`: plain LDAP on the
# host-local docker network, never published. The outpost dials Authentik
# over the public route; every bind and search is a live API call there
# (direct mode), so an unreachable VPS means no LDAP logins — the local idan
# admin in Jellyfin is the break-glass.
services:
  authentik-ldap:
    # Must match the server's version (headscale-vps/authentik/compose.yaml).
    image: ghcr.io/goauthentik/ldap:2026.8.5
    container_name: authentik-ldap
    environment:
      # A name under Authentik's cookie domain (idanreed.com): the bind flow's
      # session cookie is scoped to it, and an executor that cannot keep that
      # cookie restarts the flow on every answer until it gives up.
      - AUTHENTIK_HOST=https://auth.idanreed.com
      - AUTHENTIK_INSECURE=false
    # AUTHENTIK_TOKEN: the outpost's API token, whose key the blueprint pins
    # (env.nix).
    env_file: /run/stack-env/ldap.env
    networks:
      - homelab
    healthcheck:
      # The metrics socket this probes opens only once the outpost has fetched
      # its configuration, so healthy means "Authentik answered this token".
      test: ['CMD', '/ldap', 'healthcheck']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  homelab:
    external: true
