# Ghostfolio — wealth / portfolio tracker (10306). EVALUATION stack, the other
# half of the bake-off with stacks/wealthfolio: deliberately lean — no SimpleFIN,
# no Firefly linkage, no init container, no seeded admin.
#
# Backup: backup-prepare.sh's pg_dumpall loop derives `<svc>_db` and
# `pg_dumpall -U <svc>`, so `container_name: ghostfolio_db` and
# POSTGRES_USER=ghostfolio are load-bearing. The Backrest plans exclude
# **/pgdata/** so the raw datadir is not mistaken for a backup.

services:
  # App
  # NestJS + Angular, no volume: all state is in Postgres or Redis.
  # 🚨 The entrypoint runs `npx prisma migrate deploy` at every start, so it must
  # work with NO NETWORK — verified by unpacking the published layer: the prisma
  # CLI, the schema engine and (prisma 7 being WASM) no per-arch query engine are
  # all baked in. `./tests/run.sh stack ghostfolio` boots it with no route out.
  ghostfolio:
    # Docker Hub only; the tag is BARE, no `v`-prefixed tag exists at all.
    # Upstream releases roughly daily, so this pin looks stale fast by design.
    image: ghostfolio/ghostfolio:3.65.0
    container_name: ghostfolio
    depends_on:
      ghostfolio_db:
        condition: service_healthy
      ghostfolio_cache:
        condition: service_healthy
    ports:
      - '127.0.0.1:10306:3333'
    environment:
      - TZ=America/Chicago
      - NODE_ENV=production
      # Explicit: the published port above is a separate file's decision, and a
      # silent upstream change would be a 502 with a healthy container.
      - PORT=3333
      # Assembled from POSTGRES_PASSWORD so the password exists in exactly ONE
      # key of secrets.sops.json (interpolated from the stack env, which Komodo
      # passes with --env-file). connect_timeout
      # is Prisma's, in seconds, and generous because the migration step runs
      # before the app and a cold first-init takes tens of seconds.
      - 'DATABASE_URL=postgresql://ghostfolio:${POSTGRES_PASSWORD:-}@ghostfolio_db:5432/ghostfolio?connect_timeout=300'
      - REDIS_HOST=ghostfolio_cache
      - REDIS_PORT=6379
      # ⚠ REDIS_PASSWORD deliberately NOT set — see ghostfolio_cache. Safe:
      # envalid declares it `str({ default: '' })` and ioredis sends no AUTH for
      # a falsy password.
      #
      # ACCESS_TOKEN_SALT and JWT_SECRET_KEY arrive from .env and are both HARD
      # boot requirements (bare `str()`, no default). ACCESS_TOKEN_SALT must
      # NEVER be rotated once users exist: it salts the hash of every security
      # token, the only credential a Ghostfolio account has.
      #
      # OIDC
      # Upstream calls it experimental, and ENABLE_FEATURE_AUTH_OIDC normally
      # fetches discovery AT BOOT, hard-stopping the container if the VPS is
      # unreachable. Setting all three explicit endpoints skips discovery
      # entirely (verified in-source), so boot never contacts the VPS — that is
      # what makes enabling it safe here (unlike wealthfolio, which has no such
      # hatch). ENABLE_FEATURE_AUTH_TOKEN stays default-true as the fallback.
      # OIDC_CLIENT_SECRET arrives from .env; the blueprint registers
      # /api/auth/oidc/callback.
      - ENABLE_FEATURE_AUTH_OIDC=true
      - OIDC_ISSUER=https://auth.idanreed.com/application/o/ghostfolio/
      - OIDC_AUTHORIZATION_URL=https://auth.idanreed.com/application/o/authorize/
      - OIDC_TOKEN_URL=https://auth.idanreed.com/application/o/token/
      - OIDC_USER_INFO_URL=https://auth.idanreed.com/application/o/userinfo/
      - OIDC_CLIENT_ID=ghostfolio
    env_file: /run/stack-env/ghostfolio.env
    healthcheck:
      # /api/v1/health is honest: it runs a real Property query with
      # skipCache:true and also checks Redis, so one probe covers all three
      # containers. ⚠ Its /health/data-provider/:src and /health/ai siblings DO
      # make outbound calls — never probe those.
      # 🚨 `curl`, NOT `wget`: node:22-slim purges wget, and a probe exec'ing a
      # missing binary is recorded as a failing healthcheck, not a config error.
      # start_period covers the first-boot migration.
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://127.0.0.1:3333/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  # Database
  ghostfolio_db:
    # The fleet tag (paperless, wger, windmill, tandoor, firefly). Upstream says
    # postgres:15; one version across the host is worth more than following it.
    image: postgres:17.9-alpine
    container_name: ghostfolio_db
    volumes:
      - /mnt/fast/ghostfolio/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=ghostfolio
      - POSTGRES_DB=ghostfolio
      # POSTGRES_PASSWORD arrives from .env — the same value DATABASE_URL
      # interpolates above.
    env_file: /run/stack-env/ghostfolio.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ghostfolio -d ghostfolio']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # Cache
  # Cache plus the Bull market-data queue. No volume: everything in it is
  # reconstructible, and a bind mount would put pure churn into the backup set.
  #
  # NO PASSWORD, on purpose — upstream's `--requirepass ${REDIS_PASSWORD}` puts
  # the password on argv, and there is nothing to defend against: no `networks:`
  # is declared, so the project gets its own bridge and nothing is published.
  # Consequence: REDIS_PASSWORD must stay unset on the app, or ioredis AUTHs
  # against a server with no requirepass and errors.
  ghostfolio_cache:
    image: redis:7.4-alpine
    container_name: ghostfolio_cache
    environment:
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
