# Vaultwarden — Bitwarden-compatible password vault (Util range, port 10400).
# Design: ServerNotes/designs/service-util-stack-research.md.
# _overview.md owns the port/auth row.
#
# ITS OWN STACK, not stacks/util — three independent reasons, any one
# sufficient:
#   - Blast radius: the deploy plane deploys per PROJECT, so an IT-Tools tag
#     bump would restart the password manager.
#   - Key sets: stack-env-drift requires identical key sets PER STACK —
#     folding ADMIN_TOKEN into util puts the fleet's most sensitive rotation
#     beside a static PDF toolkit.
#   - Backup: the only Util service with a dump line, an attachments tree,
#     and a non-database artifact (rsa_key.pem) that must travel WITH the
#     database — plus the documented circular dependency with
#     stacks/backrest/.sops.env.example (the restic password protects
#     Vaultwarden's own backup, so it must not live only in Vaultwarden).
#
# 10400 sits inside the Util block while being a separate stack (the
# Tracking-domain deviation); lints key on PORTS, not stack names.
#
# Backup contract: `sqlite_backup vaultwarden /mnt/fast/vaultwarden/db.sqlite3`
# is correct as long as the bind mount stays `/mnt/fast/vaultwarden:/data`.
# The dump alone is NOT a Vaultwarden backup: rsa_key.pem (JWT signing key),
# attachments/, sends/ and config.json are non-derivable state covered only
# by the raw /mnt/fast include set. The suite asserts db.sqlite3 and
# rsa_key.pem both exist — sqlite_backup returns 0 for a MISSING source and
# would otherwise back up nothing forever, silently (finding #25's class,
# exactly what happened to Karakeep).

services:
  vaultwarden:
    # No `v` prefix — `vaultwarden/server:v1.37.2` is a 404. `latest` moves,
    # and `testing` has been pushed more recently than 1.37.2 without being
    # newer stable.
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    ports:
      - '127.0.0.1:10400:80'
    volumes:
      # Exactly this path. backup-prepare.sh's sqlite_backup line hardcodes
      # /mnt/fast/vaultwarden/db.sqlite3, and moving the mount would make that
      # line a permanent silent no-op rather than an error.
      - /mnt/fast/vaultwarden:/data
    environment:
      - TZ=America/Chicago
      # LOAD-BEARING, failure deferred: the SSO callback URI, attachment/Send
      # links and websocket URL are all GENERATED from DOMAIN — changing it
      # without updating the Authentik provider gives every SSO login a
      # redirect_uri mismatch. No trailing slash, no subpath (a subpath also
      # breaks the image's own healthcheck).
      - DOMAIN=https://vaultwarden.svc.idanreed.com
      # SHIPS CLOSED, deliberately — and no headless first-account init
      # should ever exist: Bitwarden registration is CLIENT-SIDE CRYPTOGRAPHY
      # (key derivation, wrapped symmetric key, RSA keypair), and an init
      # that got any step subtly wrong yields a vault NO REAL CLIENT CAN
      # EVER OPEN, surfacing the first time you actually need a password.
      # Two operator paths (see .sops.env.example):
      #   (a) flip true, register from the web vault, flip back
      #   (b) log into /admin with ADMIN_TOKEN and invite yourself
      # (b) preferred: never ships open, and "briefly" on a tailnet means
      # every device ever enrolled.
      - SIGNUPS_ALLOWED=false
      # Registration by invitation stays available so path (b) works.
      - INVITATIONS_ALLOWED=true
      # No egress from a tailnet-only host — and per-credential icon fetches
      # are a quiet metadata leak anyway.
      - DISABLE_ICON_DOWNLOAD=true
      - ICON_CACHE_TTL=0
      # Default already; explicit because ON would be a PERMANENT hard
      # dependency on push.bitwarden.com — the one setting that would make
      # an offline vault stop working.
      - PUSH_ENABLED=false
      # Default true; named because the notification hub shares this port —
      # why forward auth cannot front this vhost (see the Caddyfile).
      # Turning it off degrades every client to polling.
      - ENABLE_WEBSOCKET=true
      # No SMTP on this host, unconfigured on purpose: invite emails will
      # not send; /admin surfaces a copyable link instead.
      #
      # ---- OIDC ships READY and OFF (annex §4) ----
      # SSO_ENABLED stays unset until the Authentik client secret exists;
      # then SSO_ENABLED=true + SSO_AUTHORITY + the SSO_CLIENT_* values from
      # .env. Discovery is LAZY (authorize/token path, not boot), so unlike
      # Homebox this starts fine with Authentik unreachable — the offline
      # fixture can leave SSO configured.
      # ⚠ Do NOT register `bitwarden://sso-callback` with Authentik — those
      # per-client redirects never reach the IdP. The single provider URI is
      # https://vaultwarden.svc.idanreed.com/identity/connect/oidc-signin
      #
      # ADMIN_TOKEN arrives from .env.
      # 🚨 MUST be single-quoted in the plaintext .sops.env: Compose
      # interpolates env_file values, so a bare argon2 PHC has $argon2id/$v/$m
      # expanded to nothing — a DIFFERENT STRING (verified, finding #30).
      # Vaultwarden then plaintext-compares against the mangled string and
      # /admin never accepts anything. Do not $$-escape either: that advice
      # is for inline `environment:` blocks, not env_file.
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    # NO healthcheck stanza ON PURPOSE: the builtin is honest for once —
    # healthcheck.sh curls /alive, whose handler takes a DbConn guard
    # specifically so the probe verifies the database connection (upstream
    # says so at both mount points). A dead or locked SQLite fails it;
    # overriding would replace an honest check with a worse one.
    restart: unless-stopped
