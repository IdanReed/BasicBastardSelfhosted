# Vaultwarden — Bitwarden-compatible password vault (10400).
# Design: ServerNotes/designs/service-util-stack-research.md.
#
# Its own stack rather than part of stacks/util: the deploy plane deploys per
# project (an IT-Tools bump would restart the password manager), stack-env-drift
# keys per stack, and this is the only Util service with a dump line.
#
# Backup: `sqlite_backup vaultwarden /mnt/fast/vaultwarden/db.sqlite3` — correct
# only while the bind mount stays /mnt/fast/vaultwarden:/data. The dump alone is
# NOT a backup: rsa_key.pem, attachments/, sends/ and config.json are covered
# only by the raw /mnt/fast include set.

services:
  vaultwarden:
    # No `v` prefix — `vaultwarden/server:v1.37.2` is a 404.
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    ports:
      - '127.0.0.1:10400:80'
    volumes:
      # Exactly this path: backup-prepare.sh hardcodes its host-side twin, and
      # sqlite_backup returns 0 for a missing source — a moved mount is a
      # permanent silent no-op, not an error.
      - /mnt/fast/vaultwarden:/data
    environment:
      - TZ=America/Chicago
      # SSO callback URI, attachment/Send links and the websocket URL are all
      # generated from this. No trailing slash, no subpath.
      - DOMAIN=https://vaultwarden.svc.idanreed.com
      # Closed to PASSWORD registration; SSO has its own gate below. No
      # headless first-account init should ever exist: Bitwarden registration
      # is client-side cryptography, and an init that got a step subtly wrong
      # yields a vault no client can open.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      # No egress from a tailnet-only host, and per-credential icon fetches are
      # a metadata leak.
      - DISABLE_ICON_DOWNLOAD=true
      - ICON_CACHE_TTL=0
      # Default already; explicit because ON is a permanent hard dependency on
      # push.bitwarden.com.
      - PUSH_ENABLED=false
      # Default true; named because the notification hub shares this port, which
      # is why forward auth cannot front this vhost (see the Caddyfile). Off
      # degrades every client to polling.
      - ENABLE_WEBSOCKET=true
      # OIDC
      # Native SSO since 1.34 — no separate -sso build. Discovery is lazy, so
      # this starts fine with Authentik unreachable; master-password login stays
      # as fallback (SSO_ONLY unset).
      - SSO_ENABLED=true
      # 🚨 Trailing slash is LOAD-BEARING: Authentik advertises the issuer with
      # one, and vaultwarden does a strict issuer==authority match. No
      # /.well-known suffix — vaultwarden appends it.
      - SSO_AUTHORITY=https://auth.idanreed.com/application/o/vaultwarden/
      - SSO_CLIENT_ID=vaultwarden
      - SSO_SCOPES=email profile
      # Links an SSO identity to an existing account by verified email.
      - SSO_SIGNUPS_MATCH_EMAIL=true
      # 🚨 SPELLED OUT because the default is TRUE and it is easy to believe
      # SIGNUPS_ALLOWED=false covers it. It does not: config.rs has two gates,
      # is_signup_allowed (SIGNUPS_ALLOWED) and is_sso_signup_allowed
      # (SSO_SIGNUPS_ALLOWED + SIGNUPS_DOMAINS_WHITELIST), and the SSO path
      # reads only the second. So any Authentik identity can already create a
      # Vaultwarden row — the /admin invite is redundant, and the Authentik
      # user list is the real gate. Set false + invite to change that posture.
      #
      # What SSO still cannot do is FINISH an account: vaults are client-side
      # E2EE, so User::new leaves password_hash empty and private_key None.
      # Setting a master password in the web vault is one browser step per
      # user, forever (docs/for-shame.md).
      - SSO_SIGNUPS_ALLOWED=true
      # Rate-limit bucket keyed on the real client IP, not the docker gateway.
      - IP_HEADER=X-Forwarded-For
      # The single registered redirect is
      # https://vaultwarden.svc.idanreed.com/identity/connect/oidc-signin — do
      # NOT register bitwarden://sso-callback, those never reach the IdP.
      #
      # SSO_CLIENT_SECRET and ADMIN_TOKEN arrive from .env.
      # 🚨 ADMIN_TOKEN must be single-quoted in the plaintext .sops.env: Compose
      # interpolates env_file values, so a bare argon2 PHC has $argon2id/$v/$m
      # expanded away and /admin then accepts nothing. Do not $$-escape either.
    env_file:
      - path: .env
        required: false
    # NO healthcheck stanza: the builtin curls /alive, whose handler takes a
    # DbConn guard, so it really does verify the database.
    restart: unless-stopped
