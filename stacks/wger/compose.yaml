# Wger — workout and nutrition tracker (Food range, port 10351).
# Design: ServerNotes/designs/service-food-stack-research.md; _overview.md owns
# the port/auth row.
#
# Its own stack rather than sharing tandoor's: both read a bare `SECRET_KEY`
# through env_file and would collide.
#
# `container_name: wger_db` and `POSTGRES_USER=wger` are load-bearing —
# nixos/backup-prepare.sh's pg_dumpall loop names `wger`.

services:
  # 🚨 NOT PUBLISHED. `wger/server` serves NO static files (no whitenoise in
  # INSTALLED_APPS), so publishing gunicorn gives an app that renders, answers
  # the API, and has no CSS and no JS. The nginx sidecar gets the port.
  #
  # Runs as uid 1000, hard-coded in the image with no PUID/PGID and no
  # chown-on-start, so /mnt/fast/wger/media must be pre-owned 1000:1000 or
  # `collectstatic` fails on first boot.
  wger:
    # `2.6`, NOT `2.6.0` (which tracks master) and NOT `latest` (a 2.7 alpha).
    image: wger/server:2.6
    container_name: wger
    depends_on:
      wger_db:
        condition: service_healthy
      wger_cache:
        condition: service_healthy
    volumes:
      - wger_static:/home/wger/static
      - /mnt/fast/wger/media:/home/wger/media
    environment:
      - TIME_ZONE=America/Chicago
      - SITE_URL=https://wger.svc.idanreed.com
      - DJANGO_DEBUG=False
      # 🚨 REQUIRED, silently: without it the entrypoint bootstraps a fresh
      # database and then NEVER MIGRATES AGAIN, so every image bump leaves the
      # schema behind the code.
      - DJANGO_PERFORM_MIGRATIONS=True
      # 🚨 ALSO REQUIRED: without it SECURE_PROXY_SSL_HEADER is never set,
      # Django believes every request is plain HTTP, and the https CSRF origin
      # below can never match — every POST fails on CSRF.
      - X_FORWARDED_PROTO_HEADER_SET=True
      - CSRF_TRUSTED_ORIGINS=https://wger.svc.idanreed.com
      # Both default to TRUE in this image; unset means open to anyone who can
      # reach the vhost.
      - ALLOW_REGISTRATION=False
      - ALLOW_GUEST_USERS=False
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_DATABASE=wger
      - DJANGO_DB_USER=wger
      - DJANGO_DB_HOST=wger_db
      - DJANGO_DB_PORT=5432
      - DJANGO_CACHE_BACKEND=django_redis.cache.RedisCache
      - DJANGO_CACHE_LOCATION=redis://wger_cache:6379/1
      - DJANGO_CACHE_CLIENT_CLASS=django_redis.client.DefaultClient
      - DJANGO_MEDIA_ROOT=/home/wger/media
      - DJANGO_STATIC_ROOT=/home/wger/static
      # 🚨 EVERY ONE OF THESE IS EGRESS AT STARTUP: any true and a
      # tailnet-only boot hangs on the internet.
      - LOAD_ONLINE_FIXTURES_ON_STARTUP=False
      - DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP=False
      - DOWNLOAD_EXERCISE_VIDEOS_ON_STARTUP=False
      - SYNC_EXERCISES_ON_STARTUP=False
      - SYNC_INGREDIENTS_ON_STARTUP=False
      # No celery/beat: the periodic tasks are all internet syncs this host
      # cannot make.
      - USE_CELERY=False
      - ENABLE_EMAIL=False
      - EXPOSE_PROMETHEUS_METRICS=False
      # Two hops (Caddy, then the nginx sidecar). django-axes keys lockouts
      # on client IP, so a wrong count locks everyone out after a few typos.
      - AXES_IPWARE_PROXY_COUNT=2
      - NUMBER_OF_PROXIES=2
      # SECRET_KEY and DJANGO_DB_PASSWORD arrive from .env.
      # ⚠ An unset SECRET_KEY is nearly invisible: the image falls back to a
      # fresh random key per restart with only a warnings.warn, and the symptom
      # is "everyone is logged out after every restart".
    env_file: /run/stack-env/wger.env
    healthcheck:
      # Upstream's own liveness probe — it does not touch the database. The
      # 300s start period is real: first boot migrates and loads 872 exercise
      # bases plus 2429 translations.
      test: ['CMD-SHELL', 'wget -q -O /dev/null -T 10 http://127.0.0.1:8000/api/v2/version/']
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 300s
    restart: unless-stopped

  # Static files
  #
  # Serves /static/ and /media/ and proxies the rest. Not optional — see the
  # wger service above.
  wger_nginx:
    image: nginx:1.30.4-alpine
    container_name: wger_nginx
    depends_on:
      wger:
        condition: service_healthy
    ports:
      - '127.0.0.1:10351:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wger_static:/wger/static:ro
      - /mnt/fast/wger/media:/wger/media:ro
    environment:
      - TZ=America/Chicago
    healthcheck:
      # THROUGH nginx to the app: `service nginx status` cannot see a broken
      # proxy_pass or an unresolvable upstream, the only interesting failure.
      test: ['CMD-SHELL', 'wget -q -O /dev/null -T 10 http://127.0.0.1:80/api/v2/version/']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  wger_db:
    image: postgres:17.9-alpine
    container_name: wger_db
    volumes:
      - /mnt/fast/wger/pgdata:/var/lib/postgresql/data
    environment:
      - TZ=America/Chicago
      - POSTGRES_USER=wger
      - POSTGRES_DB=wger
      # POSTGRES_PASSWORD arrives from .env, shared with DJANGO_DB_PASSWORD.
    env_file: /run/stack-env/wger.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wger -d wger']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  wger_cache:
    image: redis:7.4-alpine
    container_name: wger_cache
    # No volume: a bind mount would put regenerable churn into the /mnt/fast
    # backup include set.
    environment:
      - TZ=America/Chicago
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Admin seed
  #
  # Wger creates an `admin` account with the published password `adminadmin`
  # and no env var to change it; see wger-init.py. Same image as the app,
  # because this is a Django shell script against the real ORM.
  wger_init:
    image: wger/server:2.6
    container_name: wger_init
    depends_on:
      # service_healthy: bootstrap and migrations must have finished, or
      # `admin` does not exist yet and the real bootstrap overwrites ours.
      wger:
        condition: service_healthy
    volumes:
      - ./wger-init.py:/init/wger-init.py:ro
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'cd /home/wger/src && exec python3 manage.py shell < /init/wger-init.py'
    environment:
      - DJANGO_DB_ENGINE=django.db.backends.postgresql
      - DJANGO_DB_DATABASE=wger
      - DJANGO_DB_USER=wger
      - DJANGO_DB_HOST=wger_db
      - DJANGO_DB_PORT=5432
      # Required for settings to import at all — see the app service.
      - DJANGO_DEBUG=False
    env_file: /run/stack-env/wger.env
    restart: "no"

volumes:
  # Derived: collectstatic rewrites it on every start.
  wger_static:
