# nginx for wger — NOT optional (see compose.yaml: wger/server serves no
# static files; gunicorn alone is plausible-looking and completely broken).
#
# 🚨 WRITTEN HERE RATHER THAN COPIED FROM UPSTREAM: upstream's nginx.conf
# opens with `upstream powersync { ... }` for a service its compose pulls in
# via `include:` — with no powersync container the whole vhost dies at
# startup (`[emerg] host not found in upstream`), /static/ included.
#
# The alias paths below are the SIDECAR's mount points (/wger/static,
# /wger/media), not the app container's /home/wger/... — wrong paths give
# 404s on every asset with nginx running happily.

# ⚠ nginx resolves upstream names AT CONFIGURATION LOAD, not per request
# (verified: `nginx -t` outside the project fails `[emerg] host not found in
# upstream "wger:8000"`). That is why the sidecar's depends_on uses
# `condition: service_healthy`: started before the app has a DNS name, nginx
# does not retry — it dies and takes /static/ with it.
upstream wger {
    server wger:8000;
}

# Caddy terminates TLS and sets X-Forwarded-Proto. Preserve it if present and
# fall back to the scheme nginx actually saw, so a direct loopback request
# still gets a coherent value rather than an empty one.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Exercise images and videos can be large, and so can a user's gallery
    # upload. The Django side has its own limit; this is the one that would
    # otherwise 413 first.
    client_max_body_size 100M;

    # Hashed by collectstatic, so the long immutable cache is safe HERE and
    # nowhere else — do not copy this header onto /media/, whose filenames are
    # user-supplied and stable.
    location /static/ {
        alias /wger/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /wger/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_redirect off;

        # First boot migrates and loads 872 exercise bases plus 2429
        # translations; a request arriving during that must not 504 before
        # gunicorn answers.
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }
}
