# nginx for wger — not optional; wger/server serves no static files at all.
#
# 🚨 WRITTEN HERE, NOT COPIED FROM UPSTREAM: upstream's config opens with an
# `upstream powersync { … }` for a service this stack does not run, and with
# no such container the whole vhost dies at startup, /static/ included.
#
# The alias paths below are the SIDECAR's mount points, not the app
# container's — wrong paths 404 every asset with nginx running happily.

# ⚠ nginx resolves upstream names AT CONFIGURATION LOAD and does not retry,
# which is why the sidecar's depends_on is `condition: service_healthy`.
upstream wger {
    server wger:8000;
}

# Preserve Caddy's X-Forwarded-Proto, falling back to the scheme nginx saw so
# a direct loopback request still gets a coherent value.
map $http_x_forwarded_proto $final_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Exercise media is large; this is the limit that would 413 first.
    client_max_body_size 100M;

    # Safe only here: collectstatic hashes these names. Never copy the
    # immutable header onto /media/, whose filenames are stable.
    location /static/ {
        alias /wger/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /wger/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://wger;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
        proxy_redirect off;

        # First boot migrates and loads ~3300 fixtures; a request arriving
        # during that must not 504 before gunicorn answers.
        proxy_connect_timeout 75s;
        proxy_read_timeout 300s;
    }
}
