# Glance dashboard configuration. Shipped in the stack directory so the git sync
# delivers it with compose.yaml; mounted :ro at the path the ENTRYPOINT hardcodes.
#
# Three rules, all load-bearing:
#
#   1. NO WIDGET MAY REQUIRE EGRESS. Widget fetches run inside the page-content
#      handler with wg.Wait() on every goroutine, so a widget that cannot reach
#      the internet stalls the WHOLE page until its HTTP client times out. Hence
#      no rss/weather/hacker-news, and no `monitor` widget even for
#      tailnet-reachable targets — one wedged service would hold the dashboard
#      hostage, and status is Gatus's job anyway. Icons are the same trap: the
#      `si:`/`di:` prefixes resolve to CDN URLs the BROWSER fetches, so every
#      link here is text-only.
#
#   2. NO `auth:` BLOCK. Caddy's (protected) does the work — one login, not two.
#      Sharp edge: docker-proxy re-dials from the bridge gateway, so every
#      request shares one address, and Glance blocks an IP after 5 failed logins
#      in 5 minutes — turning auth on WITHOUT `server.proxied: true` means five
#      typos lock out everybody at once.
#
#   3. EVERY CADDY-ROUTED SERVICE APPEARS ON EXACTLY ONE OF THE TWO PAGES. The
#      split is ORGANISATION, NOT A SECURITY BOUNDARY — same login, same tailnet,
#      and page nav is client-side. An unlisted service is one nobody remembers
#      exists at 2am. No lint parses this file; the check when adding a stack is
#      `grep -E '^\s*@[a-z0-9_-]+ host ' ../caddy/Caddyfile` against the URLs
#      below. Two deliberate omissions: `glance` itself, and `vlogs-ingest`
#      (a token-gated ingest endpoint with no browser UI).
#
# 🚨 GLANCE SUBSTITUTES ENV REFERENCES OVER THE RAW FILE, BEFORE YAML PARSING —
# COMMENTS ARE NOT EXEMPT, and a missing variable is a hard startup error
# repeated forever. Describe the syntax in words here; never write it.

server:
  host: 0.0.0.0
  port: 8080
  # Only affects logging while auth is off, but it must be true before auth is
  # ever turned on (rule 2).
  proxied: true

theme:
  background-color: 225 14 15
  primary-color: 210 60 70
  contrast-multiplier: 1.1

# Glance allows at most 3 columns and requires 1 or 2 of them to be `full`, so
# the only legal shapes are small-full-small, small-full and full-full.
pages:
  # Home — things a person opens on purpose, grouped by what they are for.
  # The *arr suite is on Admin: it is how the library gets filled, not how it
  # gets used.
  - name: Home
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/Chicago
                label: Home
          - type: calendar
            first-day-of-week: monday

      - size: full
        widgets:
          # First, so a glance at the page starts with whether things are up.
          # LINKS, not checks (rule 1) — Gatus owns uptime.
          - type: bookmarks
            groups:
              - title: Status
                links:
                  - title: Gatus
                    url: https://gatus.svc.idanreed.com
                  - title: Beszel
                    url: https://beszel.svc.idanreed.com

          - type: bookmarks
            groups:
              - title: Media
                links:
                  - title: Jellyfin
                    url: https://jellyfin.svc.idanreed.com
                  - title: Seerr
                    url: https://seerr.svc.idanreed.com
                  - title: Immich
                    url: https://immich.svc.idanreed.com
                  - title: Kavita
                    url: https://kavita.svc.idanreed.com
                  - title: Audiobookshelf
                    url: https://audiobookshelf.svc.idanreed.com
