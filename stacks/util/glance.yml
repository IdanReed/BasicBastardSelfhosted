# Glance dashboard configuration.
#
# Shipped in the stack directory rather than /mnt/fast so Arcane's
# syncDirectory delivers it alongside compose.yaml; the container mounts it
# read-only at the path its ENTRYPOINT hardcodes.
#
# THREE RULES THIS FILE FOLLOWS, all load-bearing:
#
#   1. NO WIDGET MAY REQUIRE EGRESS. Glance fetches widget content inside the
#      page-content request handler and wg.Wait()s on every widget goroutine,
#      so a widget that cannot reach the internet does not degrade — it stalls
#      the whole page until that widget's HTTP client times out. This host is
#      tailnet-only. `rss`, `reddit`, `weather`, `hacker-news` and friends are
#      therefore deliberately absent; add them only if this host ever gets
#      general egress, and expect the page to be as slow as the slowest feed.
#
#      The same rule is why there is NO `monitor` widget here even though every
#      target would be reachable on the tailnet: `monitor` fetches each site
#      inside that same content handler, so N services become N serial-ish
#      HTTP round trips in front of the page render, and one wedged service
#      (not down — wedged, so it never RSTs) holds the dashboard hostage for
#      its full timeout. Status is Gatus's job; this file LINKS to Gatus.
#      Duplicating the checks here would also mean two sets of thresholds
#      drifting apart, with the one nobody configured alerts on winning.
#
#      Icons are the same trap one layer out: Glance's `si:`/`di:` icon
#      prefixes resolve to CDN URLs fetched by the BROWSER. They would not
#      stall the server, but they render as broken images for anyone whose
#      client has no internet, so every link here is text-only on purpose.
#
#   2. NO `auth:` BLOCK. Glance's own login stays off and Caddy's (protected)
#      snippet does the work — one login instead of two, and this is a
#      browser-only dashboard so forward auth costs nothing. There is also a
#      sharp edge behind the loopback publish: docker-proxy re-dials from the
#      bridge gateway, so every request looks like it comes from one address,
#      and Glance blocks an IP after 5 failed logins in 5 minutes. Turning its
#      auth on WITHOUT also setting `server.proxied: true` means the first five
#      typos lock out everybody at once.
#
#   3. EVERY CADDY-ROUTED SERVICE APPEARS ON EXACTLY ONE OF THE TWO PAGES.
#      The split below is ORGANISATION, NOT A SECURITY BOUNDARY — every user
#      on the tailnet is trusted, both pages sit behind the same single
#      (protected) import, and Glance page navigation is client-side anyway.
#      "Admin" means "you only open this when something needs tending", not
#      "restricted". Do not reason about it as a privilege tier, and do not
#      let a service fall off the list because it felt too internal: an
#      unlisted service is one nobody remembers exists at 2am.
#
#      As of this writing stacks/caddy/Caddyfile defines 38 `*.svc` hosts and
#      37 of them are linked below; the single omission is `glance` itself
#      (you are here). Any future omission gets a line in this comment saying
#      why. Nothing verifies this mechanically — no lint parses this file —
#      so `grep -E '^\s*@[a-z0-9_-]+ host ' ../caddy/Caddyfile` against the
#      URLs below is the check, and it is worth doing when adding a stack.
#      `headscale.idanreed.com` is NOT a Caddy route on this host at all — it
#      lives on the VPS and serves a coordination API with no browser UI, so
#      there is nothing to bookmark. Its liveness belongs in Gatus.
#
# 🚨 GLANCE SUBSTITUTES ENV REFERENCES OVER THE RAW FILE, BEFORE YAML PARSING —
# SO COMMENTS ARE NOT EXEMPT. A dollar-brace reference anywhere in this file,
# including in a comment like this one, is resolved, and a missing variable is
# a hard startup error:
#     Config has errors: parsing variable: environment variable ENV_VAR not found
# ...repeated forever, because the container restarts.
#
# That is exactly what happened: an earlier version of THIS COMMENT spelled the
# substitution syntax out literally in order to warn about it, and the warning
# broke the file. Describe the syntax in words here; never write it.
#
# The behaviour itself is the good kind of loud — a typo'd variable name fails
# at boot rather than rendering an empty string into a widget.

server:
  host: 0.0.0.0
  port: 8080
  # Read X-Forwarded-* from Caddy. Currently only affects logging, since auth
  # is off — but it must be true before auth is ever turned on (see rule 2).
  proxied: true

theme:
  background-color: 225 14 15
  primary-color: 210 60 70
  contrast-multiplier: 1.1

# Column layout note (applies to both pages): Glance allows at most 3 columns
# and requires either 1 or 2 of them to be `full`, so the only legal shapes are
# small-full-small, small-full and full-full. "Home" uses small-full-small
# (clock / links / calendar); "Admin" uses small-full — there is no ambient
# information worth a third column on a page you open to fix something.
pages:
  # ===========================================================================
  # Page 1 — HOME. Things a person opens on purpose.
  #
  # The *arr suite is NOT here: Radarr/Sonarr/Bazarr/Prowlarr/Profilarr/
  # Cleanuparr are how the library gets filled, not how it gets used, and
  # burying Jellyfin and Seerr under six management UIs was the concrete
  # complaint that produced this restructure. They are on Admin.
  # ===========================================================================
  - name: Home
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/Chicago
                label: Home

          # The one piece of status on this page, and it is a LINK, not a
          # check (rule 1). Gatus owns uptime; this is the door to it.
          - type: bookmarks
            groups:
              - title: Status
                links:
                  - title: Gatus — uptime
                    url: https://gatus.svc.idanreed.com
                  - title: Beszel — hosts
                    url: https://beszel.svc.idanreed.com

      - size: full
        widgets:
          - type: bookmarks
            groups:
              - title: Media
                links:
                  - title: Jellyfin
                    url: https://jellyfin.svc.idanreed.com
                  - title: Seerr
                    url: https://seerr.svc.idanreed.com

              - title: Books
                links:
                  - title: Kavita
                    url: https://kavita.svc.idanreed.com
                  - title: Audiobookshelf
                    url: https://audiobookshelf.svc.idanreed.com
                  - title: Shelfmark
                    url: https://shelfmark.svc.idanreed.com

              - title: Home
                links:
                  - title: Home Assistant
                    url: https://homeassistant.svc.idanreed.com
                  - title: Frigate
                    url: https://frigate.svc.idanreed.com

              - title: Personal
                links:
                  - title: Immich
                    url: https://immich.svc.idanreed.com
                  - title: Paperless
                    url: https://paperless.svc.idanreed.com
                  - title: Vaultwarden
                    url: https://vaultwarden.svc.idanreed.com
                  - title: Dawarich
                    url: https://dawarich.svc.idanreed.com
                  - title: rmfakecloud
                    url: https://rmfakecloud.svc.idanreed.com
                  - title: Syncthing
                    url: https://syncthing.svc.idanreed.com

              - title: Notes and Inventory
                links:
                  - title: BookStack
                    url: https://bookstack.svc.idanreed.com
                  - title: Homebox
                    url: https://homebox.svc.idanreed.com
                  - title: Karakeep
                    url: https://karakeep.svc.idanreed.com
                  - title: Outline
                    url: https://outline.svc.idanreed.com
                  - title: SilverBullet
                    url: https://silverbullet.svc.idanreed.com

              # Firefly III is here; its DATA IMPORTER is on Admin. They are
              # separate hostnames with separate Authentik applications
              # (the importer holds a full-privilege Firefly PAT and has no
              # login of its own), and separating them here matches that.
              - title: Money and Health
                links:
                  - title: Firefly III
                    url: https://firefly.svc.idanreed.com
                  - title: Ghostfolio
                    url: https://ghostfolio.svc.idanreed.com
                  - title: Owl
                    url: https://owl.svc.idanreed.com
                  - title: Tandoor
                    url: https://tandoor.svc.idanreed.com
                  - title: wger
                    url: https://wger.svc.idanreed.com

              - title: Documents and Tools
                links:
                  - title: DocSpace
                    url: https://docspace.svc.idanreed.com
                  - title: BentoPDF
                    url: https://bentopdf.svc.idanreed.com
                  - title: Mazanoke
                    url: https://mazanoke.svc.idanreed.com
                  - title: IT-Tools
                    url: https://it-tools.svc.idanreed.com

      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

  # ===========================================================================
  # Page 2 — ADMIN. Things you open when something needs tending.
  #
  # Not a privilege tier (rule 3). Same login, same tailnet, same trust.
  # ===========================================================================
  - name: Admin
    slug: admin
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              # Repeated from Home on purpose: this is the first thing you
              # want on the page you opened BECAUSE something is wrong, and a
              # duplicated link costs nothing (rule 1 — these are links, so
              # there is no second set of checks to drift).
              - title: Status
                links:
                  - title: Gatus — uptime
                    url: https://gatus.svc.idanreed.com
                  - title: Beszel — hosts
                    url: https://beszel.svc.idanreed.com
                  - title: ntfy — alerts
                    url: https://ntfy.svc.idanreed.com

              - title: Identity
                links:
                  # On the VPS, not this host — the only link here that does
                  # not resolve to a *.svc.idanreed.com Caddy route.
                  - title: Authentik
                    url: https://auth.idanreed.com

      - size: full
        widgets:
          - type: bookmarks
            groups:
              - title: Infrastructure
                links:
                  - title: Arcane — containers
                    url: https://arcane.svc.idanreed.com
                  - title: Forgejo — git
                    url: https://forgejo.svc.idanreed.com
                  - title: Backrest — backups
                    url: https://backrest.svc.idanreed.com
                  - title: Windmill — jobs
                    url: https://windmill.svc.idanreed.com
                  - title: Grafana — logs
                    url: https://grafana.svc.idanreed.com

              # The library-filling half of the media stack. Everything here
              # is behind the same gluetun kill-switch as qBittorrent; if
              # these are unreachable while Jellyfin is fine, suspect the VPN
              # container before the services.
              - title: Media management
                links:
                  - title: Radarr
                    url: https://radarr.svc.idanreed.com
                  - title: Sonarr
                    url: https://sonarr.svc.idanreed.com
                  - title: Bazarr
                    url: https://bazarr.svc.idanreed.com
                  - title: Prowlarr
                    url: https://prowlarr.svc.idanreed.com
                  - title: Profilarr
                    url: https://profilarr.svc.idanreed.com
                  - title: Cleanuparr
                    url: https://cleanuparr.svc.idanreed.com

              # 🚨 The importer's UI has NO authentication of its own and
              # holds a Firefly personal access token with full access to
              # every transaction. It is reachable only through its OWN
              # Authentik application (firefly-importer, forward_single,
              # external_host firefly-importer.svc.idanreed.com). This
              # bookmark is convenience; the lock is in Caddy and Authentik.
              - title: Data import
                links:
                  - title: Firefly III importer
                    url: https://firefly-importer.svc.idanreed.com
