# Glance dashboard configuration.
#
# Shipped in the stack directory rather than /mnt/fast so stack-git-sync
# delivers it alongside compose.yaml; the container mounts it read-only at the
# path its ENTRYPOINT hardcodes.
#
# THREE RULES, all load-bearing:
#
#   1. NO WIDGET MAY REQUIRE EGRESS. Widget fetches run inside the
#      page-content handler with wg.Wait() on every goroutine, so a widget
#      that cannot reach the internet stalls the WHOLE page until its HTTP
#      client times out. Hence no rss/reddit/weather/hacker-news — and no
#      `monitor` widget even though targets are tailnet-reachable: N
#      services = N serial-ish round trips before render, and one WEDGED
#      service (never RSTs) holds the dashboard hostage. Status is Gatus's
#      job; this file LINKS to Gatus (duplicated checks = two threshold
#      sets drifting). Icons are the same trap one layer out: `si:`/`di:`
#      prefixes resolve to CDN URLs fetched by the BROWSER — broken images
#      offline — so every link is text-only on purpose.
#
#   2. NO `auth:` BLOCK. Caddy's (protected) does the work — one login, not
#      two. Sharp edge: docker-proxy re-dials from the bridge gateway, so
#      every request shares one address, and Glance blocks an IP after 5
#      failed logins in 5 minutes — turning auth on WITHOUT
#      `server.proxied: true` means five typos lock out everybody at once.
#
#   3. EVERY CADDY-ROUTED SERVICE APPEARS ON EXACTLY ONE OF THE TWO PAGES.
#      The split is ORGANISATION, NOT A SECURITY BOUNDARY (same login, same
#      tailnet; page nav is client-side). "Admin" = "open when something
#      needs tending", not "restricted". An unlisted service is one nobody
#      remembers exists at 2am.
#      Invariant: every `*.svc` host in stacks/caddy/Caddyfile is linked
#      below except `glance` itself; any future omission gets a line here
#      saying why. No lint parses this file — the check is
#      `grep -E '^\s*@[a-z0-9_-]+ host ' ../caddy/Caddyfile` against the
#      URLs below, worth doing when adding a stack.
#      `headscale.idanreed.com` is not a Caddy route on this host (VPS
#      coordination API, no browser UI) — its liveness belongs in Gatus.
#
# 🚨 GLANCE SUBSTITUTES ENV REFERENCES OVER THE RAW FILE, BEFORE YAML
# PARSING — COMMENTS ARE NOT EXEMPT. A dollar-brace reference anywhere,
# including in a comment, is resolved; a missing variable is a hard startup
# error, repeated forever as the container restarts. An earlier version of
# THIS COMMENT spelled the syntax out to warn about it and broke the file:
# describe the syntax in words; never write it. (The behaviour itself is
# the good kind of loud — a typo'd name fails at boot, not as an empty
# string in a widget.)

server:
  host: 0.0.0.0
  port: 8080
  # Read X-Forwarded-* from Caddy. Currently only affects logging, since auth
  # is off — but it must be true before auth is ever turned on (see rule 2).
  proxied: true

theme:
  background-color: 225 14 15
  primary-color: 210 60 70
  contrast-multiplier: 1.1

# Column layout note (applies to both pages): Glance allows at most 3 columns
# and requires either 1 or 2 of them to be `full`, so the only legal shapes are
# small-full-small, small-full and full-full. "Home" uses small-full-small
# (clock / links / calendar); "Admin" uses small-full — there is no ambient
# information worth a third column on a page you open to fix something.
pages:
  # ===========================================================================
  # Page 1 — HOME. Things a person opens on purpose. The *arr suite is on
  # Admin: it is how the library gets filled, not how it gets used, and it
  # buried Jellyfin/Seerr under six management UIs.
  # ===========================================================================
  - name: Home
    slug: home
    columns:
      - size: small
        widgets:
          - type: clock
            hour-format: 24h
            timezones:
              - timezone: America/Chicago
                label: Home

          # The one piece of status on this page, and it is a LINK, not a
          # check (rule 1). Gatus owns uptime; this is the door to it.
          - type: bookmarks
            groups:
              - title: Status
                links:
                  - title: Gatus — uptime
                    url: https://gatus.svc.idanreed.com
                  - title: Beszel — hosts
                    url: https://beszel.svc.idanreed.com

      - size: full
        widgets:
          - type: bookmarks
            groups:
              - title: Media
                links:
                  - title: Jellyfin
                    url: https://jellyfin.svc.idanreed.com
                  - title: Seerr
                    url: https://seerr.svc.idanreed.com

              - title: Books
                links:
                  - title: Kavita
                    url: https://kavita.svc.idanreed.com
                  - title: Audiobookshelf
                    url: https://audiobookshelf.svc.idanreed.com
                  - title: Shelfmark
                    url: https://shelfmark.svc.idanreed.com

              - title: Home
                links:
                  - title: Home Assistant
                    url: https://homeassistant.svc.idanreed.com
                  - title: Frigate
                    url: https://frigate.svc.idanreed.com

              - title: Personal
                links:
                  - title: Immich
                    url: https://immich.svc.idanreed.com
                  - title: Paperless
                    url: https://paperless.svc.idanreed.com
                  - title: Vaultwarden
                    url: https://vaultwarden.svc.idanreed.com
                  - title: Dawarich
                    url: https://dawarich.svc.idanreed.com
                  - title: rmfakecloud
                    url: https://rmfakecloud.svc.idanreed.com
                  - title: Syncthing
                    url: https://syncthing.svc.idanreed.com

              - title: Notes and Inventory
                links:
                  - title: BookStack
                    url: https://bookstack.svc.idanreed.com
                  - title: Homebox
                    url: https://homebox.svc.idanreed.com
                  - title: Karakeep
                    url: https://karakeep.svc.idanreed.com
                  - title: Outline
                    url: https://outline.svc.idanreed.com
                  - title: SilverBullet
                    url: https://silverbullet.svc.idanreed.com

              # Firefly III here; its DATA IMPORTER is on Admin — separate
              # hostnames, separate Authentik applications (the importer
              # holds a full-privilege PAT, no login of its own).
              - title: Money and Health
                links:
                  - title: Firefly III
                    url: https://firefly.svc.idanreed.com
                  - title: Ghostfolio
                    url: https://ghostfolio.svc.idanreed.com
                  - title: Owl
                    url: https://owl.svc.idanreed.com
                  - title: Tandoor
                    url: https://tandoor.svc.idanreed.com
                  - title: wger
                    url: https://wger.svc.idanreed.com

              - title: Documents and Tools
                links:
                  - title: DocSpace
                    url: https://docspace.svc.idanreed.com
                  - title: BentoPDF
                    url: https://bentopdf.svc.idanreed.com
                  - title: Mazanoke
                    url: https://mazanoke.svc.idanreed.com
                  - title: IT-Tools
                    url: https://it-tools.svc.idanreed.com

      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

  # ===========================================================================
  # Page 2 — ADMIN. Things you open when something needs tending.
  #
  # Not a privilege tier (rule 3). Same login, same tailnet, same trust.
  # ===========================================================================
  - name: Admin
    slug: admin
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              # Repeated from Home on purpose: this is the first thing you
              # want on the page you opened BECAUSE something is wrong, and a
              # duplicated link costs nothing (rule 1 — these are links, so
              # there is no second set of checks to drift).
              - title: Status
                links:
                  - title: Gatus — uptime
                    url: https://gatus.svc.idanreed.com
                  - title: Beszel — hosts
                    url: https://beszel.svc.idanreed.com
                  - title: ntfy — alerts
                    url: https://ntfy.svc.idanreed.com

              - title: Identity
                links:
                  # On the VPS, not this host — the only link here that does
                  # not resolve to a *.svc.idanreed.com Caddy route.
                  - title: Authentik
                    url: https://auth.idanreed.com

      - size: full
        widgets:
          - type: bookmarks
            groups:
              - title: Infrastructure
                links:
                  - title: Komodo — containers
                    url: https://komodo.svc.idanreed.com
                  - title: Forgejo — git
                    url: https://forgejo.svc.idanreed.com
                  - title: Backrest — backups
                    url: https://backrest.svc.idanreed.com
                  - title: Windmill — jobs
                    url: https://windmill.svc.idanreed.com
                  - title: Grafana — logs
                    url: https://grafana.svc.idanreed.com

              # The library-filling half of the media stack. Everything here
              # is behind the same gluetun kill-switch as qBittorrent; if
              # these are unreachable while Jellyfin is fine, suspect the VPN
              # container before the services.
              - title: Media management
                links:
                  - title: Radarr
                    url: https://radarr.svc.idanreed.com
                  - title: Sonarr
                    url: https://sonarr.svc.idanreed.com
                  - title: Bazarr
                    url: https://bazarr.svc.idanreed.com
                  - title: Prowlarr
                    url: https://prowlarr.svc.idanreed.com
                  - title: Profilarr
                    url: https://profilarr.svc.idanreed.com
                  - title: Cleanuparr
                    url: https://cleanuparr.svc.idanreed.com

              # 🚨 The importer's UI has NO authentication of its own and
              # holds a Firefly personal access token with full access to
              # every transaction. It is reachable only through its OWN
              # Authentik application (firefly-importer, forward_single,
              # external_host firefly-importer.svc.idanreed.com). This
              # bookmark is convenience; the lock is in Caddy and Authentik.
              - title: Data import
                links:
                  - title: Firefly III importer
                    url: https://firefly-importer.svc.idanreed.com
