# Util — small browser tools (10401-10407).
# Design: ServerNotes/designs/service-util-stack-research.md.
#
# Everything here is stateless, so NOTHING may ever acquire a `sqlite_backup`
# line: the helper returns 0 for a MISSING source, making a speculative entry a
# permanently silent no-op that looks like a working backup.
#
# Vaultwarden (10400) has its own stack; TeXlyre (10405) is deferred (no image,
# and TeX Live packages are fetched on demand).
#
# ExcaliDash was here and is DEFERRED (tests/suites/util.nix points at this
# note): its entrypoint runs `npx prisma generate` unconditionally at start and
# the image bakes only its own arch, so it crash-loops without egress. Its 10406
# slot is now stacks/excalidraw.
services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf:1.16.1
    container_name: bentopdf
    ports:
      - '127.0.0.1:10401:8080'
    restart: unless-stopped

  mazanoke:
    # `v` prefix required here; bentopdf above has none. The convention differs
    # per image, which is why tests/update-images.sh resolves every reference
    # against its registry.
    image: ghcr.io/civilblur/mazanoke:v1.1.5
    container_name: mazanoke
    ports:
      - '127.0.0.1:10403:80'
    restart: unless-stopped

  # Dashboard
  # Own auth OFF — Caddy's (protected) does the work; see glance.yml rule 2 for
  # the lockout sharp edge.
  glance:
    # `v` prefix REQUIRED — `glanceapp/glance:0.8.5` is a 404.
    image: glanceapp/glance:v0.8.5
    container_name: glance
    ports:
      - '127.0.0.1:10402:8080'
    volumes:
      # Shipped in the stack directory so the git sync delivers it with the
      # compose file. The ENTRYPOINT hardcodes this path; :ro is safe, Glance
      # never writes it and its file watcher works on a read-only bind.
      - ./glance.yml:/app/config/glance.yml:ro
    environment:
      - TZ=America/Chicago
    healthcheck:
      # /api/healthz is an unconditional 200 — but Glance exits at startup on an
      # invalid config, so "listening" does imply "a valid config parsed at
      # boot". It cannot detect a failed hot RELOAD.
      # ⚠ Never probe /api/pages/{page}/content/: widget fetches happen in that
      # handler, so with no egress it stalls until every widget times out.
      # -O /dev/null, NOT --spider: --spider is a HEAD, and a GET-only route
      # answers 405 = permanently unhealthy while fine.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:8080/api/healthz']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Developer tools
  # Static nginx SPA: no accounts, no state, no auth possible — Caddy's
  # (protected) is the only lock it can ever have. sharevb fork (a strict
  # superset; corentinth has been dead since 2024-10).
  it-tools:
    # Dated tags ONLY — `latest` and `stable` are two different moving digests,
    # and the `-baseurl-it-tools` axis 404s assets under a root-path vhost.
    # sharevb serves on 8080 (corentinth was 80).
    image: ghcr.io/sharevb/it-tools:2026.7.11
    container_name: it-tools
    ports:
      - '127.0.0.1:10407:8080'
    environment:
      - TZ=America/Chicago
    healthcheck:
      # Liveness only — nothing else to probe on a static SPA.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      # A cold multi-stack boot needs longer (the forwardauth suite was red at 10s).
      start_period: 60s
    restart: unless-stopped
