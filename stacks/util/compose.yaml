# Util — small browser tools (Util range, ports 10400-10449).
# Design: ServerNotes/designs/service-util-stack-research.md.
# _overview.md owns the port/auth rows.
#
# Ports bound to 127.0.0.1 so Caddy (host network) is the only way in: on
# 0.0.0.0 anyone on the tailnet (tailscale0 is a trusted interface) could
# skip forward auth by using the port number.
#
# NOT IN THIS STACK, both deliberate:
#   - **Vaultwarden (10400)** has its own stack — any one reason suffices:
#     the deploy plane deploys per PROJECT (an IT-Tools tag bump would
#     restart the password manager); stack-env-drift keys per stack (the
#     fleet's most sensitive rotation beside a static PDF toolkit); and it
#     is the only Util service with a dump line and an attachments tree
#     that must travel with the database.
#   - **TeXlyre (10405)** DEFERRED: no image, and TeX Live packages are
#     fetched on demand + collaboration needs upstream signalling — with no
#     egress it is an editor that cannot compile.
#
# Backup contract: NOTHING — everything here is stateless. None may ever
# acquire a `sqlite_backup` line: the helper returns 0 for a MISSING source,
# so a speculative entry is a permanently-silent no-op that looks like a
# working backup (finding #25's class; what the uptimekuma line turned out
# to be). ExcaliDash would have been the one stateful service; deferred, see
# below.
services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf:1.16.1
    container_name: bentopdf
    ports:
      - '127.0.0.1:10401:8080'
    restart: unless-stopped

  mazanoke:
    # Tagged with a leading "v" upstream; "1.1.5" does not exist in the
    # registry. Note bentopdf above does NOT use a "v" prefix — the convention
    # differs per image, which is why tests/update-images.sh resolves every
    # reference against the registry rather than trusting it.
    image: ghcr.io/civilblur/mazanoke:v1.1.5
    container_name: mazanoke
    ports:
      - '127.0.0.1:10403:80'
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # glance — feed and service-link dashboard. Own auth OFF, Caddy's
  # (protected) does the work — see glance.yml's rule 2 for the lockout
  # sharp edge. Stateless: read-only config, no volume, no backup line.
  # ---------------------------------------------------------------------------
  glance:
    # `v` prefix REQUIRED — `glanceapp/glance:0.8.5` is a 404. Note bentopdf
    # above has none and mazanoke does; three images, both conventions, one
    # compose file.
    image: glanceapp/glance:v0.8.5
    container_name: glance
    ports:
      - '127.0.0.1:10402:8080'
    volumes:
      # Shipped in the stack directory so the git sync delivers it with the
      # compose file. The ENTRYPOINT hardcodes --config /app/config/glance.yml.
      # :ro is safe — Glance never writes it; the file watcher works on a
      # read-only bind.
      - ./glance.yml:/app/config/glance.yml:ro
    environment:
      - TZ=America/Chicago
    healthcheck:
      # No builtin. /api/healthz is an UNCONDITIONAL 200 — but Glance exits
      # at startup on an invalid config, so "listening" does imply "a valid
      # config parsed at boot". It cannot detect a failed hot RELOAD (old
      # config keeps running, healthz still 200).
      # ⚠ Never probe /api/pages/{page}/content/: widget fetches happen in
      # that handler (wg.Wait on every widget), so with no egress it stalls
      # until every widget times out.
      # -O /dev/null, NOT --spider: --spider is a HEAD, a GET-only route
      # answers 405 = permanently unhealthy while fine (the Homebox lesson).
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:8080/api/healthz']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # it-tools — 80+ client-side developer utilities. Static nginx SPA: no
  # accounts, no state, no auth possible — Caddy's (protected) is the only
  # lock it can ever have. sharevb fork (strict superset; corentinth dead
  # since 2024-10-22, adopted by the bake-off).
  # ---------------------------------------------------------------------------
  it-tools:
    # Tag trap: dated tags ONLY — `latest` and `stable` are two different
    # moving digests, and the `-baseurl-it-tools` axis 404s assets under a
    # root-path vhost. sharevb serves on 8080 (corentinth was 80).
    image: ghcr.io/sharevb/it-tools:2026.7.11
    container_name: it-tools
    ports:
      - '127.0.0.1:10407:8080'
    environment:
      - TZ=America/Chicago
    healthcheck:
      # No builtin. Liveness only — nothing else to probe on a static SPA.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      # cold multi-stack boot needs longer (forwardauth suite red at 10s)
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 🚨 ExcaliDash (10406) is DEFERRED — not a configuration problem: its
  # entrypoint runs `npx prisma generate` UNCONDITIONALLY at start, and the
  # image bakes only its own arch's binaryTargets, so generate always dials
  # binaries.prisma.sh for the other one and dies (EAI_AGAIN on a
  # tailnet-only host — a crash loop, not "slow without egress"; no skip
  # flag). Deferred until upstream stops downloading at runtime.
  #
  # Found by tests/suites/util.nix on its first run — which also caught the
  # secrets named EXCALIDASH_JWT_SECRET/_CSRF_SECRET while the app reads the
  # BARE names (finding #25 recurring; the container quietly auto-generated
  # both). Worth knowing if this is ever revived.
  #
  # Slot unwound: the 10406 row is DELETED from _overview.md (bake-off
  # 2026-09-01); 10406 is free. Findings kept — tests/ and the README cite
  # them.
  # ---------------------------------------------------------------------------
