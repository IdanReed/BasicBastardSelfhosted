# Owl — retirement planner (10307). EVALUATION stack: one container, no
# database, no secrets, no volume, no init.
# Upstream: https://github.com/mdlacasse/Owl
#
# 🚨 NO AUTHENTICATION OF ANY KIND — a Streamlit app with no login and no user
# concept. Forward auth is a HARD PRECONDITION: the Authentik blueprint entry
# must exist BEFORE the Caddy route imports `protected`, and the loopback
# publish is the second half (it stops a tailnet user reaching 10307 directly).

services:
  owl:
    # Dated tag, bare (no `v`). `edge` is disqualified: it git-clones and
    # `uv sync`s on every start, so it cannot boot offline or reproducibly.
    image: owlplanner/owldocker:2026.8.29
    container_name: owl
    ports:
      # With no auth in the app, the port IS the bypass — never 0.0.0.0.
      - '127.0.0.1:10307:8501'
    # NO volumes, verified: Owl saves and loads through the browser; server
    # state is in memory, so restarting loses unsaved work by design.
    environment:
      - TZ=America/Chicago
      # Suppresses the startup disclaimer modal.
      - OWL_SKIP_DISCLAIMER=1
    # NO env_file: no secrets, so no secrets.sops.json — env-file-coverage only demands
    # one where `env_file:` is declared.
    healthcheck:
      # Overrides the image's own probe: it has no start_period (every probe
      # during Streamlit's slow import burns a retry) and uses --spider, i.e. a
      # HEAD, which a GET-only route answers 405 to.
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '-T', '5', 'http://127.0.0.1:8501/_stcore/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
