# Beszel — host and container resource monitoring (10452). Gatus answers "is it
# up"; this answers "is /mnt/fast about to fill".
# Design: ServerNotes/designs/service-monitoring-stack-research.md §5.
#
# The one-shot init means the generic `./tests/run.sh stack beszel` harness
# cannot be used (it asserts every container is running) — tests/suites/beszel.nix
# is hand-written instead.

services:
  # Init
  # The hub reads both artefacts exactly once, at startup, and generates its own
  # unrecoverable key if id_ed25519 is absent. config.yml is DECLARATIVE:
  # SyncSystems deletes every system row not listed in it.
  beszel-init:
    image: alpine:3.21
    container_name: beszel-init
    volumes:
      - ./beszel-init.sh:/init.sh:ro
      - /mnt/fast/beszel:/beszel_data
    env_file:
      - path: .env
        required: false
    command: ["/bin/sh", "/init.sh"]
    # One-shot: `on-failure` would retry a genuine misconfiguration forever.
    restart: "no"

  # Hub
  beszel:
    # Docker tags carry no `v` prefix (the git tags do), and ghcr.io/henrygd/beszel
    # does not exist — Docker Hub is the only flat path.
    image: henrygd/beszel:0.18.8
    container_name: beszel
    depends_on:
      beszel-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:10452:8090"
    volumes:
      - /mnt/fast/beszel:/beszel_data
    environment:
      - TZ=America/Chicago
      - APP_URL=https://beszel.svc.idanreed.com
    env_file:
      - path: .env
        required: false
    healthcheck:
      # `/beszel health` short-circuits on argv before the app is built, so it
      # never opens the database — it proves the listener and nothing else.
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Role
  # The env-seeded app user lands with role "user": initial-settings.go sets
  # email/password/verified and never role, and InitializeUserRole then
  # defaults it. Only the UI's first-run path sets "admin". Post-boot because
  # beszel-init runs before the hub exists. See beszel-role.sh.
  beszel-role:
    image: python:3.13-alpine
    container_name: beszel-role
    entrypoint: ['/bin/sh', '/init/beszel-role.sh']
    depends_on:
      beszel:
        condition: service_healthy
    volumes:
      - ./beszel-role.sh:/init/beszel-role.sh:ro
    env_file:
      - path: .env
        required: false
    restart: "no"

  # Agent
  # network_mode: host is not optional — without the host namespace /proc/net/dev
  # is the container's own and network stats come out empty. With DISABLE_SSH the
  # agent has no listener at all, which is the exposure argument for the
  # host-network-declared entry in tests/lib/lints.nix.
  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    container_name: beszel-agent
    network_mode: host
    depends_on:
      beszel:
        condition: service_healthy
    volumes:
      - /mnt/fast/beszel-agent:/var/lib/beszel-agent
      # Empty marker directories, not the tiers themselves: statfs answers for
      # the whole filesystem whatever path is asked, so these yield the same
      # numbers without handing this container every service's data.
      - /mnt/fast/beszel-agent/fsprobe:/extra-filesystems/fast:ro
      - /mnt/slow/beszel-fsprobe:/extra-filesystems/slow:ro
    environment:
      - TZ=America/Chicago
      # Loopback, NOT the vhost: beszel.svc is `import protected`, and the
      # outpost 302s the websocket upgrade — the agent reports no error and
      # silently falls back to SSH pull mode, which cannot work here.
      - HUB_URL=http://127.0.0.1:10452
      # Removes the SSH pull path so a broken websocket connect is loud. Does
      # NOT lift the KEY requirement — loadPublicKeys fatals without it.
      - DISABLE_SSH=true
      # Off-switch for the Docker socket (newDockerManager returns nil on an
      # empty value). Container stats are not worth a second root-equivalent
      # container; the fleet's design is exactly one.
      - DOCKER_HOST=
    env_file:
      - path: .env
        required: false
    healthcheck:
      # 🚨 A LIAR, kept only because it catches a wedged process: `/agent health`
      # stats a file the connection manager touches every 90s whether or not it
      # has ever reached the hub. The suite asserts hub-side instead.
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
