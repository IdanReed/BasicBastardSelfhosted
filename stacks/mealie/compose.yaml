# Mealie (Food range, port 10352).
#
# ⚠ EVALUATION STACK — the Tandoor side-by-side (service-bakeoff.md item 6).
# Local admin (created by mealie_init below), OIDC config-ready and OFF —
# same posture as the tandoor stack it is compared against. If it wins,
# retiring Tandoor is a separate decision.
#
# Backup contract: no _db container, no pg_dumpall entry. The database is
# /mnt/fast/mealie/mealie.db, dumped by backup-prepare.sh's sqlite_backup
# (the vaultwarden path). That line lands WITH this stack — the
# backup-coverage lint fails on a speculative line and on a missing one.

services:
  # ---------------------------------------------------------------------------
  # mealie — recipe manager. One container, one bind mount: recipes, images,
  # the SQLite database AND the token-signing secrets all live in /app/data.
  #
  # 🚨 SQLITE ON PURPOSE. settings/db_providers.py (v3.24.0): anything but
  # exactly "postgres" — unset, empty, ANY typo ("postgresql" is the CORRECT
  # string next door in tandoor!) — selects sqlite with no log line. And
  # PostgresProvider defaults POSTGRES_PASSWORD to the literal "mealie", so
  # a half-lost postgres config connects with a published password or
  # silently runs sqlite. Postgres here would rebuild the finding-#11 race
  # (deploy beats first decrypt -> phantom database) with a wider mouth;
  # sqlite DELETES the class: fallback state and intended state are the same
  # bind-mounted, backed-up file, so a race window writes to the real DB.
  # ---------------------------------------------------------------------------
  mealie:
    # `v` prefix REQUIRED (tandoor next door has none — the exact trap
    # CLAUDE.md warns about, in one 50-port range).
    image: ghcr.io/mealie-recipes/mealie:v3.24.0
    container_name: mealie
    ports:
      - '127.0.0.1:10352:9000'
    volumes:
      # Everything: sqlite DB, images, and the auto-generated
      # .secret/.session_secret token-signing files (written on first boot —
      # no SECRET key needed in .env; the fast-tier backup carries them).
      # Losing .secret logs everyone out; it does not lose data.
      - /mnt/fast/mealie:/app/data
    environment:
      - TZ=America/Chicago
      # 🚨 Pinned HERE, not .env: `environment` BEATS `env_file`, so a stray
      # DB_ENGINE in a future .env can never silently flip the engine — a
      # mid-life flip would present an EMPTY database (healthcheck still
      # green) while mealie.db held every recipe.
      - DB_ENGINE=sqlite
      # Explicit (ghostfolio's PORT=3333 reasoning): a silent upstream
      # default change would be a 502 with a healthy container.
      - API_PORT=9000
      # Used for notification links and the OIDC callback URL.
      - BASE_URL=https://mealie.svc.idanreed.com
      # Explicit although currently the default: upstream flipped this very
      # default once already (true -> false in v1.4.0).
      - ALLOW_SIGNUP=false
      # ⚠ No DEFAULT_EMAIL / DEFAULT_PASSWORD — THEY NO LONGER EXIST: v3
      # holds them as pydantic PRIVATE attrs env vars cannot reach. Every
      # fresh Mealie boots with admin changeme@example.com / MyPassword
      # (username `admin`), both public strings, no knob to change them —
      # mealie_init below is the mitigation. Same class as wger's
      # admin/adminadmin.
      #
      # OIDC — config-ready and OFF (tandoor/books posture): local admin
      # until the Authentik client secret lands. Verified NOT boot-fatal:
      # discovery happens lazily on the first login redirect, so a VPS blip
      # cannot take the stack down at `up` (no ghostfolio eager-discovery
      # hazard).
      - OIDC_AUTH_ENABLED=false
      - OIDC_PROVIDER_NAME=Authentik
      - OIDC_CONFIGURATION_URL=https://auth.idanreed.com/application/o/mealie/.well-known/openid-configuration
      - OIDC_CLIENT_ID=mealie
      # ⚠ When enabling: leave OIDC_USER_GROUP / OIDC_ADMIN_GROUP unset OR
      # put the groups claim in the token — the feature refuses to start if
      # either is set while OIDC_GROUPS_CLAIM resolves to nothing.
      # OIDC_CLIENT_SECRET arrives from .env, inert while disabled.
      #
      # ALLOW_PASSWORD_LOGIN stays default (true) on purpose: the local
      # admin is the fallback when the IdP is unreachable.
    # Long form with required:false ON PURPOSE (finding #11): a deploy can
    # race the first host-side decrypt, and the plain form aborts the whole
    # stack when .env is absent.
    env_file:
      - path: .env
        required: false
    healthcheck:
      # The baked probe is HONEST for once (verified: /api/app/about runs a
      # real groups query against the configured DB, unauthenticated, no
      # outbound calls). Rewritten here only to pin timings: the baked
      # HEALTHCHECK has no start_period and first boot runs every alembic
      # migration before uvicorn binds. curl IS in the production image.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:9000/api/app/about']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # mealie_init — headless first-run: retires the boot-time default admin
  # (changeme@example.com / MyPassword, PUBLISHED credentials). See
  # mealie-init.py for the verified details; unlike tandoor_init it drives
  # the REST API, not the ORM, so it survives schema changes.
  # ---------------------------------------------------------------------------
  mealie_init:
    image: ghcr.io/mealie-recipes/mealie:v3.24.0
    container_name: mealie_init
    depends_on:
      # service_healthy, not service_started: proves migrations finished and
      # the DB answers — the API this script drives.
      mealie:
        condition: service_healthy
    volumes:
      - ./mealie-init.py:/init/mealie-init.py:ro
    # ⚠ Entrypoint MUST be overridden — the image's /app/run.sh would start
    # a second server. System python3, NOT the /opt/mealie venv: the script
    # is stdlib-only, so it cannot break with the venv.
    entrypoint: ['/usr/local/bin/python3', '/init/mealie-init.py']
    environment:
      - MEALIE_BASE_URL=http://mealie:9000
      # MEALIE_ADMIN_USER / _EMAIL / _PASSWORD arrive from .env.
    env_file:
      - path: .env
        required: false
    restart: "no"
