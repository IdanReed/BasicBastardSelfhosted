# Mealie (10352). EVALUATION stack — the Tandoor side-by-side.
#
# Backup: no _db container and no pg_dumpall entry. The database is
# /mnt/fast/mealie/mealie.db, covered by backup-prepare.sh's sqlite_backup.

services:
  # App
  # One container, one bind mount: recipes, images, the SQLite database and the
  # token-signing secrets all live in /app/data.
  #
  # 🚨 SQLITE ON PURPOSE. db_providers.py selects sqlite for anything but exactly
  # "postgres" — unset, empty, or a typo ("postgresql" is the CORRECT string next
  # door in tandoor) — with no log line, and PostgresProvider defaults
  # POSTGRES_PASSWORD to the literal "mealie". Postgres here would rebuild the
  # decrypt-race trap with a wider mouth; sqlite deletes the class, because
  # fallback state and intended state are the same backed-up file.
  mealie:
    # `v` prefix REQUIRED (tandoor next door has none — the exact trap CLAUDE.md
    # warns about, inside one 50-port range).
    image: ghcr.io/mealie-recipes/mealie:v3.24.0
    container_name: mealie
    ports:
      - '127.0.0.1:10352:9000'
    volumes:
      # Everything, including the auto-generated .secret/.session_secret files.
      # Losing those logs everyone out; it does not lose data.
      - /mnt/fast/mealie:/app/data
    environment:
      - TZ=America/Chicago
      # 🚨 Pinned HERE, not .env: `environment` beats `env_file`, so a stray
      # DB_ENGINE in a future .env can never silently flip the engine and
      # present an empty database with a green healthcheck.
      - DB_ENGINE=sqlite
      # Explicit: a silent upstream default change would be a 502 with a healthy
      # container.
      - API_PORT=9000
      # Notification links and the OIDC callback URL.
      - BASE_URL=https://mealie.svc.idanreed.com
      # Explicit although currently the default: upstream flipped this very
      # default once already.
      - ALLOW_SIGNUP=false
      # ⚠ There is no DEFAULT_EMAIL/DEFAULT_PASSWORD any more — v3 holds them as
      # pydantic private attrs. Every fresh Mealie boots with admin
      # changeme@example.com / MyPassword and no knob to change it; mealie_init
      # below is the mitigation.
      #
      # OIDC
      # Discovery is lazy (first login redirect), so a VPS blip cannot take the
      # stack down at `up`. The local admin stays as fallback
      # (ALLOW_PASSWORD_LOGIN default true). Auto-provision matches existing
      # users by email; both signup flags default to these values and are pinned
      # so the intent is legible.
      # ⚠ OIDC_USER_GROUP / OIDC_ADMIN_GROUP left UNSET: the feature refuses to
      # start if either is set while OIDC_GROUPS_CLAIM resolves to nothing, and
      # the standard scopes carry no groups.
      # OIDC_CLIENT_SECRET arrives from the stack env.
      - OIDC_AUTH_ENABLED=true
      - OIDC_PROVIDER_NAME=Authentik
      - OIDC_CONFIGURATION_URL=https://auth.idanreed.com/application/o/mealie/.well-known/openid-configuration
      - OIDC_CLIENT_ID=mealie
      - OIDC_SIGNUP_ENABLED=true
      - OIDC_USER_CLAIM=email
    env_file: /run/stack-env/mealie.env
    healthcheck:
      # The baked probe is honest (/api/app/about runs a real query against the
      # configured DB, unauthenticated, no outbound calls); rewritten only to
      # add a start_period, since first boot runs every alembic migration
      # before uvicorn binds.
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:9000/api/app/about']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # Init
  # Retires the boot-time default admin. Drives the REST API rather than the ORM,
  # so it survives schema changes. See mealie-init.py.
  mealie_init:
    image: ghcr.io/mealie-recipes/mealie:v3.24.0
    container_name: mealie_init
    depends_on:
      # service_healthy: proves migrations finished and the API answers.
      mealie:
        condition: service_healthy
    volumes:
      - ./mealie-init.py:/init/mealie-init.py:ro
    # ⚠ Entrypoint MUST be overridden — the image's /app/run.sh would start a
    # second server. System python3, not the /opt/mealie venv: the script is
    # stdlib-only.
    entrypoint: ['/usr/local/bin/python3', '/init/mealie-init.py']
    environment:
      - MEALIE_BASE_URL=http://mealie:9000
      # MEALIE_ADMIN_USER / _EMAIL / _PASSWORD arrive from the stack env.
    env_file: /run/stack-env/mealie.env
    restart: "no"
