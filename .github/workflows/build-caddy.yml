# Builds the Caddy image with the cloudflare-dns plugin and publishes it to
# GHCR, so the services VM can pull a pinned image instead of building on the
# host from a Dockerfile that Arcane's git sync would not deliver anyway.
#
# Run manually, or on a push that touches the Dockerfile.
#
# Injection safety: this workflow reads no attacker-controllable event fields
# (no github.event.*). The only interpolations are github.repository_owner,
# github.actor and secrets.GITHUB_TOKEN, none of which are user-supplied text,
# and nothing is interpolated into a run: block.
name: Build Caddy (cloudflare-dns)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stacks/caddy/Dockerfile'
      - '.github/workflows/build-caddy.yml'

env:
  # Hardcoded lowercase, not ${{ github.repository_owner }}: the owner is
  # 'IdanReed' and docker rejects mixed-case repository names — and this
  # exact string is what stacks/caddy/compose.yaml pins, so they must agree.
  IMAGE: ghcr.io/idanreed/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # BOTH versions are read out of stacks/caddy/Dockerfile rather than
      # duplicated here, and the published tag is <caddy>-cf<plugin>.
      #
      # Why the composite tag: the artifact is a function of both inputs. With
      # the caddy version alone, a plugin-only bump (cloudflare v0.2.4 ->
      # v0.2.5) republished a DIFFERENT binary under the same `2.11.2` tag —
      # and the services VM, already holding that tag, does not repull on
      # `up -d`. The merged bump silently never deployed. A tag that changes
      # whenever the binary changes forces an explicit compose-pin edit, which
      # is the deploy.
      #
      # Still no attacker-controllable input here: both values come from a
      # file in the checkout, are matched against a digits-and-dots pattern,
      # and are passed through step outputs rather than interpolated into a
      # run: block.
      - name: Determine Caddy and plugin versions
        id: ver
        run: |
          version=$(grep -oP '^FROM caddy:\K[0-9]+\.[0-9]+\.[0-9]+$' \
            stacks/caddy/Dockerfile | tail -1)
          plugin=$(grep -oP 'caddy-dns/cloudflare@v\K[0-9]+\.[0-9]+\.[0-9]+' \
            stacks/caddy/Dockerfile | tail -1)
          if [ -z "$version" ]; then
            echo "Could not determine Caddy version from Dockerfile" >&2
            exit 1
          fi
          if [ -z "$plugin" ]; then
            echo "Could not determine cloudflare plugin version from Dockerfile" >&2
            exit 1
          fi
          echo "tag=$version-cf$plugin" >> "$GITHUB_OUTPUT"
          echo "Building Caddy $version + cloudflare-dns v$plugin as $version-cf$plugin"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: stacks/caddy
          push: true
          # The bare `<caddy>` tag is deliberately NOT published any more: it
          # was mutable, and stacks/caddy/compose.yaml pins it. The 2.11.2
          # image already in GHCR is untouched and keeps serving the host until
          # the pin is moved to the composite tag (see the Dockerfile header).
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
